<html lang="en">
<head>
  <meta charset="UTF-8">
<script>/* nomad-load-guard: reload, twice at most, when one of Nomad's own scripts or stylesheets fails to load */(function(){var k='nomadLoadGuard:'+location.pathname;window.addEventListener('error',function(e){var t=e.target;if(!t||!t.tagName)return;var s=t.tagName==='SCRIPT',c=t.tagName==='LINK'&&/stylesheet/i.test(t.rel||'');if(!s&&!c)return;var u=t.src||t.href||'';if(u.indexOf(location.origin+'/')!==0)return;var n=0;try{n=+sessionStorage.getItem(k)||0;}catch(x){return;}if(n>=2)return;try{sessionStorage.setItem(k,String(n+1));}catch(x){return;}setTimeout(function(){location.reload();},1500*(n+1));},true);window.addEventListener('load',function(){setTimeout(function(){try{sessionStorage.removeItem(k);}catch(x){}},15000);});})();</script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Jcorp Nomad Media Server - Games">
  <title>Nomad • Games</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/master.css">
  <script src="/theme-boot.js?v=5"></script>
  <script src="/theme-manager.js?v=5"></script>
  <script src="/nomad-utils.js?v=52"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* Toolbar, grid and cards match movies.html. */
    .toolbar {
      padding: .6rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: var(--header-height);
      z-index: 55;
      background: var(--bg);
    }
    .toolbar input[type="search"] {
      flex: 1 1 220px;
      padding: .5rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background: var(--card);
      color: var(--text);
    }
    .toolbar select {
      padding: .48rem .7rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 0.9rem;
      cursor: pointer;
    }
    main { flex: 1; display: flex; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; padding: 1rem; }
    .grid-wrapper { flex: 1; overflow-y: auto; padding-bottom: 12px; }
    .media-grid { display: grid; gap: var(--card-gap, 1rem); }
    .media-grid.small  { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .media-grid.medium { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .media-grid.large  { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    .media-card { width: 100%; max-width: 220px; margin: 0 auto; cursor: pointer; }
    .media-grid.small  .media-card { max-width: 120px; }
    .media-grid.medium .media-card { max-width: 160px; }
    .media-grid.large  .media-card { max-width: 220px; }

    @media (max-width:600px) {
      .media-grid.small  { grid-template-columns: repeat(4, 1fr); }
      .media-grid.medium { grid-template-columns: repeat(3, 1fr); }
      .media-grid.large  { grid-template-columns: repeat(2, 1fr); }
    }

    .thumb-wrapper { position: relative; display: flex; align-items: center; justify-content: center;
      background: var(--thumb-bg, var(--card)); color: var(--thumb-text, var(--text));
      font-size: 0.9rem; text-align: center; width: 100%; aspect-ratio: 2/3;
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .fallback-text { position: absolute; top:0;right:0;bottom:0;left:0;inset:0; display: flex; align-items: center;
      justify-content: center; z-index: 2; text-align: center; font-weight: 700;
      color: var(--thumb-title, var(--text)); pointer-events: none; padding: 6px; }
    .media-thumb { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
      z-index: 1; opacity: 0; transition: opacity .35s ease; }
    /* name lives in the artwork (or as the no-image fallback text). the row
       under the card only labels the type */
    .meta { padding: 6px 4px 0; text-align: center; }
    .meta small { display: block; font-size: .72rem; color: var(--muted); }
    /* EmulatorJS replaces #emu with its own container sized to the parent, so the size
       lives on this wrapper. A rule on #emu is lost and the game area collapses to zero
       height, which looks like a missing Start button. */
    #emuWrap {
      display: none;
      width: 100%;
      height: 60vh;          /* placeholder, startGame() fits it to the space below the exit bar */
      min-height: 300px;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    .note { grid-column: 1 / -1; text-align: center; color: var(--muted); }
    /* phones: the console filter gets the room its names need */
    @media (max-width: 600px) {
      body .toolbar #consoleSelect { flex: 1 1 auto; min-width: 0; }
      body .toolbar #sortSelect, body .toolbar #sizeSelect { flex: 0 0 auto; }
    }
    /* Recently played: one short row above the grid, per phone */
    #recent { margin: 0 0 1rem; }
    #recent[hidden] { display: none; }
    #recent h2 { font-size: .95rem; margin: 0 0 .5rem; color: var(--muted); font-weight: 600; }
    .recent-row { display: flex; gap: .6rem; overflow-x: auto; padding-bottom: .3rem; scrollbar-width: thin; }
    .recent-row .media-card { flex: 0 0 96px; max-width: 96px; margin: 0; }
    .recent-row .fallback-text { font-size: .72rem; }
    footer {
      text-align: center;
      padding: 1rem 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body data-page="games">
  <header>
    <h1>Games</h1>
    <a class="back-btn" href="/menu">← Back to Menu</a>
  </header>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Search" aria-label="Search games">
    <!-- filled from the games on the card -->
    <select id="consoleSelect" aria-label="Filter by console">
      <option value="">All consoles</option>
    </select>
    <select id="sortSelect" aria-label="Sort games">
      <option value="nameAsc">A → Z</option>
      <option value="nameDesc">Z → A</option>
    </select>
    <select id="sizeSelect" aria-label="Card size">
      <option value="small">Small</option>
      <option value="medium">Medium</option>
      <option value="large">Large</option>
    </select>
  </div>

  <main>
    <div class="grid-wrapper">
      <section id="recent" hidden aria-labelledby="recentTitle">
        <h2 id="recentTitle">Recently played</h2>
        <div class="recent-row" id="recentRow"></div>
      </section>
      <div id="grid" class="media-grid medium"></div>
      <div id="emuBar" style="display:none;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.4rem .75rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:.5rem;">
        <strong id="emuTitle" style="font-size:.95rem;"></strong>
        <span id="emuStatus" style="flex:1 1 100%;order:3;font-size:.78rem;color:var(--muted);"></span>
        <button id="exitGame" style="background:transparent;border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:.35rem .9rem;cursor:pointer;font-size:.85rem;">Exit</button>
      </div>
      <div id="emuWrap"><div id="emu"></div></div>
    </div>
  </main>

  <footer>© <span id="year"></span> Jcorp Nomad</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    // sticky offset from the header's real height. a fixed value either floats the
    // toolbar over the first card row or lets it slide under a wrapped two-line header
    (function fitToolbar() {
      const apply = () => {
        const h = document.querySelector('header');
        const tb = document.querySelector('.toolbar');
        if (h && tb) tb.style.top = h.offsetHeight + 'px';
      };
      apply();
      window.addEventListener('resize', apply);
    })();

    const grid          = document.getElementById('grid');
    const emuWrap       = document.getElementById('emuWrap');
    const searchInput   = document.getElementById('searchInput');
    const consoleSelect = document.getElementById('consoleSelect');
    const sortSelect    = document.getElementById('sortSelect');
    const sizeSelect    = document.getElementById('sizeSelect');

    let games         = [];   // ROM entries
    let builtins      = [];   // built-in .html games shipped in /Games (delete the file -> card disappears)
    let filtered      = [];
    let debounceTimer = null;
    let currentSize   = NomadPrefs.raw('nomadGamesSize') || 'medium';
    let running       = null; // the game on screen, once one is started
    const RECENT_KEY  = 'nomad:games:recent:v1';   // ROM paths, newest first, per phone

    // Built-ins pin to the top of the grid in this order. Anything else
    // (a user-added .html) follows alphabetically. Keys = lowercase filename minus .html.
    const BUILTIN_ORDER = ['watch together', 'toolkit', 'go', 'connect four', 'chess', 'tic-tac-toe', 'whiteboard',
                           'dots and boxes', 'crazy eights', '2048', 'minesweeper', 'snake'];

    // what the filter and the card badge call each system, in the filter's order
    const CONSOLE_LABEL = { nes: 'NES', snes: 'SNES', n64: 'N64', gb: 'Game Boy', gbc: 'Game Boy Color', gba: 'GBA',
                            genesis: 'Genesis', sms: 'Master System', psx: 'PlayStation', prboom: 'DOOM' };
    const BADGE = { gb: 'GB', gbc: 'GBC', psx: 'PS1' };

    function setViewSize(size) {
      if (!['small', 'medium', 'large'].includes(size)) size = 'medium';
      currentSize = size;
      grid.className = `media-grid ${size}`;
      sizeSelect.value = size;
      NomadPrefs.setRaw('nomadGamesSize', size);
    }
    setViewSize(currentSize);
    sizeSelect.addEventListener('change', () => setViewSize(sizeSelect.value));

    /* Which emulator a ROM needs. The extension says it for most files. A "Title (USA).zip",
       a PS1 .bin or anything else the extension doesn't settle goes by the folder it sits in
       (/Games/SNES/..., /Games/N64/..., /Games/PS1/...). */
    const EXT_CORE = {
      nes: 'nes', fds: 'nes', sfc: 'snes', smc: 'snes', gba: 'gba', gb: 'gb', gbc: 'gbc',
      n64: 'n64', z64: 'n64', v64: 'n64', gen: 'genesis', md: 'genesis', smd: 'genesis', sms: 'sms',
      psx: 'psx', ps1: 'psx', pbp: 'psx', chd: 'psx',
      // real DOOM: the prboom libretro core runs .wad files directly
      // (prboom.wad is embedded in the core, only the game wad is needed)
      wad: 'prboom', iwad: 'prboom'
    };
    // containers and disc images: only the folder can say what is inside
    const CONTAINER = ['zip', '7z', 'rar', 'bin', 'iso', 'img'];
    const FOLDER_CORE = {
      nes: 'nes', famicom: 'nes', nintendoentertainmentsystem: 'nes',
      snes: 'snes', supernintendo: 'snes', superfamicom: 'snes', sfc: 'snes', supernes: 'snes',
      n64: 'n64', nintendo64: 'n64',
      gb: 'gb', gameboy: 'gb', gbc: 'gbc', gameboycolor: 'gbc', gameboycolour: 'gbc', gba: 'gba', gameboyadvance: 'gba',
      genesis: 'genesis', megadrive: 'genesis', segagenesis: 'genesis', segamegadrive: 'genesis', md: 'genesis',
      sms: 'sms', mastersystem: 'sms', segamastersystem: 'sms',
      psx: 'psx', ps1: 'psx', ps: 'psx', playstation: 'psx', playstation1: 'psx', sonyplaystation: 'psx',
      doom: 'prboom'
    };
    function folderCore(path) {
      const dirs = path.split('/').slice(2, -1).reverse();   // nearest folder first, /Games itself left out
      for (const d of dirs) {
        const c = FOLDER_CORE[d.toLowerCase().replace(/[^a-z0-9]/g, '')];
        if (c) return c;
      }
      return '';
    }
    function deriveCore(path) {
      const filename = path.split('/').pop().toLowerCase();
      const parts = filename.split('.');
      let ext = parts.pop();
      if (CONTAINER.includes(ext) && parts.length > 1 && EXT_CORE[parts[parts.length - 1]]) ext = parts.pop();
      if (EXT_CORE[ext]) return EXT_CORE[ext];
      if (!CONTAINER.includes(ext)) return '';
      const core = folderCore(path);
      // a loose .bin/.iso is a disc only in a disc system's folder, and only its first track
      if (['bin', 'iso', 'img'].includes(ext) && core !== 'psx' && core !== 'genesis') return '';
      if (/\(track 0*([2-9]|\d\d+)\)/.test(filename)) return '';
      return core;
    }

    function noteHTML(text) { return `<p class="note">${text}</p>`; }

    async function init(attempt = 0) {
      try {
        // Games bucket NDJSON index (media.json is only a bucket-count summary)
        let res  = await fetch('/api/index?path=/Games', { cache: 'no-cache' });
        // 503 means the SD is busy for a moment, not that the index is missing
        for (let i = 0; i < 3 && res.status === 503; i++) {
          await new Promise(r => setTimeout(r, 800 * (i + 1)));
          res = await fetch('/api/index?path=/Games', { cache: 'no-cache' });
        }
        if (res.status === 202) {
          // firmware is building the index right now, wait and retry
          if (attempt < 8) {
            grid.innerHTML = noteHTML('Building game index…');
            setTimeout(() => init(attempt + 1), 4000);
            return;
          }
          throw new Error('index still building');
        }
        if (!res.ok) throw new Error('index fetch failed ' + res.status);
        const text  = await res.text();
        const lines = text.split('\n').filter(Boolean);
        const entries = [];
        for (let i = 1; i < lines.length; i++) {
          try { entries.push(JSON.parse(lines[i])); } catch (e) {}
        }

        const IMG_RE  = /\.(jpe?g|png|webp|gif|bmp)$/i;
        const HTML_RE = /\.html?$/i;
        // Nomad-Tools' Speed up games keeps ROMs gzipped (Game.gba.gz). Nomad sends that file
        // when Game.gba is asked for and the browser unpacks it, so the game keeps its name.
        const files  = entries.filter(e => e.t === 'f' && e.p).map(e =>
          /\.gz$/i.test(e.n) && deriveCore(e.p.slice(0, -3)) ? { ...e, n: e.n.slice(0, -3), p: e.p.slice(0, -3) } : e);
        // cover art beside the ROM, by the name without its extension. one in the same folder
        // wins over a same-named one elsewhere
        const covers = new Map(), coversByName = new Map();
        for (const f of files) {
          if (!IMG_RE.test(f.n)) continue;
          covers.set(f.p.replace(/\.[^/.]+$/, '').toLowerCase(), f.p);
          const k = f.n.replace(/\.[^/.]+$/, '').toLowerCase();
          if (!coversByName.has(k)) coversByName.set(k, f.p);
        }

        // built-in games: any .html in /Games renders as a card and opens like a page. cover
        // art uses the same sidecar convention as ROMs (Go.png next to Go.html)
        builtins = files
          .filter(f => HTML_RE.test(f.n) && f.p.split('/').length === 3)
          .map(f => {
            const base = f.n.replace(/\.[^/.]+$/, '');
            const pin  = BUILTIN_ORDER.indexOf(base.toLowerCase());
            return {
              name:  base.replace(/[_]+/g, ' ').trim() || f.n,
              cover: coversByName.get(base.toLowerCase()) || 'placeholder.jpg',
              file:  f.p,
              builtin: true,
              pin:   pin < 0 ? BUILTIN_ORDER.length : pin
            };
          })
          .sort((a, b) => a.pin - b.pin || a.name.localeCompare(b.name));
        // Watch Together turned off in admin: no card for it either
        if ((await NomadUI.config()).watchOff) builtins = builtins.filter(b => b.name.toLowerCase() !== 'watch together');

        games = files
          .filter(f => !IMG_RE.test(f.n) && !HTML_RE.test(f.n) && deriveCore(f.p))
          .map(f => {
            // Zelda.nes.zip is Zelda, with the cover Zelda.jpg
            const base = f.n.replace(/\.[^/.]+$/, '').replace(/\.(nes|fds|sfc|smc|gba|gbc|gb|n64|z64|v64|gen|md|smd|sms|psx|ps1|pbp|chd|cue)$/i, '');
            const dir = f.p.slice(0, f.p.lastIndexOf('/') + 1);
            return {
              name:  base.replace(/[_\.]+/g, ' ').trim() || f.n,
              // no sidecar art -> no img; the card shows its name as text
              // fallback, same as movies/shows
              cover: covers.get((dir + base).toLowerCase()) || coversByName.get(base.toLowerCase()) || null,
              file:  f.p,
              core:  deriveCore(f.p),
              size:  f.sz || 0     // what the first start downloads (the gzipped size, if it is)
            };
          });

        buildConsoleFilter();
        applyFilters();
        playFromHash();
      } catch (err) {
        console.error('Failed to load Games index:', err);
        grid.innerHTML = noteHTML("Couldn't load games. Reload to try again.");
      }
    }

    // only the systems that have games on this card
    function buildConsoleFilter() {
      const keep = consoleSelect.value;
      const have = new Set(games.map(g => g.core));
      const order = Object.keys(CONSOLE_LABEL);
      const cores = [...have].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      consoleSelect.innerHTML = '<option value="">All consoles</option>' +
        cores.map(c => `<option value="${c}">${escapeHtml(CONSOLE_LABEL[c] || c.toUpperCase())}</option>`).join('');
      consoleSelect.value = have.has(keep) ? keep : '';
    }

    function applyFilters() {
      const txt = searchInput.value.trim().toLowerCase();
      const sys = consoleSelect.value;
      filtered = games.filter(game => {
        const okText = game.name.toLowerCase().includes(txt);
        const okSys  = !sys || game.core === sys;
        return okText && okSys;
      });
      applySort(sortSelect.value);
    }

    function applySort(mode) {
      filtered.sort((a,b) =>
        mode === 'nameDesc'
          ? b.name.localeCompare(a.name)
          : a.name.localeCompare(b.name)
      );
      render();
    }

    const badgeFor = (game) => BADGE[game.core] || (game.core === 'prboom' ? 'DOOM' : game.core.toUpperCase());

    // same card structure as movies.html: 2/3 thumb with centered name as the
    // fallback, image fades in on load and yields back to text on error
    function makeCard(item, badge, onClick) {
      const card = document.createElement('div');
      card.className = 'media-card';
      const imgHTML = item.cover
        ? `<img class="media-thumb" loading="lazy" alt="${escapeHtml(item.name)}">`
        : '';
      card.innerHTML = `
        <div class="thumb-wrapper">
          <span class="fallback-text">${escapeHtml(item.name)}</span>
          ${imgHTML}
        </div>
        <div class="meta">
          <small>${badge}</small>
        </div>`;
      const img = card.querySelector('img');
      const fallback = card.querySelector('.fallback-text');
      if (img) {
        img.onload  = () => { img.style.opacity = '1'; if (fallback) fallback.style.display = 'none'; };
        img.onerror = () => { img.style.display = 'none'; if (fallback) fallback.style.display = 'block'; };
        NomadImages.observe(img, encodeURI(item.cover));   // a few covers at a time, near the viewport
      }
      card.onclick = onClick;
      return card;
    }

    /* Recently played, per phone: the last few ROMs started here, newest first. Shown only
       on the plain list, a search or a console filter is looking for something else. */
    function recentPaths() { const v = NomadPrefs.get(RECENT_KEY, []); return Array.isArray(v) ? v : []; }
    function noteRecent(game) {
      NomadPrefs.set(RECENT_KEY, [game.file, ...recentPaths().filter(p => p !== game.file)].slice(0, 8));
    }
    function renderRecent() {
      const box = document.getElementById('recent'), row = document.getElementById('recentRow');
      row.innerHTML = '';
      const list = searchInput.value.trim() || consoleSelect.value ? [] :
        recentPaths().map(p => games.find(g => g.file === p)).filter(Boolean);
      box.hidden = !list.length;
      list.forEach(g => row.appendChild(makeCard(g, badgeFor(g), () => startGame(g))));
    }

    function render() {
      grid.innerHTML = '';
      grid.className = `media-grid ${currentSize}`;
      emuWrap.style.display = 'none';
      renderRecent();

      // Built-ins pin to the top (own order, unaffected by the sort dropdown).
      // A console filter hides them; the search box still matches their names.
      const txt = searchInput.value.trim().toLowerCase();
      const shownBuiltins = consoleSelect.value ? [] :
        builtins.filter(b => b.name.toLowerCase().includes(txt));

      if (!shownBuiltins.length && !filtered.length) {
        grid.innerHTML = noteHTML('No games found');
        return;
      }

      shownBuiltins.forEach(b => {
        grid.appendChild(makeCard(b, 'Built-in', () => { location.href = encodeURI(b.file); }));
      });
      filtered.forEach(game => {
        grid.appendChild(makeCard(game, badgeFor(game), () => startGame(game)));
      });
    }

    /* /games#play=<rom path>, from the menu's search: start that game as if its card was
       tapped. EmulatorJS still shows its own Start button, which is the tap a browser wants
       before it plays sound. */
    function playFromHash() {
      const m = location.hash.match(/^#play=(.+)$/);
      if (!m) return;
      let want;
      try { want = normalizePath(decodeURIComponent(m[1])); } catch (e) { return; }
      history.replaceState(history.state, '', location.pathname + location.search);
      const game = games.find(g => g.file === want || g.file + '.gz' === want);
      if (game) startGame(game);
    }

    /* Leaving a game. EmulatorJS can't be torn down and started again in one page
       lifetime, so it reloads back to the grid. From the Exit button, the history step
       the game added is taken off first, so Back afterwards leaves the page as usual. */
    function exitGame() {
      if (!NomadBack.isOpen('game')) { location.reload(); return; }
      const t = setTimeout(() => location.reload(), 700);
      window.addEventListener('popstate', () => { clearTimeout(t); location.reload(); }, { once: true });
      NomadBack.done('game');
    }
    document.getElementById('exitGame').addEventListener('click', exitGame);

    function startGame(game) {
      if (running) return;
      running = game;
      noteRecent(game);
      // the phone's Back leaves the game for the list, not the page
      NomadBack.open('game', () => location.reload());
      grid.parentElement.scrollTo({ top: 0 });
      window.scrollTo({ top: 0 });
      grid.style.display = 'none';
      document.getElementById('recent').hidden = true;

      const bar = document.getElementById('emuBar');
      bar.style.display = 'flex';
      document.getElementById('emuTitle').textContent = game.name;

      // fit the player to the space below the exit bar. a fixed vh height pushes
      // EmulatorJS's bottom-anchored Start button off screen
      document.querySelector('.toolbar').style.display = 'none';
      emuWrap.style.display = 'block';
      emuWrap.innerHTML = '<div id="emu"></div>';
      const fitEmu = () => {
        const top = emuWrap.getBoundingClientRect().top;
        emuWrap.style.height = Math.max(300, window.innerHeight - top - 10) + 'px';
      };
      fitEmu();
      window.addEventListener('resize', fitEmu);

      // deriveCore's UI values are not all valid EmulatorJS system keys. there is no 'gbc'
      // (gambatte lives under 'gb') and Sega systems are 'segaMD'/'segaMS'. an unmapped
      // value makes the loader fetch a nonexistent cores/<value>-wasm.data and die
      const EJS_SYSTEM = { gbc: 'gb', genesis: 'segaMD', sms: 'segaMS' };

      window.EJS_player     = '#emu';
      window.EJS_gameUrl    = encodeURI(game.file);
      window.EJS_core       = EJS_SYSTEM[game.core] || game.core;
      window.EJS_pathtodata = '/EmulatorJS/data/';
      window.EJS_gameName   = game.name;
      window.EJS_biosUrl    = '';
      window.EJS_lightgun   = false;
      // stable per-game save/state key even if the file is renamed later
      window.EJS_gameID     = game.file;

      // phones have no console, so emulator progress and errors go to the exit bar
      const emuStatus = document.getElementById('emuStatus');
      const setStatus = (msg) => { emuStatus.textContent = msg; };
      setStatus('Loading emulator…');
      window.EJS_ready = () => setStatus('Ready');
      // after Start the emulator fetches the game, which the first time is the whole ROM
      document.addEventListener('click', (ev) => {
        if (!ev.target.closest || !ev.target.closest('.ejs_start_button')) return;
        const mb = game.size ? ' (' + (game.size / 1e6).toFixed(1) + ' MB)' : '';
        setStatus('Starting. The first time, this downloads the game' + mb + '.');
      }, true);
      window.EJS_onGameStart = () => setStatus('');
      window.addEventListener('error', (ev) => {
        if (ev.message) setStatus('Error: ' + String(ev.message).slice(0, 140));
      });
      window.addEventListener('unhandledrejection', (ev) => {
        setStatus('Error: ' + String(ev.reason && ev.reason.message || ev.reason).slice(0, 140));
      });
      const origConsoleError = console.error.bind(console);
      console.error = (...args) => {
        setStatus('Error: ' + args.map(String).join(' ').slice(0, 140));
        origConsoleError(...args);
      };
      // show a message when the emulator has not started long after launch
      let stallTicks = 0;
      const stallTimer = setInterval(() => {
        if (window.EJS_emulator && window.EJS_emulator.started) { clearInterval(stallTimer); return; }
        if (++stallTicks >= 4 && !emuStatus.textContent.startsWith('Error')) {
          setStatus('Still loading after ' + (stallTicks * 10) + 's. ' +
            'In the WiFi sign-in window? Open this page in your browser.');
        }
      }, 10000);

      const loader = document.createElement('script');
      // vendored EmulatorJS keeps the loader inside data/
      loader.src = '/EmulatorJS/data/loader.js';
      loader.onerror = () => {
        emuWrap.innerHTML = '<p style="color:#fff;text-align:center;padding-top:2rem;">' +
          'The emulator is missing from the card. Copy the card files onto it again.</p>';
      };
      document.body.appendChild(loader);
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(applyFilters, 150);
    });
    consoleSelect.addEventListener('change', applyFilters);
    sortSelect.addEventListener('change', () => applySort(sortSelect.value));

    init();
  </script>
</body>
</html>
