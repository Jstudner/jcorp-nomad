      const res = await idx.openResource(hit.archiveIdx, hit.url || articleSlug(hit.title), ref, decompressors);
      if (_imgStop) return true;
      im.removeAttribute('data-zim-src');
      const url = URL.createObjectURL(new Blob([res.data], { type: res.mimeType || 'image/webp' }));
      _imgBlobUrls.push(url); im.src = url;
      return true;
    } catch (e) {
      const msg = (e && e.message || '').toLowerCase();
      // "not in the archive" is final; a strained device is worth another go,
      // so the element keeps its data-zim-src and stays in the document
      const pressure = /reset|network|failed to fetch|abort|timeout|load /.test(msg);
      if (!pressure) { im.removeAttribute('data-zim-src'); im.remove(); }
      return !pressure;
    }
  }

  let observed = false;
  try {
    const IO = cdoc.defaultView && cdoc.defaultView.IntersectionObserver;
    if (IO) {
      _imgObserver = new IO((entries) => {
        for (const en of entries) if (en.isIntersecting) { _imgObserver.unobserve(en.target); queue.push(en.target); drain(); }
      }, { root: null, rootMargin: '300px 0px' });
      imgs.forEach((im) => _imgObserver.observe(im));
      observed = true;
    }
  } catch (e) { observed = false; }
  if (!observed) { imgs.slice(0, IMG_EAGER_FALLBACK).forEach((im) => queue.push(im)); drain(); }
}

/* Turn a clicked link into a search query. We cant resolve a raw ZIM url to an
   article on the device (that needs a live binary search) so we search for the
   target's name instead. Returns null when the link isnt worth searching:
   external site, downloadable resource, page anchor, generic nav. Prefers the
   article name in the href ("Eurasian_otter") over the link text. */
function linkToQuery(href, text) {
  href = (href || '').trim();
  text = (text || '').trim();
  if (href.startsWith('#')) return null;                                  // same-page anchor
  if (/^(https?:|mailto:|tel:|\/\/)/i.test(href)) return null;            // external (offline = dead)
  if (/\.(epub|pdf|mp4|webm|mp3|ogg|zip|png|jpe?g|gif|svg|css|js|woff2?)($|\?)/i.test(href)) return null; // resource
  // derive an article name from the href: drop query/anchor, path, namespace, extension
  let cand = href.split('#')[0].split('?')[0];
  cand = cand.substring(cand.lastIndexOf('/') + 1);                       // basename
  try { cand = decodeURIComponent(cand); } catch (e) {}
  cand = cand.replace(/\.(html?|php)$/i, '').replace(/_/g, ' ').trim();
  const generic = /^(home|index|main ?page|top|contents?|next|previous|prev|back|edit)$/i;
  // prefer readable link text; fall back to the href-derived name
  let q = (text.length > 1 && !generic.test(text)) ? text : cand;
  if (!q || q.length < 2 || generic.test(q)) return null;
  return q.slice(0, 80);
}

/* ---------------- map archives ----------------
   Some ZIMs are full offline map apps. Their place pages read fine here, but the
   viewer pages need scripts, so those get a landing that links to the app copy
   under /Maps/<id>/ when one is installed. */

function isMapAppPage(html){
  return html.indexOf('maplibre-gl.js') !== -1 ||
         (html.indexOf('streetzim') !== -1 && html.indexOf('category-index') !== -1);
}

/* Installed map-app regions on this card, via the Maps-page manifests. */
let _szRegionsP = null;
function szRegions(){
  if (!_szRegionsP){
    _szRegionsP = fetch('/api/maps-list', { cache: 'no-store' })
      .then(r => r.json())
      .then(j => Promise.all((j.regions || []).map(m =>
        fetch(m.manifest, { cache: 'no-store' }).then(r => r.json())
          .then(man => ({ id: m.id, man })).catch(() => null))))
      .then(list => list
        .filter(x => x && x.man && x.man.type === 'streetzim')
        .map(x => ({ id: x.id, name: x.man.name || x.id,
                     target: '/Maps/' + encodeURIComponent(x.id) + '/' + (x.man.app || 'index.html') })))
      .catch(() => []);
  }
  return _szRegionsP;
}

async function szFindRegion(title){
  const rs = await szRegions();
  if (!rs.length) return null;
  const t = (title || '').toLowerCase();
  return rs.find(r => r.name.toLowerCase() === t) ||
         (rs.length === 1 ? rs[0] :
          rs.find(r => t && (t.includes(r.name.toLowerCase()) || r.name.toLowerCase().includes(t))) || null);
}

function _szArchiveTitle(hit){
  const arc = hit && (window.__archives || [])[hit.archiveIdx];
  return (arc && (arc.name || arc.id)) || (hit && hit.title) || '';
}

/* "Directions to here" / "View on map" on a place page. Opens the installed
   /Maps copy at the same destination, or explains how to install it. */
async function szOpenMap(fragment){
  const region = await szFindRegion(_szArchiveTitle(_articleHit));
  if (region){ location.href = region.target + (fragment || ''); return; }
  alert('This map is not installed on the card yet.\n\nOnce its region folder is ' +
        'in /Maps on the card, Directions and View-on-map open the interactive map.');
}

async function showMapLanding(hit){
  enterReader();
  showArticleFrame();
  _articleHit = hit;
  const title = _szArchiveTitle(hit) || 'Map archive';
  document.getElementById('article-title').textContent = title;
  document.title = title + ' · Nomad Archive';
  const region = await szFindRegion(title);
  const open = region
    ? '<p><a data-sz-target="' + escapeHtml(region.target) + '" href="' + escapeHtml(region.target) + '"' +
      ' style="display:inline-block;padding:12px 22px;border-radius:10px;background:#1a56db;color:#fff;font-weight:600;">Open the map</a></p>' +
      '<p>Pan and zoom the map, search for places and addresses, and get directions, all offline.</p>'
    : '<p>To use it on this Nomad, its region folder needs to be installed into the ' +
      'card’s <b>/Maps</b> folder. It then opens from the Maps page with everything ' +
      'working offline.</p>' +
      '<p>The place pages in this archive are still searchable right here, and each one shows ' +
      'its details and coordinates.</p>';
  setFrame('<h1>' + escapeHtml(title) + '</h1>' +
    '<p style="color:#888;margin-top:-6px">Interactive map archive</p>' +
    '<p>This archive is a complete offline map application (street map, place search and ' +
    'navigation) which runs as its own page rather than inside the article reader.</p>' + open);
}

/* Sanitize ZIM article HTML: keep text and structure, drop scripts and external
   refs. Images are kept but disarmed to data-zim-src for lazy inlining. Internal
   links stay as <a> so a click can be handled by the parent. */
let _articleCssRefs = [];
let _articleBodyClass = '';
let _articleSelfStyled = false;
function sanitizeArticle(html){
  // body classes drive mwoffliner/site skins (centering, colors); carry them over
  const bm = html.match(/<body[^>]*class\s*=\s*("([^"]*)"|'([^']*)')/i);
  _articleBodyClass = bm ? (bm[2] != null ? bm[2] : bm[3]) : '';
  _articleSelfStyled = /<link\b[^>]*\.css|<style\b/i.test(html);
  // stylesheet links are collected (loaded later from the ZIM), not dropped. media is
  // kept so a print sheet cant blank the screen view, print-only sheets are skipped
  _articleCssRefs = [];
  html.replace(/<link\b[^>]*rel=["']?stylesheet["']?[^>]*>/gi, (tag) => {
    const m = tag.match(/href\s*=\s*("([^"]*)"|'([^']*)')/i);
    const ref = m ? (m[2] != null ? m[2] : m[3]) : '';
    const mm = tag.match(/media\s*=\s*("([^"]*)"|'([^']*)')/i);
    const media = mm ? (mm[2] != null ? mm[2] : mm[3]) : '';
    if (/^\s*print\s*$/i.test(media)) return tag;
    if (ref && !/^(https?:|\/\/|data:)/i.test(ref)) _articleCssRefs.push({ ref, media });
    return tag;
  });
  // keep the document's own <style> blocks. self-styled pages (StreetZim, iFixit,
  // recipe ZIMs) are an unreadable pile without them
  const styles = (html.match(/<style\b[\s\S]*?<\/style>/gi) || []).join('\n');
  // take <body> if present
  const bodyM = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  let s = bodyM ? bodyM[1] : html;
  s = s.replace(/<script\b[\s\S]*?<\/script>/gi,'');
  s = s.replace(/<script\b[^>]*>/gi,'');        // unpaired/self-closed leftovers
  s = s.replace(/<\/script>/gi,'');
  // <base> rewrites where every relative link points, and a stray meta refresh in
  // the body would navigate the frame on its own. both are ways the reader ends up
  // loading the archive page inside its own iframe
  s = s.replace(/<base\b[^>]*>/gi,'');
  s = s.replace(/<meta\b[^>]*http-equiv=["']?refresh[^>]*>/gi,'');
  s = s.replace(/<style\b[\s\S]*?<\/style>/gi,'');
  s = s.replace(/<link\b[^>]*>/gi,'');
  // server-side errors the scraper captured as if they were article text. a wiki with
  // a broken Widgets extension writes one of these where each social button used to
  // be, so the reader shows file paths off somebody else's web server
  s = s.replace(/Error in widget[^:<]{0,80}:\s*unable to write file\s*[^\s<]*/gi, '');
  // unwrap noscript rather than dropping it: this reader runs no scripts, so the
  // no-script markup is the version meant for us. lazy-loading sites put the real
  // archive-local <img> in here and leave a blank placeholder outside it, and
  // dropping the block is what left TruePrepper pages full of empty picture boxes
  s = s.replace(/<noscript\b[^>]*>([\s\S]*?)<\/noscript>/gi, (m, inner) => inner);
  s = s.replace(/<\/?noscript\b[^>]*>/gi,'');
  // embedded frames (spotify/youtube) are dead offline and spam the console with
  // sandbox warnings; forms could navigate the frame to the captive portal on submit
  s = s.replace(/<iframe\b[\s\S]*?<\/iframe>/gi,'');
  s = s.replace(/<iframe\b[^>]*>/gi,'');
  s = s.replace(/<embed\b[^>]*>/gi,'');
  s = s.replace(/<object\b[\s\S]*?<\/object>/gi,'');
  s = s.replace(/<form\b[^>]*>/gi,'<div>');
  s = s.replace(/<\/form>/gi,'</div>');
  // MathML: phones without MathML support render the raw {\displaystyle...}
  // annotation as text. Every wiki formula ships a fallback <img>, use that.
  s = s.replace(/<math\b[\s\S]*?<\/math>/gi,'');
  s = s.replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
  s = s.replace(/\ssrcset\s*=\s*("[^"]*"|'[^']*')/gi,'');
  // disarm images: src -> data-zim-src so the sandboxed iframe makes no request,
  // inlineImages() then lazily fetches each blob from the ZIM. external/sourceless imgs are dropped
  s = s.replace(/<img\b([^>]*)>/gi, (m, attrs) => {
    const attr = (name) => {
      const r = attrs.match(new RegExp('\\b' + name + '\\s*=\\s*("([^"]*)"|\'([^\']*)\')', 'i'));
      return r ? (r[2] != null ? r[2] : r[3]) : '';
    };
    const firstOfSet = (v) => (v || '').split(',')[0].trim().split(/\s+/)[0];
    // a scraped page carries the same picture twice: the copy the scraper rewrote to a
    // path inside the archive, and a lazy-loading copy still pointing at the live web.
    // take whichever candidate actually lives in the archive
    const candidates = [
      attr('src'), attr('data-src'), attr('data-lazy-src'), attr('data-original'),
      attr('data-lazy'), firstOfSet(attr('srcset')), firstOfSet(attr('data-srcset'))
    ];
    const usable = candidates.find(c => c && !/^(https?:|\/\/|data:)/i.test(c));
    if (!usable) {
      // nothing local: a bare placeholder would just hold open an empty box
      const inlineOnly = candidates.find(c => c && /^data:/i.test(c));
      return (inlineOnly && !candidates.some(c => c && /^(https?:|\/\/)/i.test(c))) ? m : '';
    }
    const rest = attrs
      .replace(/\b(?:data-)?(?:src|lazy-src|original|lazy)\s*=\s*("[^"]*"|'[^']*')/gi, '')
      .replace(/\b(?:data-)?srcset\s*=\s*("[^"]*"|'[^']*')/gi, '')
      // the page's own script would have swapped this class once the image loaded.
      // without scripts its not-loaded styling (often opacity:0) hides our blob
      .replace(/\bclass\s*=\s*"([^"]*)"/i, (cm, cls) => 'class="' + cls.replace(/\blazyload(ing)?\b/g, 'lazyloaded') + '"');
    return '<img data-zim-src="' + usable.replace(/"/g, '&quot;') + '"' + rest + '>';
  });
  s = s.replace(/<source\b[^>]*>/gi,'');
  // external links are stripped, internal ones move their target into data-zim-href
  // so the iframe can never navigate on its own (a click racing the handler used to
  // sail off to the captive portal). same-page anchors keep a real href
  s = s.replace(/<a\b([^>]*)>/gi, (m, attrs) => {
    const hm = attrs.match(/href\s*=\s*("([^"]*)"|'([^']*)')/i);
    const href = hm ? (hm[2] != null ? hm[2] : hm[3]) : '';
    if (!href) return '<a' + attrs + '>';
    if (/^(https?:|mailto:|tel:|\/\/)/i.test(href))
      return '<a data-zim-ext="1" title="Links to the live web, not saved in this archive">';
    if (href.charAt(0) === '#') return '<a' + attrs + '>';
    const rest = attrs
      .replace(/\shref\s*=\s*("[^"]*"|'[^']*')/i, '')
      .replace(/\starget\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');   // no _top/_parent escapes
    return '<a data-zim-href="' + href.replace(/"/g, '&quot;') + '"' + rest + ' style="cursor:pointer">';
  });
  return styles + s;
}

/* (Article link clicks are wired from setFrame's frame.onload - the sandboxed
   iframe can't run scripts, so the parent attaches the handler directly.) */

/* ---------------- reader search ---------------- */
async function searchArticles(){
  const q = document.getElementById('reader-search-input').value.trim();
  const panel = document.getElementById('search-results');
  if(!q){ panel.style.display='none'; return; }
  panel.innerHTML = '<div class="search-result-item"><span class="sr-title">Searching…</span></div>';
  panel.style.display='block';
  try {
    const idx = await getIndex();
    searchHits = await idx.search(q, 30);
    if(!searchHits.length){ panel.innerHTML='<div class="search-result-item"><span class="sr-title">No results</span></div>'; return; }
    panel.innerHTML = searchHits.map((h,i)=>`<div class="search-result-item" onclick="selectSearchResult(${i})">
      <div class="sr-title">${escapeHtml(h.title)}</div>
      <div class="sr-url">${escapeHtml(h.archiveId||'')}</div>
    </div>`).join('');
  } catch (e) {
    panel.innerHTML='<div class="search-result-item"><span class="sr-title">Error: '+escapeHtml(e.message)+'</span></div>';
  }
}
function selectSearchResult(i){
  const h = searchHits[i]; if(!h) return;
  document.getElementById('search-results').style.display='none';
  openArticle(h);
}

/* ---------------- history / ui ---------------- */
function historyBack(){ if(historyIndex>0){ historyIndex--; navigatingHistory=true; openArticle(history[historyIndex]); } }
function historyForward(){ if(historyIndex<history.length-1){ historyIndex++; navigatingHistory=true; openArticle(history[historyIndex]); } }
function updateHistoryButtons(){ const b=document.getElementById('btn-hist-back'),f=document.getElementById('btn-hist-fwd'); if(b)b.disabled=historyIndex<=0; if(f)f.disabled=historyIndex>=history.length-1; }

function toggleSidebar(){ const sb=document.getElementById('sidebar'); sb.classList.toggle('open'); if(sb.classList.contains('open')) buildToc(); }
function buildToc(){
  const body=document.getElementById('sidebar-body');
  try{
    const doc=document.getElementById('article-frame').contentDocument;
    const hs=doc.querySelectorAll('h1,h2,h3,h4');
    if(!hs.length){ body.innerHTML='<div class="sidebar-item" style="color:var(--muted)">No headings</div>'; return; }
    body.innerHTML=Array.from(hs).map((h,i)=>{const lv=parseInt(h.tagName[1]);return `<div class="sidebar-item" style="padding-left:${16+(lv-1)*14}px" onclick="scrollToHeading(${i})">${escapeHtml(h.textContent)}</div>`;}).join('');
  }catch(e){ body.innerHTML='<div class="sidebar-item" style="color:var(--muted)">Unavailable</div>'; }
}
function scrollToHeading(i){ try{ const doc=document.getElementById('article-frame').contentDocument; const h=doc.querySelectorAll('h1,h2,h3,h4')[i]; if(h)h.scrollIntoView({behavior:'smooth'}); document.getElementById('sidebar').classList.remove('open'); }catch(e){} }

// close search dropdown on outside click
document.addEventListener('click',(e)=>{ const p=document.getElementById('search-results'),i=document.getElementById('reader-search-input'); if(p&&!p.contains(e.target)&&e.target!==i) p.style.display='none'; });

if (localStorage.getItem('nomad_dark_mode')==='true'){ document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }

/* ---------------- boot ---------------- */
(async function boot(){
  NomadUI.applyDownloadPolicy();
  NomadPlyr.ready();
  await loadZimList();
  const p = new URLSearchParams(window.location.search);
  if (p.has('a') && p.has('c') && p.has('b')){
    const hit = { archiveIdx:+p.get('a'), cluster:+p.get('c'), blob:+p.get('b'), title:p.get('t')||'' };
    // a deep link to an archive's main page can take its URL from the manifest
    const arc = (window.__archives||[]).find(x => x.idx === hit.archiveIdx);
    if (arc && hit.cluster === arc.mainCluster && hit.blob === arc.mainBlob && arc.mainUrl) hit.url = arc.mainUrl;
    openArticle(hit, true);
  } else if (SINGLE_ARCHIVE_IDX >= 0){
    // Only one archive on the card - go straight into it, no selection screen.
    document.getElementById('library-view').style.display='none';
    openArchive(SINGLE_ARCHIVE_IDX);
  }
})();
</script>
