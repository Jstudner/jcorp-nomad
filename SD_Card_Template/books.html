<!DOCTYPE html>
<!-- Version 7 -->
<html lang="en">
<head>
    <link rel="stylesheet" href="/master.css">
    <script src="/theme-boot.js?v=5"></script>
<script src="/nomad-icons.js?v=1"></script>
    <script src="/nomad-utils.js?v=52"></script>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nomad • Books</title>
    <!-- Books page supports epub, audiobook, and PDF formats. Comics (CBZ/CBR/folder) open in comics.html. -->
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html, body {
            height: 100%
        }

        body {
            font-family: Arial,Helvetica,sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }

            body.dark {
                background: var(--bg);
                color: var(--text);
            }

                body.dark .toolbar {
                    background: var(--bg);
                    border-bottom-color: var(--white-alpha-4);
                }

                body.dark .media-card {
                    background: var(--card);
                    box-shadow: var(--shadow-medium);
                }
                body.dark .back-btn { background: var(--white-alpha-12); color: var(--color-white); }
                body.dark .view-btn.active { border-color: var(--primary); }

                body.dark .overlay-title {
                    color: var(--text);
                }

                body.dark .modal-content, body.dark .list-modal-content {
                    background: var(--card);
                    color: var(--text);
                }

                body.dark .progress-bar-container {
                    background: var(--progress-dark);
                }

                body.dark .time-info {
                    color: var(--time-dark);
                }

        header {
            position: sticky;
            top: 0;
            z-index: 60;
        }

            header h1 {
                font-size: clamp(1.25rem,4vw,1.75rem);
                margin: 0
            }

        .back-btn {
            text-decoration: none;
            color: #fff;
            background: var(--primary-dark);
            padding: .5rem .75rem;
            border-radius: var(--radius);
            font-size: .95rem
        }

        .toolbar {
            background: var(--bg);
            padding: .65rem 1rem;
            display: flex;
            flex-wrap: nowrap;
            gap: .6rem;
            align-items: center;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: var(--header-height);
            z-index: 55;
            }

            .toolbar input[type="search"] {
            flex: 1;
            padding: .5rem .75rem;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card);
            color: var(--text);
            }

            .toolbar select, .toolbar .view-btn {
                padding: .48rem .7rem;
                border: 1px solid var(--line);
                background: var(--card);
                color: var(--text);
                border-radius: var(--radius);
                font-size: 0.9rem;
                cursor: pointer;
            }

        .view-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary-dark);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            padding-bottom: calc(1rem + var(--audio-height));
        }

        .grid-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px
        }

        .media-grid {
            display: grid;
            gap: 1rem;
        }

            .media-grid.small {
                grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
            }

            .media-grid.medium {
                grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
            }

            .media-grid.large {
                grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            }

        .media-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .25s ease;
            cursor: pointer;
        }

        .media-card:hover {
            transform: translateY(-4px);
        }

        @media (max-width: 768px) {
            .media-grid.medium {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .media-grid.small {
                grid-template-columns: repeat(4, 1fr);
            }

            .media-grid.medium {
                grid-template-columns: repeat(3, 1fr);
            }

            .media-grid.large {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .media-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .25s ease;
            cursor: pointer;
            width: 100%;
            max-width: 220px;
            margin: 0 auto;
        }

        .media-grid.small .media-card {
            max-width: 120px;
        }

        .media-grid.medium .media-card {
            max-width: 160px;
        }

        .media-grid.large .media-card {
            max-width: 220px;
        }

        .media-card.is-directory .thumb-wrapper {
            box-sizing: border-box;
        }

        .folder-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 3;
            display: flex;
            color: #fff;
            opacity: 0.85;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
            pointer-events: none;
        }

        body.dark .folder-icon {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.7));
        }

        .media-card:hover {
            transform: translateY(-3px);
        }

        .thumb-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #efeff5;
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            aspect-ratio: 2/3;
        }

        .overlay-title {
            position: absolute;
            top:0;right:0;bottom:0;left:0;inset:0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            text-align: center;
            font-weight: 700;
            color: #06306f;
            pointer-events: none;
            padding: 6px;
        }

        .media-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity .35s ease;
        }

        /* How far along (paintProgress): a thin bar and a short label on covers, rows,
           folder popup items and Continue; a quiet "Finished" once done */
        .prog { pointer-events: none; }
        .prog-bar { display: block; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
        .prog-bar i { display: block; height: 100%; background: var(--primary); }
        .prog.done .prog-bar, .prog.nobar .prog-bar { display: none; }
        .thumb-wrapper .prog { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; }
        .thumb-wrapper .prog-label {
            position: absolute; left: 6px; bottom: 9px; max-width: calc(100% - 12px);
            padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.72); color: #fff;
            font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .thumb-wrapper .prog-bar { height: 4px; border-radius: 0; background: rgba(0,0,0,0.35); }
        .thumb-wrapper .prog.done .prog-label { bottom: 6px; background: rgba(0,0,0,0.5); font-weight: 600; }
        .book-row { position: relative; }
        .book-row .prog-label { color: var(--muted); font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
        .book-row .prog-bar { position: absolute; left: 10px; right: 10px; bottom: 2px; }
        .book-row.has-prog .context { display: none; }

        /* Continue: what you're partway through, newest first */
        .continue { margin-bottom: 1rem; }
        .continue[hidden] { display: none; }
        .continue h2 { font-size: 1rem; margin: 0 0 0.5rem; }
        .continue-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
        .cont-tile {
            flex: 0 0 auto; width: 230px; max-width: 80vw; display: flex; gap: 10px; align-items: center;
            padding: 8px; border: 1px solid var(--card-border); border-radius: var(--radius);
            background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; scroll-snap-align: start;
        }
        .cont-tile:hover { border-color: var(--primary); }
        .cont-art {
            width: 40px; height: 60px; flex: 0 0 auto; border-radius: 4px; overflow: hidden; background: var(--bg);
            display: flex; align-items: center; justify-content: center; color: var(--primary);
        }
        .cont-art { position: relative; }
        .cont-art img { position: absolute; top:0;right:0;bottom:0;left:0;inset:0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
        .cont-art.has-img img { opacity: 1; }
        .cont-art.has-img svg { visibility: hidden; }
        .cont-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        .cont-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cont-text .prog { display: flex; flex-direction: column; gap: 4px; }
        .cont-text .prog-label { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .modal, .list-modal {
            display: none;
            position: fixed;
            top:0;right:0;bottom:0;left:0;inset:0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content, .list-modal-content {
            background: #fff;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            width: 92%;
            max-width: 720px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

            /* action modal: even spacing + theme tokens, matches movies/shows */
            #actionModal .modal-content {
                display: flex;
                flex-direction: column;
                gap: 10px;
                max-width: 480px;
                background: var(--card-bg);
                color: var(--text);
                overflow: visible;
            }
            #actionModal .modal-content h2 { margin: 0; }
            #actionSub { font-size: 0.9rem; color: var(--muted); }

            /* the list scrolls inside a popup that never outgrows the screen: on a phone held
               sideways 70vh plus the title and Close button would run off the top and bottom */
            .list-modal-content {
                display: flex;
                flex-direction: column;
                max-height: calc(100vh - 24px);
                max-height: calc(100dvh - 24px);
            }

            .list-modal-content .list {
                flex: 1 1 auto;
                min-height: 0;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
                padding: 12px;
                max-height: 70vh;
                overflow-y: auto;
                text-align: center;
            }

            .list-modal-content .list .media-card {
                max-width: 100%;
                margin: 0;
            }

            .modal-content h2, .list-modal-content h2 {
                margin: 0 0 10px 0
            }

        .btn {
            background: var(--primary);
            color: #fff;
            border: 0;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 6px rgba(2,6,23,0.08);
        }

            .btn.small {
                padding: 8px;
                font-size: .9rem;
                width: auto;
                min-width: 96px;
            }

        .btn-muted {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .list {
            max-height: 420px;
            overflow: auto;
            text-align: left;
            margin-top: 8px
        }

            .list .item {
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 8px;
                border-bottom: 1px solid #f4f4f9
            }

                .list .item .title {
                    flex: 1
                }

                .list .item .meta {
                    font-size: 0.9rem;
                    color: var(--muted)
                }

        .row-buttons {
            display: flex;
            gap: 8px;
            min-width: 120px
        }

        .no-cover-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .book-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
            background: transparent;
        }

        .book-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(10,12,20,0.04);
        }

        body.dark .book-row:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .book-row .book-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            display: flex;
            color: var(--primary);
        }

        .book-row .title {
            font-weight: 700;
            color: var(--primary-dark);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark .book-row .title {
            color: var(--primary);
        }

        .book-row .context {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

            .row-buttons button {
                padding: 8px;
                border-radius: 6px;
                border: 0;
                cursor: pointer
            }

        /* Audiobook player: a bar along the bottom on Nomad's theme. Cover, title and
           folder (a series) it sits in, a seek bar you can drag, then the controls. */
        .audio-player {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            color: var(--text);
            box-shadow: var(--shadow-large);
            border-top: 1px solid var(--card-border);
            padding: 10px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 1500;
        }
        .audio-player.active { display: block; }
        .audio-player-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
        .audio-top-row { display: flex; align-items: center; gap: 10px; }
        .audio-art { width: 44px; height: 44px; border-radius: var(--radius-small); object-fit: cover; flex: 0 0 auto; background: var(--bg); }
        .audio-meta { flex: 1; min-width: 0; }
        .audio-title { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .audio-sub { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .audio-close-btn { width: 36px; height: 36px; border: none; background: none; color: var(--muted); cursor: pointer;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .audio-close-btn:hover { color: var(--text); background: var(--primary-alpha-10); }

        .audio-progress-section { display: flex; flex-direction: column; gap: 2px; }
        #audioSeek { width: 100%; height: 24px; margin: 0; accent-color: var(--primary); cursor: pointer; }
        .time-info { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

        .audio-controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .audio-btn { border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            background: transparent; color: var(--text); border-radius: 50%; flex: 0 0 auto; }
        .audio-btn svg { width: 24px; height: 24px; fill: currentColor; display: block; }
        .audio-btn svg text { font-size: 7.5px; font-weight: 700; fill: currentColor; }
        .audio-btn.icon { width: 44px; height: 44px; }
        .audio-btn.icon:hover:not(:disabled) { background: var(--primary-alpha-10); color: var(--primary); }
        .audio-btn:disabled { opacity: 0.3; cursor: default; }
        .audio-btn[hidden] { display: none; }
        .audio-btn.play-pause { width: 56px; height: 56px; background: var(--primary); color: var(--header-text); margin: 0 4px; }
        .audio-btn.play-pause svg { width: 28px; height: 28px; }
        .audio-btn.play-pause .ic-pause { display: none; }
        .audio-btn.play-pause.playing .ic-play { display: none; }
        .audio-btn.play-pause.playing .ic-pause { display: block; }
        .audio-btn.pill { border-radius: var(--radius-medium); min-width: 52px; height: 34px; padding: 0 8px; font-size: 0.82rem;
            font-weight: 700; border: 1px solid var(--card-border); color: var(--text); font-variant-numeric: tabular-nums; }
        .audio-btn.pill.on { background: var(--primary); border-color: var(--primary); color: var(--header-text); }
        @media (max-width: 400px) {
            .audio-btn.icon { width: 40px; height: 40px; }
            .audio-btn.pill { min-width: 44px; padding: 0 6px; }
            .audio-controls { gap: 2px; }
        }

        @keyframes pop-in {
            0% {
                transform: scale(.97);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }
    </style>
    <script src="theme-manager.js?v=5"></script>
    <script src="/assets/nomad-marks.js?v=1"></script>
    <style>
        .marks-pill { position: relative; }
        .marks-pill svg { width: 15px; height: 15px; }
        .marks-pill.has-marks::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: #ffd400; }
    </style>
</head>
<body>
    <header>
        <h1>Books</h1>
        <a class="back-btn" href="/menu">← Back to Menu</a>
    </header>

    <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search" aria-label="Search books">
        <select id="sortSelect" aria-label="Sort books">
            <option value="nameAsc">A → Z</option>
            <option value="nameDesc">Z → A</option>
        </select>
        <div class="view-group">
          <button class="view-btn" data-size="small" title="Compact view">🔳</button>
          <button class="view-btn active" data-size="medium" title="Comfort view">🔲</button>
          <button class="view-btn" data-size="large" title="Gallery view">⬜</button>
        </div>
    </div>

    <main>
        <div class="grid-wrapper">
            <section class="continue" id="continueRow" hidden aria-label="Continue">
                <h2>Continue</h2>
                <div class="continue-list" id="continueList"></div>
            </section>
            <div id="grid" class="media-grid medium" aria-live="polite" role="list"></div>
        </div>
    </main>

    <div id="listModal" class="list-modal" onclick="if(event.target===this) closeListModal()">
        <div class="list-modal-content" onclick="event.stopPropagation()">
            <h2 id="listModalTitle">Contents</h2>
            <div id="listContainer" class="list" role="list"></div>
            <div style="margin-top:8px"><button id="listCloseBtn" class="btn-muted">Close</button></div>
        </div>
    </div>

    <div id="actionModal" class="modal" onclick="if(event.target===this) closeActionModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="actionTitle">What do you want to do?</h2>
            <div id="actionSub"></div>
            <button id="viewButton" class="btn"></button>
            <button id="downloadButton" class="btn-muted" aria-label="Download file" data-dl>Download</button>
            <button id="actionCancelBtn" class="btn-muted">Cancel</button>
        </div>
    </div>

    <!-- Audiobook Player -->
    <div class="audio-player" id="audioPlayer" role="region" aria-label="Audiobook player">
        <div class="audio-player-inner">
            <div class="audio-top-row">
                <img class="audio-art" id="audioArt" alt="" hidden>
                <div class="audio-meta">
                    <div class="audio-title" id="audioTitle">Audiobook</div>
                    <div class="audio-sub" id="audioSub"></div>
                </div>
                <button class="audio-close-btn" id="closeAudio" title="Close" aria-label="Close" data-icon="x"></button>
            </div>
            <div class="audio-progress-section">
                <input type="range" id="audioSeek" min="0" max="1000" step="1" value="0" aria-label="Position in this book">
                <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
            </div>
            <div class="audio-controls">
                <button class="audio-btn pill" id="speedBtn" title="Playback speed">1x</button>
                <button class="audio-btn icon" id="rewind" title="Back 15 seconds" aria-label="Back 15 seconds">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" text-anchor="middle">15</text></svg>
                </button>
                <button class="audio-btn play-pause" id="playPause" title="Play or pause" aria-label="Play or pause">
                    <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                    <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>
                </button>
                <button class="audio-btn icon" id="forward" title="Forward 15 seconds" aria-label="Forward 15 seconds">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16" text-anchor="middle">15</text></svg>
                </button>
                <button class="audio-btn pill" id="sleepBtn" title="Sleep timer">Sleep</button>
                <button class="audio-btn pill marks-pill" id="audioMarksBtn" title="Bookmarks" aria-label="Bookmarks" data-icon="pin"></button>
            </div>
        </div>
        <audio id="audioElement" preload="metadata" crossorigin="anonymous"></audio>
    </div>

    <script>
        /* theme via shared ThemeManager instead of a local reimplementation */
        (function () { try { ThemeManager.applyDarkMode(ThemeManager.getDarkMode()); } catch (e) { } })();
        window.addEventListener('storage', (ev) => { if (ev.key === ThemeManager.STORAGE_KEY) ThemeManager.applyDarkMode(ev.newValue === 'true'); });

        /* Constants */
        const ROOT = '/Books';
        const INDEX_ENDPOINT = '/api/index';
        const BOOK_EXTS = ['.pdf', '.epub', '.mobi', '.azw3', '.cbz', '.cbr', '.cbt', '.cb7', '.djvu', '.txt'];
        const AUDIO_EXTS = ['.mp3', '.m4b', '.m4a', '.ogg', '.wav', '.aac', '.flac'];
        const IMAGE_EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif', '.bmp'];
        const COMIC_EXTS = ['.cbz', '.cbr'];

        /* Utils */
        function ext(name) { const i = name.lastIndexOf('.'); return i >= 0 ? name.slice(i).toLowerCase() : ''; }
        function isBookName(n) { return BOOK_EXTS.includes(ext(n)); }
        function isAudioName(n) { return AUDIO_EXTS.includes(ext(n)); }
        function isImageName(n) { return IMAGE_EXTS.includes(ext(n)); }
        function isComicName(n) { return COMIC_EXTS.includes(ext(n)); }
        function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', '\'': '&#39;' }[c])); }
        function prettify(filename) {
            if (!filename) return '';
            let base = filename.replace(/\.[^/.]+$/, '');
            let title = base.replace(/[_\.]+/g, ' ').replace(/\s+/g, ' ').trim();
            title = title.replace(/\s*($$\d{4}$$|\d{4})\s*$/, '').trim();
            return title || filename;
        }
        function fileUrlDirect(path) { if (!path) return ''; return `/media?file=${encodeURIComponent(normalizePath(path))}`; }
        // names in natural order (HTTYD 2 before HTTYD 10), the order comics.html uses for pages
        const byName = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
        function formatBytes(bytes) {
            if (!bytes && bytes !== 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(Math.max(bytes, 1)) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        function formatTime(seconds) {
            if (!seconds || !isFinite(seconds)) return '0:00';
            seconds = Math.floor(seconds);
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hrs) return hrs + ':' + mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            return mins + ':' + secs.toString().padStart(2, '0');
        }

        /* Resume store */
        const RESUME_KEY = 'nomad_resume_store_v1';
        function readResume() { try { return JSON.parse(NomadPrefs.raw(RESUME_KEY) || '{}'); } catch (e) { return {}; } }
        function writeResume(obj) { try { NomadPrefs.setRaw(RESUME_KEY, JSON.stringify(obj)); } catch (e) { } }
        function fileKey(path, sz, mt) { return `${normalizePath(path)}|${sz || 0}|${mt || 0}`; }
        function findResume(movie) {
            const store = readResume();
            const norm = normalizePath(movie.path);
            const exact = fileKey(movie.path, movie.sz || 0, movie.mt || 0);
            if (store[exact]) return { key: exact, entry: store[exact] };
            // by path alone, never by file name: chapter files ("01.mp3") of different books share theirs
            for (const k of Object.keys(store)) { const p = (k.split('|')[0] || ''); if (normalizePath(p) === norm) return { key: k, entry: store[k] }; }
            return null;
        }
        // one place per file: a key written without the size (from Continue, or a link to
        // #play=) must not leave an older key for the same file that findResume finds first
        function dropResumeFor(store, path) {
            const norm = normalizePath(path);
            for (const k of Object.keys(store)) if (normalizePath(k.split('|')[0] || '') === norm) delete store[k];
        }

        /* How far along, from NomadProgress (nomad-utils.js), which every reader and the
           player here write. A folder shows the book in it you're on. Anything with
           data-prog is painted, wherever it sits. */
        const BOOK_KINDS = ['epub', 'pdf', 'comic', 'audio'];
        let inProgress = null;   // newest first, read once per paint
        function progressFor(path, isDir) {
            path = normalizePath(path);
            const own = NomadProgress.get(path);
            if (own || !isDir) return own;
            if (!inProgress) inProgress = NomadProgress.recent({ kinds: BOOK_KINDS });
            return inProgress.find(e => e.path.startsWith(path + '/')) || null;
        }
        function paintProgress(el) {
            const e = progressFor(el.dataset.path || '', el.dataset.dir === '1');
            const host = el.querySelector('.thumb-wrapper, .cont-text') || el;
            let box = host.querySelector('.prog');
            const shown = e && (e.done || e.p > 0 || e.l);
            el.classList.toggle('has-prog', !!shown);
            if (!shown) { if (box) box.remove(); return; }
            if (!box) {
                box = document.createElement('div');
                box.className = 'prog';
                box.innerHTML = '<span class="prog-label"></span><span class="prog-bar"><i></i></span>';
                host.appendChild(box);
            }
            box.classList.toggle('done', !!e.done);
            box.classList.toggle('nobar', !e.done && e.p == null);
            box.querySelector('.prog-label').textContent = e.done ? 'Finished' : (e.l || Math.round(e.p * 100) + '%');
            box.querySelector('.prog-bar i').style.width = (e.p > 0 ? Math.max(2, e.p * 100) : 0) + '%';
        }
        function refreshProgress() {
            NomadProgress._fresh();   // a reader in another tab, or this page back from the cache
            inProgress = null;
            renderContinue();
            document.querySelectorAll('[data-prog]').forEach(paintProgress);
        }

        /* Continue: the books and audiobooks you're partway through, newest first. Hidden
           while searching, and when there is nothing to continue. */
        let continueSig = null;
        function coverFor(path) {
            path = normalizePath(path);
            let best = null;
            for (const x of library) {
                const p = normalizePath(x.type === 'file' ? x.fileEntry.path : x.dir);
                if (p === path) return x.cover;
                if (x.cover && x.type === 'dir' && path.startsWith(p + '/')) best = x.cover;
            }
            return best;
        }
        function kindIcon(k) { return NomadIcons.svg(k === 'audio' ? 'headphones' : k === 'comic' ? 'books' : 'book'); }
        function renderContinue() {
            const row = document.getElementById('continueRow'), list = document.getElementById('continueList');
            if (searchInput.value.trim()) { row.hidden = true; return; }   // tiles stay for after
            const items = NomadProgress.recent({ kinds: BOOK_KINDS }).filter(e => e.path.startsWith(ROOT + '/')).slice(0, 8);
            row.hidden = !items.length;
            const sig = items.map(e => e.path).join('\n');
            if (sig === continueSig) return;   // the same books: paintProgress updates them in place
            continueSig = sig;
            // tiles already there move rather than being made again, so their covers don't reload
            const had = new Map([...list.children].map(t => [t.dataset.path, t]));
            list.innerHTML = '';
            for (const e of items) {
                const kept = had.get(e.path);
                if (kept) { list.appendChild(kept); continue; }
                const tile = document.createElement('button');
                tile.type = 'button';
                tile.className = 'cont-tile';
                tile.dataset.prog = '';
                tile.dataset.path = e.path;
                const title = e.t || prettify(e.path.split('/').pop());
                tile.innerHTML = `<span class="cont-art">${kindIcon(e.k)}</span>
                    <span class="cont-text"><span class="cont-title">${escapeHtml(title)}</span></span>`;
                tile.title = title;
                const cover = coverFor(e.path);
                if (cover) {
                    // the icon until the cover arrives (it loads through the shared queue, in place)
                    const art = tile.querySelector('.cont-art'), img = document.createElement('img');
                    img.alt = '';
                    img.addEventListener('load', () => art.classList.add('has-img'));
                    art.appendChild(img);
                    NomadImages.observe(img, fileUrlDirect(cover));
                }
                tile.addEventListener('click', () => openFromProgress(e));
                paintProgress(tile);
                list.appendChild(tile);
            }
        }
        function openFromProgress(e) {
            const q = encodeURIComponent(e.path);
            if (e.k === 'epub') location.href = `/epub?path=${q}`;
            else if (e.k === 'pdf') location.href = `/pdf?path=${q}`;
            else if (e.k === 'comic') location.href = `/comics?path=${q}`;
            else playTrack({ name: prettify(e.path.split('/').pop()), path: e.path });
        }
        window.addEventListener('pageshow', (ev) => { if (ev.persisted) refreshProgress(); });
        window.addEventListener('storage', (ev) => { if (ev.key === NomadProgress.KEY) refreshProgress(); });

        /* DOM refs */
        const gridEl = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const viewButtons = document.querySelectorAll('.view-btn');
        const listModal = document.getElementById('listModal');
        const listModalTitle = document.getElementById('listModalTitle');
        const listContainer = document.getElementById('listContainer');
        const listCloseBtn = document.getElementById('listCloseBtn');
        const actionModal = document.getElementById('actionModal');
        const actionTitle = document.getElementById('actionTitle');
        const viewButton = document.getElementById('viewButton');
        const downloadButton = document.getElementById('downloadButton');
        const actionCancelBtn = document.getElementById('actionCancelBtn');
        const actionSub = document.getElementById('actionSub');

        /* Audio refs */
        const audioPlayer = document.getElementById('audioPlayer');
        const audioTitle = document.getElementById('audioTitle');
        const audioElement = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPause');
        const speedBtn = document.getElementById('speedBtn');
        const audioSeek = document.getElementById('audioSeek');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        /* State */
        let library = [];
        let filtered = [];
        let currentSize = NomadPrefs.raw('nomadBooksSize') || 'medium';
        let currentItem = null;
        const ANIM_KEY = 'nomadBooksAnimated_v1';

        /* Audio bottom padding management */
        function updateAudioHeight() {
            const player = document.getElementById('audioPlayer');
            const height = (player && player.classList.contains('active')) ? player.offsetHeight : 0;
            document.documentElement.style.setProperty('--audio-height', height + 'px');
        }
        window.addEventListener('resize', updateAudioHeight);
        if (window.ResizeObserver) new ResizeObserver(updateAudioHeight).observe(document.getElementById('audioPlayer'));

        /* Index fetch (NDJSON) */
        async function fetchIndex(path){ return NomadIndex.fetch(path); }   // shared reader, nomad-utils.js

        /* Build top-level library */
        async function buildLibrary() {
            const out = [];
            const rootResp = await fetchIndex(ROOT);

            const rootImages = new Map();
            for (const e of rootResp.entries) {
                if (e.n && e.n.includes('/')) continue;
                if (e.t === 'f' && isImageName(e.n)) {
                    rootImages.set(e.n.replace(/\.[^/.]+$/, '').toLowerCase(), normalizePath((ROOT === '/' ? '' : ROOT) + '/' + e.n));
                }
            }

            for (const e of rootResp.entries) {
                if (e.n && e.n.includes('/')) continue;
                
                if (e.t === 'd') {
                    const seriesName = e.n;
                    const dir = normalizePath((ROOT === '/' ? '' : ROOT) + '/' + seriesName);
                    let cover = null;
                    const variants = [
                        seriesName.toLowerCase(),
                        seriesName.toLowerCase().replace(/\s+/g, '-'),
                        seriesName.toLowerCase().replace(/\s+/g, '_')
                    ];
                    for (const v of variants) { if (rootImages.has(v)) { cover = rootImages.get(v); break; } }
                    if (!cover) ['poster', 'cover', 'folder', 'art'].forEach(k => { if (!cover && rootImages.has(k)) cover = rootImages.get(k); });
                    
                    const isComic = e.comic === true;
                    out.push({ name: seriesName.replace(/[_\.]+/g, ' ').trim(), dir, cover, type: 'dir', isComic });

                } else if (e.t === 'f') {
                    if (isBookName(e.n) || isAudioName(e.n) || isComicName(e.n)) {
                        const p = normalizePath((ROOT === '/' ? '' : ROOT) + '/' + e.n);
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        const cover = rootImages.has(base) ? rootImages.get(base) : null;
                        out.push({ name: prettify(e.n), dir: null, cover, type: 'file', fileEntry: { name: e.n, path: p, sz: e.sz || 0, mt: e.mt || 0 } });
                    }
                }
            }

            out.sort((a, b) => byName.compare(a.name, b.name));
            return out;
        }
        async function loadDirContents(dir) {
            try {
                const resp = await fetchIndex(dir);
                const files = [];
                const images = new Map();
                
                const normalizedDir = normalizePath(dir);
                
                for (const e of resp.entries) {
                    if (!e.p || !e.n) continue;
                    
                    const entryPath = normalizePath(e.p);
                    
                    if (entryPath === normalizedDir) continue;
                    
                    if (!entryPath.startsWith(normalizedDir + '/')) continue;
                    
                    const relativePath = entryPath.substring(normalizedDir.length + 1);
                    if (relativePath.includes('/')) continue;
                    
                    if (e.t === 'f' && isImageName(e.n)) {
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        images.set(base, entryPath);
                    }
                }
                
                for (const e of resp.entries) {
                    if (!e.p || !e.n) continue;
                    
                    const entryPath = normalizePath(e.p);
                    
                    if (entryPath === normalizedDir) continue;
                    
                    if (!entryPath.startsWith(normalizedDir + '/')) continue;
                    
                    const relativePath = entryPath.substring(normalizedDir.length + 1);
                    if (relativePath.includes('/')) continue;
                    
                    if (e.t === 'f' && (isBookName(e.n) || isAudioName(e.n) || isComicName(e.n))) {
                        const base = e.n.replace(/\.[^/.]+$/, '').toLowerCase();
                        const cover = images.has(base) ? images.get(base) : null;
                        files.push({ name: prettify(e.n), path: entryPath, sz: e.sz || 0, mt: e.mt || 0, cover });
                    } else if (e.t === 'd') {
                        const isComic = e.comic === true;
                        const base = e.n.toLowerCase();
                        const cover = images.has(base) ? images.get(base) : null;
                        files.push({ name: e.n, path: entryPath, isDir: true, isComic, cover });
                    }
                }
                // by file name, numbers as numbers: chapter 2 before chapter 10
                files.sort((a, b) => byName.compare(a.path.split('/').pop(), b.path.split('/').pop()));
                return { header: resp.header, files };
            } catch (err) {
                console.warn('loadDirContents failed', dir, err);
                return { header: null, files: [] };
            }
        }
        /* View controls */
        function setViewSize(size) {
            currentSize = size;
            viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.size === size));
            gridEl.className = `media-grid ${size}`;
            NomadPrefs.setRaw('nomadBooksSize', size);
        }
        setViewSize(currentSize);
        viewButtons.forEach(btn => btn.addEventListener('click', () => setViewSize(btn.dataset.size)));

        /* Render grid */
        function renderGrid() {
            inProgress = null;
            renderContinue();
            if (filtered.length === 0) {
                gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);padding:12px">No books found</p>';
                return;
            }

            const withImages = filtered.filter(item => item.cover);
            const noImages = filtered.filter(item => !item.cover);

            const useMixedMode = withImages.length > 0 && noImages.length > 0;

            if (useMixedMode) {
                gridEl.className = `media-grid ${currentSize}`;
            } else {
                gridEl.className = `media-grid ${currentSize}`;
            }

            const shouldAnimate = !NomadPrefs.raw(ANIM_KEY);
            let animIdx = 0;

            const frag = document.createDocumentFragment();

            if (withImages.length > 0 || !useMixedMode) {
                const itemsToRender = useMixedMode ? withImages : filtered;
                itemsToRender.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    if (item.type === 'dir') {
                        card.classList.add('is-directory');
                    }
                    card.setAttribute('role', 'listitem');
                    card.setAttribute('aria-label', item.name || '');
                    const pathVal = item.type === 'file' ? ((item.fileEntry && item.fileEntry.path) || '') : (item.dir || '');
                    card.dataset.path = pathVal;
                    card.dataset.prog = '';
                    if (item.type === 'dir') card.dataset.dir = '1';

                    const coverPath = item.cover ? fileUrlDirect(item.cover) : '';
                    const imgHTML = coverPath ? `<img class="media-thumb" loading="lazy" alt="${escapeHtml(item.name)}">` : '';

                    const showFolderIcon = item.type === 'dir' && !item.isComic;
                    const folderIconHTML = showFolderIcon ? `<span class="folder-icon">${NomadIcons.svg('folder', 20)}</span>` : '';

                    card.innerHTML = `
                    <div class="thumb-wrapper" aria-hidden="false">
                        <span class="fallback-text">${escapeHtml(item.name)}</span>
                        ${imgHTML}
                        ${folderIconHTML}
                    </div>
                    `;

                    const img = card.querySelector('img');
                    const fallback = card.querySelector('.fallback-text');
                    if (img && coverPath) {
                        img.addEventListener('load', () => { img.style.opacity = '1'; if (fallback) fallback.style.display = 'none'; });
                        img.addEventListener('error', () => { img.style.display = 'none'; if (fallback) fallback.style.display = 'block'; });
                        NomadImages.observe(img, coverPath);   // a few covers at a time, near the viewport
                    } else {
                        if (fallback) fallback.style.display = 'block';
                    }

                    card.addEventListener('click', async () => {
                        if (item.type === 'dir') {
                            if (item.isComic) {
                                window.location.href = `/comics?path=${encodeURIComponent(item.dir)}`;
                            } else {
                                await openListModal(item);
                            }
                        } else {
                            openActionModal(item.fileEntry);
                        }
                    });

                    if (shouldAnimate) {
                        card.style.animation = 'pop-in .36s cubic-bezier(.22,.9,.32,1) both';
                        card.style.animationDelay = Math.min(6000, animIdx * 55) + 'ms';
                        animIdx++;
                    }

                    paintProgress(card);
                    frag.appendChild(card);
                });
            }

            if (useMixedMode && noImages.length > 0) {
                const noCoverSection = document.createElement('div');
                noCoverSection.className = 'no-cover-list';
                noCoverSection.style.gridColumn = '1 / -1';

                noImages.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'book-row';
                    const pathVal = item.type === 'file' ? ((item.fileEntry && item.fileEntry.path) || '') : (item.dir || '');
                    row.dataset.path = pathVal;
                    row.dataset.prog = '';
                    if (item.type === 'dir') row.dataset.dir = '1';

                    let icon = NomadIcons.svg('book');
                    if (item.type === 'dir') {
                        icon = NomadIcons.svg(item.isComic ? 'books' : 'folder');
                    } else if (item.fileEntry) {
                        const name = item.fileEntry.name.toLowerCase();
                        if (name.endsWith('.mp3') || name.endsWith('.m4a') || name.endsWith('.m4b')) {
                            icon = NomadIcons.svg('headphones');
                        } else if (name.endsWith('.cbz') || name.endsWith('.cbr')) {
                            icon = NomadIcons.svg('books');
                        }
                    }

                    const contextText = item.type === 'file' && item.fileEntry ? formatBytes(item.fileEntry.sz || 0) : '';

                    row.innerHTML = `
                        <span class="book-icon">${icon}</span>
                        <span class="title">${escapeHtml(item.name)}</span>
                        ${contextText ? `<span class="context">${contextText}</span>` : ''}
                    `;
                    paintProgress(row);

                    row.addEventListener('click', async () => {
                        if (item.type === 'dir') {
                            if (item.isComic) {
                                window.location.href = `/comics?path=${encodeURIComponent(item.dir)}`;
                            } else {
                                await openListModal(item);
                            }
                        } else {
                            openActionModal(item.fileEntry);
                        }
                    });

                    if (shouldAnimate) {
                        row.style.animation = 'pop-in .36s cubic-bezier(.22,.9,.32,1) both';
                        row.style.animationDelay = Math.min(6000, animIdx * 55) + 'ms';
                        animIdx++;
                    }

                    noCoverSection.appendChild(row);
                });

                frag.appendChild(noCoverSection);
            }

            gridEl.innerHTML = '';
            gridEl.appendChild(frag);
            if (shouldAnimate) { try { NomadPrefs.setRaw(ANIM_KEY, '1'); } catch (e) { } }
        }



        /* Folder popup. A folder inside opens in the same popup. The phone's Back goes up a
           folder, then closes it (NomadBack). Close and the backdrop close it all. */
        let folderStack = [];   // the folders opened in the popup, the shown one last
        let folderShowing = 0;
        async function openListModal(item) {
            folderStack.push(item);
            listModal.style.display = 'flex';
            NomadBack.open('books-folder-' + folderStack.length, folderBack);
            await showFolder(item);
        }
        function folderBack() {
            folderStack.pop();
            if (folderStack.length) showFolder(folderStack[folderStack.length - 1]);
            else listModal.style.display = 'none';
        }
        async function showFolder(item) {
            const ticket = ++folderShowing;
            listModalTitle.textContent = item.name;
            listContainer.innerHTML = '<p style="padding:12px;color:var(--muted)">Loading…</p>';

            const resp = await loadDirContents(item.dir);
            if (ticket !== folderShowing) return;   // gone up or on since
            const files = resp.files || [];
            if (files.length === 0) {
                listContainer.innerHTML = '<p style="padding:12px;color:var(--muted)">This folder is empty</p>';
                return;
            }

            listContainer.innerHTML = '';
            inProgress = null;
            const frag = document.createDocumentFragment();

            for (const f of files) {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.dataset.path = f.path;
                card.dataset.prog = '';
                if (f.isDir) {
                    card.classList.add('is-directory');
                    card.dataset.dir = '1';
                }

                const coverPath = f.cover ? fileUrlDirect(f.cover) : '';
                const imgHTML = coverPath ? `<img class="media-thumb" loading="lazy" alt="${escapeHtml(f.name)}">` : '';

                card.innerHTML = `
                <div class="thumb-wrapper" aria-hidden="false">
                    <span class="fallback-text">${escapeHtml(f.name)}</span>
                    ${imgHTML}
                </div>
                `;

                const img = card.querySelector('img');
                const fallback = card.querySelector('.fallback-text');
                if (img && coverPath) {
                    img.addEventListener('load', () => { 
                        img.style.opacity = '1'; 
                        if (fallback) fallback.style.display = 'none'; 
                    });
                    img.addEventListener('error', () => { 
                        img.style.display = 'none'; 
                        if (fallback) fallback.style.display = 'block'; 
                    });
                    NomadImages.observe(img, coverPath);   // a few covers at a time, near the viewport
                } else {
                    if (fallback) fallback.style.display = 'block';
                }

                card.addEventListener('click', () => {
                    if (f.isDir) {
                        if (f.isComic) leaveTo(`/comics?path=${encodeURIComponent(f.path)}`);
                        else openListModal({ name: f.name, dir: f.path });
                    } else {
                        openActionModal({ name: f.name, path: f.path, sz: f.sz, mt: f.mt, cover: f.cover });
                    }
                });

                paintProgress(card);
                frag.appendChild(card);
            }

            listContainer.appendChild(frag);
        }
        function closeListModal() {
            if (!folderStack.length) return;
            folderStack = [];
            folderShowing++;
            listModal.style.display = 'none';
            NomadBack.done('books-folder-1');
        }
        listCloseBtn.addEventListener('click', closeListModal);

        // closes the action popup and the folder popup under it, with their Back entries
        function closePopups() {
            actionModal.style.display = 'none';
            if (folderStack.length) closeListModal();   // takes the action popup's entry with it
            else NomadBack.done('books-action');
        }
        // off to a reader: the popups' Back entries go first, so Back from the reader lands
        // on the shelf and not on a popup that is no longer there
        function leaveTo(url) {
            if (!folderStack.length && !NomadBack.isOpen('books-action')) { location.href = url; return; }
            let gone = false;
            const go = () => { if (!gone) { gone = true; location.href = url; } };
            window.addEventListener('popstate', go, { once: true });
            setTimeout(go, 400);
            closePopups();
        }

        /* Action modal */
        // through /media with download=1, as Movies does: the raw path is not a URL Nomad serves
        function downloadFile(path, filename) {
            const a = document.createElement('a');
            a.href = `/media?file=${encodeURIComponent(normalizePath(path))}&download=1`;
            a.download = filename || (path ? path.split('/').pop() : 'file');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        function openActionModal(file) {
            currentItem = file;
            actionTitle.textContent = file.name || 'File';
            const fext = ext(file.path).toLowerCase();
            const q = encodeURIComponent(file.path);

            if (fext === '.pdf') {
                viewButton.textContent = 'Read PDF';
                viewButton.onclick = () => leaveTo(`/pdf?path=${q}`);
            } else if (fext === '.epub') {
                viewButton.textContent = 'Read EPUB';
                viewButton.onclick = () => leaveTo(`/epub?path=${q}`);
            } else if (isComicName(file.path)) {
                // comics open in comics.html, which streams pages instead of loading the whole archive here
                viewButton.textContent = 'Read comic';
                viewButton.onclick = () => leaveTo(`/comics?path=${q}`);
            } else if (isAudioName(file.path)) {
                viewButton.textContent = 'Listen';
                viewButton.onclick = () => { closePopups(); openAudioPlayer(file); };
            } else {
                viewButton.textContent = 'Download';
                viewButton.onclick = () => { closeActionModal(); downloadFile(file.path, file.name); };
            }

            // the modal is reused: when downloads are disabled, hide the view
            // button only while it acts as a Download fallback
            viewButton.style.display = (window.__dlDisabled && viewButton.textContent === 'Download') ? 'none' : '';
            const prog = NomadProgress.get(file.path);
            actionSub.textContent = prog ? (prog.done ? 'Finished' : prog.l || '') : '';
            actionSub.hidden = !actionSub.textContent;

            downloadButton.onclick = () => { closeActionModal(); downloadFile(file.path, file.name); };
            actionModal.style.display = 'flex';
            NomadBack.open('books-action', () => { actionModal.style.display = 'none'; });
        }
        function closeActionModal() { actionModal.style.display = 'none'; NomadBack.done('books-action'); }
        actionCancelBtn.addEventListener('click', closeActionModal);

        /* Search & Sort */
        function applyFilters() {
            const query = searchInput.value.toLowerCase().trim();
            const sort = sortSelect.value;
            filtered = library.filter(item => (item.name || '').toLowerCase().includes(query));
            if (sort === 'nameAsc') filtered.sort((a, b) => byName.compare(a.name || '', b.name || ''));
            else if (sort === 'nameDesc') filtered.sort((a, b) => byName.compare(b.name || '', a.name || ''));
            renderGrid();
        }
        searchInput.addEventListener('input', applyFilters);
        sortSelect.addEventListener('change', applyFilters);


        /* Audio Player
           A file is a book, or one part of a book split into files. A part that ends goes on
           to the next part in its folder, but a folder of whole books (a series) never runs on
           into the next book, and neither do loose files. Each file keeps its own place. */
        let currentAudio = null;
        // bookmarks and notes by time in this file, kept on this phone
        const audioMarks = NomadMarks.attach(document.getElementById('audioMarksBtn'), {
            key: () => currentAudio && currentAudio.path,
            title: () => audioTitle.textContent,
            here: () => (currentAudio ? { at: audioElement.currentTime, order: audioElement.currentTime, label: NomadMarks.clock(audioElement.currentTime) } : null),
            go: (t) => { try { audioElement.currentTime = +t; audioElement.play().catch(() => {}); } catch (e) {} },
        });
        const speeds = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
        let speed = parseFloat(NomadPrefs.raw('nomad_audio_speed') || '1') || 1;
        const audioArt = document.getElementById('audioArt');
        audioArt.addEventListener('error', () => { audioArt.hidden = true; });
        const audioSub = document.getElementById('audioSub');
        const sleepBtn = document.getElementById('sleepBtn');

        // a part of a book by its name: "01", "Chapter 3", "Part 2", "Disc 1"
        const PART_NAME = /^\s*(\d|chapter\b|ch\b|part\b|pt\b|track\b|disc\b|cd\b)/i;
        // a folder holds one book in parts when its files are all named as parts, or are the
        // same apart from their numbers ("Dune - 01", "Dune - 02"). A series is neither
        // ("HTTYD 1. How To Train Your Dragon", "HTTYD 2. How To Be A Pirate").
        function partsOfOneBook(names) {
            if (names.length < 2) return false;
            if (names.every(n => PART_NAME.test(n))) return true;
            return new Set(names.map(n => n.replace(/\d+/g, '#').replace(/[\s_.\-]+/g, ' ').trim().toLowerCase())).size === 1;
        }
        // the title Continue shows: the file's, or for a part named as one the folder's,
        // which is the book's name
        function bookTitleFor(path) {
            const parts = normalizePath(path).split('/');
            const file = prettify(parts.pop());
            const folder = parts.length > 2 ? parts[parts.length - 1].replace(/[_\.]+/g, ' ').replace(/\s+/g, ' ').trim() : '';
            return folder && PART_NAME.test(file) ? folder : file;
        }

        function openAudioPlayer(file) { playTrack(file); }
        function showTrackInfo() {
            const f = currentAudio;
            const folder = (f.path || '').split('/').slice(-2, -1)[0] || '';
            audioTitle.textContent = f.name || 'Audiobook';
            audioSub.textContent = folder && !/^books$/i.test(folder) ? folder : '';
            // its own picture, or the one beside it (or its folder) on the shelf
            const cover = f.cover || coverFor(f.path || '');
            if (cover) { audioArt.src = fileUrlDirect(cover); audioArt.hidden = false; } else audioArt.hidden = true;
            if ('mediaSession' in navigator && window.MediaMetadata) {
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: f.name || 'Audiobook',
                        album: folder && !/^books$/i.test(folder) ? folder : '',
                        artwork: cover ? [{ src: location.origin + fileUrlDirect(cover) }] : []
                    });
                } catch (e) {}
            }
        }
        function playTrack(file) {
            saveAudioPosition(true);
            currentAudio = file;
            if (audioMarks) audioMarks.refresh();
            audioElement.pause();
            audioElement.src = fileUrlDirect(file.path);
            try { audioElement.load(); } catch (e) {}
            audioElement.playbackRate = speed;
            audioPlayer.classList.add('active');
            showTrackInfo();
            updateAudioHeight();
            const resume = findResume(file);
            // a book you finished starts again from the top
            if (resume && resume.entry && resume.entry.time && !(resume.entry.duration && resume.entry.time > resume.entry.duration - 5)) {
                const t = resume.entry.time;
                audioElement.addEventListener('loadedmetadata', () => { audioElement.currentTime = t; }, { once: true });
            }
            // a browser that won't start without a tap leaves it paused: the play button does it
            audioElement.play().catch(() => {});
            findUpNext(file);
        }
        function closeAudio() {
            saveAudioPosition(true);
            audioPlayer.classList.remove('active');
            audioElement.pause();
            audioElement.removeAttribute('src');
            try { audioElement.load(); } catch (e) {}
            currentAudio = null;
            upNext = null;
            setNextAction();
            setSleep(0);
            updateAudioHeight();
        }
        document.getElementById('closeAudio').addEventListener('click', closeAudio);

        // the next part in this one's folder, looked up when it starts so the switch at its
        // end is immediate (a locked phone may not wait for a slow card)
        let upNext = null;
        async function findUpNext(file) {
            upNext = null;
            setNextAction();
            const parent = normalizePath(file.path.replace(/\/[^/]*$/, ''));
            if (parent === normalizePath(ROOT)) return;
            const { files } = await loadDirContents(parent);
            if (currentAudio !== file) return;
            const parts = files.filter(f => !f.isDir && isAudioName(f.path));
            const i = parts.findIndex(f => normalizePath(f.path) === normalizePath(file.path));
            if (i >= 0 && !file.cover && parts[i].cover) { file.cover = parts[i].cover; showTrackInfo(); }
            const oneBook = partsOfOneBook(parts.map(f => f.path.split('/').pop().replace(/\.[^/.]+$/, '')));
            upNext = oneBook && i >= 0 && parts[i + 1] ? parts[i + 1] : null;
            setNextAction();
        }
        function setNextAction() {
            if (!('mediaSession' in navigator)) return;
            try { navigator.mediaSession.setActionHandler('nexttrack', upNext ? () => playTrack(upNext) : null); } catch (e) {}
        }

        playPauseBtn.addEventListener('click', () => {
            if (audioElement.paused) audioElement.play().catch(() => {}); else audioElement.pause();
        });
        const skip = (s) => { if (isFinite(audioElement.duration)) audioElement.currentTime = Math.max(0, Math.min(audioElement.duration, audioElement.currentTime + s)); };
        document.getElementById('rewind').addEventListener('click', () => skip(-15));
        document.getElementById('forward').addEventListener('click', () => skip(15));

        function showSpeed() { speedBtn.textContent = (speed % 1 ? speed : speed.toFixed(0)) + 'x'; speedBtn.classList.toggle('on', speed !== 1); }
        speedBtn.addEventListener('click', () => {
            const i = speeds.indexOf(speed);
            speed = speeds[(i + 1) % speeds.length];
            audioElement.playbackRate = speed;
            NomadPrefs.setRaw('nomad_audio_speed', String(speed));
            showSpeed();
        });
        showSpeed();

        /* Sleep timer: off, 15, 30 or 60 minutes. The last few seconds fade out instead of
           stopping mid-word. No "end of the book" step: playback runs on through a book's
           folder and stops at its end by itself. */
        const SLEEP_STEPS = [0, 15, 30, 60];
        const FADE_MS = 8000;
        let sleepStep = 0, sleepAt = 0, sleepTick = null, fade = null;
        function setSleep(step) {
            stopFade();
            sleepStep = step;
            clearInterval(sleepTick); sleepTick = null; sleepAt = 0;
            const v = SLEEP_STEPS[step];
            if (v > 0) { sleepAt = Date.now() + v * 60000; sleepTick = setInterval(showSleep, 1000); }
            showSleep();
        }
        function showSleep() {
            const v = SLEEP_STEPS[sleepStep];
            sleepBtn.classList.toggle('on', !!v);
            if (!v) { sleepBtn.textContent = 'Sleep'; sleepBtn.title = 'Sleep timer: off'; return; }
            const left = Math.max(0, Math.ceil((sleepAt - Date.now()) / 60000));
            sleepBtn.textContent = left + 'm'; sleepBtn.title = 'Stops in ' + left + ' minutes';
            if (!fade && Date.now() >= sleepAt - FADE_MS) startFade();
        }
        function startFade() {
            if (audioElement.paused) { setSleep(0); return; }
            const from = audioElement.volume, t0 = Date.now();
            fade = { from, timer: setInterval(() => {
                const k = 1 - (Date.now() - t0) / FADE_MS;
                if (k > 0) { audioElement.volume = from * k; return; }
                clearInterval(fade.timer); fade = null;
                audioElement.pause();
                audioElement.volume = from;
                setSleep(0);
            }, 100) };
        }
        function stopFade() {
            if (!fade) return;
            clearInterval(fade.timer);
            audioElement.volume = fade.from;
            fade = null;
        }
        sleepBtn.addEventListener('click', () => setSleep((sleepStep + 1) % SLEEP_STEPS.length));

        let seeking = false;
        audioSeek.addEventListener('input', () => {
            seeking = true;
            if (isFinite(audioElement.duration)) currentTimeEl.textContent = formatTime(audioSeek.value / 1000 * audioElement.duration);
        });
        audioSeek.addEventListener('change', () => {
            if (isFinite(audioElement.duration)) audioElement.currentTime = audioSeek.value / 1000 * audioElement.duration;
            seeking = false;
        });

        audioElement.addEventListener('loadedmetadata', () => {
            durationEl.textContent = '-' + formatTime(audioElement.duration);
            sendPosition(true);
        });

        // position is saved on a timer: timeupdate fires ~4 times a second, and each save
        // rewrites the whole resume store and scans the grid
        let lastAudioSave = 0;
        function saveAudioPosition(force) {
            if (!currentAudio || !(audioElement.duration > 0)) return;
            const now = Date.now();
            if (!force && now - lastAudioSave < 5000) return;
            lastAudioSave = now;
            const t = audioElement.currentTime, d = audioElement.duration;
            const store = readResume();
            dropResumeFor(store, currentAudio.path);
            store[fileKey(currentAudio.path, currentAudio.sz, currentAudio.mt)] = {
                time: t,
                duration: d,
                percent: Math.round((t / d) * 100),
                timestamp: now
            };
            writeResume(store);
            // nothing heard yet (just opened, or a finished book opened again): leave it as it was
            if (t < 1) return;
            NomadProgress.note(currentAudio.path, { k: 'audio', p: t / d, t: bookTitleFor(currentAudio.path), l: NomadProgress.timeLeft(d - t) });
            refreshProgress();
        }

        // the lock screen's scrubber, as Music does it
        let posAt = 0;
        function sendPosition(force) {
            if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
            const d = audioElement.duration;
            if (!isFinite(d) || d <= 0) return;
            const now = Date.now();
            if (!force && now - posAt < 5000) return;
            posAt = now;
            try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audioElement.playbackRate || 1, position: Math.min(audioElement.currentTime, d) }); } catch (e) {}
        }

        audioElement.addEventListener('timeupdate', () => {
            const d = audioElement.duration, t = audioElement.currentTime;
            if (!seeking) {
                currentTimeEl.textContent = formatTime(t);
                if (isFinite(d) && d > 0) audioSeek.value = Math.round(t / d * 1000);
            }
            if (isFinite(d)) durationEl.textContent = '-' + formatTime(Math.max(0, d - t));
            saveAudioPosition(false);
            sendPosition(false);
        });
        audioElement.addEventListener('seeked', () => sendPosition(true));
        audioElement.addEventListener('ratechange', () => sendPosition(true));

        // the throttle above could otherwise drop the last few seconds
        audioElement.addEventListener('pause', () => saveAudioPosition(true));
        // drive the icon off the element, so it stays right no matter what
        // paused playback (end of file, another tab, headphone controls)
        audioElement.addEventListener('play',  () => { playPauseBtn.classList.add('playing'); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; sendPosition(true); });
        audioElement.addEventListener('pause', () => {
            playPauseBtn.classList.remove('playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            sendPosition(true);
            if (fade) setSleep(0);   // paused by hand while fading out: the timer is done
        });
        audioElement.addEventListener('ended', () => {
            saveAudioPosition(true);
            if (currentAudio) NomadProgress.finish(currentAudio.path, { k: 'audio', t: bookTitleFor(currentAudio.path) });
            refreshProgress();
            if (upNext) { playTrack(upNext); return; }
            playPauseBtn.classList.remove('playing');
        });
        window.addEventListener('pagehide', () => saveAudioPosition(true));

        // a busy Nomad turns a read away now and then (503): try the file again, from where it was
        let audioRetries = 0;
        audioElement.addEventListener('playing', () => { audioRetries = 0; });
        audioElement.addEventListener('error', () => {
            const f = currentAudio;
            if (!f || !audioElement.getAttribute('src') || audioRetries >= 3) return;
            const at = audioElement.currentTime || (findResume(f) || { entry: {} }).entry.time || 0;
            setTimeout(() => {
                if (currentAudio !== f) return;
                audioElement.src = fileUrlDirect(f.path);
                try { audioElement.load(); } catch (e) {}
                if (at) audioElement.addEventListener('loadedmetadata', () => { audioElement.currentTime = at; }, { once: true });
                audioElement.play().catch(() => {});
            }, 1500 * ++audioRetries);
        });

        // lock screen, headphones and car buttons
        if ('mediaSession' in navigator) {
            const ms = navigator.mediaSession, on = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
            on('play', () => audioElement.play().catch(() => {}));
            on('pause', () => audioElement.pause());
            on('seekbackward', () => skip(-15));
            on('seekforward', () => skip(15));
            on('seekto', (d) => { if (d && isFinite(d.seekTime)) { audioElement.currentTime = d.seekTime; sendPosition(true); } });
        }

        /* Keys: Escape closes the top popup. With a book playing, Space plays or pauses and
           the arrows go back or forward 15 seconds (not while typing or on a popup) */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (actionModal.style.display === 'flex') closeActionModal();
                else if (folderStack.length) closeListModal();
                return;
            }
            if (!currentAudio || e.ctrlKey || e.metaKey || e.altKey) return;
            const t = e.target || {};
            if (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName || '') || t.isContentEditable) return;
            if (actionModal.style.display === 'flex' || folderStack.length) return;
            if (e.key === ' ') { e.preventDefault(); playPauseBtn.click(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-15); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); skip(15); }
        });

        // the menu's Continue row opens an audiobook here as /books#play=<path>: play it from
        // its place, then take the hash off so a reload doesn't start it again
        function playFromHash() {
            const m = /^#play=(.+)$/.exec(location.hash);
            if (!m) return;
            let path;
            try { path = normalizePath(decodeURIComponent(m[1])); } catch (e) { return; }
            try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
            playTrack({ name: prettify(path.split('/').pop()), path });
        }
        window.addEventListener('hashchange', playFromHash);

        /* Init */
        let _buildingRetries = 0;
        async function init() {
            try {
                library = await buildLibrary();
                filtered = library;
                renderGrid();
            } catch (err) {
                // a card whose index is still being built answers 202, wait for it
                // instead of reporting an empty library on first boot
                if (NomadIndex.isBuilding(err) && _buildingRetries++ < 10) {
                    gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);padding:12px">Building the book index…</p>';
                    setTimeout(init, 3000);
                    return;
                }
                console.error('Failed to load library', err);
                gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:red;padding:20px">Couldn\'t load the library. Reload to try again.</p>';
            }
            playFromHash();
        }
        init();
    
/* admin toggle: hide download actions when downloads are disabled (the
   fallback 'Download' view-button is handled where the modal is populated) */
NomadUI.applyDownloadPolicy('downloadButton');
NomadUI.config().then(c => { window.__dlDisabled = !NomadUI.canDownload(c, 'books'); });
</script>
</body>
</html>
