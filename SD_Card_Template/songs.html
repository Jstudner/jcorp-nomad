<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
<meta charset="utf-8" />
<script>/* nomad-load-guard: reload, twice at most, when one of Nomad's own scripts or stylesheets fails to load */(function(){var k='nomadLoadGuard:'+location.pathname;window.addEventListener('error',function(e){var t=e.target;if(!t||!t.tagName)return;var s=t.tagName==='SCRIPT',c=t.tagName==='LINK'&&/stylesheet/i.test(t.rel||'');if(!s&&!c)return;var u=t.src||t.href||'';if(u.indexOf(location.origin+'/')!==0)return;var n=0;try{n=+sessionStorage.getItem(k)||0;}catch(x){return;}if(n>=2)return;try{sessionStorage.setItem(k,String(n+1));}catch(x){return;}setTimeout(function(){location.reload();},1500*(n+1));},true);window.addEventListener('load',function(){setTimeout(function(){try{sessionStorage.removeItem(k);}catch(x){}},15000);});})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Songs</title>
<link rel="stylesheet" href="master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/nomad-icons.js?v=1"></script>
<script src="/nomad-utils.js?v=52"></script>
<script src="theme-manager.js?v=5"></script>
<style>
/* the frame is a column: the search bar, then the list filling what is left */
body{margin:0;padding:0;background:var(--bg);font-family:Inter,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--card);padding:.45rem 10px;display:flex;gap:.6rem;align-items:center;border-bottom:1px solid var(--black-alpha-4);position:sticky;top:0;z-index:55;flex-wrap:wrap;}
.search-wrap{display:flex;flex:1;gap:12px;align-items:center;}
.toolbar input[type="search"]{flex:1;min-width:0;padding:.45rem .75rem;border-radius:12px;border:1px solid var(--black-alpha-6);background:var(--card);font-size:0.95rem;color:var(--text);}
.toolbar .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.btn{padding:.45rem .65rem;border-radius:8px;border:0;background:var(--card);box-shadow:0 2px 8px var(--black-alpha-4);cursor:pointer;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:6px;}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--black-alpha-4);}
.btn .icon{font-size:1rem;line-height:1;}
.btn .label{white-space:nowrap;}
.total-count{color:var(--muted);font-weight:700;white-space:nowrap;font-size:0.95rem;}
main{flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;padding:8px;box-sizing:border-box;display:flex;}
.section{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:12px;padding:6px;box-shadow:var(--shadow);}
.section h2{font-size:1rem;margin:4px 6px 8px;color:var(--primary);font-weight:800;}
@media (max-width:600px){ .section h2{display:none;} }
/* Only the rows on screen exist: a big library as full rows is seconds of work on a phone
   per song change. Every row is ROW_H tall. */
.all-list{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;}
.list-spacer{position:relative;}
.row{position:absolute;left:0;right:0;height:52px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;background:transparent;}
.row:hover{background:var(--primary-alpha-5);}
.row .text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;}
.row.playing{background:var(--primary);color:var(--color-white);}
.row .title{font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.row.playing .title{color:var(--color-white);}
/* album is secondary: smaller and capped so it can't crowd the title */
.row .context{color:var(--muted);font-weight:600;font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;max-width:none;margin:0;}   /* master.css right-aligns it for its one-line rows */
.row.playing .context{color:var(--white-alpha-80);}
.list-empty{padding:12px;color:var(--muted);}
.add-queue-btn{padding:4px 8px;background:var(--card);border:1px solid var(--black-alpha-10);border-radius:6px;font-size:0.85rem;font-weight:700;color:var(--primary);cursor:pointer;transition:all .15s;margin-left:8px;}
.add-queue-btn:hover{background:var(--primary);color:var(--color-white);transform:scale(1.05);}
.row.playing .add-queue-btn{background:var(--white-alpha-20);color:var(--color-white);border-color:var(--white-alpha-30);}
/* recently played on this phone: one row of chips under the search, gone while searching */
.recent{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 10px 0;max-width:1200px;width:100%;margin:0 auto;box-sizing:border-box;}
.recent[hidden]{display:none;}
.recent-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;}
.recent-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px 0;}
.recent-row::-webkit-scrollbar{display:none;}
.recent-chip{flex-shrink:0;max-width:200px;display:flex;flex-direction:column;align-items:flex-start;padding:5px 10px;border-radius:10px;
  border:1px solid var(--black-alpha-8);background:var(--card);color:var(--text);font:inherit;cursor:pointer;text-align:left;}
.recent-chip:hover{border-color:var(--primary);}
.recent-chip.playing{background:var(--primary);color:var(--color-white);border-color:transparent;}
.recent-chip b{font-size:.82rem;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-chip span{font-size:.7rem;color:var(--muted);font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-chip.playing span{color:var(--white-alpha-80);}
</style>
</head>
<body>

<div class="toolbar">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search">
  </div>
  <div id="totalCount" class="total-count">0 tracks</div>
</div>

<div class="recent" id="recent" hidden><span class="recent-h">Recent</span><div class="recent-row" id="recentRow"></div></div>
<main>
  <section class="section">
    <h2>All songs</h2>
    <div id="allList" class="all-list"></div>
  </section>
</main>

<script>
const ROOT = '/Music';
const INDEX_ENDPOINT = '/api/index';
const AUDIO_EXTS = ['.mp3','.m4a','.flac','.aac','.ogg','.wav','.opus','.alac','.aiff'];

let trackPathSet = new Set();
let allTracks = [];        // the library, in the order chosen (sort, shuffle)
let view = [];             // what the list shows: allTracks with the search applied
let originalTracks = [];
let isShuffled = false;
let currentPlayingPath = null;
let queuePaths = new Set();

const allListEl = document.getElementById('allList');
const totalCountEl = document.getElementById('totalCount');
const searchEl = document.getElementById('search');
const COLL = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const ROW_H = 58;          // a row (52px) and the space under it
const OVERSCAN = 8;        // rows drawn above and below the screen

function ext(name){
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i).toLowerCase() : '';
}
function isAudio(n){ return AUDIO_EXTS.includes(ext(n)); }
function prettifyFilename(n){
  if(!n) return '';
  return n.replace(/\.[^/.]+$/, '').replace(/[_\.]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function topLevelKeyForPath(full){
  const parts = normalizePath(full).split('/').filter(Boolean);
  return parts.length >= 2 ? parts[1] : '/';
}
// "Artist - Album" from the folders the song is in
function computeDisplayForPath(fullPath){
  const parts = normalizePath(fullPath).split('/').filter(Boolean);
  const folderRel = parts.slice(1, parts.length - 1);
  if(folderRel.length === 0) return '';
  if(folderRel.length === 1) return folderRel[0];
  return `${folderRel[0]} - ${folderRel[1]}`;
}
function sha1(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h << 5) + h) + str.charCodeAt(i); h = h & 0xffffffff; }
  return 'h' + (h >>> 0).toString(16);
}
// lower case, no accents, punctuation as spaces: "Beyoncé", "AC/DC" find "beyonce", "ac dc"
function norm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
}

async function fetchIndex(path){ return NomadIndex.fetch(path); }   // shared reader, nomad-utils.js

function trackFor(fullPath){
  const normalized = normalizePath(fullPath);
  const parts = normalized.split('/').filter(Boolean);
  const filename = parts[parts.length - 1];
  const t = {
    id: sha1(normalized),
    name: prettifyFilename(filename),
    file: filename,
    path: normalized,
    dirPath: '/' + parts.slice(0, parts.length - 1).join('/'),
    topKey: topLevelKeyForPath(normalized),
    contextParts: parts.slice(2, parts.length - 1),
    display: computeDisplayForPath(normalized)
  };
  // what search looks through, worked out once and kept off the object the player is sent
  Object.defineProperty(t, '_h', { value: norm(t.name + ' ' + parts.slice(1, -1).join(' ')), enumerable: false });
  return t;
}

// the songs this phone played last (the player keeps the list), still on the card
function renderRecent(){
  const box = document.getElementById('recent'), row = document.getElementById('recentRow');
  let paths = [];
  try { paths = JSON.parse(localStorage.getItem('nomad_music_recent_v1') || '[]'); } catch(e){}
  const tracks = paths.filter(p => trackPathSet.has(p)).slice(0, 12).map(trackFor);
  box.hidden = !tracks.length || !!(searchEl.value || '').trim();
  row.innerHTML = '';
  tracks.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'recent-chip' + (t.path === currentPlayingPath ? ' playing' : '');
    b.title = t.name; b.dataset.p = t.path;
    const n = document.createElement('b'); n.textContent = t.name;
    const d = document.createElement('span'); d.textContent = t.display || 'Music';
    b.append(n, d);
    b.addEventListener('click', () => window.parent.postMessage({ type: 'PLAY_PLAYLIST', payload: { tracks, startIndex: i } }, location.origin));
    row.appendChild(b);
  });
}

async function scanLibrary(){
  trackPathSet = new Set();
  allTracks = [];
  try{
    const resp = await fetchIndex(ROOT);
    for(const e of resp.entries){
      if(e.t !== 'f') continue;
      const fullPath = normalizePath(e.p || (ROOT + '/' + e.n));
      if(!isAudio(fullPath) || trackPathSet.has(fullPath)) continue;
      trackPathSet.add(fullPath);
      allTracks.push(trackFor(fullPath));
    }
  }catch(err){
    // index still being built (202): try again shortly rather than showing nothing
    if(NomadIndex.isBuilding(err) && (window.__idxRetries = (window.__idxRetries||0) + 1) <= 10){ setTimeout(scanLibrary, 3000); return; }
    console.warn('[Songs] index failed', err);
    allListEl.innerHTML = '<p class="list-empty">Couldn\'t load music. Trying again…</p>';
    NomadRetry.later('library', scanLibrary);
    return;
  }
  NomadRetry.done('library');
  // artist and album, then the song: one collator, made once (localeCompare with options
  // builds a new one per comparison, which is slow on a big library)
  allTracks.sort((a, b) => COLL.compare(a.display, b.display) || COLL.compare(a.name, b.name));
  applySearch(true);
  // the player may already be playing something, or hold a queue: ask, now the list can show it
  window.parent.postMessage({ type: 'REQUEST_STATE' }, location.origin);
  await handleHashPlayIfPresent();
}

async function handleHashPlayIfPresent(){
  try {
    if(!location.hash) return;
    const params = {};
    location.hash.replace(/^#/, '').split('&').forEach(p => {
      const [k, v] = p.split('=');
      if(!k) return;
      try { params[k] = v === undefined ? '' : decodeURIComponent(v || ''); }
      catch(e){ params[k] = v === undefined ? '' : (v || ''); }
    });
    if(!params.play) return;
    const playPath = normalizePath(params.play || '').toLowerCase();
    // the song in the order the list shows, so Next carries on down the list
    const ordered = allTracks.slice();
    const foundIndex = ordered.findIndex(t => t.path.toLowerCase() === playPath);
    window.parent.postMessage({ type: 'PLAY_PLAYLIST',
      payload: foundIndex >= 0 ? { tracks: ordered, startIndex: foundIndex } : { tracks: [trackFor(params.play)], startIndex: 0 } }, location.origin);
    history.replaceState(null, '', location.pathname + location.search);
  } catch(err){
    console.warn('[Songs] handleHashPlayIfPresent failed', err);
  }
}

/* the list: only the rows on screen exist */
const spacer = document.createElement('div');
spacer.className = 'list-spacer';
const pool = [];
let _paintQueued = false;

function makeRow(){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<div class="text"><div class="title"></div><div class="context"></div></div><button class="add-queue-btn" type="button"></button>';
  row._title = row.firstChild.firstChild;
  row._ctx = row.firstChild.lastChild;
  row._btn = row.lastChild;
  row._btnState = null;
  spacer.appendChild(row);
  return row;
}

function paint(){
  _paintQueued = false;
  const top = allListEl.scrollTop, h = allListEl.clientHeight || window.innerHeight;
  const first = Math.max(0, Math.floor(top / ROW_H) - OVERSCAN);
  const last = Math.min(view.length, Math.ceil((top + h) / ROW_H) + OVERSCAN);
  while (pool.length < last - first) pool.push(makeRow());
  for (let i = 0; i < pool.length; i++) {
    const row = pool[i], idx = first + i;
    if (idx >= last) { if (row.style.display !== 'none') row.style.display = 'none'; continue; }
    const t = view[idx];
    row.style.display = '';
    row.style.top = (idx * ROW_H) + 'px';
    row.dataset.idx = idx;
    if (row._path !== t.path) {
      row._path = t.path;
      row._title.textContent = t.name;
      row._ctx.textContent = t.display || '';
      row.title = t.display ? `${t.name} (${t.display})` : t.name;
    }
    row.classList.toggle('playing', t.path === currentPlayingPath);
    const inQueue = queuePaths.has(t.path);
    if (row._btnState !== inQueue) {
      row._btnState = inQueue;
      row._btn.innerHTML = NomadIcons.svg(inQueue ? 'check' : 'plus', 16);
      row._btn.title = inQueue ? 'In queue' : 'Add to queue';
      row._btn.setAttribute('aria-label', row._btn.title);
      row._btn.style.opacity = inQueue ? '0.5' : '';
    }
  }
}
function schedulePaint(){
  if (_paintQueued) return;
  _paintQueued = true;
  requestAnimationFrame(paint);
}

// the search applied to the library, in its current order
function applySearch(toTop){
  const rb = document.getElementById('recent');
  if (rb && (searchEl.value || '').trim()) rb.hidden = true; else if (rb && rb.hidden && trackPathSet.size) renderRecent();
  const q = norm(searchEl.value);
  const words = q ? q.split(' ') : [];
  view = words.length ? allTracks.filter(t => words.every(w => t._h.includes(w))) : allTracks;
  totalCountEl.textContent = words.length ? `${view.length} of ${allTracks.length} tracks` : `${allTracks.length} tracks`;
  if (!view.length) {
    spacer.remove();
    allListEl.innerHTML = `<p class="list-empty">${allTracks.length ? 'No matches' : 'No tracks found'}</p>`;
    return;
  }
  if (spacer.parentNode !== allListEl) { allListEl.innerHTML = ''; allListEl.appendChild(spacer); }
  spacer.style.height = (view.length * ROW_H) + 'px';
  if (toTop) allListEl.scrollTop = 0;
  paint();
}

allListEl.addEventListener('scroll', schedulePaint, { passive: true });
window.addEventListener('resize', schedulePaint);

// one handler for every row
allListEl.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const t = view[+row.dataset.idx];
  if (!t) return;
  if (e.target.closest('.add-queue-btn')) {
    if (!queuePaths.has(t.path)) window.parent.postMessage({ type: 'ADD_TO_QUEUE', payload: t }, location.origin);
    return;
  }
  // the list as shown, from this song on
  window.parent.postMessage({ type: 'PLAY_PLAYLIST', payload: { tracks: view.slice(), startIndex: +row.dataset.idx } }, location.origin);
});

let _searchDebounce = null;
searchEl.addEventListener('input', () => {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => applySearch(true), 120);
});

function fisherYates(arr){
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
}

window.addEventListener('message', (event) => {
  // only the player page talks to this frame
  if (event.origin !== location.origin || !event.data || typeof event.data !== 'object') return;
  const { type, payload } = event.data;
  if (type === 'PLAYBACK_UPDATE') {
    currentPlayingPath = payload && payload.currentTrack ? payload.currentTrack.path : null;
    schedulePaint();
    document.querySelectorAll('.recent-chip').forEach(c => c.classList.toggle('playing', c.dataset.p === currentPlayingPath));
  } else if (type === 'RECENT_UPDATE') {
    renderRecent();
  } else if (type === 'QUEUE_UPDATE') {
    queuePaths = new Set(((payload && payload.queue) || []).map(t => t && t.path).filter(Boolean));
    schedulePaint();
  } else if (type === 'SHUFFLE') {
    if (!isShuffled) {
      originalTracks = allTracks.slice();
      fisherYates(allTracks);
      isShuffled = true;
    } else {
      allTracks = originalTracks.slice();
      isShuffled = false;
    }
    applySearch(true);
    if (view.length) window.parent.postMessage({ type: 'PLAY_PLAYLIST', payload: { tracks: view.slice(), startIndex: 0 } }, location.origin);
  } else if (type === 'SORT') {
    const asc = !payload || payload.ascending !== false;
    allTracks.sort((a, b) => asc ? COLL.compare(a.name, b.name) : COLL.compare(b.name, a.name));
    isShuffled = false;
    applySearch(true);
  }
});

window.addEventListener('hashchange', handleHashPlayIfPresent);

scanLibrary();
</script>
</body>
</html>
