<style>
  /* Functional CSS: Shows-specific layout and Plyr.js customization */
  :root{
    --card-gap:1rem;
    --header-height:68px; /* fallback used by CSS; JS will set exact top */
  }
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  header{position:sticky;top:0;z-index:60;}

  .toolbar{
    padding:.65rem 1rem;
    display:flex;
    flex-wrap:wrap;
    gap:.6rem;
    align-items:center;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:var(--header-height);
    z-index:55;
    background:var(--bg);
  }
  .toolbar input[type="search"]{flex:1 1 220px;padding:.5rem .75rem;border:1px solid var(--line);border-radius:var(--radius);font-size:0.95rem;background:var(--card);color:var(--text)}
  .toolbar select, .toolbar .view-btn{padding:.48rem .7rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);font-size:0.9rem;cursor:pointer}
  .view-btn.active{background:var(--primary);color:var(--color-white);border-color:var(--primary-dark);}

  main{flex:1;display:flex;flex-direction:column;max-width:1200px;width:100%;margin:0 auto;padding:1rem}
  .grid-wrapper{flex:1;overflow-y:auto;padding-bottom:12px}
  .media-grid{display:grid;gap:var(--card-gap);}
  .media-grid.small  {grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .media-grid.medium {grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  .media-grid.large  {grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

  @media (max-width:600px){
    .media-grid.small  {grid-template-columns:repeat(4,1fr);}
    .media-grid.medium {grid-template-columns:repeat(3,1fr);}
    .media-grid.large  {grid-template-columns:repeat(2,1fr);}
  }

  /* cards */
  .media-card{width:100%;max-width:220px;margin:0 auto;position:relative;}
  .media-grid.small  .media-card{max-width:120px;}
  .media-grid.medium .media-card{max-width:160px;}
  .media-grid.large  .media-card{max-width:220px;}

  .thumb-wrapper{position:relative;display:flex;align-items:center;justify-content:center;background:var(--thumb-bg);color:var(--thumb-text);font-size:0.9rem;text-align:center;width:100%;aspect-ratio:2/3;overflow:hidden;}
  .fallback-text{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;text-align:center;font-weight:700;color:var(--thumb-title);pointer-events:none;padding:6px}
  .media-thumb{display:block;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:1;opacity:0;transition:opacity .35s ease;}
  /* episode, time left and a bar: two lines cut with an ellipsis to fit the smallest card */
  .badge-resume{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(0,0,0,0.6);color:#fff;padding:5px 9px 6px;border-radius:10px;font-weight:700;font-size:12px;line-height:1.25;z-index:4;display:block;min-width:40px;max-width:85%;overflow:hidden;text-align:center}
  .badge-resume .br-line{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge-resume .br-sub{font-weight:500;font-size:.92em;opacity:.85}
  .badge-resume .br-bar{display:block;height:3px;margin-top:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
  .badge-resume .br-bar i{display:block;height:100%;background:var(--primary);border-radius:2px}
  .badge-resume.br-done{display:flex;align-items:center;gap:4px;border-radius:999px}
  .media-grid.small .badge-resume{font-size:10px;padding:4px 6px 5px;max-width:92%}

  .card-body{display:none}

  /* modals */
  .modal,.episode-modal,.video-modal{display:none;position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:var(--overlay-modal);justify-content:center;align-items:center;z-index:1000;padding:20px;}
  .modal-content,.episode-modal-content{background:var(--card-bg);color:var(--text);padding:18px;border-radius:var(--radius);text-align:center;width:94%;max-width:980px;box-shadow:var(--shadow-large);max-height:90vh;overflow:auto}
  .video-modal-content{
    background:var(--card-bg);
    color:var(--text);
    padding:14px;
    border-radius:var(--radius);
    width:100%;
    max-width:980px;
    box-shadow:var(--shadow-large);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .modal button,.episode-modal button,.video-modal button{padding:10px 12px;font-size:0.98rem;border-radius:var(--radius);border:0;cursor:pointer}
  .modal button:not(.cancel):not(.secondary){background:var(--primary);color:var(--color-white);width:100%}
  .modal button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary);width:100%}
  .modal button.cancel{background:transparent;color:var(--text);border:1px solid var(--line);width:100%}
  /* action modal: even spacing between stacked buttons (like movies/books). scoped to #actionModal so the episode picker is untouched */
  #actionModal .modal-content{display:flex;flex-direction:column;gap:10px}
  #actionModal .modal-content h2{margin:0;font-size:1.15rem;font-weight:700}
  #actionSub{font-size:0.9rem;color:var(--muted)}
  /* episode picker's Resume/Close buttons live in .episode-modal. token colors so they read in dark mode too */
  .episode-modal button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary);width:100%;font-weight:700}
  .episode-modal button.cancel{background:var(--card);color:var(--text);border:1px solid var(--line);width:100%}
  .episode-list{max-height:60vh;overflow-y:auto;text-align:left;padding:6px}
  .episode-list .ep-row{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--line)}
  .episode-list .ep-row button{flex:1;background:var(--primary);border:0;color:var(--color-white);text-align:center;padding:8px;border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:0.95rem}
  /* how far along each episode is. currentColor, so it reads on the light and dark buttons alike */
  .episode-list .ep-row button{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;text-align:left;min-height:40px}
  .ep-row .ep-name{flex:1;min-width:0}
  .ep-row .ep-state{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:600;opacity:.85;white-space:nowrap}
  .ep-row .ep-bar{position:absolute;left:0;right:0;bottom:0;height:3px}
  .ep-row .ep-bar::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:currentColor;opacity:.25}
  .ep-row .ep-bar i{position:relative;display:block;height:100%;background:currentColor}
  .ep-row.watched .ep-name{opacity:.7}
  #episodeResumeBanner .banner-done{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;opacity:.8}
  .season-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px;background:var(--primary);color:var(--color-white);border-radius:var(--radius);margin:6px 0;cursor:pointer;font-weight:700}
  .season-content{padding-left:6px;padding-right:6px;margin-bottom:6px}

  .video-container{ width:100%; display:flex;flex-direction:column;align-items:center;gap:8px; }
  .video-container video{ width:100%; border-radius:var(--radius); }
  .video-actions{ display:flex; width:100%; gap:10px; }
  .video-actions button{
    flex:1;
    padding:10px 14px;
    font-size:0.95rem;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    background:var(--primary);
    color:var(--color-white);
    transition:filter .18s ease;
  }
  .video-actions button:hover{ filter:brightness(0.96); }
  .video-actions button:disabled{ opacity:.55; cursor:default; filter:none; font-size:.8rem; padding:10px 4px; white-space:nowrap; }
  /* Up next: the countdown has its own line so a long title can't push it out */
  .up-next{ position:absolute; right:16px; bottom:72px; z-index:5; width:min(300px, calc(100% - 32px));
    display:flex; align-items:center; gap:4px; padding:8px 8px 8px 10px; border-radius:12px; overflow:hidden;
    background:rgba(12,16,24,.86); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .up-next[hidden]{ display:none; }
  .up-next button{ border:0; background:none; color:inherit; font:inherit; cursor:pointer; }
  .up-next .un-go{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:0; text-align:left; }
  .up-next .un-play{ flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    background:var(--primary); color:#fff; font-size:.72rem; padding-left:2px; transition:transform .15s; }
  .up-next .un-go:hover .un-play, .up-next .un-go:focus-visible .un-play{ transform:scale(1.08); }
  .up-next .un-txt{ min-width:0; display:flex; flex-direction:column; gap:1px; line-height:1.25; }
  .up-next .un-when{ font-size:.72rem; opacity:.75; white-space:nowrap; }
  .up-next .un-name{ font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .up-next .un-code{ font-weight:500; opacity:.7; margin-right:6px; }
  .up-next .un-x{ flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; align-self:flex-start;
    font-size:1rem; line-height:1; opacity:.6; transition:opacity .15s, background .15s; }
  .up-next .un-x:hover, .up-next .un-x:focus-visible{ opacity:1; background:rgba(255,255,255,.14); }
  .up-next .un-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--primary); transform-origin:left; opacity:.9; }
  .video-actions .marks-b{ background:transparent; color:var(--text); border:1px solid var(--line, rgba(0,0,0,.15)); position:relative; }
  .video-actions .marks-b.has-marks::after{ content:''; position:absolute; top:6px; right:8px; width:7px; height:7px; border-radius:50%; background:#ffd400; }
  .video-title{font-weight:700;color:var(--color-white);margin:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  body.dark .back-btn { background: var(--white-alpha-12); color: var(--color-white); }
  body.dark .view-btn.active { border-color: var(--primary); }
</style>
</head>
<body data-page="shows">
  <header>
    <h1>Shows</h1>
    <a class="back-btn" href="/menu">← Back to Menu</a>
  </header>

  <div class="toolbar" role="region" aria-label="toolbar">
    <input id="searchInput" type="search" placeholder="Search" aria-label="Search shows">
    <select id="sortSelect" aria-label="Sort shows">
      <option value="nameAsc">A → Z</option>
      <option value="nameDesc">Z → A</option>
    </select>
    <div class="view-group">
      <button class="view-btn" data-size="small" title="Compact view" aria-pressed="false">🔳</button>
      <button class="view-btn active" data-size="medium" title="Comfort view" aria-pressed="true">🔲</button>
      <button class="view-btn" data-size="large" title="Gallery view" aria-pressed="false">⬜</button>
    </div>
  </div>

  <main>
    <div class="grid-wrapper">
      <div id="grid" class="media-grid medium" aria-live="polite" aria-label="Show list"></div>
    </div>
  </main>

  <div id="episodeModal" class="episode-modal" role="dialog" aria-modal="true">
    <div class="episode-modal-content" role="document">
      <h2 id="episodeModalTitle">Select an episode</h2>
      <div id="episodeResumeBanner" style="display:none;margin-bottom:8px"></div>
      <div id="episodeList" class="episode-list"></div>
      <div style="margin-top:10px"><button id="episodeCloseBtn" class="cancel">Close</button></div>
    </div>
  </div>

  <div id="actionModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content" role="document">
      <h2 id="actionTitle">Play / Download</h2>
      <div id="actionSub"></div>
      <button id="resumeEpButton" style="display:none">Resume</button>
      <button id="playButton">Play</button>
      <button id="togetherButton" class="secondary">Watch together</button>
      <button id="downloadButton" class="cancel" data-dl>Download</button>
      <button id="actionCloseBtn" class="cancel">Cancel</button>
    </div>
  </div>

  <div id="videoModal" class="video-modal" role="dialog" aria-modal="true">
    <div class="video-modal-content" role="document">
      <div id="videoTitle" class="video-title"></div>
      <div class="video-container">
        <video id="videoPlayer" controls playsinline aria-label="Video player"></video>
      </div>
      <div class="video-actions">
        <button id="videoCloseBtn">Close</button>
        <button id="videoMarksBtn" class="marks-b">Bookmarks</button>
        <button id="videoNextBtn">Next</button>
      </div>
    </div>
  </div>

<script>
/* Basic setup */

const ROOT_PATH = '/Shows';
const INDEX_ENDPOINT = '/api/index';
const MEDIA_ENDPOINT = '/media';

/* shared resume store */
const RESUME_KEY = 'nomad:watch:v1';
const ANIM_KEY_BASE = 'nomad:shows:anim:v1';

const VIDEO_EXTS = ['.mp4','.mkv','.avi','.mov','.webm','.m4v'];
const IMAGE_EXTS = ['.jpg','.jpeg','.png','.webp','.avif'];
const SUB_EXTS = ['.srt','.vtt','.ass','.ssa','.sub'];

const THEME_KEY = 'nomad_dark_mode';

function applyThemeFlag(dark){
  try {
    dark = !!dark;
    // class hook 
    document.body.classList.toggle('dark', dark);

    // update root CSS variables for broad styles
    const root = document.documentElement.style;
    if(dark){
      root.setProperty('--bg', '#0b1116');
      root.setProperty('--text', '#e6eef8');
      root.setProperty('--muted', '#9aa6b3');
    } else {
      root.setProperty('--bg', '#f4f4f9');
      root.setProperty('--text', '#333');
      root.setProperty('--muted', '#6b7280');
    }

    // Keep search readable 
    const searchEl = document.querySelector('.toolbar input[type="search"], #searchInput');
    if(searchEl){
      // keep highly readable for the menu UI
      if(dark){
        searchEl.style.background = '#071421';
        searchEl.style.color = '#eaf6ff';
        searchEl.style.borderColor = 'rgba(255,255,255,0.04)';
      } else {
        searchEl.style.background = '#fff';
        searchEl.style.color = '#000';
        searchEl.style.borderColor = '#d6d9e6';
      }
    }

    // Header and toolbar surfaces
    const header = document.querySelector('header');
    if(header) header.style.background = '';
    const toolbar = document.querySelector('.toolbar');
    if(toolbar){
      toolbar.style.background = dark ? '#0d1722' : 'var(--bg)';
      toolbar.style.borderBottomColor = dark ? 'rgba(255,255,255,0.04)' : '#e6e9ef';
    }

    // Cards / thumbs / fallback text
    document.querySelectorAll('.media-card').forEach(c => {
      c.style.background = dark ? '#071421' : '#fff';
      c.style.boxShadow = dark ? '0 8px 24px rgba(0,0,0,0.45)' : 'var(--shadow)';
    });
    document.querySelectorAll('.thumb-wrapper').forEach(t => {
      t.style.background = dark ? '#08121a' : '#efeff5';
    });
    document.querySelectorAll('.fallback-text').forEach(f => {
      f.style.color = dark ? '#eaf6ff' : '#06306f';
    });
    document.querySelectorAll('.media-thumb').forEach(img => {
      // subtle outline in light mode, none in dark
      img.style.outline = dark ? 'none' : '1px solid rgba(0,0,0,0.04)';
    });

    // Resume badges
    document.querySelectorAll('.badge-resume').forEach(b => {
      b.style.background = dark ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.6)';
      b.style.color = '#fff';
    });

    // modal bg + text (action modal uses theme-token CSS, so it's excluded here)
    document.querySelectorAll('.episode-modal-content, .video-modal-content').forEach(el => {
      if(dark){
        el.style.background = '#071722';
        el.style.color = '#eaf6ff';
        el.style.border = '1px solid rgba(255,255,255,0.04)';
        el.style.boxShadow = '0 12px 44px rgba(0,0,0,0.5)';
      } else {
        el.style.background = '#fff';
        el.style.color = '#111';
        el.style.border = '0';
        el.style.boxShadow = '0 12px 44px rgba(0,0,0,0.12)';
      }
    });

    // Episode list and rows 
    document.querySelectorAll('.episode-list').forEach(el => {
      if(dark){
        el.style.background = '#071722';
        el.style.color = '#eaf6ff';
        el.style.borderRadius = '8px';
        el.style.border = '1px solid rgba(255,255,255,0.03)';
      } else {
        el.style.background = '';
        el.style.color = '';
        el.style.borderRadius = '';
        el.style.border = '';
      }
    });
    document.querySelectorAll('.episode-list .ep-row').forEach(r => {
      r.style.background = 'transparent';
      r.style.borderBottom = dark ? '1px solid rgba(255,255,255,0.04)' : '1px solid #f4f4f9';
    });
    document.querySelectorAll('.episode-list .ep-row button').forEach(b => {
      if(dark){
        b.style.background = '#06202b';
        b.style.color = '#eaf6ff';
        b.style.border = '1px solid rgba(255,255,255,0.04)';
      } else {
        b.style.background = 'var(--primary)';
        b.style.color = '#fff';
        b.style.border = '0';
      }
    });

    // cancel/secondary buttons are styled by theme-token CSS (dynamic ones too), no JS pass needed

    // Video player and title
    const videoEl = document.getElementById('videoPlayer');
    if(videoEl){
      // black in both themes, it shows around a picture that doesn't fill the box
      videoEl.style.background = '#000';
      videoEl.style.outline = dark ? 'none' : '1px solid rgba(0,0,0,0.06)';
    }
    const videoTitleEl = document.getElementById('videoTitle');
    if(videoTitleEl) videoTitleEl.style.color = dark ? '#fff' : 'var(--text, #111)';

    // Resume banner styling
    const resumeBanner = document.getElementById('episodeResumeBanner');
    if(resumeBanner){
      resumeBanner.style.background = dark ? 'transparent' : 'transparent';
      resumeBanner.style.color = dark ? '#eaf6ff' : '#111';
    }

  } catch(e){
    console.warn('applyThemeFlag error', e);
  }
}

// bootstrap from storage
applyThemeFlag(window.nomadIsDark ? nomadIsDark() : false);
window.addEventListener('nomad-dark', (ev) => applyThemeFlag(ev.detail));

// sync across tabs when menu toggles theme
window.addEventListener('storage', (ev) => {
  if(ev.key === THEME_KEY){
    applyThemeFlag(ev.newValue === 'true');
  }
});

// Re-apply theme when grid children are replaced/added (so newly created cards get inline styles)
(function attachGridObserver(){
  try {
    const gridNode = document.getElementById('grid');
    if(!gridNode) return;
    const obs = new MutationObserver(() => {
      applyThemeFlag(document.body.classList.contains('dark'));
    });
    obs.observe(gridNode, { childList: true, subtree: true });
  } catch(e){
    // ignore
  }
})();



/* State */
let shows = [];
let filtered = [];
let currentSize = NomadPrefs.raw('nomadShowsSize') || 'medium';
let currentShow = null;
let flattenedEpisodes = [];   // copy of show.episodes for currently open show
let pathIndexMap = {};        // normalized path -> index
let currentEpisode = null;
let currentEpisodeIndex = -1;
let autosaveTimer = null;
let mediaReadyFor = null;     // the episode path the player has really loaded (saves wait for it)
let openGen = 0;              // which openVideo call is current
let rootSig = null;
// Bounds the "index is building" wait so it cannot poll forever.
let _buildingRetries = 0;
const _MAX_BUILDING_RETRIES = 10;

/* Helpers */
function ext(name){ const i=name.lastIndexOf('.'); return i>=0? name.slice(i).toLowerCase() : ''; }
function isVideoName(n){ return VIDEO_EXTS.includes(ext(n)); }
function isImageName(n){ return IMAGE_EXTS.includes(ext(n)); }
function fileUrl(path){ const p = normalizePath(path); return isVideoName(p) ? `${MEDIA_ENDPOINT}?file=${encodeURIComponent(p)}` : encodeURI(p); }
function formatTime(sec){ if(!sec||!isFinite(sec)) return '0:00'; sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; if(h) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; return `${m}:${String(s).padStart(2,'0')}`; }
// numbers compare as numbers, so "10" sorts after "2"
const byName = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function prettify(filename){ const n = filename.replace(/\.[^/.]+$/,''); let t = n.replace(/[_\.]+/g,' ').trim(); t = t.replace(/\s*\(?\d{4}\)?\s*$/,'').trim(); return t || filename; }

/* Resume store helpers (fileKey like movies) */
function readResume(){ try{ return JSON.parse(NomadPrefs.raw(RESUME_KEY)||'{}'); }catch(e){ return {}; } }
function writeResume(v){ try{ NomadPrefs.setRaw(RESUME_KEY, JSON.stringify(v)); }catch(e){ /* ignore */ } }
function fileKey(path, sz=0, mt=0){ return `${normalizePath(path)}|${sz||0}|${mt||0}`; }

/* Save a single resume entry. A finished episode saves again when it's watched again. */
function saveResumeEntryByKey(key, entry, purgeOtherNonCompleted = true){
  try{
    const store = readResume();
    const pathOnly = normalizePath(key.split('|')[0] || '');
    const showDir = purgeOtherNonCompleted ? findShowDirForEpisodePath(pathOnly) : null;

    for(const k of Object.keys(store)){
      if(k === key) continue;
      const normP = normalizePath(k.split('|')[0] || '');
      // the same file under an older key (size or date changed) would shadow this one
      if(normP === pathOnly){ delete store[k]; continue; }
      // one place per show: the half-watched hold of any other episode goes, like NomadProgress
      if(showDir && normP.startsWith(showDir + '/') && !(store[k] && store[k].completed)) delete store[k];
    }

    // set the new/updated entry and persist
    store[key] = entry;
    writeResume(store);
  }catch(e){
    console.warn('saveResumeEntryByKey failed', e);
  }
}

/* Not used right now. Keep any reindex retry capped: while a reindex runs the firmware
   503s every media request. */
const MAX_REINDEX_ATTEMPTS = 1;
let reindexAttempts = 0;

async function loadLibrary(){
  try {
    const { header, entries } = await fetchIndex(ROOT_PATH);

    // no usable index nearly always means /Shows is empty
    if(!header){
      NomadRetry.done('library');
      console.warn('No index header for /Shows, treating as empty');
      shows = [];
      filtered = [];
      renderGrid();
      return;
    }

    NomadRetry.done('library');
    rootSig = header.sig || null;
    const data = [header, ...entries];
    shows = buildShowsFromIndexes(data, ROOT_PATH);
    applyFilter(searchInput.value);
    applySort(sortSelect.value);
    renderGrid();
    checkIndex();
  } catch(err){
    if(err && err.message === 'INDEX_BUILDING') {
      // capped so a build that never finishes doesn't leave every phone polling
      if(_buildingRetries < _MAX_BUILDING_RETRIES){
        _buildingRetries++;
        gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Building shows index…</p>';
        setTimeout(() => loadLibrary(), 3000);
      } else {
        gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Building shows index…</p>';
        NomadRetry.later('library', loadLibrary);
      }
      return;
    }
    console.error('loadLibrary failed', err);
    gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Couldn\'t load shows. Trying again…</p>';
    NomadRetry.later('library', loadLibrary);
  }
}

function findShowDirForEpisodePath(path){
  if(!path) return null;
  const norm = normalizePath(path);
  for(const s of shows){
    if(!s || !s.dir) continue;
    const sd = normalizePath(s.dir);
    // match if episode path starts with show dir (add trailing slash to avoid partial matches)
    if(norm === sd || norm.startsWith(sd + '/')) return sd;
  }
  return null;
}
function showForPath(path){
  const d = findShowDirForEpisodePath(path);
  return (d && shows.find(s => normalizePath(s.dir) === d)) || currentShow;
}

/* What this phone knows about each episode, by path: { pos, dur, done, updated }.
   One read of the store for a whole list instead of one per row. A place saved in the
   credits counts as finished too. */
function resumeMap(){
  const m = new Map();
  for(const [k, e] of Object.entries(readResume())){
    if(!e) continue;
    const p = normalizePath(k.split('|')[0] || '');
    const prev = m.get(p);
    if(prev && prev.updated >= (e.updated || 0)) continue;
    const pos = +e.position || 0, dur = +e.duration || 0;
    m.set(p, { pos, dur, updated: e.updated || 0, done: !!e.completed || (pos > 0 && NomadProgress.isFinished(pos, dur)) });
  }
  return m;
}
function epState(ep, map){ return ep && ep.path ? ((map || resumeMap()).get(normalizePath(ep.path)) || null) : null; }
// started and not finished: worth a Resume
function hasPlace(s){ return !!s && !s.done && s.pos > 1; }
function placeLeft(s){ return s.dur > 0 ? NomadProgress.timeLeft(s.dur - s.pos) : `At ${formatTime(s.pos)}`; }

// "S01E03 - Prisoners of Love" -> { code: 'S1 E3', title: 'Prisoners of Love' }, and the
// same for "Adventure Time S01E03 Prisoners of Love" (the show's name is said elsewhere)
function epCode(ep){
  const name = (ep && ep.name) || '';
  const m = name.match(/^(?:.*?[\s._-])?S(\d+)\s*E(\d+)\s*[-–:.]?\s*(.*)$/i);
  return m ? { code: `S${+m[1]} E${+m[2]}`, title: m[3] || '' } : { code: '', title: name };
}
function epShort(ep){ const c = epCode(ep); return c.code || c.title; }
// "Adventure Time · S1 E3 Prisoners of Love", for Continue and the lock screen
function progressTitle(ep){
  const s = showForPath(ep.path), c = epCode(ep);
  return [s && s.name, [c.code, c.title].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
}

/* Where you are in a show, for its card and the top of its episode list:
   resume  the episode you're partway through
   next    the one after the last you finished
   done    every episode finished
   null    nothing watched yet */
function showPlace(show, map){
  if(!show) return null;
  if(!show._loaded) loadSeriesEpisodes(show);
  const eps = show.episodes || [];
  if(!eps.length) return null;
  map = map || resumeMap();
  let last = null, lastI = -1, all = true;
  eps.forEach((ep, i) => {
    const s = epState(ep, map);
    if(!s || !s.done) all = false;
    if(s && (!last || s.updated > last.updated)){ last = s; lastI = i; }
  });
  if(!last) return null;
  if(all) return { kind: 'done' };
  if(hasPlace(last)) return { kind: 'resume', ep: eps[lastI], s: last };
  for(let i = last.done ? lastI + 1 : lastI; i < eps.length; i++){
    const s = epState(eps[i], map);
    if(!s || !s.done) return { kind: 'next', ep: eps[i], s };
  }
  return null;
}

/* the card's label: "S1 E3" over "12 min left" and a thin bar, cut with an ellipsis when long */
function createShowBadge(place){
  if(!place) return null;
  const b = document.createElement('div'); b.className = 'badge-resume';
  const line = (cls, text) => { const s = document.createElement('span'); s.className = 'br-line' + (cls ? ' ' + cls : ''); s.textContent = text; b.appendChild(s); };
  if(place.kind === 'done'){
    b.classList.add('br-done');
    b.innerHTML = NomadIcons.svg('check', 13);
    line('', 'Watched');
    b.title = 'Watched';
  } else if(place.kind === 'resume'){
    const left = placeLeft(place.s);
    line('', epShort(place.ep)); line('br-sub', left);
    const bar = document.createElement('span'); bar.className = 'br-bar';
    const fill = document.createElement('i'); fill.style.width = (place.s.dur > 0 ? Math.round(100 * place.s.pos / place.s.dur) : 0) + '%';
    bar.appendChild(fill); b.appendChild(bar);
    b.title = `Continue ${epShort(place.ep)} · ${left}`;
  } else {
    line('', epShort(place.ep)); line('br-sub', 'Up next');
    b.title = `Up next ${epShort(place.ep)}`;
  }
  b.setAttribute('aria-label', b.title);
  return b;
}

function updateShowBadge(showDir, map){
  try {
    if(!showDir) return;
    const normDir = normalizePath(showDir);
    const card = Array.from(gridEl.querySelectorAll('.media-card')).find(c => normalizePath(c.dataset.dir || '') === normDir);
    const thumb = card && card.querySelector('.thumb-wrapper');
    if(!thumb) return;
    const show = shows.find(s => normalizePath(s.dir) === normDir);
    const badge = createShowBadge(showPlace(show, map));
    const old = thumb.querySelector('.badge-resume');
    // the same label again: leave the DOM alone (this runs every few seconds while playing)
    if(old && badge && old.title === badge.title && old.innerHTML === badge.innerHTML) return;
    if(old) old.remove();
    if(badge) thumb.appendChild(badge);
  } catch(e){
    console.warn('updateShowBadge failed', e);
  }
}

/* Start over: forget the place here and in Continue */
function clearResumeForPath(path){
  const store = readResume();
  const norm = normalizePath(path);
  let changed = false;
  for(const k of Object.keys(store)){
    if(normalizePath(k.split('|')[0] || '') === norm){ delete store[k]; changed = true; }
  }
  if(changed) writeResume(store);
  NomadProgress.clear(norm);
}

/* The one place an episode's progress is written: its exact place in nomad:watch:v1 (what this
   page resumes from) and how far along it is in NomadProgress (what Continue shows). Both drop
   the other episodes' half-watched holds, so starting the next episode clears the last one's. */
function recordProgress(ep, pos, dur){
  if(!ep || !ep.path || !(dur > 0) || !isFinite(pos)) return;
  dur = Math.floor(dur);
  pos = Math.max(0, Math.min(dur, Math.floor(pos)));
  const key = fileKey(ep.path, ep.sz || 0, ep.mt || 0);
  const info = { k: 'episode', t: progressTitle(ep), g: findShowDirForEpisodePath(ep.path) || undefined };
  if(NomadProgress.isFinished(pos, dur)){
    saveResumeEntryByKey(key, { completed: true, position: 0, duration: dur, updated: Date.now(), title: ep.name || '' }, true);
    NomadProgress.finish(ep.path, info);
    // the menu's Continue can't work out what follows, so it's told: the next episode, "Up next"
    const i = findIndexForPathOrBasename(ep.path);
    const nxt = (i !== undefined && i !== null && i + 1 < flattenedEpisodes.length) ? flattenedEpisodes[i + 1] : null;
    const had = nxt && NomadProgress.get(nxt.path);
    if(nxt && info.g && !(had && (had.done || had.p))) NomadProgress.note(nxt.path, { k: 'episode', t: progressTitle(nxt), g: info.g, p: null, l: 'Up next' });
  } else {
    saveResumeEntryByKey(key, { position: pos, duration: dur, updated: Date.now(), title: ep.name || '' }, true);
    NomadProgress.note(ep.path, Object.assign(info, { p: pos / dur, l: NomadProgress.timeLeft(dur - pos), done: false }));
  }
  const map = resumeMap();
  if(info.g) updateShowBadge(info.g, map);
  refreshEpisodeMarks(map);
}

/* fetch NDJSON index */
async function fetchIndex(path){ return NomadIndex.fetch(path); }   // shared reader, nomad-utils.js


/* Build shows list */
function buildShowsFromIndexes(data, root = '/Shows'){
  const out = [];
  const rootImages = new Map();
  const entries = data.slice(1); // Skip the root dir entry

  // Pre-process to group entries by their parent directory
  const dirChildren = new Map();
  for(const e of entries){
    const parentPath = normalizePath(e.p.substring(0, e.p.lastIndexOf('/')));
    if(!dirChildren.has(parentPath)) dirChildren.set(parentPath, []);
    dirChildren.get(parentPath).push(e);
  }

  // Function to recursively build entries for a directory
  function getEntriesForDir(dirPath){
    const children = (dirChildren.get(dirPath) || []).map(c => Object.assign({}, c));
    for(const child of children){
      if(child.t === 'd'){
        child.entries = getEntriesForDir(normalizePath(child.p));
      }
    }
    return children;
  }

  // Find top-level show directories and build their nested entries
  const showDirs = entries.filter(e => {
    if (e.t !== 'd') return false;
    const parentPath = normalizePath(e.p.substring(0, e.p.lastIndexOf('/')));
    return parentPath.toLowerCase() === root.toLowerCase();
  });

  for(const e of showDirs){
    e.entries = getEntriesForDir(normalizePath(e.p));
  }

  // Pre-scan for root-level images that might be show covers
  entries.forEach(e => {
    if(e.t === 'f' && isImageName(e.n)){
      const parentPath = normalizePath(e.p.substring(0, e.p.lastIndexOf('/')));
      if(parentPath.toLowerCase() === root.toLowerCase()){
        const name = e.n.split('.').slice(0,-1).join('.').toLowerCase();
        if(!rootImages.has(name)) rootImages.set(name, normalizePath(e.p));
      }
    }
  });

  for(const e of showDirs){
    const seriesName = e.n;
    const seriesDir = normalizePath(e.p);

    let cover = null;

    if (e.entries) {
        const coverEntry = e.entries.find(item => item.t === 'f' && isImageName(item.n) && ['poster','cover','folder','art'].some(cs => item.n.toLowerCase().includes(cs)));
        if (coverEntry) {
            cover = normalizePath(coverEntry.p);
        }
    }

    if (!cover) {
        const candidates = [ seriesName.toLowerCase(), seriesName.toLowerCase().replace(/\s+/g,'-'), seriesName.toLowerCase().replace(/\s+/g,'_') ];
        for(const c of candidates) if(rootImages.has(c)) { cover = rootImages.get(c); break; }
        if(!cover){
          ['poster','cover','folder','art'].forEach(k => { if(!cover && rootImages.has(k)) cover = rootImages.get(k); });
        }
    }

    out.push({
        name: seriesName.replace(/[_\.]+/g,' ').trim(),
        dir: seriesDir,
        cover: cover || null,
        _loaded: false, 
        entries: e.entries || [],
        episodes: null
    });
  }
  out.sort((a,b)=> byName.compare(a.name, b.name));
  return out;
}

/* load series episodes from pre-loaded nested data */
function loadSeriesEpisodes(show){
  if(!show || !show.dir) return;
  if(show.episodes) return; // Already processed

  try {
    const entries = [];
    const showEntries = show.entries || [];

    // Sidecar subtitles: collect per directory, matched to an episode when the
    // subtitle's basename starts with the episode file's basename
    // (Ep1.srt / Ep1.en.srt next to Ep1.mp4).
    const isSubName = (n) => SUB_EXTS.includes(ext(n));
    const subsInDir = new Map();
    const addSub = (n, p) => {
      const full = normalizePath(p);
      const dir = full.replace(/\/[^/]+$/, '');
      if(!subsInDir.has(dir)) subsInDir.set(dir, []);
      subsInDir.get(dir).push({ n, p: full });
    };
    const subsFor = (videoPath, rawName) => {
      const dir = normalizePath(videoPath).replace(/\/[^/]+$/, '');
      const base = String(rawName).replace(/\.[^.]+$/, '').toLowerCase();
      return (subsInDir.get(dir) || [])
        .filter(s => s.n.replace(/\.[^.]+$/, '').toLowerCase().startsWith(base))
        .map(s => s.p);
    };

    // Process all entries in the show
    for(const e of showEntries){
      if(e.t === 'f' && isVideoName(e.n)) {
        // This is a video file directly in the show directory
        entries.push({ type:'f', name: prettify(e.n), raw: e.n, path: normalizePath(e.p), sz: e.sz||0, mt: e.mt||0 });
      } else if(e.t === 'f' && isSubName(e.n)) {
        addSub(e.n, e.p);
      } else if(e.t === 'd') {
        // This is a directory (season folder)
        const seasonPath = normalizePath(e.p);
        const children = [];

        // Look for video files in this season directory
        if(e.entries) {
          for(const se of e.entries) {
            if(se.t === 'f' && isVideoName(se.n)) {
              children.push({ name: prettify(se.n), raw: se.n, path: normalizePath(se.p), sz: se.sz||0, mt: se.mt||0 });
            } else if(se.t === 'f' && isSubName(se.n)) {
              addSub(se.n, se.p);
            }
          }
        }

        children.sort((a,b) => byName.compare(a.name, b.name));

        // Add the season directory with its episodes
        entries.push({ type:'d', name: e.n, path: seasonPath, children });
      }
    }

    // Sort entries in natural order: Season 2 before Season 10, Episode 9 before Episode 10
    entries.sort((A,B) => byName.compare(String(A.name || ''), String(B.name || '')));

    // Create flattened episode list
    const flat = [];
    let idx = 0;
    const map = {};

    for(const en of entries){
      if(en.type === 'f'){
        const item = { name: en.name, path: en.path, season: null, sz: en.sz||0, mt: en.mt||0, _seq: idx+1,
                       subtitles: subsFor(en.path, en.raw || en.name) };
        flat.push(item);
        map[normalizePath(item.path)] = idx;
        idx++;
      } else if(en.type === 'd'){
        for(const c of en.children){
          const item = { name: c.name, path: c.path, season: en.name, sz: c.sz||0, mt:c.mt||0, _seq: idx+1,
                         subtitles: subsFor(c.path, c.raw || c.name) };
          flat.push(item);
          map[normalizePath(item.path)] = idx;
          idx++;
        }
      }
    }

    show.entries = entries;
    show.episodes = flat.slice();
    show._loaded = true;
  } catch(err){
    console.warn('loadSeriesEpisodes failed', show.dir, err);
    show.entries = [];
    show.episodes = [];
    show._loaded = true;
  }
}

/* ensure flattened for current show */
function ensureFlattenedForCurrentShow(){
  if(!currentShow) return;
  if(!currentShow._loaded) loadSeriesEpisodes(currentShow);
  if(currentShow.episodes && currentShow.episodes.length){
    flattenedEpisodes = currentShow.episodes.map(e => Object.assign({}, e));
    pathIndexMap = {};
    flattenedEpisodes.forEach((it,i)=>{ pathIndexMap[normalizePath(it.path)] = i; });
  } else {
    flattenedEpisodes = [];
    pathIndexMap = {};
  }
}

/* UI render helpers */
const gridEl = document.getElementById('grid');


/* Render grid */
function renderGrid(){
  gridEl.className = `media-grid ${currentSize}`;
  const frag = document.createDocumentFragment();
  if(filtered.length === 0){ gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">No shows found</p>'; return; }
  const map = resumeMap();
  for(const show of filtered){
    const card = document.createElement('div'); card.className='media-card';
    // helpful hook for single-card updates:
    try { card.dataset.dir = normalizePath(show.dir || ''); } catch(e){ card.dataset.dir = show.dir || ''; }

    const thumb = document.createElement('div'); thumb.className='thumb-wrapper';
    const fallback = document.createElement('span'); fallback.className='fallback-text'; fallback.textContent = show.name;
    thumb.appendChild(fallback);

    // where you are in it: the episode to continue, the next one, or Watched
    const badge = createShowBadge(showPlace(show, map));
    if(badge) thumb.appendChild(badge);

    if(show.cover){
      const img = document.createElement('img'); img.className='media-thumb'; img.loading='lazy'; img.alt = show.name;
      img.onload = ()=>{ img.style.opacity='1'; if(fallback) fallback.style.display='none'; };
      img.onerror = ()=>{ img.style.display='none'; if(fallback) fallback.style.display='block'; };
      thumb.appendChild(img);
      // src assigned by NomadImages: a few covers at a time, only near the viewport
      NomadImages.observe(img, `${MEDIA_ENDPOINT}?file=${encodeURIComponent(show.cover)}`);
    }
    card.appendChild(thumb);
    card.addEventListener('click', ()=> openEpisodeModal(show));
    frag.appendChild(card);
  }
  gridEl.innerHTML = '';
  gridEl.appendChild(frag);

  const animKey = ANIM_KEY_BASE;   // once per browser, not per library change
  if(!NomadPrefs.raw(animKey) && filtered.length>0) runStaggeredAnimation(animKey);
}

/* stagger animation */
function runStaggeredAnimation(storeKey){
  if(!gridEl.querySelector('.media-card')){ NomadPrefs.setRaw(storeKey, Date.now()); return; }
  // the cards are taken in the frame: a second render in between replaces them
  requestAnimationFrame(()=>{
    const cards = Array.from(gridEl.querySelectorAll('.media-card'));
    if(!cards.length || NomadPrefs.raw(storeKey)) return;
    const gap = parseFloat(getComputedStyle(gridEl).gap) || 16;
    const gridW = Math.max(1, gridEl.clientWidth);
    const rect = cards[0].getBoundingClientRect();
    const cardW = Math.max(1, rect.width);
    const cols = Math.max(1, Math.floor((gridW + gap) / (cardW + gap)));
    const stagger = 45;
    // the first screenful only: card N waits N x 45 ms hidden
    cards.length = Math.min(cards.length, cols * Math.max(1, Math.ceil(window.innerHeight / Math.max(1, rect.height))) + cols);
    cards.forEach((c,i)=>{ const row = Math.floor(i/cols), col=i%cols; c.style.animationDelay = `${(row*cols + col)*stagger}ms`; c.classList.add('play-anim'); });
    try{ NomadPrefs.setRaw(storeKey, Date.now()); }catch(e){}
    setTimeout(()=>{ cards.forEach(c=>{ c.style.animationDelay=''; c.classList.remove('play-anim'); }); }, (Math.ceil(cards.length/cols)*cols*stagger)+500);
  });
}

/* closeVideo optionally avoids autosave (used when marking completed to avoid overwriting) */
function closeVideo(doSave=true){

/* play an episode from the list, the banner or a link, from its saved place when resume is set */
function playEpisode(ep, resume){
  ensureFlattenedForCurrentShow();
  const idx = findIndexForPathOrBasename(ep.path);
  if(idx !== undefined && idx !== null) ep = flattenedEpisodes[idx];
  openVideo(fileUrl(ep.path), resume, ep);
}

/* the top of the episode list: one button back to where you are in the show */
function renderResumeBanner(show, map){
  episodeResumeBanner.innerHTML = '';
  const place = showPlace(show, map);
  if(!place){ episodeResumeBanner.style.display = 'none'; return; }
  episodeResumeBanner.style.display = 'block';
  if(place.kind === 'done'){
    const txt = document.createElement('div'); txt.className = 'banner-done'; txt.setAttribute('role', 'status');
    txt.innerHTML = NomadIcons.svg('check', 16);
    txt.append('All watched');
    episodeResumeBanner.appendChild(txt);
    return;
  }
  const btn = document.createElement('button'); btn.className = 'secondary';
  const name = epShort(place.ep);
  btn.textContent = place.kind === 'resume' ? `Resume ${name} from ${formatTime(place.s.pos)}` : `Play next: ${name}`;
  btn.onclick = () => playEpisode(place.ep, true);
  episodeResumeBanner.appendChild(btn);
}

/* one episode's row: its name, then Watched or the time left, and a thin bar along the bottom */
function episodeRow(en, season, map){
  const row = document.createElement('div'); row.className = 'ep-row'; row.dataset.path = normalizePath(en.path);
  const btn = document.createElement('button');
  const name = document.createElement('span'); name.className = 'ep-name'; name.textContent = en.name || 'Untitled';
  const state = document.createElement('span'); state.className = 'ep-state';
  btn.append(name, state);
  btn.onclick = ()=>{ ensureFlattenedForCurrentShow(); const idx = findIndexForPathOrBasename(en.path); const target = (idx !== undefined)? flattenedEpisodes[idx] : { name: en.name, path: en.path, season }; openActionModalForEpisode(target); };
  row.appendChild(btn);
  markRow(row, map.get(row.dataset.path) || null);
  return row;
}
function markRow(row, s){
  const btn = row.querySelector('button');
  if(!btn) return;
  const kind = !s ? '' : s.done ? 'done' : hasPlace(s) ? 'part' : '';
  const pct = kind === 'part' && s.dur > 0 ? Math.max(2, Math.round(100 * s.pos / s.dur)) : 0;
  const left = kind === 'part' ? placeLeft(s) : '';
  const sig = kind + pct + left;
  if(row.dataset.mark === sig) return;   // unchanged: this runs every few seconds while playing
  row.dataset.mark = sig;
  row.classList.toggle('watched', kind === 'done');
  const state = btn.querySelector('.ep-state'), name = btn.querySelector('.ep-name').textContent;
  const oldBar = btn.querySelector('.ep-bar');
  if(oldBar) oldBar.remove();
  if(kind === 'done'){
    state.innerHTML = NomadIcons.svg('check', 14) + '<span>Watched</span>';
    btn.setAttribute('aria-label', `${name}, watched`);
  } else if(kind === 'part'){
    state.textContent = left;
    const bar = document.createElement('span'); bar.className = 'ep-bar'; bar.setAttribute('aria-hidden', 'true');
    const fill = document.createElement('i'); fill.style.width = pct + '%';
    bar.appendChild(fill); btn.appendChild(bar);
    btn.setAttribute('aria-label', `${name}, ${left}`);
  } else {
    state.textContent = '';
    btn.removeAttribute('aria-label');
  }
}
// bring the open list's marks and banner up to date (after playing, or while it plays underneath)
function refreshEpisodeMarks(map){
  if(episodeModal.style.display !== 'flex') return;
  map = map || resumeMap();
  episodeList.querySelectorAll('.ep-row[data-path]').forEach(r => markRow(r, map.get(r.dataset.path) || null));
  if(currentShow) renderResumeBanner(currentShow, map);
}

function setSeasonOpen(content, chev, open, animate){
  content.style.display = open ? 'block' : 'none';
  chev.innerHTML = NomadIcons.svg(open ? 'chevron-down' : 'chevron-right', 18);
  if(open && animate){ Array.from(content.querySelectorAll('.ep-row')).forEach((r,i)=>{ r.style.opacity='0'; r.style.transform='translateY(6px)'; setTimeout(()=>{ r.style.transition='opacity .25s ease, transform .25s ease'; r.style.opacity='1'; r.style.transform='translateY(0)'; }, 20*i); }); }
}

/* open episode modal */
function openEpisodeModal(show){
  currentShow = show;
  episodeModalTitle.textContent = show.name;
  episodeModal.style.display='flex';
  NomadBack.open('episodes', closeEpisodeModal);

  if(!show._loaded) loadSeriesEpisodes(show);
  ensureFlattenedForCurrentShow();

  const map = resumeMap();
  renderResumeBanner(show, map);
  const place = showPlace(show, map);
  const here = place && place.ep ? normalizePath(place.ep.path) : null;

  episodeList.innerHTML = '';
  const entries = show.entries || [];
  if(entries.length === 0){ episodeList.innerHTML = '<p style="padding:12px;color:var(--muted)">No episodes found</p>'; return; }

  entries.forEach(en=>{
    if(en.type === 'f'){
      episodeList.appendChild(episodeRow(en, null, map));
    } else if(en.type === 'd'){
      const section = document.createElement('div');
      const toggle = document.createElement('div'); toggle.className='season-toggle';
      const tleft = document.createElement('div'); tleft.textContent = en.name;
      const tchev = document.createElement('div'); tchev.style.display = 'flex'; tchev.innerHTML = NomadIcons.svg('chevron-right', 18);
      toggle.appendChild(tleft); toggle.appendChild(tchev);
      const content = document.createElement('div'); content.className='season-content'; content.style.display='none';
      if(!en.children || en.children.length===0){ const none = document.createElement('div'); none.style.padding='8px'; none.style.color='var(--muted)'; none.textContent='No episodes'; content.appendChild(none); }
      else en.children.forEach(child => content.appendChild(episodeRow(child, en.name, map)));
      toggle.onclick = ()=> setSeasonOpen(content, tchev, content.style.display !== 'block', true);
      // the season you're in opens by itself, and so does a show's only season
      if((here && (en.children || []).some(c => normalizePath(c.path) === here)) || entries.length === 1) setSeasonOpen(content, tchev, true, false);
      section.appendChild(toggle); section.appendChild(content); episodeList.appendChild(section);
    }
  });

  // Apply theme styling to the newly created episode buttons
  applyThemeFlag(document.body.classList.contains('dark'));
}

/* action modal for an episode */
function openActionModalForEpisode(ep){
  // canonicalize to flattened
  if(ep && ep.path){
    const idx = findIndexForPathOrBasename(ep.path);
    if(idx !== undefined && idx !== null){ ep = Object.assign({}, flattenedEpisodes[idx]); currentEpisodeIndex = idx; }
  }
  currentEpisode = ep;
  if(currentEpisode && currentEpisode.path){
    const idx = findIndexForPathOrBasename(currentEpisode.path);
    currentEpisodeIndex = (idx !== undefined && idx !== null) ? idx : -1;
  } else currentEpisodeIndex = -1;

  const s = epState(ep), place = hasPlace(s);
  actionTitle.textContent = ep.name || 'Episode';
  actionSub.textContent = [currentShow && currentShow.name, ep.season, s && s.done ? 'Watched' : place ? placeLeft(s) : ''].filter(Boolean).join(' · ');

  // a saved place: Resume is the main action and Start over the second. Only Start over forgets it
  resumeEpButton.style.display = place ? '' : 'none';
  if(place) resumeEpButton.textContent = `Resume from ${formatTime(s.pos)}`;
  resumeEpButton.onclick = ()=>{ closeActionModal(true); openVideo(fileUrl(ep.path), true, ep); };
  playButton.textContent = place ? 'Start over' : 'Play';
  playButton.classList.toggle('secondary', place);
  playButton.onclick = ()=>{
    if(place) clearResumeForPath(ep.path);
    closeActionModal(true);
    openVideo(fileUrl(ep.path), false, ep);
    updateShowBadge(findShowDirForEpisodePath(ep.path));
  };
  downloadButton.onclick = ()=>{ closeActionModal(); startDownload(ep); };
  // host a watch party of this episode
  document.getElementById('togetherButton').onclick = ()=>{
    const title = `${currentShow ? currentShow.name + ' · ' : ''}${ep.name || ''}`.slice(0, 70);
    location.href = '/watch.html?' + new URLSearchParams({ host: '1', path: ep.path, title, cover: (currentShow && currentShow.cover) || '' });
  };

  actionModal.style.display = 'flex';
  NomadBack.open('sheet', closeSheet);
}

/* download */
function startDownload(ep){
  if(!confirm(`Download "${ep.name}"?`)) return;
  const a = document.createElement('a');
  // go through /media like playback does. a raw path cuts the request off at the
  // first # or ? in a filename
  a.href = `${MEDIA_ENDPOINT}?file=${encodeURIComponent(normalizePath(ep.path))}&download=1`;
  a.download = normalizePath(ep.path).split('/').pop() || ep.name;   // the file's own name, extension included
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* Player wiring & logic  */
/* find index: exact path first -> basename fallback */
function findIndexForPathOrBasename(path){
  const norm = normalizePath(path);
  if(pathIndexMap && pathIndexMap[norm] !== undefined) return pathIndexMap[norm];
  const base = norm.split('/').pop().toLowerCase();
  for(let i=0;i<flattenedEpisodes.length;i++){
    const ebase = (flattenedEpisodes[i].path || '').split('/').pop().toLowerCase();
    if(ebase === base) return i;
  }
  return undefined;
}

/* openVideo uses fileKey resume matching and updates title to the current episode */
async function openVideo(src, useResume=false, ep=null){
  if(ep) currentEpisode = ep;
  if(!currentEpisode || !currentEpisode.path) return;

  ensureFlattenedForCurrentShow();
  const idx = findIndexForPathOrBasename(currentEpisode.path);
  if(idx !== undefined && idx !== null){ currentEpisodeIndex = idx; currentEpisode = Object.assign({}, flattenedEpisodes[idx]); }
  else { currentEpisodeIndex = -1; }


  // its own saved place, by exact path (a basename match could be another show's episode)
  const saved = epState(currentEpisode);
  const startTime = (useResume && hasPlace(saved)) ? saved.pos : 0;

  // save nothing until the player has this episode: the old one's time and length linger
  // on the element until then
  const gen = ++openGen, playing = currentEpisode;
  mediaReadyFor = null;
  videoPlayer.removeAttribute('src');
  videoPlayer.innerHTML = '';
  // once its length is known it is noted as started, which drops the last episode's hold
  videoPlayer.addEventListener('loadedmetadata', () => {
    if(gen !== openGen) return;
    mediaReadyFor = playing.path;
    recordProgress(playing, startTime, videoPlayer.duration);
  }, { once: true });

  if (!window.plyrInstance) {
    // shared player build (nomad-utils.js). captions.update makes Plyr notice tracks appended
    // after the player exists. Set per player, not in NomadPlyr's defaults: 'addtrack' also
    // fires for in-band tracks, which would add a captions button on gallery and archive files.
    window.plyrInstance = await NomadPlyr.create(videoPlayer, { captions: { update: true } });

    try {
      const allImages = document.querySelectorAll('img[loading="lazy"]');
      allImages.forEach(img => {
        if (img.src && !img.complete) {
          img.dataset.originalSrc = img.src;
          img.removeAttribute('src');
        }
      });
    } catch(e) {
      console.warn('Could not pause image loading', e);
    }

    window.plyrInstance.on('ended', () => { handleEpisodeEnded(); });
    upNext.attach(window.plyrInstance);
    window.plyrInstance.on('pause', () => { saveNow(); });
    window.plyrInstance.on('seeked', () => { saveNow(); });
  }

  // all sidecar subtitles as selectable tracks. srt converted to VTT (browsers
  // render nothing for raw srt in <track>)
  const subTracks = await NomadSubs.buildTracks(
    (currentEpisode.subtitles || []).map(p => ({ path: p, url: fileUrl(p) })),
    currentEpisode.path);
  if (gen !== openGen) return;   // closed, or another episode chosen, while the subtitles loaded
  // set only now: set before the wait above, the episode is requested twice (again by load())
  videoPlayer.src = src;
  subTracks.forEach(sub => {
    const track = document.createElement('track');
    track.kind = sub.kind;
    track.label = sub.label;
    track.srclang = sub.srclang;
    track.src = sub.src;
    videoPlayer.appendChild(track);
  });
  NomadSubs.keepOn(window.plyrInstance, videoPlayer);
  videoPlayer.load();
  NomadPlyr.previews(window.plyrInstance, currentEpisode && currentEpisode.path);   // seek previews, if made
  upNext.reset();
  if (window.videoMarks) videoMarks.refresh();

  videoModal.style.display = 'flex';
  NomadBack.open('sheet', closeSheet);
  videoTitle.textContent = currentEpisode.name || '';
  updateNextBtn();
  setMediaSession(currentEpisode);

  if (startTime > 0) {
    let seekDone = false;
    const doSeek = () => {
      if(seekDone) return;
      try {
        const vid = window.plyrInstance.media || videoPlayer;
        if(vid.readyState >= 1 && vid.duration > 0){
          seekDone = true;
          vid.currentTime = startTime;
        }
      } catch(e){ console.warn('Seek failed:', e); }
    };
    videoPlayer.addEventListener('canplay', doSeek, { once: true });
    videoPlayer.addEventListener('loadeddata', doSeek, { once: true });
    setTimeout(doSeek, 500);
    setTimeout(doSeek, 1500);
    setTimeout(doSeek, 3000);
  }

  startAutosave();

  const doPlay = () => {
    window.plyrInstance.play().catch(e => console.warn('Play failed:', e));
  };
  if(videoPlayer.readyState >= 3){
    doPlay();
  } else {
    videoPlayer.addEventListener('canplay', doPlay, { once: true });
  }
}

/* Up next: fullscreen only, in the last 3% of an episode (20 to 60 s), counting down to the
   next one. Tap to go now, x to stay on this episode. */
const upNext = {
  el: null, cancelled: false, player: null,
  attach(p){
    this.player = p;
    const box = p.elements && p.elements.container;
    if(!box) return;
    this.el = document.createElement('div');
    this.el.className = 'up-next';
    this.el.hidden = true;
    this.el.innerHTML = `<button class="un-go" type="button"><span class="un-play" aria-hidden="true">&#9654;</span>
        <span class="un-txt"><span class="un-when"></span><span class="un-name"><span class="un-code"></span><span class="un-title"></span></span></span></button>
      <button class="un-x" type="button" aria-label="Stay on this episode" title="Stay on this episode">&times;</button>
      <span class="un-bar" aria-hidden="true"></span>`;
    box.appendChild(this.el);
    this.el.querySelector('.un-go').addEventListener('click', (e) => { e.stopPropagation(); this.hide(); nextEpisode(); });
    this.el.querySelector('.un-x').addEventListener('click', (e) => { e.stopPropagation(); this.cancelled = true; this.hide(); });
    const tick = () => this.update();
    p.on('timeupdate', tick);
    p.on('enterfullscreen', tick);
    p.on('exitfullscreen', tick);
  },
  next(){
    if(!Array.isArray(flattenedEpisodes)) return null;
    let i = currentEpisodeIndex;
    if((i === undefined || i === -1) && currentEpisode && currentEpisode.path) i = findIndexForPathOrBasename(currentEpisode.path);
    return (i !== undefined && i !== null && i + 1 < flattenedEpisodes.length) ? flattenedEpisodes[i + 1] : null;
  },
  update(){
    const p = this.player;
    if(!this.el || !p) return;
    const dur = p.duration || 0, left = dur - (p.currentTime || 0);
    const window_ = Math.min(60, Math.max(20, dur * 0.03));
    const nxt = this.next();
    const show = !this.cancelled && !!nxt && dur > 60 && left > 0 && left <= window_ && p.fullscreen && p.fullscreen.active;
    this.el.hidden = !show;
    if(show){
      // "S01E02 - Trouble in Lumpy Space" reads as a small "S1 E2" and the title
      const c = epCode(nxt);
      this.el.querySelector('.un-code').textContent = c.code;
      this.el.querySelector('.un-title').textContent = c.title;
      this.el.querySelector('.un-name').title = nxt.name || '';
      this.el.querySelector('.un-when').textContent = `Next episode in ${Math.ceil(left)}s`;
      this.el.querySelector('.un-bar').style.transform = `scaleX(${Math.max(0, Math.min(1, left / window_))})`;
    }
  },
  hide(){ if(this.el) this.el.hidden = true; },
  reset(){ this.cancelled = false; this.hide(); },
};

/* When an episode ends it is finished, then the next one plays (the same as Next). The x on
   Up next stays on this one. After the last episode the player closes onto the list. */
function handleEpisodeEnded(){
  const dur = window.plyrInstance ? window.plyrInstance.duration || 0 : 0;
  if(mediaReadyFor && currentEpisode && mediaReadyFor === currentEpisode.path) recordProgress(currentEpisode, dur, dur);
  stopAutosave();
  if(upNext.cancelled){ upNext.reset(); return; }
  if(upNext.next()){
    nextEpisode().catch(e => { console.warn('auto next failed', e); closeVideo(false); });
  } else {
    closeVideo(false);
  }
}

// Next says when this is the last episode instead of closing the player
function updateNextBtn(){
  const has = !!upNext.next();
  videoNextBtn.disabled = !has;
  videoNextBtn.textContent = has ? 'Next' : 'Last episode';
  videoNextBtn.title = has ? `Next: ${epShort(upNext.next())}` : '';
}

/* the lock screen and notification: which episode of which show, and its next button */
function setMediaSession(ep){
  if(!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  try {
    if(!ep){ navigator.mediaSession.metadata = null; navigator.mediaSession.setActionHandler('nexttrack', null); return; }
    const show = showForPath(ep.path), c = epCode(ep);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: c.title || ep.name || '',
      artist: [show && show.name, c.code].filter(Boolean).join(' · '),
      album: ep.season || '',
      artwork: show && show.cover ? [{ src: `${MEDIA_ENDPOINT}?file=${encodeURIComponent(show.cover)}` }] : []
    });
    navigator.mediaSession.setActionHandler('nexttrack', upNext.next() ? () => { nextEpisode(); } : null);
  } catch(e){ console.warn('mediaSession', e); }
}

/* Next (the button, Up next, the end of an episode): play the next one from its start. Its
   place is noted as soon as it loads, which drops the hold on the one you left. */
async function nextEpisode(){
  const next = upNext.next();
  if(!next){ updateNextBtn(); return; }

  currentEpisodeIndex = findIndexForPathOrBasename(next.path);
  currentEpisode = Object.assign({}, next);
  videoTitle.textContent = currentEpisode.name || '';

  // Go through openVideo, never Plyr's source setter. The setter replaces the <video> element,
  // which orphans `videoPlayer` (a hidden second download, later picks play nothing), and its
  // blank src "" fetches this page as media. openVideo also restarts autosave.
  // Captions here need captions:{update:true} in NomadPlyr.create, keep the two together.
  await openVideo(fileUrl(currentEpisode.path), false, currentEpisode);
}

/* Autosave */
function startAutosave(){ stopAutosave(); autosaveTimer = setInterval(saveNow, 4000); }
function stopAutosave(){ if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; } }

function saveNow(){
  try {
    if(!currentEpisode || !currentEpisode.path || !window.plyrInstance) return;
    if(mediaReadyFor !== currentEpisode.path) return;   // still loading: the time on the player is the last episode's
    const cur = window.plyrInstance.currentTime || 0;
    const dur = window.plyrInstance.duration || 0;
    if(cur > 0 && dur > 0) recordProgress(currentEpisode, cur, dur);
  } catch(e){ console.warn('saveNow failed', e); }
}


/* UI helpers: search, sort, view size */
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const viewButtons = document.querySelectorAll('.view-btn');

function applyFilter(term=''){ const lower = (term||'').trim().toLowerCase(); filtered = !lower ? shows.slice() : shows.filter(s => (s.name||'').toLowerCase().includes(lower)); applySort(sortSelect.value || 'nameAsc'); }
function applySort(mode='nameAsc'){ filtered.sort((a,b) => mode === 'nameDesc' ? byName.compare(b.name, a.name) : byName.compare(a.name, b.name)); renderGrid(); }
function setViewSize(size){ currentSize = size; viewButtons.forEach(btn => { btn.classList.toggle('active', btn.dataset.size === size); btn.setAttribute('aria-pressed', btn.dataset.size === size ? 'true' : 'false'); }); gridEl.className = `media-grid ${size}`; NomadPrefs.setRaw('nomadShowsSize', size); }

/* Index watcher + load library */
async function checkIndex(){
  // skipped while hidden or playing: the poll competes for the SD mutex
  if(document.hidden) return;
  if(videoModal && videoModal.style.display === 'flex') return;
  try {
    // revalidated, not re-fetched: an unchanged index answers 304 (the device sends its sig as an ETag)
    const res = await fetch(`${INDEX_ENDPOINT}?path=${encodeURIComponent(ROOT_PATH)}`, { cache: 'no-cache' });
    if(!res.ok) return;
    const text = await res.text();
    const headerLine = text.split('\n')[0];
    if(headerLine){
      const header = JSON.parse(headerLine);
      if(header && header.sig && rootSig && rootSig !== header.sig) await loadLibrary();
      else if(header && header.sig && !rootSig) rootSig = header.sig;
    }
  } catch(e){}
}

/* Handle incoming hash like #open=%2FShows%2FShowName%2FS1%20E1.mp4
*/
async function handleHashOpenIfPresent(){
  try {
    if(!location.hash) return;
    const raw = location.hash.replace(/^#/,'');

    // parse hash key=value pairs (hash format used by menu.html)
    const params = {};
    raw.split('&').forEach(p => {
      const [k, v] = p.split('=');
      if(!k) return;
      try { params[k] = v === undefined ? '' : decodeURIComponent(v || ''); }
      catch(e) { params[k] = v === undefined ? '' : (v || ''); }
    });

    if(!params.open && !params.play) return;

    const openPath = normalizePath(params.open || params.play || '');
    const parts = openPath.split('/').filter(Boolean); // e.g. ['Shows','ShowName','Season1'] or ['Shows','ShowName','S01E01.mkv']

    // If the path is a show directory or season directory, open the episode modal instead of playing.
    // Handle both /Shows/ShowName (2 parts) and /Shows/ShowName/Season1 (3+ parts where last part is a directory)
    if(parts.length >= 2 && parts[0].toLowerCase() === 'shows'){
      // For paths like /Shows/ShowName or /Shows/ShowName/Season1, we want to open the show's episode modal
      const showDirCandidate = '/' + parts.slice(0,2).join('/'); // Always use first 2 parts for show directory

      // ensure library is loaded so we can find the show object
      if(!shows || !shows.length){
        try { await loadLibrary(); } catch(e){ /* ignore */ }
      }

      // find by normalized dir (case-insensitive)
      let show = shows.find(s => normalizePath(s.dir).toLowerCase() === showDirCandidate.toLowerCase());

      // fallback: try matching by show name if exact dir not found
      if(!show){
        const showNameCandidate = decodeURIComponent(parts[1]).replace(/[_\-\%]+/g,' ').toLowerCase();
        show = shows.find(s => (s.name || '').toLowerCase() === showNameCandidate);
      }

      if(show){
        // Check if this is likely a season directory (3+ parts and last part doesn't look like a video file)
        const isSeasonDir = parts.length >= 3 && !isVideoName(parts[parts.length - 1]);
        
        // If it's a season directory or just the show directory, open the episode modal
        if(parts.length === 2 || isSeasonDir){
          // load episodes, set currentShow and open modal (no playback)
          await loadSeriesEpisodes(show);
          currentShow = show;
          await ensureFlattenedForCurrentShow();
          openEpisodeModal(show);
          
          // Clear the hash so reloads don't re-open the modal
          history.replaceState(null, '', location.pathname + location.search);
          return;
        }
      }
    }

    // Otherwise treat open as an explicit episode/file request
    // Attempt to find the parent show (first two segments)
    if(parts.length < 3){
      // not enough info to identify an episode; clear hash and exit
      history.replaceState(null, '', location.pathname + location.search);
      return;
    }

    const showDir = '/' + parts.slice(0,2).join('/'); // /Shows/ShowName

    // ensure shows list is present
    if(!shows || !shows.length){
      try { await loadLibrary(); } catch(e){ /* ignore */ }
    }

    let showObj = shows.find(s => normalizePath(s.dir).toLowerCase() === showDir.toLowerCase());
    if(!showObj){
      const showNameCandidate = decodeURIComponent(parts[1]).replace(/[_\-\%]+/g,' ').toLowerCase();
      showObj = shows.find(s => (s.name||'').toLowerCase() === showNameCandidate);
    }

    if(!showObj){
      // can't find show; clear hash and stop
      history.replaceState(null, '', location.pathname + location.search);
      return;
    }

    // ensure episodes loaded for that show
    await loadSeriesEpisodes(showObj);
    currentShow = showObj;
    await ensureFlattenedForCurrentShow();

    // find the episode (exact path or fallback to basename match)
    const idx = findIndexForPathOrBasename(openPath);
    const ep = (idx !== undefined && idx !== null) ? flattenedEpisodes[idx] : null;

    // if a specific episode was requested, open it in the player (resume)
    if(ep){
      openVideo(fileUrl(ep.path), true, ep);
    } else {
      // If we didn't find a matching episode file, try to open the provided path directly in the player.
      openVideo(fileUrl(openPath), true, { name: openPath.split('/').pop(), path: openPath });
    }

    // Clear the hash so a reload doesn't auto-play again
    history.replaceState(null, '', location.pathname + location.search);

  } catch(err){
    console.warn('handleHashOpenIfPresent failed', err);
  }
}
// also respond to hash changes while on page
window.addEventListener('hashchange', ()=> handleHashOpenIfPresent());

/* Boot */
setViewSize(currentSize);
viewButtons.forEach(btn => btn.addEventListener('click', () => setViewSize(btn.dataset.size)));
searchInput.addEventListener('input', e => { clearTimeout(window.__debounce); window.__debounce = setTimeout(()=> applyFilter(e.target.value), 150); });
sortSelect.addEventListener('change', () => applySort(sortSelect.value));

(async function init(){
  try {
    await loadLibrary();

    // handle hash if present (resume/open)
    await handleHashOpenIfPresent();
  } catch(e){ console.error('init failed', e); }
  setInterval(checkIndex, 30000);
})();

/* admin toggle: hide the download action when downloads are disabled */
NomadUI.applyDownloadPolicy('downloadButton');
</script>
