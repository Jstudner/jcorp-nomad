<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<script>/* nomad-load-guard: reload, twice at most, when one of Nomad's own scripts or stylesheets fails to load */(function(){var k='nomadLoadGuard:'+location.pathname;window.addEventListener('error',function(e){var t=e.target;if(!t||!t.tagName)return;var s=t.tagName==='SCRIPT',c=t.tagName==='LINK'&&/stylesheet/i.test(t.rel||'');if(!s&&!c)return;var u=t.src||t.href||'';if(u.indexOf(location.origin+'/')!==0)return;var n=0;try{n=+sessionStorage.getItem(k)||0;}catch(x){return;}if(n>=2)return;try{sessionStorage.setItem(k,String(n+1));}catch(x){return;}setTimeout(function(){location.reload();},1500*(n+1));},true);window.addEventListener('load',function(){setTimeout(function(){try{sessionStorage.removeItem(k);}catch(x){}},15000);});})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nomad • Files</title>
  <script src="/theme-boot.js?v=5"></script>
  <script src="/nomad-icons.js?v=1"></script>
  <link rel="stylesheet" href="master.css">
  <script src="theme-manager.js?v=5"></script>
  <script src="/nomad-utils.js?v=51"></script>
  <script src="/assets/nomad-files.js?v=3"></script>
  <style>
    /* Full-screen form of the admin page's Files browser (assets/nomad-files.js). */
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .fb-top { background: var(--primary); color: var(--header-text, #fff); display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; height: 44px; box-sizing: border-box; flex: 0 0 auto; }
    .fb-top a { color: inherit; text-decoration: none; background: rgba(255,255,255,.18); padding: 5px 11px; border-radius: 999px;
      font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .fb-top h1 { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .fb-body { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto;
      padding: 10px 12px 0; box-sizing: border-box; }
    .fb-body > .nf { flex: 1; }
  </style>
</head>
<body>
  <div class="fb-top">
    <a href="/admin.html#files" aria-label="Back to the admin page">&larr; Admin</a>
    <h1>Files</h1>
  </div>
  <div class="fb-body" id="fb"></div>
  <script>
    // the folder in the address (#/Movies), so a reload or a link comes back to it
    const start = decodeURIComponent(location.hash.slice(1)) || '/';
    NomadFiles.mount(document.getElementById('fb'), {
      path: start,
      onPath: (p) => { try { history.replaceState(null, '', '#' + encodeURI(p)); } catch (e) {} }
    });
  </script>
</body>
</html>
