<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Jcorp Nomad Menu" />
<title>Jcorp Nomad</title>
<script src="/nomad-icons.js?v=1"></script>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/theme-manager.js?v=5"></script>
<script src="/nomad-utils.js?v=49"></script>
<style>
  /* Menu-specific functional CSS layout and search functionality */
  :root {
    --header-height:64px;
    --page-max:1400px;
  }

  html,body {
    height:100%;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  body {
    display:flex;
    flex-direction:column;
  }

  /* full-page background layer to avoid mobile variable bleed / white gaps */
  .page-bg {
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:0;
    pointer-events:none;
    transition:background .18s linear;
  }

  /* Header */
  header {
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:space-between;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--primary);
    color:#fff;
    z-index:80;
    backdrop-filter:blur(6px);
    height:var(--header-height);
    box-sizing:border-box;
  }

  .brand {
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .logo {
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    height:48px;
    min-width:48px;
    border-radius:var(--radius);
    overflow:hidden;
    background:rgba(255,255,255,0.06);
    box-shadow:var(--shadow);
    flex-shrink:0;
  }

  .logo img {
    display:block;
    max-height:40px;
    max-width:180px;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
  }

  .title {
    font-weight:800;
    font-size:1.06rem;
    line-height:1;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .header-space {
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
  }

  .icon-btn {
    width:44px;
    height:44px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.06);
    display:inline-grid;
    place-items:center;
    cursor:pointer;
    color:#fff;
    transition:transform .12s, box-shadow .12s, opacity .12s;
    font-size:16px;
  }

  .icon-btn:active {
    transform:translateY(1px);
  }

  .admin-btn {
    width:38px;
    height:38px;
    border-radius:var(--radius);
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.06);
    color:#fff;
    display:inline-grid;
    place-items:center;
    cursor:pointer;
  }

  /* Main layout */
  main {
    max-width:var(--page-max);
    margin:18px auto;
    padding:12px 20px;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - var(--header-height) - 36px);
    box-sizing:border-box;
    z-index:1;
    align-items:center;
  }

  .content-area {
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    align-items:center;
  }

  .welcome-center {
    text-align:center;
    margin-bottom:6px;
    width:100%;
  }

  .welcome-center h1 {
    margin:0;
    font-size:1.4rem;
    font-weight:900;
    letter-spacing:-0.3px;
    color:var(--text);
  }

  .welcome-center p {
    margin:6px 0 0;
    color:var(--muted);
    font-size:1rem;
  }

  /* Search row */
  .search-row {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin:8px 0 14px;
    justify-content:center;
    width:100%;
  }

  .search-input {
    width:100%;
    max-width:980px;
    padding:14px 16px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--text);
    font-weight:600;
    font-size:1rem;
    box-shadow:var(--shadow);
  }

  .search-input::placeholder {
    color:var(--muted);
  }

  /* loader under input for feedback */
  .search-loader {
    width:100%;
    max-width:980px;
    height:8px;
    border-radius:6px;
    overflow:hidden;
    background:linear-gradient(90deg, color-mix(in srgb, var(--primary) 10%, transparent), color-mix(in srgb, var(--primary) 5%, transparent));
    display:none;
  }

  .search-loader .bar {
    position:relative;
    left:-40%;
    width:36%;
    height:100%;
    background:linear-gradient(90deg, var(--primary), var(--primary-dark));
    animation:slide 1100ms linear infinite;
  }

  @keyframes slide {
    to {
      left:140%;
    }
  }

  /* tiles - use flex grid so partial bottom rows are centered */
  .grid-wrap {
    margin-top:8px;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.01));
    width:100%;
    box-sizing:border-box;
  }

  .grid {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    max-width:760px;
    margin:12px auto 0;
    align-items:stretch;
  }

  @media (min-width:1100px) {
    .grid {
      max-width:1200px;
    }
  }

  @media (max-width:900px) {
    .tile {
      flex:0 0 calc(50% - 8px);
      max-width:360px;
    }
  }

  @media (max-width:480px) {
    .tile {
      flex:0 0 100%;
      max-width:none;
    }
  }

  .tile {
    background:var(--card-bg);
    border-radius:var(--radius);
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    border:1px solid var(--line);
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
    min-height:60px;
    color:var(--text);
    flex:0 0 calc(33.333% - 8px);
    max-width:none;
    box-sizing:border-box;
  }

  .tile:active {
    transform:translateY(1px);
  }

  .tile .label {
    font-size:1rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 6px;
    text-align:center;
    width:100%;
  }

  /* the tiles come in together: a first visit holds the grid until the Nomad has said
     which optional pages it has (at most 1.2 s), then fades it in whole. A tile that
     changes after that fades in on its own */
  #tiles { transition: opacity .18s ease-out; }
  #tiles.tiles-wait { opacity: 0; }
  .tile.tile-in { animation: tileIn .22s ease-out; }
  @keyframes tileIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #tiles, .tile.tile-in { transition: none; animation: none; } }

  /* the title takes the row and wraps to two lines, at a weight that leaves room for the
     matched words in bold */
  #resultsPanel .meta { flex: 1 1 auto; }
  #resultsPanel .meta .title { font-weight: 500; white-space: normal; max-width: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-row b { font-weight: 800; color: var(--text); }
  @media (max-width: 640px) { #resultsPanel .result-path { display: none; } }
  a.result-row { color: inherit; text-decoration: none; }
  .result-more { padding: 10px 12px; color: var(--muted); font-size: .85rem; text-align: center; }

  /* search results panel */
  #resultsPanel {
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:150px;
    width:min(1200px, calc(100% - 36px));
    z-index:220;
    display:none;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow-large);
    border:1px solid var(--line);
    max-height:62vh;
    overflow:auto;
  }

  .result-row {
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    color:var(--text);
    transition: background 0.15s ease;
  }

  .result-row:hover {
    background: color-mix(in srgb, var(--primary) 5%, transparent);
  }

  .result-row:last-child {
    border-bottom:0;
  }

  .thumb {
    border-radius:8px;
    background:linear-gradient(180deg, rgba(0,0,0,0.03), transparent);
    display:grid;
    place-items:center;
    color:var(--muted);
    font-weight:700;
    overflow:hidden;
    flex:0 0 auto;
  }

  .thumb img {
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .thumb.rect {
    width:72px;
    height:108px;
    border-radius:8px;
  }

  .thumb.square {
    width:56px;
    height:56px;
    border-radius:8px;
  }

  .meta {
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
    margin-right:8px;
  }

  /* scoped to .meta so it doesnt clobber the header .brand .title (unscoped it made the brand title low-contrast) */
  .meta .title {
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:48ch;
    color:var(--text);
  }

  .sub {
    color:var(--muted);
    font-size:0.95rem;
  }

  .result-path {
    margin-left:auto;
    font-weight:700;
    color:var(--muted);
    font-size:0.95rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:40ch;
  }















  @media (max-width:640px) {
    /* header tweaks */
    header {
      padding:8px 10px;
    }

    .logo {
      height:36px;
      min-width:36px;
    }

    .logo img {
      max-height:28px;
    }

    /* Hide the textual title on small screens */
    .brand .title {
      display:none !important;
    }

    /* header buttons keep the larger touch size */
    .icon-btn {
      width:88px;
      height:48px;
      border-radius:10px;
      font-size:18px;
      padding:0 10px;
      justify-content:center;
      align-items:center;
      display:inline-flex;
      gap:6px;
    }

    .admin-btn {
      width:76px;
      height:44px;
      border-radius:10px;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      padding:0 8px;
    }

    .header-space {
      gap:10px;
    }

    /* Make the tile container use more of the screen */
    .grid {
      max-width:calc(100% - 28px);
      margin:12px 14px 0;
      justify-content:stretch;
      gap:12px;
    }

    /* Make tiles full-width on mobile */
    .tile {
      flex:0 0 100%;
      max-width:none;
      min-height:70px;
      padding:16px;
      font-size:1.05rem;
      box-sizing:border-box;
    }

    /* Results/resume adjustments */
    .welcome-center h1 {
      font-size:1.06rem;
    }

    #resultsPanel {
      top:190px;
      left:8px;
      transform:none;
      width:calc(100% - 16px);
    }




  }







  /* Continue: what this phone was on, newest first, one row that scrolls sideways */
  #resumePanel{margin:4px auto 0;width:calc(100% - 36px);box-sizing:border-box;max-width:760px;background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--line);
    padding:8px 12px;box-shadow:var(--shadow-medium);}
  #resumePanel[open]{padding-bottom:8px;}
  #resumePanel summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:28px;color:var(--text);user-select:none;}
  #resumePanel summary::-webkit-details-marker{display:none;}
  #resumePanel .rs-h{font-weight:800;font-size:.95rem;flex-shrink:0;}
  #resumePanel .rs-what{flex:1;min-width:0;text-align:left;color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #resumePanel .rs-chev{width:9px;height:9px;flex-shrink:0;margin-right:4px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s;}
  #resumePanel[open] .rs-chev{transform:rotate(-135deg) translateY(-1px);}
  #resumePanel[open] summary{margin-bottom:10px;}
  #resumePanel[open] .rs-what{visibility:hidden;}   /* open, the cards say it */
  .resume-list{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .resume-item{flex:0 0 124px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;
    background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;}
  .resume-thumb{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000));box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .resume-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .resume-thumb .rt-name{padding:10px;font-weight:800;font-size:.82rem;line-height:1.25;text-align:center;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .resume-item:hover .resume-thumb,.resume-item:focus-visible .resume-thumb{outline:2px solid var(--primary);outline-offset:2px;}
  .resume-item:focus-visible{outline:none;}
  .resume-kind{position:absolute;top:6px;left:6px;z-index:1;font-size:.64rem;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:999px;
    background:rgba(0,0,0,.62);color:#fff;}
  .resume-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);z-index:1;}
  .resume-bar i{display:block;height:100%;background:var(--primary);}
  .resume-title{font-weight:700;font-size:.84rem;line-height:1.25;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .resume-sub{font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px;}
  /* x to take it off the row: always there on a touch screen, on hover with a mouse */
  .resume-remove{position:absolute;top:4px;right:4px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;
    font-size:16px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;}
  @media (hover:hover){ .resume-remove{opacity:0;transition:opacity .15s;} .resume-item:hover .resume-remove,.resume-remove:focus-visible{opacity:1;} }
  @media (max-width:640px){ .resume-item{flex-basis:108px;} #resumePanel{width:calc(100% - 28px);padding:8px 10px;} }
</style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="false">
      <img src="/Logo.png" alt="Jcorp Nomad logo" onerror="this.style.display='none'">
    </div>
    <div style="min-width:0">
      <div class="title" aria-label="Application title">Jcorp Nomad</div>
    </div>
  </div>

  <div class="header-space">
    <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-pressed="false" aria-label="Toggle theme" data-icon="sun"></button>
    <button id="chatBtn" class="icon-btn" title="Chat" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="admin-btn" href="/admin" title="Admin panel" aria-label="Admin">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="currentColor" stroke-width="1.4"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82L4.31 4.9A2 2 0 017.14 2.07l.06.06c.5.5 1.16.76 1.82.76H9a1.65 1.65 0 001.51-1V1a2 2 0 014 0v.09c.14.6.62 1.09 1.22 1.33l.06.02a2 2 0 012.35-.34l.06.03a2 2 0 01.34 3.14l-.06.06c-.46.46-.66 1.15-.53 1.82h.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.2"/></svg>
    </a>
  </div>
</header>

<main>
  <div class="content-area">
    <div class="welcome-center">
      <h1>Jcorp Nomad</h1>
      <p>Your personal Media Library</p>
    </div>

    <div class="search-row" style="position:relative; z-index:210;">
      <input id="searchInput" class="search-input" placeholder="Search" aria-label="Search">
      <div id="searchLoader" class="search-loader" aria-hidden="true"><div class="bar"></div></div>
    </div>

    <div id="resultsPanel" role="list" aria-label="Search results"></div>

    <!-- Continue: a dropdown right under the search. Closed it's one line, what you were on
         last; open it's the row of everything in progress. -->
    <details id="resumePanel" style="display:none;">
      <summary><span class="rs-h">Continue</span><span class="rs-what" id="resumeWhat"></span><span class="rs-chev" aria-hidden="true"></span></summary>
      <div class="resume-list" id="resumeList"></div>
    </details>

    <div class="grid-wrap" aria-hidden="false">
      <div class="grid" role="navigation" aria-label="Categories" id="tiles">
        <a class="tile" href="/movies" data-bucket="Movies"><div class="label">Movies</div></a>
        <a class="tile" href="/shows" data-bucket="Shows"><div class="label">Shows</div></a>
        <a class="tile" href="/music" data-bucket="Music"><div class="label">Music</div></a>
        <a class="tile" href="/books" data-bucket="Books"><div class="label">Books</div></a>
        <a class="tile" href="/gallery" data-bucket="Gallery"><div class="label">Gallery</div></a>
        <a class="tile" href="/files" data-bucket="Files"><div class="label">Files</div></a>
        <a class="tile" href="/games" data-bucket="Games" style="display:none;"><div class="label">Games</div></a>
        <a class="tile" href="/maps" data-bucket="Maps" style="display:none;"><div class="label">Maps</div></a>
        <a class="tile" href="/archive" data-bucket="Archive" style="display:none;"><div class="label">Archive</div></a>
        <a class="tile" href="/translate" data-bucket="Translate" style="display:none;"><div class="label">Translate</div></a>
        <a class="tile" href="/cookbook" data-bucket="Cookbook" style="display:none;"><div class="label">Cookbook</div></a>
        <a class="tile" href="/workshop" data-bucket="Workshop" style="display:none;"><div class="label">Workshop</div></a>
      </div>
      <script>
      /* before the first paint: the tiles as they were last time (optional pages found, pages
         the admin hid), so a revisit draws the finished menu at once. A first visit has
         nothing to go on, so the grid waits for the answer instead of assembling itself. */
      (function(){
        var g = document.getElementById('tiles'), st = null, hidden = [];
        try { st = JSON.parse(localStorage.getItem('nomadMenuTiles.v1') || 'null'); hidden = JSON.parse(localStorage.getItem('nomadMenuHidden.v1') || '[]') || []; } catch(e){}
        if (!st) { g.classList.add('tiles-wait'); setTimeout(function(){ g.classList.remove('tiles-wait'); }, 1200); return; }
        var optional = { games: 1, maps: 1, archive: 1, translate: 1, cookbook: 1, workshop: 1 };
        g.querySelectorAll('.tile[data-bucket]').forEach(function(t){
          var k = t.dataset.bucket.toLowerCase();
          var show = (optional[k] ? !!st[k] : true) && hidden.indexOf(k) < 0;
          t.style.display = show ? '' : 'none';
        });
      })();
      </script>
    </div>
  </div>

</main>
<script>
/* ---------------- CONFIG ---------------- */
const INDEX_DIR = '/.system-index';
const BUCKETS = ['Movies','Shows','Music','Books','Gallery','Files','Games','Cookbook','Workshop'];
// buckets the admin turned off stay out of search results too
function activeBuckets(){
  return BUCKETS.filter(b => !isPageHidden(b.toLowerCase()));
}
const THEME_KEY = 'nomad_dark_mode';
const RE_VIDEO = /\.(mp4|mkv|avi|mov|ts|webm|m4v)$/i;
const RE_AUDIO = /\.(mp3|flac|wav|m4a|aac|ogg)$/i;
const RE_IMAGE = /\.(jpe?g|png|webp|gif|heic|avif)$/i;
const RE_BOOK  = /\.(pdf|epub|mobi|azw3|txt)$/i;

// debug logger
function debugLog(...args){
  try { console.debug('[NOMAD]', ...args); } catch(e){ }
}

/* ---------------- UI refs ---------------- */
const themeBtn = document.getElementById('themeBtn');
const searchInput = document.getElementById('searchInput');
const searchLoader = document.getElementById('searchLoader');
const resultsPanel = document.getElementById('resultsPanel');
const resumePanel = document.getElementById('resumePanel');
const resumeList = document.getElementById('resumeList');
const pageBg = document.querySelector('.page-bg');

// warm archives on first focus so theyre open by the time the user stops typing
searchInput.addEventListener('focus', () => {
  warmArchives();

/* Archive (ZIM) search: the PC-built sidecar index via NomadArchiveIndex, one small read per
   query instead of binary-searching the multi-GB ZIM. Archive hits go below media results;
   a card with no archives shows no trace of the feature. */

let __archiveIndex = null;      // NomadArchiveIndex instance
let __archiveIndexReady = null; // Promise: resolves to it, or null if no usable index
let __archivesPresent = false;  // "does the Archive folder have anything?" - set at boot

function loadScriptOnce(src) {
  loadScriptOnce._p = loadScriptOnce._p || {};
  if (!loadScriptOnce._p[src]) {
    loadScriptOnce._p[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res;
      s.onerror = () => { delete loadScriptOnce._p[src]; rej(new Error('failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }
  return loadScriptOnce._p[src];
}

/* load nomad-zim.js + the sidecar index once. null if no index or zero archives */
function getArchiveIndex() {
  if (__archiveIndexReady) return __archiveIndexReady;
  __archiveIndexReady = (async () => {
    try {
      await loadScriptOnce('/assets/nomad-zim.js?v=idx3');  // ?v defeats a stale cached copy
      const idx = new NomadZim.NomadArchiveIndex('/Archive/.nomad-zim');
      await idx.load();
      if (!idx.manifest || !idx.manifest.archives || !idx.manifest.archives.length) {
        debugLog('archive index has zero archives, treating as absent');
        return null;
      }
      __archiveIndex = idx;
      return idx;
    } catch (e) {
      debugLog('no archive index on card', String(e));
      return null;
    }
  })();
  // if the sidecar has archives, reveal the UI too (usually the boot probe already did).
  // never hides here - the boot probe owns tile visibility
  __archiveIndexReady.then(idx => { if (idx) applyArchiveUI(true); });
  return __archiveIndexReady;
}

/* pre-warm the index so the first query is instant. keep it on search focus, loading it
   at page load was tied to reboots right after the manifest fetch */
function warmArchives() { getArchiveIndex(); }

/* reveal/hide the Archive tile */
function applyArchiveUI(present) {
  const archiveTile = document.querySelector('.tile[data-bucket="Archive"]');
  if (!archiveTile) return;
  const show = present && !isPageHidden('archive'), was = archiveTile.style.display !== 'none';
  archiveTile.style.display = show ? '' : 'none';
  if (show && !was) { archiveTile.classList.remove('tile-in'); void archiveTile.offsetWidth; archiveTile.classList.add('tile-in'); }
}

/* Feature probes. Each answers true (present), false (absent) or null (unknown: SD
   busy or transient, worth retrying). They only report, bootMenuFeatures() applies
   everything in one pass so the menu doesnt assemble itself tile by tile. */

/* archive check - instead of loading the heavy sidecar (touches multi-GB
   files, tied to reboots) hit /api/archive-list, a cheap directory scan. */
async function probeArchive() {
  try {
    const res = await fetch('/api/archive-list', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      return !!(data && Array.isArray(data.archives) && data.archives.length);
    }
    return res.status === 503 ? null : false;
  } catch (e) {
    debugLog('archive-list probe failed', String(e));
    return null;
  }
}

/* games/maps checks, same cheap directory scan pattern. The Games tile reveals
   whenever /api/games-list answers at all: firmware that has it also has the
   /api/mp/* room store, so Play Together works with zero ROMs on the card.
   Maps needs at least one region with a manifest. */
async function probeGames() {
  try {
    const res = await fetch('/api/games-list', { cache: 'no-store' });
    if (res.ok) {
      // must be real JSON: old firmware answers unknown /api/* routes with the
      // captive portal HTML at 200, which would fake the tile into showing
      const data = JSON.parse(await res.text());
      return !!(data && Array.isArray(data.games));
    }
    return res.status === 503 ? null : false;
  } catch (e) { return null; }
}
async function probeMaps() {
  try {
    const res = await fetch('/api/maps-list', { cache: 'no-store' });
    if (res.ok) {
      const data = JSON.parse(await res.text());
      return !!(data && Array.isArray(data.regions) && data.regions.length);
    }
    return res.status === 503 ? null : false;
  } catch (e) { return null; }
}

/* translate check. no /api endpoint, so probe the pack manifest directly, a few
   hundred bytes. v2 manifests list "packs", v1 listed "pairs". */
async function probeTranslate() {
  try {
    const res = await fetch('/Translate/manifest.json', { cache: 'no-store' });
    if (res.ok) {
      const data = JSON.parse(await res.text());
      const list = (data && (data.packs || data.pairs)) || null;
      return !!(Array.isArray(list) && list.length);
    }
    return res.status === 503 ? null : false;   // 404 = no packs installed
  } catch (e) {
    debugLog('translate probe failed', String(e));
    return null;
  }
}

/* cookbook/workshop check: cheap /listfiles look at the folder. */
async function probeDirBucket(dir) {
  try {
    const res = await fetch('/listfiles?dir=' + encodeURIComponent(dir) + '&_=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const arr = JSON.parse(await res.text());
      return !!(Array.isArray(arr) && arr.length);
    }
    return res.status === 503 ? null : false;
  } catch (e) { return null; }
}

/* Query the index. Returns rows shaped for renderArchiveSection / onResultClick. */
async function archiveSearch(term, limit = 12) {
  const idx = await getArchiveIndex();
  if (!idx) return [];
  const hits = await idx.search(term, limit);
  return hits.map(h => ({
    title: h.title,
    bucket: 'Archive',
    subtype: 'zim',
    archive: h.archiveId,
    // deep link straight to the article by its known location - no lookup on open
    path: '/archive?a=' + h.archiveIdx + '&c=' + h.cluster + '&b=' + h.blob +
          '&t=' + encodeURIComponent(h.title),
    preview: null
  }));
}

/* appends archive hits as a "From Archive" section below media. data-zim-section
   lets performSearch swap it without touching the media results */
function renderArchiveSection(zrows, status) {
  resultsPanel.querySelectorAll('[data-zim-section]').forEach(n => n.remove());
  if ((!zrows || !zrows.length) && !status) return;

  const section = document.createElement('div');
  section.setAttribute('data-zim-section', '1');

  const hdr = document.createElement('div');
  hdr.style.padding = '10px 14px';
  hdr.style.borderBottom = '1px solid var(--line)';
  hdr.style.fontWeight = '800';
  hdr.style.color = 'var(--muted)';
  hdr.style.display = 'flex';
  hdr.style.justifyContent = 'space-between';
  hdr.innerHTML = '<span>From Archive</span>' +
    (status ? `<span style="font-weight:600;opacity:.75;">${status}</span>` : '');
  section.appendChild(hdr);

  for (const r of (zrows || [])) {
    const row = document.createElement('div'); row.className = 'result-row';
    const thumb = document.createElement('div'); thumb.className = 'thumb square';
    thumb.innerHTML = iconSVG('file');

    const meta = document.createElement('div'); meta.className = 'meta';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = r.title || '(untitled)';
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = friendlyDisplayName(r.archive || 'archive');
    meta.appendChild(title); meta.appendChild(sub);

    row.appendChild(thumb); row.appendChild(meta);
    row.addEventListener('click', ()=> onResultClick(r));
    section.appendChild(row);
  }

  resultsPanel.appendChild(section);
  resultsPanel.style.display = 'block';
}

    /* ---------------- UTIL ---------------- */
    /* Request deduplication cache to prevent spam */
    const __fetchCache = new Map();
    const __fetchInFlight = new Map();

    async function cachedFetch(url, timeoutMs = 3000) {
        // Return cached result if available (60s TTL instead of 5s)
        if (__fetchCache.has(url)) {
            const cached = __fetchCache.get(url);
            if (Date.now() - cached.ts < 60000) return cached.result; // 60 seconds
        }

        // Wait for in-flight request if one exists
        if (__fetchInFlight.has(url)) {
            return await __fetchInFlight.get(url);
        }

        // Make new request
        const promise = (async () => {
            try {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), timeoutMs);
                const r = await fetch(url, {
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Accept': 'text/plain, application/json, application/x-ndjson, */*' }
                });
                clearTimeout(tid);

                if (!r.ok) {
                    __fetchCache.set(url, { result: null, ts: Date.now() });
                    return null;
                }

                const ct = r.headers.get('content-type') || '';
                const text = await r.text();

                // Detect HTML fallback (server rewriting 404s to index.html)
                if (ct.includes('text/html') || text.trim().startsWith('<!DOCTYPE')) {
                    __fetchCache.set(url, { result: null, ts: Date.now() });
                    return null;
                }

                __fetchCache.set(url, { result: text, ts: Date.now() });
                return text;
            } catch (e) {
                __fetchCache.set(url, { result: null, ts: Date.now() });
                return null;
            } finally {
                __fetchInFlight.delete(url);
            }
        })();

        __fetchInFlight.set(url, promise);
        return promise;
    }
function basenameNoExt(n){ return (n||'').replace(/\.[^/.]+$/,''); }
function friendlyDisplayName(n){ return basenameNoExt((n||'').toString()).replace(/[_\.]+/g,' ').replace(/\s+/g,' ').trim(); }
// a folder has no extension to drop: "Mr. Robot" stays whole (friendlyDisplayName would make it "Mr")
function folderDisplayName(p){ return String(p || '').split('/').filter(Boolean).pop().replace(/_+/g,' ').replace(/\s+/g,' ').trim(); }
function parseNdjson(text){ if(!text) return []; return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } }).filter(Boolean); }
    async function tryFetchText(url, timeoutMs = 2000) {
        return await cachedFetch(url, timeoutMs);
    }

    async function tryFetchJSON(url, timeoutMs = 2000) {
        const text = await cachedFetch(url, timeoutMs);
        if (!text) return null;
        try { return JSON.parse(text); } catch { return null; }
    }

/* ---------------- CLASSIFY ---------------- */
function classifyEntry(obj, parentBucket){
  const name = (obj.n||obj.name||'').toString();
  let path = (obj.path||obj.p||'') || (parentBucket ? `/${parentBucket}/${name}` : name);
  path = normalizePath(path);
  if(obj._type === 'dir' || obj.t === 'd') return { kind:'dir', name, path, raw: obj };
  if(RE_VIDEO.test(name) || RE_VIDEO.test(path)) return { kind:'file', subtype:'video', name, path, raw: obj };
  if(RE_AUDIO.test(name) || RE_AUDIO.test(path)) return { kind:'file', subtype:'audio', name, path, raw: obj };
  if(RE_IMAGE.test(name) || RE_IMAGE.test(path)) return { kind:'file', subtype:'image', name, path, raw: obj };
  if(RE_BOOK.test(name) || RE_BOOK.test(path)) return { kind:'file', subtype:'book', name, path, raw: obj };
  return { kind:'file', subtype:'other', name, path, raw: obj };
}

/* ---------------- SEARCH INDEX ---------------- */
let searchIndexCache = null;
let previewByPath = new Map();
let previewByBaseDir = new Map();

/* Deterministic fallback for preview images  */
function previewPathFromItemPath(itemPath){
  if(!itemPath) return null;
  const p = normalizePath(itemPath);
  const low = p.toLowerCase();

  if(low.startsWith('/movies/')){
    const filename = p.split('/').pop() || '';
    const base = basenameNoExt(filename);
    return `/Movies/${encodeURIComponent(base)}.jpg`;
  }
  if(low.startsWith('/books/')){
    const filename = p.split('/').pop() || '';
    const base = basenameNoExt(filename);
    return `/Books/${encodeURIComponent(base)}.jpg`;
  }
  if(low.startsWith('/shows/')){
    const parts = p.split('/').filter(Boolean);
    if(parts.length >= 2){
      const showName = parts[1];
      return `/Shows/${encodeURIComponent(showName)}.jpg`;
    }
  }
  if(RE_IMAGE.test(p)) return p;
  return null;
}

/* Builds the search index and preview maps (concurrent fetches) */
async function buildSearchIndex(forceRebuild = false){
  if(!forceRebuild && searchIndexCache && searchIndexCache.entries) return searchIndexCache.entries;

  // Built from the Nomad's own folder indexes every time. Don't save a copy to the card,
  // nothing would check it against the library. Unchanged folder indexes come back as
  // 304s from the browser's cache.

  // Prevent multiple simultaneous builds
  if (buildSearchIndex._building) {
    return buildSearchIndex._building;
  }

  buildSearchIndex._building = (async () => {
    try {
      previewByPath = new Map();
      previewByBaseDir = new Map();
      const LIVE_BUCKETS = activeBuckets();
      const byBucket = {};
      for(const b of BUCKETS) byBucket[b] = [];

      const fetchPromises = LIVE_BUCKETS.map(b => {
        const idxUrl = `${INDEX_DIR}/${b}.index.ndjson`;
        return fetch(idxUrl, { cache: 'no-cache' })
          .then(r => r.ok ? r.text() : '')
          .catch(() => '')
          .then(txt => ({ bucket: b, txt: /^\s*</.test(txt) ? '' : txt }));
      });
      const settled = await Promise.allSettled(fetchPromises);
      for(const res of settled){
        if(res.status !== 'fulfilled') continue;
        const { bucket, txt } = res.value || {};
        if(!bucket) continue;
        const arr = parseNdjson(txt || '');
        for(const obj of arr){
          if(!obj) continue;
          const c = classifyEntry(obj, bucket);
          if(!c) continue;
          byBucket[bucket].push(c);
        }
      }

        // An index that already lists what is inside its folders needs no per-folder files.
        // Asking for them anyway is two missing files per folder, hundreds of requests on a
        // full card.
        const nestedFetches = [];
        for (const b of ['Shows', 'Music', 'Gallery']) {
            const deep = (byBucket[b] || []).some(c => (c.path || '').split('/').length > 3);
            if (deep) continue;
            for (const c of (byBucket[b] || [])) {
                if (c.kind === 'dir') {
                    const candidate = `${INDEX_DIR}${c.path}.index.ndjson`.replace('//', '/');
                    nestedFetches.push({ url: candidate, bucket: b, parentDir: c.path });
                    const encoded = c.path.replace(/^\//, '').replace(/\//g, '__');
                    nestedFetches.push({ url: `${INDEX_DIR}/${encoded}.index.ndjson`, bucket: b, parentDir: c.path });
                }
            }
        }

        // Fetch with concurrency limit (3 at a time, 2s timeout each)
        const nestedResults = [];
        const concurrency = 3;
        for (let i = 0; i < nestedFetches.length; i += concurrency) {
            const batch = nestedFetches.slice(i, i + concurrency);
            const batchPromises = batch.map(async ({ url, bucket, parentDir }) => {
                const text = await tryFetchText(url, 2000); // 2s timeout
                return { bucket, parentDir, text };
            });
            const settled = await Promise.allSettled(batchPromises);
            nestedResults.push(...settled.filter(r => r.status === 'fulfilled').map(r => r.value));
        }
        const nestedSettled = nestedResults;
      for (const data of nestedSettled) {
        if(!data || !data.text) continue;
        const narr = parseNdjson(data.text || '');
        for(const n of narr){
          if(!n) continue;
          const c2 = classifyEntry(n, data.bucket);
          if(!c2) continue;
          c2.parentDir = data.parentDir;
          byBucket[data.bucket].push(c2);
        }
      }

      const entries = [];
      function combineMap(list, bucketName){
        const map = new Map();
        for(const it of list){
          if(it.kind !== 'file') continue;
          const base = basenameNoExt(it.name || it.path.split('/').pop() || '');
          const key = base.toLowerCase();
          if(!map.has(key)) map.set(key, { base, files: [], preview: null, dirs: new Set() });
          map.get(key).files.push(it);
          if(it.path) map.get(key).dirs.add((it.path.replace(/\/[^/]+$/,'') || '').toLowerCase());
          if(it.subtype === 'image' && !map.get(key).preview) map.get(key).preview = it.path;
        }
        for(const [k,v] of map.entries()){
          const video = v.files.find(x => x.subtype === 'video');
          const book  = v.files.find(x => x.subtype === 'book');
          const audio = v.files.find(x => x.subtype === 'audio');
          if(video){
            entries.push({ title: friendlyDisplayName(video.name), bucket: bucketName, subtype:'video', path: video.path, preview: v.preview || null, raw: video.raw });
          } else if(book){
            entries.push({ title: friendlyDisplayName(book.name), bucket: bucketName, subtype:'book', path: book.path, preview: v.preview || null, raw: book.raw });
          } else if(audio && bucketName === 'Music'){
            entries.push({ title: friendlyDisplayName(audio.name), bucket: bucketName, subtype:'audio', path: audio.path, preview:null, raw: audio.raw });
          } else {
            if(bucketName !== 'Movies' && bucketName !== 'Books'){
              const anyFile = v.files[0];
              if(anyFile) entries.push({ title: friendlyDisplayName(anyFile.name || anyFile.path), bucket:bucketName, subtype:anyFile.subtype||'file', path:anyFile.path, preview:v.preview||null, raw:anyFile.raw });
            }
          }
        }
      }

      combineMap(byBucket['Movies'] || [], 'Movies');

      (function(){
        const seriesMap = new Map();
        for(const it of (byBucket['Shows']||[])){
          if(it.kind === 'dir'){
            const key = (it.path || '').toLowerCase();
            if(!seriesMap.has(key)) seriesMap.set(key, { title: it.name || it.path, preview: null, dir: it.path });
          } else if(it.kind === 'file'){
            const parent = (it.parentDir || (it.path.split('/').slice(0,-1).join('/')) || '').toLowerCase();
            const key = parent || basenameNoExt(it.name).toLowerCase();
            if(!seriesMap.has(key)) seriesMap.set(key, { title: it.parentDir || it.name || key, preview: null, dir: it.parentDir || '' });
            if(it.subtype === 'image' && it.parentDir){
              const s = seriesMap.get(key);
              if(s && !s.preview) s.preview = it.path;
            }
          }
        }
        for(const [k,v] of seriesMap.entries()){
          entries.push({ title: folderDisplayName(v.title) || friendlyDisplayName(v.title), bucket:'Shows', subtype:'series', path: v.dir, preview: v.preview || null });
        }
      })();

      combineMap(byBucket['Books'] || [], 'Books');

      (function(){
        const seen = new Set();
        for(const g of (byBucket['Gallery']||[])){
          if(g.kind !== 'file') continue;
          const subtype = g.subtype || (RE_VIDEO.test(g.path)?'video':(RE_IMAGE.test(g.path)?'image':'other'));
          const dir = (g.path||'').replace(/\/[^/]+$/,'').toLowerCase();
          const base = basenameNoExt(g.name||g.path).toLowerCase();
          const key = `${base}|${dir}|${subtype}`;
          if(seen.has(key)) continue;
          seen.add(key);
          entries.push({ title: friendlyDisplayName(g.name||g.path), bucket:'Gallery', subtype, path: g.path, preview: subtype==='image'?g.path:null, raw:g.raw });
        }
      })();

      (function(){
        const seen = new Set();
        for(const m of (byBucket['Music']||[])){
          if(m.kind !== 'file' || m.subtype !== 'audio') continue;
          const dir = (m.path||'').replace(/\/[^/]+$/,'').toLowerCase();
          const base = basenameNoExt(m.name).toLowerCase();
          const key = `${base}|${dir}`;
          if(seen.has(key)) continue;
          seen.add(key);
          entries.push({ title: friendlyDisplayName(m.name), bucket:'Music', subtype:'audio', path: m.path, preview:null, raw:m.raw });
        }
      })();

      (function(){
        const seen = new Set();
        for(const f of (byBucket['Files']||[])){
          if(f.kind !== 'file') continue;
          const dir = (f.path||'').replace(/\/[^/]+$/,'').toLowerCase();
          const base = basenameNoExt(f.name).toLowerCase();
          const key = `${base}|${dir}`;
          if(seen.has(key)) continue;
          seen.add(key);
          entries.push({ title: friendlyDisplayName(f.name), bucket:'Files', subtype:'file', path: f.path, preview:null, raw:f.raw });
        }
      })();

      // Games: built-in .html games and ROMs. Sidecar images are cover art,
      // not results. Cookbook: recipe files. Workshop: printable models.
      (function(){
        const RECIPE_RE = /\.(md|cook|json)$/i;
        const MODEL_RE  = /\.(stl|obj|3mf|gcode|bgcode|gco|amf|ply|step|stp|scad|f3d|sldprt|ipt|blend|3ds|dae|dxf|svg|zip)$/i;
        for(const g of (byBucket['Games']||[])){
          if(g.kind !== 'file' || g.subtype === 'image') continue;
          const isHtml = /\.html?$/i.test(g.name);
          entries.push({ title: friendlyDisplayName(g.name), bucket:'Games',
                         subtype: isHtml ? 'game' : 'rom', path: g.path, preview:null, raw:g.raw });
        }
        for(const r of (byBucket['Cookbook']||[])){
          if(r.kind !== 'file' || !RECIPE_RE.test(r.name)) continue;
          if(/^readme\./i.test(r.name)) continue;
          entries.push({ title: friendlyDisplayName(r.name), bucket:'Cookbook',
                         subtype:'recipe', path: r.path, preview:null, raw:r.raw });
        }
        for(const w of (byBucket['Workshop']||[])){
          if(w.kind !== 'file' || !MODEL_RE.test(w.name)) continue;
          entries.push({ title: friendlyDisplayName(w.name), bucket:'Workshop',
                         subtype:'model', path: w.path, preview:null, raw:w.raw });
        }
      })();

      function addMissingFilesFromBucket(bucketName){
        const list = byBucket[bucketName] || [];
        for(const it of list){
          if(it.kind !== 'file') continue;
          if(it.subtype === 'image') continue;
          const norm = normalizePath(it.path || '');
          if(entries.some(e => e.path && normalizePath(e.path) === norm && (e.bucket || '').toLowerCase() === bucketName.toLowerCase())) continue;
          entries.push({
            title: friendlyDisplayName(it.name || it.path || ''),
            bucket: bucketName,
            subtype: it.subtype || 'file',
            path: it.path,
            preview: null,
            raw: it.raw
          });
        }
      }
      addMissingFilesFromBucket('Movies');
      addMissingFilesFromBucket('Books');

      for(const e of entries){
        if(!e.path) continue;
        const p = (e.path || '').toLowerCase();
        if(p.includes('/movies/')) e.bucket = 'Movies';
        else if(p.includes('/shows/')) e.bucket = 'Shows';
        else if(p.includes('/books/')) e.bucket = 'Books';
        else if(p.includes('/gallery/')) e.bucket = 'Gallery';
        else if(p.includes('/music/')) e.bucket = 'Music';
        else if(p.includes('/games/')) e.bucket = 'Games';
        else if(p.includes('/cookbook/')) e.bucket = 'Cookbook';
        else if(p.includes('/workshop/')) e.bucket = 'Workshop';
        else if(!e.bucket) e.bucket = 'Files';
      }

      for(const b of ['Movies','Books','Games','Cookbook','Workshop']){
        for(const it of (byBucket[b]||[])){
          if(it.kind === 'file' && it.subtype === 'image' && it.path){
            const dir = (it.path || '').replace(/\/[^/]+$/,'').toLowerCase();
            const base = basenameNoExt(it.name || it.path).toLowerCase();
            const k = `${base}|${dir}`;
            if(!previewByBaseDir.has(k)) previewByBaseDir.set(k, it.path);
          }
        }
      }

      const finalMap = new Map();
      for(const e of entries){
        if(!e.path) continue;
        const norm = normalizePath(e.path);
        if((e.bucket === 'Movies' || e.bucket === 'Books' || e.bucket === 'Games' ||
            e.bucket === 'Cookbook' || e.bucket === 'Workshop') && RE_IMAGE.test(norm)) continue;
        if(!finalMap.has(norm)){
          if(!e.preview){
            const dir = (e.path || '').replace(/\/[^/]+$/,'').toLowerCase();
            const base = basenameNoExt(e.title || e.path || '').toLowerCase();
            const k = `${base}|${dir}`;
            if(previewByBaseDir.has(k)) e.preview = previewByBaseDir.get(k);
            else e.preview = previewPathFromItemPath(e.path) || null;
          }
          finalMap.set(norm, e);
        } else {
          const existing = finalMap.get(norm);
          if(!existing.preview && e.preview) existing.preview = e.preview;
          if(!existing.bucket && e.bucket) existing.bucket = e.bucket;
          if((!existing.title || existing.title === '(untitled)') && e.title) existing.title = e.title;
        }
      }

      const finalEntries = Array.from(finalMap.values());

      for(const e of finalEntries){
        if(e.path){
          const norm = normalizePath(e.path);
          const fallback = e.preview || previewPathFromItemPath(e.path) || null;
          previewByPath.set(norm, fallback);
          const dir = (e.path || '').replace(/\/[^/]+$/,'').toLowerCase();
          const base = basenameNoExt(e.title || (e.path||'')).toLowerCase();
          const k = `${base}|${dir}`;
          if(!previewByBaseDir.has(k) && fallback) previewByBaseDir.set(k, fallback);
        }
      }

      for (const e of finalEntries) { delete e.raw; prepareForSearch(e); }
      searchIndexCache = { entries: finalEntries, ts: Date.now() };
      console.info('Search index built:', finalEntries.length);
      return finalEntries;
    } finally {
      delete buildSearchIndex._building;
    }
  })();
  
  return buildSearchIndex._building;
}

/* icon helpers */
function iconSVG(kind){
  if(kind === 'audio') return '<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M9 17a2 2 0 100-4 2 2 0 000 4z" fill="currentColor"/><path d="M9 15V5l10-2v10" stroke="currentColor" stroke-width="1.6"/></svg>';
  if(kind === 'file') return '<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.6"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6"/></svg>';
  if(kind === 'video') return '<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M23 7l-7 5 7 5V7z" fill="currentColor"/><rect x="1" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/></svg>';

// Continue, from NomadProgress (nomad-utils.js). A show keeps only the episode you're on,
// and finished things drop off.
const CONTINUE_MAX = 10;
const KIND_NAMES = { film: 'Film', episode: 'Show', epub: 'Book', pdf: 'PDF', comic: 'Comic', audio: 'Audiobook' };

function continueTitle(e){
  const parts = normalizePath(e.path).split('/').filter(Boolean);
  const file = basenameNoExt(parts[parts.length - 1] || '').replace(/[_.]+/g, ' ').trim();
  if(e.k === 'episode'){
    const m = /S(\d+)\s*E(\d+)/i.exec(file);
    return { title: parts[1] || file, sub: m ? `S${+m[1]} E${+m[2]}` : file };
  }
  if(e.k === 'audio' && parts.length > 3) return { title: e.t || parts[parts.length - 2], sub: '' };
  return { title: e.t || file.replace(/\s*\(\d{4}\)\s*$/, ''), sub: '' };
}
function continueUrl(e){
  const p = encodeURIComponent(e.path);
  switch(e.k){
    case 'film': return `/movies#play=${p}`;
    case 'episode': return `/shows#play=${p}`;
    case 'epub': return `/epub.html?path=${p}`;
    case 'pdf': return `/pdf.html?path=${p}`;
    case 'comic': return `/comics.html?path=${p}`;
    case 'audio': return `/books#play=${p}`;
    default: return null;
  }
}
// the poster or cover the search index found for it, an image named like it in its folder,
// or the usual place for one (/Movies/<name>.jpg, /Shows/<show>.jpg, /Books/<name>.jpg)
function continuePreview(e){
  const norm = normalizePath(e.path);
  if(previewByPath.get(norm)) return previewByPath.get(norm);
  const dir = (norm.replace(/\/[^/]+$/, '') || '').toLowerCase();
  const k = `${basenameNoExt(norm.split('/').pop() || '').toLowerCase()}|${dir}`;
  return previewByBaseDir.get(k) || previewPathFromItemPath(norm);
}

const CONTINUE_OPEN_KEY = 'nomad:menu:continueOpen:v1';
function renderResume(){
  resumeList.innerHTML = '';
  let items = [];
  try { items = NomadProgress.recent({ limit: CONTINUE_MAX }).filter(e => continueUrl(e)); } catch(err){}
  if(!items.length){ resumePanel.style.display = 'none'; return; }
  for(const e of items) resumeList.appendChild(makeResumeNode(e));
  // closed, the line says what you were on last (and how many more)
  const first = continueTitle(items[0]);
  const more = items.length > 1 ? ` and ${items.length - 1} more` : '';
  document.getElementById('resumeWhat').textContent = [first.title, first.sub].filter(Boolean).join(' ') + more;
  resumePanel.open = NomadPrefs.get(CONTINUE_OPEN_KEY, false) === true;

}
// open or closed is kept per phone
resumePanel.addEventListener('toggle', () => NomadPrefs.set(CONTINUE_OPEN_KEY, resumePanel.open));

function makeResumeNode(e){
  const { title, sub } = continueTitle(e);
  const how = [sub, e.l || (e.p != null ? Math.round(e.p * 100) + '%' : '')].filter(Boolean).join(' · ');
  const node = document.createElement('div');
  node.className = 'resume-item';
  node.setAttribute('role', 'link');
  node.tabIndex = 0;
  node.title = title + (how ? ' · ' + how : '');

  const thumb = document.createElement('div'); thumb.className = 'resume-thumb';
  const name = document.createElement('div'); name.className = 'rt-name'; name.textContent = title;
  thumb.appendChild(name);
  const preview = continuePreview(e);
  if(preview){
    const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = preview;
    img.onload = () => { name.style.visibility = 'hidden'; };
    img.onerror = () => img.remove();
    thumb.appendChild(img);
  }
  const kind = document.createElement('span'); kind.className = 'resume-kind'; kind.textContent = KIND_NAMES[e.k] || '';
  thumb.appendChild(kind);
  if(e.p != null){
    const bar = document.createElement('div'); bar.className = 'resume-bar';
    const fill = document.createElement('i'); fill.style.width = Math.max(3, Math.round(e.p * 100)) + '%';
    bar.appendChild(fill); thumb.appendChild(bar);
  }

  const t = document.createElement('div'); t.className = 'resume-title'; t.textContent = title;
  const s = document.createElement('div'); s.className = 'resume-sub'; s.textContent = how;

  const removeBtn = document.createElement('button');
  removeBtn.className = 'resume-remove';
  removeBtn.textContent = '×';
  removeBtn.title = 'Take off Continue';
  removeBtn.setAttribute('aria-label', 'Take ' + title + ' off Continue');
  removeBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    try { NomadProgress.clear(e.path); } catch(err){}
    renderResume();
  });

  node.append(thumb, t, s, removeBtn);
  const open = () => { const url = continueUrl(e); if(url) location.href = url; };
  node.addEventListener('click', open);
  node.addEventListener('keydown', (ev) => { if(ev.key === 'Enter'){ ev.preventDefault(); open(); } });
  return node;
}

/* ---------------- SEARCH UI & Logic ---------------- */
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function shortenPath(p){ if(!p) return ''; const parts = p.split('/'); if(parts.length <= 3) return p; return '…' + parts.slice(-3).join('/'); }
function debounce(func, wait, immediate) {
  let timeout, lastCallTime = 0;
  return function executedFunction(...args) {
    const context = this;
    const now = Date.now();
    
    // Prevent excessive calls
    if (now - lastCallTime < wait) {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        lastCallTime = Date.now();
        func.apply(context, args);
      }, wait);
      return;
    }
    
    lastCallTime = now;
    clearTimeout(timeout);
    
    if (immediate && !timeout) {
      func.apply(context, args);
    } else {
      timeout = setTimeout(() => {
        func.apply(context, args);
      }, wait);
    }
  };
}
const RESULTS_SHOWN = 60;
// the title with what was typed in bold (matched without accents, shown as written)
function highlightTitle(text, tokens){
  const plain = String(text);
  if (!tokens || !tokens.length) return escapeHtml(plain);
  const folded = plain.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // NFD can lengthen a string, so only highlight when positions still line up
  if (folded.length !== plain.length) return escapeHtml(plain);
  const marks = new Array(plain.length).fill(false);
  for (const tok of tokens) {
    let i = -1;
    while ((i = folded.indexOf(tok, i + 1)) >= 0) {
      if (i === 0 || !/[a-z0-9]/.test(folded[i - 1])) { for (let k = i; k < i + tok.length; k++) marks[k] = true; break; }
    }
  }
  let out = '', open = false;
  for (let i = 0; i < plain.length; i++) {
    if (marks[i] !== open) { out += marks[i] ? '<b>' : '</b>'; open = marks[i]; }
    out += escapeHtml(plain[i]);
  }
  return out + (open ? '</b>' : '');
}
function renderResults(rows, q, tokens, shortcuts){
  resultsPanel.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const sc of (shortcuts || [])) {
    const row = document.createElement('a'); row.className = 'result-row result-page'; row.href = sc.href;
    row.innerHTML = `<div class="thumb square">${iconSVG('file')}</div><div class="meta"><div class="title">Open ${escapeHtml(sc.label)}</div><div class="sub">Page</div></div>`;
    frag.appendChild(row);
  }
  if(!rows || rows.length === 0){
    if (!frag.childNodes.length) {
      resultsPanel.innerHTML = `<div style="padding:12px;color:var(--muted)">No results for <strong>${escapeHtml(q)}</strong></div>`;
    } else resultsPanel.appendChild(frag);
    resultsPanel.style.display = 'block';
    return;
  }
  for(const r of rows.slice(0, RESULTS_SHOWN)){
    const row = document.createElement('div'); row.className = 'result-row';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    const bucket = (r.bucket||'').toLowerCase();
    const subtype = r.subtype || '';

    let preview = r.preview || null;
    if(!preview){
      const norm = normalizePath(r.path || '');
      if(previewByPath.has(norm)) preview = previewByPath.get(norm);
    }
    if(!preview){
      const dir = ((r.path||'').replace(/\/[^/]+$/,'') || '').toLowerCase();
      const base = basenameNoExt((r.title||r.path||'')).toLowerCase();
      const k = `${base}|${dir}`;
      if(previewByBaseDir.has(k)) preview = previewByBaseDir.get(k);
    }
    if(!preview) preview = previewPathFromItemPath(r.path || '');

    if(bucket === 'movies' || bucket === 'shows' || bucket === 'books' || bucket === 'games'){
      thumb.classList.add('rect');
      const img = document.createElement('img');
      if(preview){
        img.src = preview;
        img.alt = r.title || '';
        img.loading = 'lazy';
        img.onerror = ()=> { img.style.display='none'; thumb.innerHTML = iconSVG(subtype === 'audio' ? 'audio' : (subtype === 'video' ? 'video' : 'file')); };
        thumb.appendChild(img);
      } else {
        thumb.innerHTML = iconSVG(subtype === 'video' ? 'video' : 'file');
      }
    } else if(bucket === 'gallery' || bucket === 'cookbook' || bucket === 'workshop'){
      thumb.classList.add('square');
      if(preview){
        const img = document.createElement('img'); img.src = preview; img.alt = r.title || ''; img.loading='lazy';
        img.onerror = ()=> { img.style.display='none'; thumb.innerHTML = iconSVG('file'); };
        thumb.appendChild(img);
      } else {
        thumb.innerHTML = iconSVG('file');
      }
    } else {
      thumb.classList.add('square');
      if(bucket === 'music') thumb.innerHTML = iconSVG('audio');
      else if(bucket === 'files') thumb.innerHTML = iconSVG('file');
      else if(subtype === 'video') thumb.innerHTML = iconSVG('video');
      else thumb.innerHTML = iconSVG('file');
    }

    const meta = document.createElement('div'); meta.className = 'meta';
    const title = document.createElement('div'); title.className = 'title'; title.innerHTML = highlightTitle(r.title || friendlyDisplayName(r.path) || '(untitled)', tokens);
    const sub = document.createElement('div'); sub.className = 'sub';
    const ext = (r.path || '').split('.').pop() || '';
    let subTxt = (r.bucket || '');
    if(ext && ext.length <= 4) subTxt += ` • .${ext}`;
    sub.textContent = subTxt;
    meta.appendChild(title); meta.appendChild(sub);

    const pathDiv = document.createElement('div'); pathDiv.className = 'result-path'; pathDiv.textContent = shortenPath(r.path);
    row.appendChild(thumb); row.appendChild(meta); row.appendChild(pathDiv);
    row.addEventListener('click', ()=> onResultClick(r));
    row._item = r;
    frag.appendChild(row);
  }
  if (rows.length > RESULTS_SHOWN) {
    const more = document.createElement('div'); more.className = 'result-more';
    more.textContent = `Showing ${RESULTS_SHOWN} of ${rows.length}`;
    frag.appendChild(more);
  }
  resultsPanel.appendChild(frag);
  resultsPanel.style.display = 'block';
}

// Lower case, accents off, punctuation as spaces: "Pokémon", "Spider-Man" and "AC/DC"
// match "pokemon", "spider man" and "ac dc".
function normForSearch(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
}
// the folders an entry sits in, below its section: artist and album, a show, a gallery folder
function contextOf(e){
  const parts = String(e.path || '').split('/').filter(Boolean);
  return parts.slice(1, -1).join(' ');
}
function prepareForSearch(e){
  e._t = normForSearch(e.title);
  e._tc = e._t.replace(/ /g, '');
  e._w = e._t.split(' ');
  e._c = normForSearch(e.bucket === 'Shows' ? '' : contextOf(e));
}
// one letter wrong, missing, extra, or two swapped
function nearlyEqual(a, b){
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  if (i === a.length && i === b.length) return true;
  return a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i)
    || (a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2));
}
// How well an entry answers the query: 0 is no match. Title over the folders it is in.
// Whole title, then its start, then words starting with what was typed, in any order.
function scoreEntry(e, qn, qt, qc){
  if (!e._t) prepareForSearch(e);
  const t = e._t;
  if (t === qn) return 1000;
  if (t.startsWith(qn)) return 900 - Math.min(t.length, 99);
  const wordStart = (tok) => e._w.some(w => w.startsWith(tok));
  if (qt.every(wordStart)) return 700 - Math.min(e._w.length, 50);
  if (qc.length >= 4 && e._tc.includes(qc)) return 600;          // "spiderman", "acdc"
  if (qt.every(tok => t.includes(tok))) return 500;
  // some words in the title, the rest in the folders: "abba waterloo"
  if (qt.every(tok => wordStart(tok) || e._c.includes(tok))) return qt.some(wordStart) ? 400 : 300;
  // a slip of the finger in a longer word
  if (qt.every(tok => wordStart(tok) || (tok.length >= 5 && e._w.some(w => nearlyEqual(tok, w.slice(0, tok.length + 1)) || nearlyEqual(tok, w)))))
    return 200;
  return 0;
}
const BUCKET_ORDER = { Movies:0, Shows:1, Music:2, Books:3, Gallery:4, Games:5, Cookbook:6, Workshop:7, Files:8 };
// the pages themselves, so "maps" or "translate" opens one
function pageShortcuts(qn){
  if (qn.length < 2) return [];
  return [...document.querySelectorAll('#tiles .tile')]
    .filter(t => t.style.display !== 'none' && normForSearch(t.textContent).startsWith(qn))
    .map(t => ({ label: t.textContent.trim(), href: t.getAttribute('href') }));
}

// media results first, the archive section after
let buildPromise = null;
let __searchToken = 0;
async function performSearch(q){
  const term = (q||'').trim();
  if(!term){ resultsPanel.style.display = 'none'; resultsPanel.innerHTML=''; return []; }
  const myToken = ++__searchToken;

  // Build media index and search
  let mediaResults = [];
  try {
    searchLoader.style.display = 'block';
    if(!buildPromise) buildPromise = buildSearchIndex();
    const idx = await buildPromise;
    if (myToken !== __searchToken) return [];          // a newer keystroke took over
    const qn = normForSearch(term);
    const qt = qn ? qn.split(' ') : [];
    const qc = qt.join('');
    if (qt.length) {
      for(const e of idx){
        const sc = scoreEntry(e, qn, qt, qc);
        if (sc) mediaResults.push({ e, sc });
      }
    }
    mediaResults.sort((a, b) => b.sc - a.sc
      || (BUCKET_ORDER[a.e.bucket] ?? 9) - (BUCKET_ORDER[b.e.bucket] ?? 9)
      || (a.e.title || '').length - (b.e.title || '').length);
    mediaResults = mediaResults.map(r => r.e);

    // render only the media results immediately
    renderResults(mediaResults, q, qt, pageShortcuts(qn));
  } catch (e) {
    console.error('media search fail', e);
    resultsPanel.innerHTML = `<div style="padding:12px;color:darkred">Search error</div>`;
    resultsPanel.style.display = 'block';
  } finally {
    searchLoader.style.display = 'none';
  }

  // archive results below media, which is never reordered. The archive query is a couple
  // of tiny reads, and a newer keystroke abandons this run
  const stillCurrent = () => myToken === __searchToken;
  try {
    const idx = await getArchiveIndex();
    if (idx && stillCurrent()) {
      renderArchiveSection([], 'Searching…');
      const zrows = await archiveSearch(term, 12);
      if (stillCurrent()) {
        renderArchiveSection(zrows, zrows.length ? null : 'No matches');
      }
    }
  } catch (e) {
    console.warn('archive search failed', e);
    // show the failure instead of hanging on "Searching…"
    const msg = /abort/i.test(String(e && e.name) + String(e && e.message)) ? 'Timed out' : 'Search error';
    if (stillCurrent()) renderArchiveSection([], msg);
  }

  return mediaResults;
}

// books and documents open in Nomad's own readers, wherever they are on the card
const READER_FOR = [
  [/\.epub$/i, (p) => `/epub.html?path=${p}`],
  [/\.pdf$/i, (p) => `/pdf.html?path=${p}`],
  [/\.(cbz|cbr|cb7)$/i, (p) => `/comics.html?path=${p}`],
  [/\.(docx|docm|dotx|odt|ott|pptx|pptm|ppsx|potx|odp|otp|xlsx|xlsm|xltx|ods|ots|csv|tsv|md|markdown|txt|log|rtf|gdoc|gsheet|gslides|doc|xls|ppt|pps)$/i, (p) => `/docview.html?file=${p}`],
];
function readerUrlFor(path){
  const hit = READER_FOR.find(([re]) => re.test(path));
  return hit ? hit[1](encodeURIComponent(normalizePath(path))) : null;
}

function onResultClick(item){
  const p = item.path || '';
  if(item.bucket === 'Files' || item.bucket === 'Books'){
    const reader = readerUrlFor(p);
    if(reader){ window.location.href = reader; return; }
    // audiobooks play on the Books page. anything else in Files opens there, in its folder
    if(item.bucket === 'Books' && RE_AUDIO.test(p)){ window.location.href = `/books#play=${encodeURIComponent(p)}`; return; }
    window.location.href = item.bucket === 'Books' ? '/books' : `/files#open=${encodeURIComponent(p)}`;
    return;
  }
  if(item.bucket === 'Movies'){ window.location.href = `/movies#open=${encodeURIComponent(p)}`; return; }
  if(item.bucket === 'Shows'){ window.location.href = `/shows#open=${encodeURIComponent(p)}`; return; }
  if(item.bucket === 'Music'){ window.location.href = `/music#play=${encodeURIComponent(p)}`; return; }
  if(item.bucket === 'Gallery'){ window.location.href = `/gallery#open=${encodeURIComponent(p)}`; return; }
  if(item.bucket === 'Games'){
    // built-in games are pages, open them straight. a ROM starts in the Games page
    if(/\.html?$/i.test(p)) window.location.href = p;
    else window.location.href = `/games#play=${encodeURIComponent(p)}`;
    return;
  }
  if(item.bucket === 'Cookbook'){ window.location.href = `/cookbook#open=${encodeURIComponent(p)}`; return; }
  if(item.bucket === 'Workshop'){ window.location.href = `/workshop#open=${encodeURIComponent(p)}`; return; }

  
  if(item.bucket === 'Archive') {
    window.location.href = item.path; // /archive.html?a=<idx>&c=<cluster>&b=<blob> deep link
    return;
  }

  window.location.href = `/${(item.bucket||'').toLowerCase()}`;
}

/* Wiring & events */
searchInput.addEventListener('input', debounce((e) => {
  const v = e.target.value || '';
  if(!v.trim()){ resultsPanel.style.display='none'; resultsPanel.innerHTML=''; return; }
  performSearch(v);
}, 150));   // searching the index is a few ms, this only waits for a pause in typing
searchInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const first = resultsPanel.querySelector('.result-row');
  if (!first) { performSearch(searchInput.value); return; }
  e.preventDefault();
  if (first.classList.contains('result-page')) location.href = first.getAttribute('href');
  else if (first._item) onResultClick(first._item);
});

document.addEventListener('click', (ev) => {
  if(!resultsPanel.contains(ev.target) && ev.target !== searchInput) { resultsPanel.style.display='none'; }
});

let __uiCfg = null;
function isPageHidden(key){

}
async function applyUiConfig(){

}
/* Menu boot: the hidden-pages setting and the feature answers are applied together in one
   pass, and the result is cached so a revisit paints the full menu at once. Probes that
   answer unknown (SD busy right after boot) retry and apply late. */
const TILE_CACHE_KEY = 'nomadMenuTiles.v1';
const TILE_KEYS = ['archive', 'games', 'maps', 'translate', 'cookbook', 'workshop'];

function applyTileStates(st){
  st = st || {};
  __archivesPresent = !!st.archive;
  const grid = document.getElementById('tiles');
  const waiting = grid.classList.contains('tiles-wait');
  const set = (bucket, key) => {
    const t = document.querySelector('.tile[data-bucket="' + bucket + '"]');
    if (!t) return;
    const show = !!st[key] && !isPageHidden(key);
    const was = t.style.display !== 'none';
    t.style.display = show ? '' : 'none';
    // a tile that turns up once the menu is already showing fades in
    if (show && !was && !waiting) { t.classList.remove('tile-in'); void t.offsetWidth; t.classList.add('tile-in'); }
  };
  set('Archive', 'archive'); set('Games', 'games'); set('Maps', 'maps'); set('Translate', 'translate');
  set('Cookbook', 'cookbook'); set('Workshop', 'workshop');
  grid.classList.remove('tiles-wait');
}

/* the firmware's one answer for all six (/api/menu). null for each if it can't say,
   and 'old' when the firmware doesn't have /api/menu */
async function probeMenu(){
  try {
    const res = await fetch('/api/menu', { cache: 'no-store' });
    if (res.status === 404) return 'old';
    if (!res.ok) return null;
    const j = JSON.parse(await res.text());
    return TILE_KEYS.map(k => typeof j[k] === 'boolean' ? j[k] : null);
  } catch (e) { return null; }
}

async function bootMenuFeatures(){
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(TILE_CACHE_KEY) || 'null'); } catch(e){}

  const withTimeout = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(() => r(null), ms))]);
  // firmware without /api/menu: the six separate checks, in TILE_KEYS order
  const runSix = () => Promise.all([
    withTimeout(probeArchive(), 4000),
    withTimeout(probeGames(), 4000),
    withTimeout(probeMaps(), 4000),
    withTimeout(probeTranslate(), 4000),
    withTimeout(probeDirBucket('/Cookbook'), 4000),
    withTimeout(probeDirBucket('/Workshop'), 4000),
  ]);
  let oldFirmware = false;
  const run = async () => {
    if (!oldFirmware) {
      const one = await withTimeout(probeMenu(), 4000);
      if (one !== 'old') return one || TILE_KEYS.map(() => null);
      oldFirmware = true;
    }
    return runSix();
  };
  // the hidden-pages setting and the answer travel together. tiles apply once both are in
  const first = run();
  await applyUiConfig();

  const st = Object.assign({}, cached || {});
  let unknown = [];
  const fold = (results) => {
    unknown = [];
    results.forEach((v, i) => {
      const k = TILE_KEYS[i];
      if (v === null || v === undefined) { if (!(k in st)) st[k] = false; unknown.push(k); }
      else st[k] = v;
    });
  };
  fold(await first);
  applyTileStates(st);
  try { localStorage.setItem(TILE_CACHE_KEY, JSON.stringify(st)); } catch(e){}

  // SD-busy boots: retry the unanswered probes in the background
  for (let attempt = 0; attempt < 5 && unknown.length; attempt++){
    await new Promise(r => setTimeout(r, 5000));
    fold(await run());
    applyTileStates(st);
    try { localStorage.setItem(TILE_CACHE_KEY, JSON.stringify(st)); } catch(e){}
  }
}
bootMenuFeatures();
/* Continue: drawn at once from this phone's own record, and again when coming back to
   the menu (the back button can show the page from the browser's cache) */
renderResume();
window.addEventListener('pageshow', (e) => { if(e.persisted) renderResume(); });

/* ESC to close results */
document.addEventListener('keydown', (e) => { if(e.key === 'Escape'){ resultsPanel.style.display='none'; } });

/* Chat lives on its own page (chat.html), served at the /chat short route. */
document.getElementById('chatBtn').addEventListener('click', () => { location.href = '/chat'; });

</script>
</body>
</html>
