<style>
  /* Functional CSS: Movies-specific layout and Plyr.js customization */
  :root{
    --card-gap:1rem; /* used in JS for calculations */
    --header-height:68px; /* fallback used by CSS; JS will set exact top */
  }

  body{display:flex;flex-direction:column;min-height:100vh}

  /* Dark mode overrides */
  body.dark .toolbar{ background: var(--bg); border-bottom-color: var(--white-alpha-4); }

  header{
    position:sticky;
    top:0;
    z-index:60;
    -webkit-box-align:center;
  }

  .toolbar{
    background:var(--bg);
    padding:.65rem 1rem;
    display:flex;
    flex-wrap:wrap;
    gap:.6rem;
    align-items:center;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:var(--header-height);
    z-index:55;
  }
  .toolbar input[type="search"]{flex:1 1 220px;padding:.5rem .75rem;border:1px solid var(--line);border-radius:var(--radius);font-size:0.95rem;background:var(--card);color:var(--text)}
  .toolbar select, .toolbar .view-btn{padding:.48rem .7rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);font-size:0.9rem;cursor:pointer}
  .view-btn.active{background:var(--primary);color:var(--color-white);border-color:var(--primary-dark);}

  main{flex:1;display:flex;flex-direction:column;max-width:1200px;width:100%;margin:0 auto;padding:1rem}
  .grid-wrapper{flex:1;overflow-y:auto;padding-bottom:12px}
  .media-grid{display:grid;gap:var(--card-gap);}

  .media-grid.small  {grid-template-columns:repeat(auto-fit,minmax(120px,1fr));}
  .media-grid.medium {grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .media-grid.large  {grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}

  /* card specifics */
  .media-card{width:100%;max-width:220px;margin:0 auto;}
  .media-grid.small  .media-card{max-width:120px;}
  .media-grid.medium .media-card{max-width:160px;}
  .media-grid.large  .media-card{max-width:220px;}

  @media (max-width:600px){
    .toolbar{top:112px;}
    .media-grid.small  {grid-template-columns:repeat(4,1fr);}
    .media-grid.medium {grid-template-columns:repeat(3,1fr);}
    .media-grid.large  {grid-template-columns:repeat(2,1fr);}
  }

  .thumb-wrapper{position:relative;display:flex;align-items:center;justify-content:center;background:var(--thumb-bg);color:var(--thumb-text);font-size:0.9rem;text-align:center;width:100%;aspect-ratio:2/3;}
  .fallback-text{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;text-align:center;font-weight:700;color:var(--thumb-title);pointer-events:none;padding:6px}
  .media-thumb{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:1;opacity:0;transition:opacity .35s ease;}
  .badge-resume{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(0,0,0,0.6);color:#fff;padding:5px 10px 6px;border-radius:10px;font-weight:700;font-size:12px;line-height:1.25;z-index:4;display:block;min-width:40px;max-width:85%;overflow:hidden;text-align:center;white-space:nowrap;text-overflow:ellipsis}
  /* how far into the film: a thin bar under the resume time */
  .badge-resume .br-bar{display:block;height:3px;margin-top:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
  .badge-resume .br-bar i{display:block;height:100%;background:var(--primary);border-radius:2px}
  /* a finished film: a quiet tick in the corner */
  .badge-watched{position:absolute;top:6px;right:6px;z-index:4;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;opacity:.85}

  .meta{padding:10px 8px;text-align:center}
  .meta .title{font-weight:700;color:var(--thumb-title);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:0.95rem}
  .meta .dir{font-size:12px;color:var(--text-gray);overflow:hidden;white-space:nowrap;text-overflow:ellipsis; display:none}

  /* modal specifics */
  .modal,.video-modal{display:none;position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:var(--overlay-modal);justify-content:center;align-items:center;z-index:1000;padding:20px;}
  .modal-content {
    background: var(--card-bg);
    color: var(--text);
    padding:20px;
    border-radius:var(--radius);
    text-align:center;
    width:94%;
    max-width:480px;
    box-shadow:var(--shadow-large);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .modal-content h2 {margin:0;font-size:1.15rem;font-weight:700;}
  #modalSub {font-size:0.9rem;color:var(--muted)}

  .modal button {
    padding:10px 14px;
    font-size:0.95rem;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background-color .18s ease, color .18s ease;
  }
  .modal button { width:100%; font-weight:600; }
  .modal button:not(.cancel):not(.secondary) {
    background:var(--primary);
    color:var(--color-white);
  }
  /* resume = outlined accent, download/cancel = outlined muted. tokens flip for dark on their own */
  .modal button.secondary { background:transparent; color:var(--primary); border:1px solid var(--primary); }
  .modal button.cancel { background:transparent; color:var(--text); border:1px solid var(--line); }

  .video-modal-content {
    background: var(--card-bg);
    color: var(--text);
    padding:14px;
    border-radius:var(--radius);
    width:100%;
    max-width:980px;
    box-shadow:var(--shadow-large);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .video-modal-content h2 { color:var(--text); font-size:1.05rem; margin:0; text-align:center; font-weight:700 }
  .video-container { width:100%; display:flex;flex-direction:column;align-items:center;gap:8px; }
  .video-container video { width:100%; border-radius:var(--radius); }
  .video-modal-content .close-btn {
    padding:10px 14px;
    font-size:0.95rem;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    background:var(--primary);
    color:var(--color-white);
    transition:filter .18s ease;
  }
  .video-modal-content .close-btn:hover { filter:brightness(0.96); }
  .video-btns { display:flex; gap:10px; }
  .video-btns .close-btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .video-btns .marks-b { background:transparent; color:var(--text); border:1px solid var(--line, rgba(0,0,0,.15)); position:relative; }
  .video-btns .marks-b.has-marks::after { content:''; position:absolute; top:6px; right:8px; width:7px; height:7px; border-radius:50%; background:#ffd400; }

  /* entrance animation for cards */
  .media-card.play-anim { animation-name:cardIn; animation-duration:360ms; animation-timing-function:cubic-bezier(.2,.9,.2,1); animation-fill-mode:both; will-change:transform,opacity; }
  @keyframes cardIn {
    from { opacity:0; transform:translateX(-18px) scale(.994); }
    to   { opacity:1; transform:translateX(0) scale(1); }
  }

  /* dark mode modal adjustments */
  body.dark .modal { background: var(--overlay-modal); }
  body.dark .modal-content {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--white-alpha-3);
  }
  /* modal button colors come from the theme tokens above, no dark overrides needed */
  body.dark .video-modal { background: rgba(0,0,0,0.88); }
  body.dark .video-modal-content {
    background: #071018;
    border: 1px solid rgba(255,255,255,0.03);
  }
  body.dark .video-container video {
    background: #000;
    outline: 1px solid rgba(255,255,255,0.03);
  }
  body.dark .video-modal-content .close-btn { background: var(--white-alpha-12); color: var(--color-white); }
  body.dark .back-btn { background: var(--white-alpha-12); color: var(--color-white); }
  body.dark .view-btn.active { border-color: var(--primary); }
</style>

<script>
/* Config */
const ROOT_PATH = '/Movies';
const INDEX_ENDPOINT = '/api/index';
const MEDIA_ENDPOINT = '/media';
const RESUME_KEY = 'nomad:watch:v1';
const ANIM_KEY_BASE = 'nomad:movies:anim:v1';
const VIDEO_EXTS = ['.mp4','.mkv','.avi','.mov','.webm','.m4v'];
const IMAGE_EXTS = ['.jpg','.jpeg','.png','.webp','.avif'];
const SUB_EXTS = ['.srt','.vtt','.ass','.ssa','.sub'];

const THEME_KEY = 'nomad_dark_mode';
function applyThemeFlag(dark){
  if(dark) document.body.classList.add('dark');
  else document.body.classList.remove('dark');

  // Keep search readable: enforce white bg + black text (menu wants this behavior)
  const search = document.querySelector('.search-input');
  if(search){
    try {
      search.style.background = '#fff';
      search.style.color = '#000';
    } catch(e){ /* ignore style errors */ }
  }

  // Resume badges - same style for both themes
  document.querySelectorAll('.badge-resume').forEach(b => {
    b.style.background = 'rgba(0,0,0,0.6)';
    b.style.color = '#fff';
  });
}
(function initThemeFromStorage(){
  applyThemeFlag(window.nomadIsDark ? nomadIsDark() : false);
})();
window.addEventListener('nomad-dark', (ev) => applyThemeFlag(ev.detail));

// Keep pages/tabs in sync when menu toggles the key
window.addEventListener('storage', (ev) => {
  if(ev.key === THEME_KEY){
    const dark = ev.newValue === 'true';
    applyThemeFlag(dark);
  }
});
// optional helper for local toggles
function toggleThemeLocal(){
  const isDark = document.body.classList.toggle('dark');
  try { NomadPrefs.setRaw(THEME_KEY, isDark ? 'true' : 'false'); }catch(e){}
}

/* State */
let movies = [];      // list of {name, rawName, cover, path, dir, sz, mt, subtitles}
let filtered = [];
let currentSize = NomadPrefs.raw('nomadMoviesSize') || 'medium';
let currentMovie = null;
let autosaveTimer = null;
let mediaReadyFor = null;     // the film path the player has really loaded (saves wait for it)
let openGen = 0;              // which openVideo call is current
let rootSig = null;
// limit for the "index building" retry chain in loadLibrary
let _buildingRetries = 0;
const _MAX_BUILDING_RETRIES = 10;


/* Helpers */
function ext(name){ const i=name.lastIndexOf('.'); return i>=0? name.slice(i).toLowerCase() : ''; }
function isVideoName(n){ return VIDEO_EXTS.includes(ext(n)); }
function isImageName(n){ return IMAGE_EXTS.includes(ext(n)); }
function isSubtitleName(n){ return SUB_EXTS.includes(ext(n)); }
function fileUrl(path){ return `${MEDIA_ENDPOINT}?file=${encodeURIComponent(path)}`; }
// the store is parsed once and kept, with lookup maps, until this page or another tab writes
// it. Kept to the 500 most recent films
let _resume = null;
function readResume(){
  if(_resume) return _resume.store;
  let store = {};
  try{ store = JSON.parse(NomadPrefs.raw(RESUME_KEY)||'{}') || {}; }catch(e){ store = {}; }
  _resume = { store, maps: null };
  return store;
}
function resumeMaps(){
  readResume();
  if(_resume.maps) return _resume.maps;
  const byPath = new Map(), byTail = new Map(), byBase = new Map();
  for(const k of Object.keys(_resume.store)){
    const p = k.split('|')[0] || '';
    const n = normalizePath(p);
    if(!byPath.has(n)) byPath.set(n, k);
    const tail = p.replace(/^\//,'');
    if(!byTail.has(tail)) byTail.set(tail, k);
    const base = p.toLowerCase().split('/').pop();
    if(!byBase.has(base)) byBase.set(base, k);
  }
  return (_resume.maps = { byPath, byTail, byBase });
}
function writeResume(v){
  const keys = Object.keys(v);
  if(keys.length > 500){
    keys.sort((a, b) => ((v[b] && v[b].updated) || 0) - ((v[a] && v[a].updated) || 0));
    for(const k of keys.slice(500)) delete v[k];
  }
  NomadPrefs.setRaw(RESUME_KEY, JSON.stringify(v));   // quota or private mode: just not kept
  _resume = null;
}
window.addEventListener('storage', (e) => { if(!e.key || e.key === RESUME_KEY) _resume = null; });
function fileKey(path, sz=0, mt=0){ return `${normalizePath(path)}|${sz||0}|${mt||0}`; }
function formatTime(sec){ if(!sec||!isFinite(sec)) return '0:00'; sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; if(h) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; return `${m}:${String(s).padStart(2,'0')}`; }

/* getHashParam() parses location.hash into {action, path} safely */
function getHashParam(){
  const h = (location.hash || '').replace(/^#/,'');

  if(!h) return { action:null, path:null };
  const [k, ...rest] = h.split('=');
  const v = rest.length ? rest.join('=') : '';
  try {
    return { action: k || null, path: v ? decodeURIComponent(v) : null };
  } catch(e){
    // fallback to raw
    return { action: k || null, path: v || null };
  }
}
/* The card's mark: the resume time over a thin bar, or a quiet tick once it's finished */
function filmBadgeHTML(movie){
  const s = filmState(movie);
  if(s && s.done) return `<div class="badge-watched" title="Watched" aria-label="Watched">${NomadIcons.svg('check', 14)}</div>`;
  if(!hasPlace(s)) return '';
  const bar = s.dur > 0 ? `<span class="br-bar"><i style="width:${Math.max(2, Math.round(100 * s.pos / s.dur))}%"></i></span>` : '';
  return `<div class="badge-resume" title="Resume from ${formatTime(s.pos)}">${formatTime(s.pos)}${bar}</div>`;
}
function updateFilmBadge(movie){
  if(!movie || !movie.path) return;
  const card = Array.from(gridEl.querySelectorAll('.media-card')).find(c => c.dataset.path === movie.path);
  const wrapper = card && card.querySelector('.thumb-wrapper');
  if(!wrapper) return;
  wrapper.querySelectorAll('.badge-resume, .badge-watched').forEach(n => n.remove());
  const html = filmBadgeHTML(movie);
  if(html) wrapper.insertAdjacentHTML('beforeend', html);
}

/* Resume matching */
function findResume(movie){
  const store = readResume();
  const norm = normalizePath(movie.path);
  const exact = fileKey(movie.path, movie.sz||0, movie.mt||0);
  if(store[exact]) return { key: exact, entry: store[exact] };
  // in order of preference: the path, the path without its slash, the name
  const m = resumeMaps();
  const k = m.byPath.get(norm) || m.byTail.get(norm.replace(/^\//,'')) || m.byBase.get(norm.split('/').pop().toLowerCase());
  return k ? { key: k, entry: store[k] } : null;
}
/* this phone's place in a film: { pos, dur, done }. A place saved in the credits counts as
   finished too, even if it was never marked completed */
function filmState(movie){
  const r = movie && findResume(movie);
  if(!r || !r.entry) return null;
  const pos = +r.entry.position || 0, dur = +r.entry.duration || 0;
  return { pos, dur, done: !!r.entry.completed || (pos > 0 && NomadProgress.isFinished(pos, dur)) };
}
function hasPlace(s){ return !!s && !s.done && s.pos > 1; }

// Start over: forget the place here and in Continue
function clearResumeFor(path){
  const store = readResume();
  const norm = normalizePath(path);
  let changed=false;
  for(const k of Object.keys(store)){
    const p = (k.split('|')[0] || '');
    if(normalizePath(p) === norm || p.replace(/^\//,'') === norm.replace(/^\//,'')){
      delete store[k];
      changed = true;
    }
  }
  if(changed) writeResume(store);
  NomadProgress.clear(norm);
}

/* The one place a film's progress is written: its exact place in nomad:watch:v1 (what this page
   resumes from) and how far along it is in NomadProgress (what the menu's Continue shows).
   Stopped in the last minute or the credits, it is finished. */
function recordFilm(movie, pos, dur){
  if(!movie || !movie.path || !(dur > 0) || !isFinite(pos)) return;
  dur = Math.floor(dur);
  pos = Math.max(0, Math.min(dur, Math.floor(pos)));
  const store = readResume(), norm = normalizePath(movie.path);
  // one entry per film: an older key for the same file would shadow this one
  for(const k of Object.keys(store)) if(normalizePath(k.split('|')[0] || '') === norm) delete store[k];
  const key = fileKey(movie.path, movie.sz || 0, movie.mt || 0);
  const info = { k: 'film', t: movie.name || '' };
  if(NomadProgress.isFinished(pos, dur)){
    store[key] = { completed: true, position: 0, duration: dur, updated: Date.now() };
    NomadProgress.finish(movie.path, info);
  } else {
    store[key] = { position: pos, duration: dur, updated: Date.now() };
    NomadProgress.note(movie.path, Object.assign(info, { p: pos / dur, l: NomadProgress.timeLeft(dur - pos), done: false }));
  }
  writeResume(store);
  updateFilmBadge(movie);
}

async function fetchIndex(path){ return NomadIndex.fetch(path); }   // shared reader, nomad-utils.js


/* Build movies from NDJSON indexes */
async function buildFromIndexes(root){
  // Attempt to set rootSig using the root index header
  const rootResp = await fetchIndex(root);
  if(rootResp.header && rootResp.header.sig) rootSig = rootResp.header.sig;

  const map = new Map();
  // gather root entries. The bucket index is recursive, so a film in its own folder
  // (/Movies/Nosferatu/Nosferatu.mp4) is already here: group it under the folder it is
  // really in, or it shows twice, once with a path that doesn't exist.
  const covered = new Set();
  for(const e of rootResp.entries){
    const full = e.p ? normalizePath(e.p) : normalizePath(`${root}/${e.n}`);
    const dir = full.replace(/\/[^/]*$/, '') || '/';
    if(dir !== normalizePath(root)) covered.add(dir);
    const base = e.n.replace(/\.[^/.]+$/,'').toLowerCase();
    const key = `${dir}::${base}`;
    if(!map.has(key)) map.set(key, { dir, base, files: [] });
    map.get(key).files.push({ name: e.n, t: e.t, sz: e.sz||0, mt: e.mt||0, full: normalizePath(full) });
  }

  // fetch child dir indexes the root index did not already cover
  for(const e of rootResp.entries){
    if(e.t === 'd'){
      const dirPath = (root === '/' ? '' : root) + '/' + e.n;
      if(e.p && normalizePath(e.p) !== normalizePath(dirPath)) continue;   // a deeper folder, not a child
      if(covered.has(normalizePath(dirPath))) continue;
      try {
        const resp = await fetchIndex(dirPath);
        for(const f of resp.entries){
          const dir = normalizePath(dirPath);
          const full = dir === '/' ? `/${f.n}` : `${dir}/${f.n}`;
          const base = f.n.replace(/\.[^/.]+$/,'').toLowerCase();
          const key = `${dir}::${base}`;
          if(!map.has(key)) map.set(key, { dir, base, files: [] });
          map.get(key).files.push({ name: f.n, t: f.t, sz: f.sz||0, mt: f.mt||0, full: normalizePath(full) });
        }
      } catch(err){
        console.warn('child index missing', dirPath, err);
      }
    }
  }

  // Attach language-suffixed subtitles (Movie.en.srt) to their video's group:
  // the suffix makes their basename differ, so they land in a video-less group
  // of their own and would otherwise be dropped.
  for(const [k,v] of map.entries()){
    if(v.files.some(x => isVideoName(x.name))) continue;
    const subsOnly = v.files.filter(x => isSubtitleName(x.name));
    if(!subsOnly.length) continue;
    let best = null;
    for(const v2 of map.values()){
      if(v2 === v || v2.dir !== v.dir) continue;
      if(!v2.files.some(x => isVideoName(x.name))) continue;
      if(v.base.startsWith(v2.base) && (!best || v2.base.length > best.base.length)) best = v2;
    }
    if(best) best.files.push(...subsOnly);
  }

  const out = [];
  for(const [k,v] of map.entries()){
    const media = v.files.find(x => isVideoName(x.name));
    if(!media) continue;
    const image = v.files.find(x => isImageName(x.name));
    const subs = v.files.filter(x => isSubtitleName(x.name));
    const dir = v.dir;
    const path = normalizePath((dir === '/' ? '' : dir) + '/' + media.name);
    out.push({
    name: prettify(media.name),
    rawName: media.name,
    cover: image ? (`${MEDIA_ENDPOINT}?file=${encodeURIComponent(normalizePath((dir === '/' ? '' : dir) + '/' + image.name))}&_=${image.mt || image.sz || media.mt || rootSig || Date.now()}`) : null,
    path,
    dir,
    sz: media.sz || 0,
    mt: media.mt || 0,
    subtitles: subs.map(s => ({ path: normalizePath((dir === '/' ? '' : dir) + '/' + s.name), ext: ext(s.name) }))
    });
  }
  out.sort((a,b) => a.name.localeCompare(b.name));
  return out;
}
function prettify(filename){
  const n = filename.replace(/\.[^/.]+$/,'');

  let t = n.replace(/[_\.]+/g,' ').trim();
  t = t.replace(/\s*\(?\d{4}\)?\s*$/,'').trim();
  return t || filename;
}

/* Render grid with optional staggered animation on first load */
const gridEl = document.getElementById('grid');

function renderGrid(){
  gridEl.className = `media-grid ${currentSize}`;
  const frag = document.createDocumentFragment();

  for(const item of filtered){
    const card = document.createElement('div');
    card.className = 'media-card';
    // helpful hook to update badge for a specific movie without re-rendering whole grid:
    card.dataset.path = item.path || '';

    const resumeHTML = filmBadgeHTML(item);
    // no src yet: NomadImages hands covers to the device a few at a time, near the viewport
    const imgHTML = item.cover ? `<img class="media-thumb" loading="lazy" alt="${escapeHtml(item.name)}">` : '';
    card.innerHTML = `
      <div class="thumb-wrapper">
        <span class="fallback-text">${escapeHtml(item.name)}</span>
        ${resumeHTML}
        ${imgHTML}
      </div>
    `;
    const img = card.querySelector('img');
    const fallback = card.querySelector('.fallback-text');
    if(img){
      img.onload = () => { img.style.opacity = '1'; if(fallback) fallback.style.display = 'none'; };
      img.onerror = () => { img.style.display = 'none'; if(fallback) fallback.style.display = 'block'; };
      NomadImages.observe(img, item.cover);
    } else {
      if(fallback) fallback.style.display = 'block';
    }
    card.addEventListener('click', () => showMovieOptions(item));
    frag.appendChild(card);
  }

  // Clear + append
  gridEl.innerHTML = '';
  gridEl.appendChild(frag);

  // Decide if we should animate now:
  const animKey = ANIM_KEY_BASE;   // once per browser, not per library change
  const already = NomadPrefs.raw(animKey);
  if(!already && filtered.length > 0){
    runStaggeredAnimation(animKey);
  }
}

/* Escape helper for injection safety when inserting titles */
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
  });
}

/* Animation logic: compute grid columns and set animationDelay for each card row-by-row left->right */
function runStaggeredAnimation(storeKey){
  if(!gridEl.querySelector('.media-card')) { NomadPrefs.setRaw(storeKey, Date.now()); return; }

  // allow layout to stabilize. The cards are taken here, not before: a second render in
  // the same frame replaces them
  requestAnimationFrame(() => {
    const cards = Array.from(gridEl.querySelectorAll('.media-card'));
    if(!cards.length || NomadPrefs.raw(storeKey)) return;
    const gridStyles = getComputedStyle(gridEl);
    const gapPx = parseFloat(gridStyles.gap) || 16;
    const gridWidth = Math.max(1, gridEl.clientWidth);
    const firstCardRect = cards[0].getBoundingClientRect();
    const cardWidth = Math.max(1, firstCardRect.width);

    // compute columns (fallback to 1)
    const columns = Math.max(1, Math.floor((gridWidth + gapPx) / (cardWidth + gapPx)));

    const stagger = 45; // ms per step (keeps animation quick)
    // the first screenful only: card N waits N x 45 ms hidden
    const shown = Math.min(cards.length, columns * Math.max(1, Math.ceil(window.innerHeight / Math.max(1, firstCardRect.height))) + columns);
    cards.length = shown;
    cards.forEach((card, i) => {
      const row = Math.floor(i / columns);
      const col = i % columns;
      // Row-by-row left->right: delay increases with (row*columns + col)
      const delay = (row * columns + col) * stagger;
      card.style.animationDelay = `${delay}ms`;
      // apply class to start the animation
      card.classList.add('play-anim');
    });

    // mark as animated so it won't run again until signature changes
    try { NomadPrefs.setRaw(storeKey, Date.now()); } catch(e){ /* ignore */ }

    // cleanup inline animationDelay after animation end to keep DOM cleaner
    const maxDelay = (Math.ceil(cards.length / columns) * columns) * stagger + 500;
    setTimeout(() => {
      cards.forEach(c => { c.style.animationDelay = ''; c.classList.remove('play-anim'); /* cards still visible without class */ });
    }, maxDelay);
  });
}

/* Modal controls */
const modal = document.getElementById('modal');
const modalSub = document.getElementById('modalSub');
const playButton = document.getElementById('playButton');
const resumeButton = document.getElementById('resumeButton');
const downloadButton = document.getElementById('downloadButton');
const videoModal = document.getElementById('videoModal');
const videoPlayer = document.getElementById('videoPlayer');
// a film Nomad turns away or that stops arriving is asked for again at its place
NomadStream.keep(videoPlayer, { retryHost: document.querySelector('#videoModal .video-btns') });
const videoTitle = document.getElementById('videoTitle');

function showMovieOptions(movie){
  currentMovie = movie;
  const s = filmState(movie), place = hasPlace(s);
  modalSub.textContent = [movie.name || movie.rawName || movie.path || '',
    s && s.done ? 'Watched' : place && s.dur > 0 ? NomadProgress.timeLeft(s.dur - s.pos) : ''].filter(Boolean).join(' · ');
  // a saved place: Resume is the main action and Start over the second. Only Start over forgets it
  resumeButton.style.display = place ? 'block' : 'none';
  if(place) resumeButton.textContent = `Resume from ${formatTime(s.pos)}`;
  playButton.textContent = place ? 'Start over' : 'Play';
  playButton.classList.toggle('secondary', place);

  playButton.onclick = () => {
    if(place) clearResumeFor(movie.path);
    updateFilmBadge(movie);
    closeModal(true);
    openVideo(fileUrl(movie.path), false);
  };
  resumeButton.onclick = () => {
    closeModal(true);
    openVideo(fileUrl(movie.path), true);
  };
  downloadButton.onclick = () => {
    closeModal();
    startDownload(movie);
  };
  // host a watch party of this film: the code to share comes up straight away
  document.getElementById('togetherButton').onclick = () => {
    let cover = '';
    try { cover = movie.cover ? new URL(movie.cover, location.href).searchParams.get('file') || '' : ''; } catch (e) {}
    location.href = '/watch.html?' + new URLSearchParams({ host: '1', path: movie.path, title: movie.name || '', cover });
  };

  modal.style.display = 'flex';
  NomadBack.open('film', closeFilm);
}
/* The phone's Back closes the popup or the player instead of leaving the page (NomadBack).
   They take turns on one Back entry: going from the popup to the player hands it over, as
   dropping one history entry and adding another in the same moment loses one of them. */
function closeModal(handOver){ modal.style.display = 'none'; if(handOver !== true) NomadBack.done('film'); }
function closeFilm(){ if(videoModal.style.display === 'flex') closeVideo(); else closeModal(); }
// bookmarks and notes by time in the film, kept on this phone
window.videoMarks = NomadMarks.attach(document.getElementById('videoMarksBtn'), {
  key: () => currentMovie && currentMovie.path,
  title: () => (currentMovie && currentMovie.name) || '',
  here: () => (currentMovie && videoPlayer.duration ? { at: videoPlayer.currentTime, order: videoPlayer.currentTime, label: NomadMarks.clock(videoPlayer.currentTime) } : null),
  go: (t) => { try { videoPlayer.currentTime = +t; videoPlayer.play().catch(() => {}); } catch (e) {} },
});

function openMovieFromHash(hashObj){
  if(!hashObj || !hashObj.path) return;
  const wantRaw = hashObj.path || '';
  // getHashParam already decoded this. Decoding again throws a URIError on
  // names with a literal % like "50% Off.mp4".
  const want = normalizePath(wantRaw);

  // Try to find the movie by exact normalized path, rawName, or basename fallback
  let found = movies.find(m => normalizePath(m.path) === want)
           || movies.find(m => normalizePath('/' + (m.rawName||'')) === want)
           || movies.find(m => normalizePath('/' + (m.rawName||'')).endsWith(want.split('/').pop()))
           || movies.find(m => normalizePath(m.path).endsWith(want.split('/').pop()));

  if(!found){
    try {
      // search again, for when hash handling runs early
      found = movies.find(m => normalizePath(m.path) === want) ||
              movies.find(m => normalizePath('/' + (m.rawName||'')) === want) ||
              movies.find(m => normalizePath(m.path).endsWith(want.split('/').pop()));
    } catch(e){
      console.warn('hash reload attempt failed', e);
    }
  }

  if(!found){
    console.warn('movie not found for hash', want);
    return;
  }

  // Set currentMovie used by openVideo / resume logic
  currentMovie = found;

  // Hash navigation indicates intent to play: auto-play with resume
  openVideo(fileUrl(found.path), true);

  // Clear the hash so reloads / back button don't auto-play again unexpectedly
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ /* ignore */ }
}

function handleHashNavigation(hashObj){
  if(!hashObj) return;
  // Accept 'open' or 'play' keys
  if(hashObj.action === 'open' || hashObj.action === 'play' || (!hashObj.action && hashObj.path)){
    openMovieFromHash(hashObj);
  }
}

/* Download helper */
function startDownload(movie){
  if(!confirm(`Download "${movie.name}"?`)) return;
  const a = document.createElement('a');
  // go through /media like playback does. a raw path cuts the request off at the
  // first # or ? in a filename
  a.href = `${MEDIA_ENDPOINT}?file=${encodeURIComponent(normalizePath(movie.path))}&download=1`;
  a.download = movie.rawName || movie.name;   // the file's own name, extension included
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function openVideo(src, useResume=false){
  const saved = filmState(currentMovie);
  const startTime = (useResume && hasPlace(saved)) ? saved.pos : 0;

  // save nothing until the player has this film: the last one's time and length linger
  // on the element until then
  const gen = ++openGen, movie = currentMovie;
  mediaReadyFor = null;
  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.innerHTML = '';
  videoPlayer.addEventListener('loadedmetadata', () => { if(gen === openGen && movie) mediaReadyFor = movie.path; }, { once: true });

  // every sidecar subtitle becomes a selectable track; srt is converted to VTT
  // (browsers render nothing for raw srt in <track>)
  const subtitles = await NomadSubs.buildTracks(
    ((currentMovie && currentMovie.subtitles) || []).map(s => ({ path: s.path, url: fileUrl(s.path) })),
    currentMovie && currentMovie.path);

  if (!window.plyrInstance) {
    // shared player build (nomad-utils.js). captions.update is needed because tracks are
    // appended after the player exists. Without it Plyr ignores them after the first title.
    window.plyrInstance = await NomadPlyr.create(videoPlayer, { captions: { update: true } });

    try {
      const allImages = document.querySelectorAll('img[loading="lazy"]');
      allImages.forEach(img => {
        if (img.src && !img.complete) {
          img.dataset.originalSrc = img.src;
          img.removeAttribute('src');
        }
      });
    } catch(e) {
      console.warn('Could not pause image loading', e);
    }

    window.plyrInstance.on('pause', () => { saveNow(); });
    window.plyrInstance.on('seeked', () => { saveNow(); });
    window.plyrInstance.on('ended', () => {
      const dur = window.plyrInstance.duration || 0;
      if(currentMovie && mediaReadyFor === currentMovie.path) recordFilm(currentMovie, dur, dur);
      stopAutosave();
    });
  }

  videoPlayer.src = src;
  subtitles.forEach(sub => {
    const track = document.createElement('track');
    track.kind = sub.kind;
    track.label = sub.label;
    track.srclang = sub.srclang;
    track.src = sub.src;
    videoPlayer.appendChild(track);
  });
  NomadSubs.keepOn(window.plyrInstance, videoPlayer);
  videoPlayer.load();
  NomadPlyr.previews(window.plyrInstance, currentMovie && currentMovie.path);   // seek previews, if made
  if (window.videoMarks) videoMarks.refresh();

  videoModal.style.display = 'flex';
  NomadBack.open('film', closeFilm);
  videoTitle.textContent = currentMovie ? currentMovie.name : '';
  setMediaSession(currentMovie);

  if (startTime > 0) {
    let seekDone = false;
    const doSeek = () => {
      if(seekDone) return;
      try {
        const vid = window.plyrInstance.media || videoPlayer;
        if(vid.readyState >= 1 && vid.duration > 0){
          seekDone = true;
          vid.currentTime = startTime;
        }
      } catch(e){ console.warn('Seek failed:', e); }
    };
    videoPlayer.addEventListener('canplay', doSeek, { once: true });
    videoPlayer.addEventListener('loadeddata', doSeek, { once: true });
    setTimeout(doSeek, 500);
    setTimeout(doSeek, 1500);
    setTimeout(doSeek, 3000);
  }

  startAutosave();

  const doPlay = () => {
    window.plyrInstance.play().catch(e => console.warn('Play failed:', e));
  };
  if(videoPlayer.readyState >= 3){
    doPlay();
  } else {
    videoPlayer.addEventListener('canplay', doPlay, { once: true });
  }
}
function closeVideo(){
  try{ saveNow(); }catch(e){}
  if (window.plyrInstance) {
    window.plyrInstance.pause();
  }
  // let go of the stream: a paused, hidden player keeps its reply open, and Nomad has eight
  // of those for everyone. The place was saved above; nothing is saved from the empty player.
  openGen++;
  mediaReadyFor = null;
  videoPlayer.removeAttribute('src');
  videoPlayer.innerHTML = '';
  videoPlayer.load();
  videoModal.style.display = 'none';
  NomadBack.done('film');
  stopAutosave();
  releaseWakeLock().catch(()=>{});
  setMediaSession(null);

  try {
    const allImages = document.querySelectorAll('img[loading="lazy"]');
    allImages.forEach(img => {
      if (img.dataset.originalSrc) {
        img.src = img.dataset.originalSrc;
        delete img.dataset.originalSrc;
      }
    });
  } catch(e) {
    console.warn('Could not resume image loading', e);
  }
}

/* autosave every 4s */
function startAutosave(){ stopAutosave(); autosaveTimer = setInterval(saveNow, 4000); }
function stopAutosave(){ if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; } }
function saveNow(){
  try {
    if(!currentMovie || !window.plyrInstance) return;
    if(mediaReadyFor !== currentMovie.path) return;   // still loading: the time on the player is the last film's
    const cur = window.plyrInstance.currentTime || 0;
    const dur = window.plyrInstance.duration || 0;
    if(cur > 0 && dur > 0) recordFilm(currentMovie, cur, dur);
  } catch(e){ console.warn('saveNow failed', e); }
}

/* the lock screen and notification show the film and its poster */
function setMediaSession(movie){
  if(!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  try {
    navigator.mediaSession.metadata = movie ? new MediaMetadata({
      title: movie.name || '', artist: 'Nomad',
      artwork: movie.cover ? [{ src: movie.cover }] : []
    }) : null;
  } catch(e){ console.warn('mediaSession', e); }
}

/* Fetch & build logic */
async function loadLibrary(){
  try {
    const list = await buildFromIndexes(ROOT_PATH);
    NomadRetry.done('library');
    if(list && list.length){
      movies = list;
      filtered = movies.slice();
      renderGrid();
      return;
    }
    gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">No movies yet</p>';
    return;
  } catch(e){
    if(e && e.message === 'INDEX_BUILDING') {
      // capped so a build that never finishes doesn't leave every phone polling
      if(_buildingRetries < _MAX_BUILDING_RETRIES){
        _buildingRetries++;
        gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Building movie index…</p>';
        setTimeout(() => loadLibrary(), 3000);
        return;
      }
      gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Building movie index…</p>';
      NomadRetry.later('library', loadLibrary);
      return;
    }
    console.warn('index build failed, falling back', e);
  }

  // no media.json fallback: on this firmware it only holds bucket counts
  gridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--primary-dark);">Couldn\'t load movies. Trying again…</p>';
  NomadRetry.later('library', loadLibrary);
}

/* UI: search, sort, size buttons */
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const viewButtons = document.querySelectorAll('.view-btn');

function applyFilter(term=''){
  const lower = (term||'').trim().toLowerCase();
  filtered = !lower ? movies.slice() : movies.filter(m => (m.name || '').toLowerCase().includes(lower));
  applySort(sortSelect.value || 'nameAsc');
}
function applySort(mode){
  filtered.sort((a,b) => mode === 'nameDesc' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name));
  renderGrid();
}
function setViewSize(size){
  currentSize = size;
  viewButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === size);
    btn.setAttribute('aria-pressed', btn.dataset.size === size ? 'true' : 'false');
  });
  gridEl.className = `media-grid ${size}`;
  NomadPrefs.setRaw('nomadMoviesSize', size);
}

/* index poll (cheap) to refresh if index sig changes */
async function checkIndex(){
  // skipped while hidden or playing: the poll competes for the SD mutex
  if(document.hidden) return;
  if(videoModal && videoModal.style.display === 'flex') return;
  try {
    // revalidated, not re-fetched: an unchanged index answers 304 (the device sends its sig as an ETag)
    const url = `${INDEX_ENDPOINT}?path=${encodeURIComponent(ROOT_PATH)}`;
    const res = await fetch(url, { cache: 'no-cache' });
    if(!res.ok) return;
    const text = await res.text();
    const headerLine = text.split('\n')[0];
    if(headerLine){
      const header = JSON.parse(headerLine);
      if(header && header.sig){
        if(!rootSig){
          rootSig = header.sig;
        } else if(rootSig !== header.sig){
          // new signature -> reload library
          rootSig = header.sig;
          await loadLibrary();
        }
      }
    }
  } catch(e){}
}

/* keyboard: allow ESC to close modal/video */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(document.getElementById('videoModal').style.display === 'flex') closeVideo();
    if(document.getElementById('modal').style.display === 'flex') closeModal();
  }
});

/* bootstrap */
setViewSize(currentSize);
viewButtons.forEach(btn => btn.addEventListener('click', () => setViewSize(btn.dataset.size)));
searchInput.addEventListener('input', (e)=> { clearTimeout(window.__debounce); window.__debounce = setTimeout(()=> applyFilter(e.target.value), 150); });
sortSelect.addEventListener('change', ()=> applySort(sortSelect.value));
videoPlayer.addEventListener('ended', closeVideo);

window.addEventListener('hashchange', ()=> handleHashNavigation(getHashParam()));

/* Init sequence */
(async function init(){
  try {
    await loadLibrary();

    function updateToolbarTop(){
      try {
        const headerEl = document.querySelector('header');
        const toolbarEl = document.querySelector('.toolbar');
        if(!headerEl || !toolbarEl) return;
        const h = Math.ceil(headerEl.getBoundingClientRect().height);
        toolbarEl.style.top = h + 'px';
        document.documentElement.style.setProperty('--header-height', h + 'px');
      } catch(e){ /* ignore measurement errors */ }
    }
    window.addEventListener('resize', updateToolbarTop);
    window.addEventListener('load', updateToolbarTop);
    updateToolbarTop();

    try { handleHashNavigation(getHashParam()); } catch(e){ console.warn('hash handling failed', e); }

  } catch(e){
    console.error('init error', e);
  }
  setInterval(checkIndex, 30000);
})();

/* admin toggle: hide the download action when downloads are disabled */
NomadUI.applyDownloadPolicy('downloadButton');
</script>
