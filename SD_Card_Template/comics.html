    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overscroll-behavior: none;
        }

        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: var(--card);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            z-index: 200;
            transition: transform 0.3s ease;
        }

        #topbar.hidden { transform: translateY(-100%); }

        .marks-btn { position: relative; cursor: pointer; height: 26px; min-width: 30px; display: inline-grid; place-items: center; }
        .marks-btn svg { width: 14px; height: 14px; }
        .marks-btn.has-marks::after { content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: #ffd400; }
        #back-btn {
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius, 6px);
            border: 1px solid var(--line);
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }
        #back-btn:hover { background: var(--primary) !important; color: white !important; }
        /* the next comic in the same folder (chapters, a series), like Shows' next episode */
        #next-comic {
            background: var(--primary); color: var(--color-white, #fff); text-decoration: none;
            padding: 6px 10px; border-radius: var(--radius, 6px); font-size: 12px; font-weight: 600;
            white-space: nowrap; flex-shrink: 0; border: 1px solid var(--primary);
        }
        #next-comic[hidden], #end-card[hidden] { display: none; }
        #end-card {
            max-width: 560px; margin: 24px auto 90px; padding: 18px 16px; text-align: center;
            background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-large, 12px);
        }
        #end-card .muted { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
        #end-card a {
            display: inline-block; background: var(--primary); color: var(--color-white, #fff); text-decoration: none;
            padding: 10px 18px; border-radius: var(--radius, 6px); font-weight: 600; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-sizing: border-box;
        }
        body.paged-mode #end-card { display: none; }

        #comic-title {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        #page-indicator {
            display: none;
        }

        .topbar-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .mode-select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 4px 6px;
            border-radius: var(--radius, 6px);
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s;
            max-width: 80px;
        }
        .mode-select:hover {
            background: var(--primary-dark) !important;
            border-color: var(--primary) !important;
        }
        .mode-select option {
            background: var(--card);
            color: var(--text);

        @media (min-width: 640px) {
            #topbar {
                gap: 10px;
                padding: 0 12px;
            }
            #back-btn {
                padding: 6px 14px;
                font-size: 14px;
            }
            #comic-title {
                font-size: 15px;
            }
            #page-indicator {
                display: block;
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
                flex-shrink: 0;
            }
            .topbar-controls {
                gap: 8px;
            }

                padding: 6px 10px;
                font-size: 13px;
                max-width: none;
            }

        button.topbar-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--line);

        button.topbar-btn:hover { background: var(--primary) !important; color: white !important; }

        #reader {
            margin-top: 52px;
            min-height: calc(100vh - 52px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            background: var(--bg);
        }

        #reader.webtoon .page-wrapper {
            width: 100%;
            max-width: 800px;
            display: block;
            margin: 0 auto;
            background: var(--bg);
        }
        #reader.webtoon .comic-page {
            width: 100%;
            height: auto;
            display: block;
        }

        #reader.paged {
            overflow: hidden;
            height: calc(100vh - 52px);
            justify-content: center;
            background: var(--bg);
        }
        #reader.paged .page-wrapper {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: var(--bg);
        }
        #reader.paged .page-wrapper.active {
            display: flex;
        }
        #reader.paged .comic-page {
            max-width: 100%;
            max-height: calc(100vh - 52px - 60px);
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;

            height: calc(100vh - 52px);
            justify-content: center;

            height: 100%;
            justify-content: center;
            align-items: center;
            background: var(--bg);

            display: flex;

        #reader.two-page .comic-page {

            height: auto;
            object-fit: contain;
            display: block;

        #page-controls {

            border: 1px solid var(--line);

        .topbar-controls {
            display: flex;

        .mode-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);

            cursor: pointer;
            transition: background-color 0.2s;

        .mode-select:hover {
            background: var(--bg);
        }

        #overlay {
            position: fixed;
            top:0;right:0;bottom:0;left:0;inset:0;
            z-index: 500;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        #overlay.hidden { display: none; }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid var(--line);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        @keyframes spin { to { transform: rotate(360deg); } }

        #overlay-status {
            max-width: 320px;
            line-height: 1.5;
            color: rgba(255,255,255,0.85);
        }

        #error-banner {
            position: fixed;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            background: #c62828;
            color: #fff;
            padding: 10px 24px;
            border-radius: var(--radius, 6px);
            font-size: 14px;
            z-index: 600;
            display: none;
            max-width: 90%;
            text-align: center;

        #tap-left, #tap-right {
            display: none;

            top: 52px;
            bottom: 56px;
            width: 35%;
            z-index: 100;
            cursor: pointer;
        }
        #tap-left { left: 0; }
        #tap-right { right: 0; }
        body.paged-mode #tap-left,
        body.paged-mode #tap-right { display: block; }

<body>

    <div id="page-controls">
        <button id="btn-left" onclick="tapSide('left')">← Prev</button>
        <span id="paged-indicator" style="font-size:14px;opacity:0.8"></span>
        <button id="btn-right" onclick="tapSide('right')">Next →</button>
    </div>

    <div id="overlay">
        <div class="spinner"></div>
        <div id="overlay-status">Opening…</div>
    </div>

    <div id="error-banner"></div>

    <script>
    const params      = new URLSearchParams(window.location.search);
    const comicPath   = params.get('path') || '';
    let   entries     = [];
    let   mode        = NomadPrefs.raw('nomad_comic_mode') || 'webtoon';
    let   direction   = NomadPrefs.raw('nomad_comic_direction') || 'ltr';
    let   currentPage = 0;
    const blobURLs    = {};
    const PRELOAD     = 4;
    const UNLOAD_MARGIN = 25; // pages this far from the current one get their decoded image freed

    /* Card reads: a few at a time, nearest the current page first. The firmware gives
       overlapping reads of one file their own handles, so CBZ pages needn't queue single
       file. Three at once leaves room for the rest of the page: past ~4 Nomad answers 503. */
    const MAX_READS = 3;
    let reading = 0;
    const waiting = [], inFlight = new Set();
    function cardRead(idx, run) {
        return new Promise((resolve, reject) => { waiting.push({ idx, run, resolve, reject }); pump(); });
    }
    function pump() {
        // ahead of the current page before behind it
        const score = (w) => w.idx >= currentPage ? w.idx - currentPage : (currentPage - w.idx) * 2;
        // Nomad's ~0.6 MB/s is shared by every read in flight: while the current page
        // loads, only one other read runs beside it, so it arrives first
        const limit = () => inFlight.has(currentPage) ? 2 : MAX_READS;
        while (reading < limit() && waiting.length) {
            let best = 0;
            for (let i = 1; i < waiting.length; i++) if (score(waiting[i]) < score(waiting[best])) best = i;
            const job = waiting.splice(best, 1)[0];
            // scrolled far away since it was asked for: not worth a read now
            if (Math.abs(job.idx - currentPage) > UNLOAD_MARGIN) { job.reject(new Error('stale')); continue; }
            reading++; inFlight.add(job.idx);
            job.run().then(job.resolve, job.reject).finally(() => { reading--; inFlight.delete(job.idx); pump(); });
        }
    }
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    // a ranged read (spec: "bytes=a-b" or "bytes=-n"), retried while the card is busy
    async function rangeRead(url, spec) {
        for (let i = 0, wait = 400; ; i++) {
            const r = await fetch(url, { headers: { Range: spec } });
            if (r.status === 206) return { buf: await r.arrayBuffer(), range: r.headers.get('Content-Range') || '' };
            if (r.status === 200) {
                // a server that ignored the range: take the part that was asked for
                const all = await r.arrayBuffer(), m = /bytes=(\d*)-(\d*)/.exec(spec);
                const a = m[1] === '' ? Math.max(0, all.byteLength - +m[2]) : +m[1], b = m[1] === '' || m[2] === '' ? all.byteLength - 1 : +m[2];
                return { buf: all.slice(a, b + 1), range: `bytes ${a}-${b}/${all.byteLength}` };
            }
            if (r.status !== 503 || i >= 6) throw new Error(r.status === 404 ? 'The file is missing from the card' : 'HTTP ' + r.status);
            const ra = parseFloat(r.headers.get('Retry-After'));
            await sleep(ra > 0 ? ra * 1000 : wait); wait = Math.min(wait * 1.8, 4000);
        }
    }

    function setStatus(msg) {
        document.getElementById('overlay-status').textContent = msg;
    }
    function hideOverlay() {
        document.getElementById('overlay').classList.add('hidden');
    }
    function showError(msg) {
        const banner = document.getElementById('error-banner');
        banner.textContent = msg;
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 6000);
        console.error('[ComicReader]', msg);
    }
    function showFatalError(msg) {
        setStatus(msg);
        document.querySelector('#overlay .spinner').style.display = 'none';
    }

    async function init() {
        if (!comicPath) { showFatalError('No comic chosen. Go back and pick one.'); return; }

        const name = comicName(comicPath.split('/').pop());
        document.title = name + ' – Comic Reader';
        document.getElementById('comic-title').textContent = name;
        document.getElementById('back-btn').href = '/books';

        const savedMode = NomadPrefs.raw('nomad_comic_mode') || 'webtoon';
        const savedDirection = NomadPrefs.raw('nomad_comic_direction') || 'ltr';

        mode = savedMode;
        direction = savedDirection;

        document.getElementById('mode-select').value = savedMode;
        document.getElementById('direction-select').value = savedDirection;

        if (savedMode === 'paged' || savedMode === 'two-page') {
            document.getElementById('reader').className = savedMode;
            document.getElementById('page-controls').classList.add('visible');
            document.body.classList.add('paged-mode');
        } else {
            document.getElementById('reader').className = 'webtoon';
        }

        setStatus('Opening…');

        try {
            const isCBZ = comicPath.toLowerCase().endsWith('.cbz');
            const isCBR = comicPath.toLowerCase().endsWith('.cbr');
            const isArchive = isCBZ || isCBR;

            if (isArchive) {
                if (isCBZ) {
                    await loadCBZFile();
                } else if (isCBR) {
                    await loadCBRFile();
                }
            } else {
                await loadComicDirectory();
            }

            // buildReader has gone to where you left off

        } catch (err) {
            console.error('[ComicReader] Fatal:', err);
            if (err.message && err.message.includes('503')) {
                showFatalError('Nomad is still indexing. Try again in a moment.');
            } else {
                showFatalError("Couldn't open this comic: " + (err.message || err));
            }
        }
    }

    /* CBZ: a ZIP read in place on the card. Opening reads the last 64 KB, which holds the
       end-of-directory record and on most comics the whole directory (~80 bytes a page).
       Each page is then one read of its local header and data. ZIP64 is supported. */
    let zipTotal = 0;
    const u64 = (v, o) => v.getUint32(o, true) + v.getUint32(o + 4, true) * 4294967296;
    async function loadCBZFile() {
        setStatus('Opening…');
        const url = '/media?file=' + encodeURIComponent(comicPath);
        const tail = await rangeRead(url, 'bytes=-65536');
        zipTotal = parseInt((/\/(\d+)\s*$/.exec(tail.range) || [])[1], 10) || tail.buf.byteLength;
        const tailStart = zipTotal - tail.buf.byteLength;
        const tv = new DataView(tail.buf);
        let e = -1;
        for (let i = tail.buf.byteLength - 22; i >= 0; i--) if (tv.getUint32(i, true) === 0x06054b50) { e = i; break; }
        if (e < 0) throw new Error("this isn't a readable CBZ. It may be damaged or a renamed CBR");
        let cdSize = tv.getUint32(e + 12, true), cdOff = tv.getUint32(e + 16, true);
        if (cdOff === 0xFFFFFFFF || cdSize === 0xFFFFFFFF || tv.getUint16(e + 10, true) === 0xFFFF) {
            const loc = e - 20;
            if (loc >= 0 && tv.getUint32(loc, true) === 0x07064b50) {
                const z = u64(tv, loc + 8);
                const rec = z >= tailStart ? new DataView(tail.buf, z - tailStart) : new DataView((await rangeRead(url, `bytes=${z}-${z + 55}`)).buf);
                cdSize = u64(rec, 40); cdOff = u64(rec, 48);
            }
        }
        // a file with something stuck on the front: the directory sits later than it says
        const shift = Math.max(0, (tailStart + e) - (cdOff + cdSize));
        cdOff += shift;
        let cd;
        if (cdOff >= tailStart) cd = tail.buf.slice(cdOff - tailStart, cdOff - tailStart + cdSize);
        else { setStatus('Opening…'); cd = (await rangeRead(url, `bytes=${cdOff}-${cdOff + cdSize - 1}`)).buf; }

        const v = new DataView(cd), dec = new TextDecoder();
        const imageExts = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;
        const list = [];
        for (let o = 0; o + 46 <= cd.byteLength && v.getUint32(o, true) === 0x02014b50;) {
            const nameLen = v.getUint16(o + 28, true), extraLen = v.getUint16(o + 30, true), comLen = v.getUint16(o + 32, true);
            let compressedSize = v.getUint32(o + 20, true), size = v.getUint32(o + 24, true), offset = v.getUint32(o + 42, true);
            // ZIP64 sizes and offset live in extra field 0x0001, in this order, only where 0xFFFFFFFF
            for (let x = o + 46 + nameLen, end = x + extraLen; x + 4 <= end;) {
                const id = v.getUint16(x, true), len = v.getUint16(x + 2, true);
                if (id === 1) {
                    let f = x + 4;
                    if (size === 0xFFFFFFFF) { size = u64(v, f); f += 8; }
                    if (compressedSize === 0xFFFFFFFF) { compressedSize = u64(v, f); f += 8; }
                    if (offset === 0xFFFFFFFF) { offset = u64(v, f); }
                }
                x += 4 + len;
            }
            const filename = dec.decode(new Uint8Array(cd, o + 46, nameLen));
            // macOS zips carry __MACOSX/._page.jpg copies that are not images
            if (imageExts.test(filename) && !/(^|\/)(__MACOSX\/|\._)/.test(filename)) {
                list.push({ type: 'cbz', fileUrl: url, filename, offset: offset + shift, nameLen, extraLen,
                    compressedSize, size, method: v.getUint16(o + 10, true) });
            }
            o += 46 + nameLen + extraLen + comLen;
        }
        entries = list.sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' }));
        if (!entries.length) { showFatalError('No JPG, PNG, WEBP, GIF or AVIF pages in this CBZ.'); return; }
        buildReader();
        updateIndicator();
        hideOverlay();
    }

    // where a page really starts, when its directory offset is off (a damaged or odd zip)
    async function findLocalHeader(entry) {
        const from = Math.max(0, entry.offset - 131072), to = Math.min(zipTotal, entry.offset + 131072);
        const { buf } = await rangeRead(entry.fileUrl, `bytes=${from}-${to - 1}`);
        const v = new DataView(buf), want = new TextEncoder().encode(entry.filename);
        for (let j = 0; j + 30 + want.length <= buf.byteLength; j++) {
            if (v.getUint32(j, true) !== 0x04034b50 || v.getUint16(j + 26, true) !== want.length) continue;
            const nm = new Uint8Array(buf, j + 30, want.length);
            if (nm.every((c, k) => c === want[k])) return from + j;
        }
        return -1;
    }
    async function inflateRaw(u8) {
        if (window.DecompressionStream) {
            try {
                const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                return new Uint8Array(await new Response(s).arrayBuffer());
            } catch (e) { /* an engine without deflate-raw: pako below */ }
        }
        return pako.inflateRaw(u8);
    }
    const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', avif: 'image/avif' };
    // one page: its local header and data in one read (the header's extra field is usually
    // the directory's size, a little slack covers the rest, and a short read fetches the remainder)
    async function cbzPage(entry) {
        let start = entry.offset;
        const want = 30 + entry.nameLen + entry.extraLen + 128 + entry.compressedSize;
        let buf = (await rangeRead(entry.fileUrl, `bytes=${start}-${Math.min(zipTotal, start + want) - 1}`)).buf;
        let v = new DataView(buf);
        if (buf.byteLength < 30 || v.getUint32(0, true) !== 0x04034b50) {
            start = await findLocalHeader(entry);
            if (start < 0) throw new Error('page not found in the archive');
            entry.offset = start;
            buf = (await rangeRead(entry.fileUrl, `bytes=${start}-${Math.min(zipTotal, start + want) - 1}`)).buf;
            v = new DataView(buf);
        }
        const dataStart = 30 + v.getUint16(26, true) + v.getUint16(28, true);
        let data;
        if (dataStart + entry.compressedSize <= buf.byteLength) data = new Uint8Array(buf, dataStart, entry.compressedSize);
        else {
            const rest = (await rangeRead(entry.fileUrl, `bytes=${start + buf.byteLength}-${start + dataStart + entry.compressedSize - 1}`)).buf;
            data = new Uint8Array(dataStart + entry.compressedSize);
            data.set(new Uint8Array(buf)); data.set(new Uint8Array(rest), buf.byteLength);
            data = data.subarray(dataStart);
        }
        if (entry.method === 8) data = await inflateRaw(data);
        else if (entry.method !== 0) throw new Error(`compression method ${entry.method} is not supported`);
        return new Blob([data], { type: MIME[(entry.filename.split('.').pop() || '').toLowerCase()] || '' });
    }

    async function loadCBRFile() {
        setStatus('Downloading…');

        const fileUrl = '/media?file=' + encodeURIComponent(comicPath);

        const response = await fetch(fileUrl);
        if (!response.ok) {
            throw new Error('Failed to download CBR: ' + response.statusText);
        }

        const contentLength = parseInt(response.headers.get('content-length') || '0');
        const reader = response.body.getReader();
        const chunks = [];
        let receivedLength = 0;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            receivedLength += value.length;

            if (contentLength > 0) {
                const percent = Math.floor((receivedLength / contentLength) * 100);
                setStatus(`Downloading… ${percent}%`);
            }
        }

        const arrayBuffer = new Uint8Array(receivedLength);
        let position = 0;
        for (const chunk of chunks) {
            arrayBuffer.set(chunk, position);
            position += chunk.length;
        }

        setStatus('Unpacking…');
        // libunrar.js fetches libunrar.js.mem after it loads. calling it before that lands
        // aborts with abort(0)
        for (let waited = 0; !(window.Module && window.Module.calledRun); waited += 100) {
            if (waited > 15000) throw new Error('The RAR reader did not finish loading.');
            await new Promise(r => setTimeout(r, 100));
        }

        const archive = await new Promise((resolve, reject) => {
            archiveOpenArrayBuffer(comicPath.split('/').pop(), arrayBuffer.buffer, (archive, error) => {
                if (error) {
                    reject(error);
                } else {
                    resolve(archive);
                }
            });
        });


        const imageExts = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;
        const imageEntries = archive.entries.filter(entry => entry.is_file && imageExts.test(entry.name));


        setStatus('Unpacking…');

        const loadedEntries = await Promise.all(
            imageEntries.map((entry, idx) => {
                return new Promise((resolve, reject) => {
                    entry.readData((data, error) => {
                        if (error) {
                            console.warn('[ComicReader] Failed to read:', entry.name, error);
                            reject(error);
                        } else {
                            resolve({
                                type: 'rar',
                                data: data,
                                filename: entry.name
                            });
                        }
                    });
                });
            })
        );

        entries = loadedEntries.sort((a, b) =>
            a.filename.localeCompare(b.filename, undefined,
                { numeric: true, sensitivity: 'base' })
        );

        archiveClose(archive);

        if (entries.length === 0) {
            showFatalError('No pages found in this CBR.');
            return;
        }

        setStatus('Opening…');
        buildReader();
        updateIndicator();
        hideOverlay();
    }

    async function loadComicDirectory() {
        setStatus('Opening…');

        // the firmware's NDJSON index first, then a live /listfiles scan. don't use /list,
        // on Nomad it falls through to the captive portal
        let names = [];
        const fetch503 = async (url) => {
            let r = await fetch(url, { cache: 'no-store' });
            for (let i = 0; i < 3 && r.status === 503; i++) {
                await new Promise(w => setTimeout(w, 700 * (i + 1)));
                r = await fetch(url, { cache: 'no-store' });
            }
            return r;
        };
        try {
            const res = await fetch503('/api/index?path=' + encodeURIComponent(comicPath));
            if (res.ok) {
                const lines = (await res.text()).split('\n').filter(Boolean);
                for (let i = 1; i < lines.length; i++) {   // line 0 is the header
                    try {
                        const e = JSON.parse(lines[i]);
                        if (e && e.t === 'f' && e.n) names.push(e.n);
                    } catch (e) {}
                }
            }
        } catch (e) {}
        if (!names.length) {
            const res = await fetch503('/listfiles?dir=' + encodeURIComponent(comicPath) + '&_=' + Date.now());
            if (!res.ok) {
                throw new Error('Failed to load directory: HTTP ' + res.status);
            }
            const arr = JSON.parse(await res.text());
            names = (Array.isArray(arr) ? arr : [])
                .filter(f => !f.isDir)
                .map(f => String(f.name || '').replace(/\/$/, ''));
        }

        const imageExts = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;
        entries = names
            .filter(n => imageExts.test(n))
            .map(n => ({
                type: 'direct',
                path: comicPath + '/' + n,
                filename: n
            }))
            .sort((a, b) =>
                a.filename.localeCompare(b.filename, undefined,
                    { numeric: true, sensitivity: 'base' })
            );

        if (entries.length === 0) {
            showFatalError('No images in this folder.');
            return;
        }

        setStatus('Opening…');
        buildReader();
        updateIndicator();
        hideOverlay();
    }

    function buildReader() {
        const reader = document.getElementById('reader');
        reader.innerHTML = '';

        entries.forEach((entry, idx) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.id = `page-wrapper-${idx}`;
            wrapper.dataset.index = idx;

            const placeholder = document.createElement('div');
            placeholder.className = 'page-placeholder';
            placeholder.id = `placeholder-${idx}`;
            wrapper.appendChild(placeholder);

            const img = document.createElement('img');
            img.id = `img-${idx}`;
            img.className = 'comic-page';
            img.alt = `Page ${idx + 1}`;
            img.dataset.loaded = 'false';
            img.dataset.retryCount = '0';
            img.decoding = 'async';
            img.style.display = 'none';
            wrapper.appendChild(img);

            reader.appendChild(wrapper);
        });

        // read the saved place before applyMode, which saves currentPage in the page modes
        // and would overwrite it with page 1. A finished comic starts again from the top.
        const done = (NomadProgress.get(comicPath) || {}).done;
        const savedPage = done ? 0 : parseInt(NomadPrefs.raw('comic_page_' + comicPath) || '0');
        currentPage = Math.max(0, Math.min(savedPage, entries.length - 1));

        document.getElementById('mode-select').value = mode;
        document.getElementById('direction-select').value = direction;
        applyDirection();
        applyMode();

        if (mode === 'webtoon') {
            setupWebtoonObserver();
        } else {
            goToPage(currentPage);
        }
    }

    let observer = null;
    let pageAspectSet = false;

    // long comics crash low-memory phones if every decoded page stays resident. CBZ and
    // folder pages re-fetch cheaply, so drop pages past UNLOAD_MARGIN. RAR is excluded:
    // the whole archive is already in memory.
    function unloadPage(idx) {
        const entry = entries[idx];
        const url = blobURLs[idx];
        if (!entry || !url || entry.type === 'rar') return;

        URL.revokeObjectURL(url);
        delete blobURLs[idx];

        const img = document.getElementById(`img-${idx}`);
        if (img) {
            img.removeAttribute('src');
            img.style.display = 'none';
            img.dataset.loaded = 'false';
            img.dataset.retryCount = '0';
        }

        const wrapper = document.getElementById(`page-wrapper-${idx}`);
        if (wrapper && !document.getElementById(`placeholder-${idx}`)) {
            const placeholder = document.createElement('div');
            placeholder.className = 'page-placeholder';
            placeholder.id = `placeholder-${idx}`;
            wrapper.insertBefore(placeholder, img || null);
        }
    }

    function unloadFarPages(centerIdx) {
        for (const key of Object.keys(blobURLs)) {
            const idx = parseInt(key, 10);
            if (Math.abs(idx - centerIdx) > UNLOAD_MARGIN) unloadPage(idx);
        }
    }

    function setupWebtoonObserver() {
        if (observer) observer.disconnect();

        observer = new IntersectionObserver((changes) => {
            // where you are first: the reads below are ordered (and old ones dropped) by it
            const shown = changes.filter(c => c.isIntersecting).map(c => parseInt(c.target.dataset.index));
            if (!shown.length) return;
            trackWebtoon();
            for (const idx of shown) {
                for (let i = idx; i < Math.min(entries.length, idx + PRELOAD); i++) decodeImage(i);
            }
        }, {
            root: null,
            rootMargin: '600px 0px 600px 0px',
            threshold: 0.01
        });

        document.querySelectorAll('.page-wrapper').forEach(w => observer.observe(w));

        for (let i = 0; i < Math.min(entries.length, 5); i++) {
            decodeImage(i);
        }
    }

    /* The current page in Webtoon: the one across the upper part of the screen, or the last
       at the bottom. Not taken from the observer, it also reports pages 600 px below and
       would save a page or more ahead. Waits until the saved place has been scrolled to. */
    let webtoonReady = false, trackQueued = false;
    function trackWebtoon() {
        if (mode !== 'webtoon' || !webtoonReady || !entries.length) return;
        const el = document.elementFromPoint(window.innerWidth / 2, 52 + (window.innerHeight - 52) * 0.3);
        const w = el && el.closest && el.closest('.page-wrapper');
        const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
        const idx = atBottom ? entries.length - 1 : w ? parseInt(w.dataset.index) : currentPage;
        if (idx === currentPage && !atBottom) return;
        currentPage = idx;
        updateIndicator();
        savePlace(idx);
        unloadFarPages(idx);
    }
    window.addEventListener('scroll', () => {
        if (trackQueued) return;
        trackQueued = true;
        requestAnimationFrame(() => { trackQueued = false; trackWebtoon(); });
    }, { passive: true });

    // the exact page for coming back to it, and how far along for the Books shelf and the
    // menu's Continue (NomadProgress, nomad-utils.js). A finished comic opened again on its
    // first page stays finished until you turn one.
    function savePlace(idx) {
        NomadPrefs.setRaw('comic_page_' + comicPath, idx);
        const n = entries.length;
        if (!n) return;
        const was = NomadProgress.get(comicPath);
        if (idx === 0 && was && was.done) return;
        const info = { k: 'comic', t: comicName(comicPath.split('/').pop()) };
        const last = mode === 'two-page' ? spreadStart(idx) + 2 >= n : idx >= n - 1;
        if (last) NomadProgress.finish(comicPath, info);
        else NomadProgress.note(comicPath, Object.assign(info, { p: (idx + 1) / n, l: `Page ${idx + 1} of ${n}` }));
    }

    // straight there: a smooth scroll down a long comic passes every page on the way and
    // asks the card for each of them
    function scrollToPage(idx) {
        const el = document.getElementById(`page-wrapper-${idx}`);
        if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
    }

    async function decodeImage(idx) {
        const wrapper = document.getElementById(`page-wrapper-${idx}`);
        const placeholder = document.getElementById(`placeholder-${idx}`);
        const img = document.getElementById(`img-${idx}`);

        if (placeholder) placeholder.classList.add('loading');
        if (!img) return;
        if (img.dataset.loaded === 'true') return;
        img.dataset.loaded = 'true';

        const MAX_RETRIES = 3;
        const retryCount = parseInt(img.dataset.retryCount || '0');

        if (retryCount >= MAX_RETRIES) {
            console.error(`[ComicReader] Page ${idx} failed after ${MAX_RETRIES} retries, giving up`);
            if (placeholder) {
                placeholder.classList.remove('loading');
                placeholder.textContent = 'Failed to load';
            }
            return;
        }

        try {
            const entry = entries[idx];
            let blob;

            if (entry.type === 'cbz') {
                blob = await cardRead(idx, () => cbzPage(entry));
            } else if (entry.type === 'rar') {
                blob = new Blob([entry.data]);
            } else {
                // a page of a folder comic: the whole image file, through the same few-at-a-time reads
                blob = await cardRead(idx, async () => new Blob([(await rangeRead('/media?file=' + encodeURIComponent(entry.path), 'bytes=0-')).buf]));
            }

            const url = URL.createObjectURL(blob);
            blobURLs[idx] = url;

            img.onload = () => {
                if (!pageAspectSet && img.naturalWidth && img.naturalHeight) {
                    pageAspectSet = true;
                    document.documentElement.style.setProperty('--page-aspect', `${img.naturalWidth} / ${img.naturalHeight}`);
                    document.documentElement.classList.add('page-aspect-known');
                }
                if (placeholder) placeholder.remove();
                img.style.display = 'block';
                img.dataset.loaded = 'true';
                img.dataset.retryCount = '0';
                // the Blob already copied the bytes, so once decoded drop the raw
                // extracted copy (matters for CBR, the whole archive is in memory)
                if (entry.type === 'rar') entry.data = null;
            };

            img.onerror = () => {
                console.error(`[ComicReader] Image element failed to load for page ${idx}`);
                img.dataset.loaded = 'false';
                if (placeholder) {
                    placeholder.classList.remove('loading');
                    placeholder.textContent = 'Failed';
                }
                URL.revokeObjectURL(url);
                delete blobURLs[idx];
            };

            img.src = url;

        } catch (err) {
            img.dataset.loaded = 'false';
            // scrolled away before its turn: it loads again when it comes back into view
            if (err && err.message === 'stale') { if (placeholder) placeholder.classList.remove('loading'); return; }
            console.error(`[ComicReader] Page ${idx} decode error:`, err.message || err);
            if (placeholder) {
                placeholder.classList.remove('loading');
                placeholder.textContent = 'Failed';
            }

            const newRetryCount = retryCount + 1;
            if (newRetryCount < MAX_RETRIES) {
                const retryDelay = Math.min(1000 * Math.pow(2, retryCount), 30000);
                img.dataset.retryCount = newRetryCount.toString();
                setTimeout(() => decodeImage(idx), retryDelay);
            } else {
                console.error(`[ComicReader] Page ${idx} failed permanently after ${MAX_RETRIES} retries`);
            }
        }
    }

    function changeMode() {
        const modeSelect = document.getElementById('mode-select');
        mode = modeSelect.value;
        NomadPrefs.setRaw('nomad_comic_mode', mode);
        applyMode();
    }

    function changeDirection() {
        const directionSelect = document.getElementById('direction-select');
        direction = directionSelect.value;
        NomadPrefs.setRaw('nomad_comic_direction', direction);
        applyDirection();
    }

    function applyDirection() {
        if (direction === 'rtl') {
            document.body.classList.add('rtl');
        } else {
            document.body.classList.remove('rtl');
        }
        updateIndicator();
    }

    function applyMode() {
        const reader   = document.getElementById('reader');
        const controls = document.getElementById('page-controls');

        if (mode === 'paged' || mode === 'two-page') {
            reader.className = mode;
            controls.classList.add('visible');
            document.body.classList.add('paged-mode');
            if (observer) { observer.disconnect(); observer = null; }
            goToPage(currentPage);
        } else {
            reader.className = 'webtoon';
            controls.classList.remove('visible');
            document.body.classList.remove('paged-mode');
            document.querySelectorAll('.page-wrapper').forEach(w => {
                w.classList.remove('active');
                w.style.display = '';
            });
            webtoonReady = false;
            setupWebtoonObserver();
            setTimeout(() => { scrollToPage(currentPage); webtoonReady = true; }, 100);
        }
        updateIndicator();
    }

    // bookmarks and notes by page, kept on this phone
    document.addEventListener('DOMContentLoaded', () => {
        NomadMarks.attach(document.getElementById('marks-btn'), {
            key: () => comicPath,
            title: () => document.getElementById('comic-title').textContent,
            here: () => (typeof entries !== 'undefined' && entries.length ? { at: currentPage, order: currentPage, label: 'Page ' + (currentPage + 1) } : null),
            go: (i) => { i = +i; if (mode === 'webtoon') { currentPage = i; scrollToPage(i); updateIndicator(); savePlace(i); } else goToPage(i); },
        });
    });

    function goToPage(idx) {
        if (idx < 0) idx = 0;
        if (idx >= entries.length) idx = entries.length - 1;
        currentPage = idx;

        document.querySelectorAll('.page-wrapper').forEach(w => {
            w.classList.remove('active');
        });

        if (mode === 'two-page') {
            const firstPage = idx % 2 === 0 ? idx : idx - 1;
            for (let i = firstPage; i < Math.min(firstPage + 2, entries.length); i++) {
                const wrapper = document.getElementById(`page-wrapper-${i}`);
                if (wrapper) wrapper.classList.add('active');
                decodeImage(i);
            }
            for (let i = firstPage + 2; i < Math.min(entries.length, firstPage + 2 + PRELOAD); i++) {
                decodeImage(i);
            }
        } else {
            const wrapper = document.getElementById(`page-wrapper-${idx}`);
            if (wrapper) wrapper.classList.add('active');
            decodeImage(idx);
            for (let i = idx + 1; i < Math.min(entries.length, idx + PRELOAD); i++) {
                decodeImage(i);
            }
        }

        updateIndicator();
        savePlace(idx);
        unloadFarPages(idx);
    }

    /* Turning pages. forward() and back() go in reading order. Which side of the screen
       does which depends on the direction. Right to left (manga) goes forward with the left
       button, a tap on the left, the left arrow and a swipe to the right. Past the last
       page, forward opens the next comic in the folder, in either direction. */
    const spreadStart = (i) => mode === 'two-page' ? i - (i % 2) : i;
    const pageStep = () => mode === 'two-page' ? 2 : 1;
    const atLastPage = () => spreadStart(currentPage) + pageStep() >= entries.length;
    function forward() {
        if (atLastPage()) { if (nextComic) openNextComic(); return; }
        goToPage(spreadStart(currentPage) + pageStep());
    }
    function back() {
        const start = spreadStart(currentPage);
        if (start > 0) goToPage(Math.max(0, start - pageStep()));
    }
    function sideAction(side) { return (side === 'left') === (direction === 'rtl') ? forward : back; }
    let swipedAt = 0;
    function tapSide(side) {
        if (Date.now() - swipedAt < 400) return;   // the tap a swipe ends with
        sideAction(side)();
    }

    // a swipe across the page in the page modes: one finger, mostly sideways, and not while
    // zoomed in (then a finger moves around the page)
    let swipe = null;
    document.addEventListener('touchstart', (e) => {
        const zoomed = window.visualViewport && window.visualViewport.scale > 1.01;
        const onBar = e.target && e.target.closest && e.target.closest('#topbar, #page-controls');
        swipe = mode !== 'webtoon' && e.touches.length === 1 && !zoomed && !onBar
            ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) swipe = null; }, { passive: true });
    document.addEventListener('touchend', (e) => {
        if (!swipe) return;
        const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
        swipe = null;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        swipedAt = Date.now();
        sideAction(dx < 0 ? 'right' : 'left')();
    }, { passive: true });

    /* The next comic in the same folder: chapters of a webtoon, issues of a series. Only in
       a subfolder. On the Books shelf itself the neighbours are unrelated books. */
    let nextComic = null;
    const comicName = (n) => n.replace(/\.(cbz|cbr)$/i, '').replace(/[_]+/g, ' ');
    async function findNextComic() {
        const parent = comicPath.slice(0, comicPath.lastIndexOf('/'));
        if (!parent || /^\/books$/i.test(parent)) return;
        try {
            let r = await fetch('/api/index?path=' + encodeURIComponent(parent), { cache: 'no-store' });
            if (r.status === 503) { await sleep(1500); r = await fetch('/api/index?path=' + encodeURIComponent(parent), { cache: 'no-store' }); }
            if (!r.ok) return;
            const items = [];
            for (const line of (await r.text()).split('\n').slice(1)) {
                try { const e = JSON.parse(line); if ((e.t === 'f' && /\.(cbz|cbr)$/i.test(e.n)) || (e.t === 'd' && e.comic)) items.push(e.n); } catch (x) {}
            }
            items.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            const i = items.indexOf(comicPath.split('/').pop());
            if (i < 0 || i + 1 >= items.length) return;
            nextComic = { name: comicName(items[i + 1]), path: parent + '/' + items[i + 1] };
            const top = document.getElementById('next-comic');
            top.hidden = false; top.title = 'Next: ' + nextComic.name;
            document.getElementById('end-next').textContent = 'Next: ' + nextComic.name + ' \u203a';
            document.getElementById('end-card').hidden = false;
            updateIndicator();
        } catch (e) { /* no next button, nothing else changes */ }
    }
    function openNextComic() {
        if (nextComic) window.location.href = '/comics?path=' + encodeURIComponent(nextComic.path);
    }

    function updateIndicator() {
        const total = entries.length;
        const cur   = currentPage + 1;
        document.getElementById('page-indicator').textContent = cur + ' / ' + total;
        const paged = document.getElementById('paged-indicator');
        if (paged) paged.textContent = cur + ' / ' + total;
        // the buttons sit left and right, which one goes forward follows the direction
        const left = document.getElementById('btn-left'), right = document.getElementById('btn-right');
        if (left && right && total) {
            const end = atLastPage(), fwd = end && nextComic ? 'Next comic' : 'Next';
            const [fwdBtn, backBtn] = direction === 'rtl' ? [left, right] : [right, left];
            fwdBtn.disabled = end && !nextComic;
            backBtn.disabled = spreadStart(currentPage) === 0;
            left.textContent = '\u2190 ' + (direction === 'rtl' ? fwd : 'Prev');
            right.textContent = (direction === 'rtl' ? 'Prev' : fwd) + ' \u2192';
        }
    }

    document.addEventListener('keydown', e => {
        if ((mode === 'paged' || mode === 'two-page') && !/^(SELECT|INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || '')) {
            // left and right arrows are sides of the screen, like the taps. down and up are reading order
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); sideAction(e.key === 'ArrowLeft' ? 'left' : 'right')(); }
            else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); forward(); }
            else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); back(); }
        }
        // no "f" shortcut: toggleMode doesn't exist in this build
    });

    let lastScrollY = 0;
    window.addEventListener('scroll', () => {
        if (mode !== 'webtoon') return;
        const topbar = document.getElementById('topbar');
        const dy = window.scrollY - lastScrollY;
        lastScrollY = window.scrollY;
        if (dy > 10) {
            topbar.classList.add('hidden');
        } else if (dy < -10) {
            topbar.classList.remove('hidden');
        }
    }, { passive: true });

    if (typeof pako === 'undefined') {
        showFatalError('The comic reader is missing a file. Copy the card files onto it again.');
    } else if (typeof archiveOpenArrayBuffer === 'undefined') {
        showFatalError('The comic reader is missing a file. Copy the card files onto it again.');
    } else {
        loadArchiveFormats(['rar']);
        init();
        findNextComic();
    }
    </script>
</body>
</html>
