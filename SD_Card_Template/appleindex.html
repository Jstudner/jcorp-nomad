<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
<script>/* nomad-load-guard: reload, twice at most, when one of Nomad's own scripts or stylesheets fails to load */(function(){var k='nomadLoadGuard:'+location.pathname;window.addEventListener('error',function(e){var t=e.target;if(!t||!t.tagName)return;var s=t.tagName==='SCRIPT',c=t.tagName==='LINK'&&/stylesheet/i.test(t.rel||'');if(!s&&!c)return;var u=t.src||t.href||'';if(u.indexOf(location.origin+'/')!==0)return;var n=0;try{n=+sessionStorage.getItem(k)||0;}catch(x){return;}if(n>=2)return;try{sessionStorage.setItem(k,String(n+1));}catch(x){return;}setTimeout(function(){location.reload();},1500*(n+1));},true);window.addEventListener('load',function(){setTimeout(function(){try{sessionStorage.removeItem(k);}catch(x){}},15000);});})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jcorp Nomad Media Server - Instructions for Apple Devices">
    <title>Jcorp Nomad - Instructions (Apple)</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/master.css">
    <script src="/theme-boot.js?v=5"></script>
    <script src="/theme-manager.js?v=5"></script>
    <style>
        /* layout only, colors come from master.css tokens so it follows dark/custom themes */
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--font-primary);
            background: var(--bg);
            color: var(--text);
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        /* uses master.css's shared header components (like menu.html) so it looks like part of the app */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .instructions {
            font-size: 1.1em;
            background: var(--card);
            color: var(--text);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 500px;
            padding: 28px 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .instructions h3 {
            margin: 0 0 10px;
        }
        .instructions > p {
            margin: 0 0 18px;
        }
        .instructions > p:empty {
            display: none;
        }
        .instructions ol {
            list-style-position: inside;
            margin: 0 0 18px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* mobile steps show by default, PC steps + "Go to Menu" appear once adjustForDevice() sees a wide screen */
        .step-pc { display: none; }
        body.is-pc .step-pc { display: list-item; }
        body.is-pc .step-mobile { display: none; }
        .copy-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        #copyLink {
            flex: 1 1 200px;
            max-width: 240px;
            padding: 8px;
            font-size: 1em;
            text-align: center;
            box-sizing: border-box;
            word-wrap: break-word;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-small);
            background: var(--bg);
            color: var(--text);
        }
        .buttons {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .buttons a {
            font-size: 1.2em;
            padding: 15px 25px;
        }
        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
                gap: 10px;
            }
            .buttons a {
                width: 90%;
                padding: 12px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo" aria-hidden="false">
                <img src="/Logo.png" alt="Jcorp Nomad logo" onerror="this.style.display='none'">
            </div>
            <div style="min-width:0">
                <div class="title">Jcorp Nomad</div>
            </div>
        </div>
    </header>

    <div class="content">
        <div class="instructions" id="instructions">
            <h3 id="instructionHeader">Connect to Nomad</h3>
            <p id="instructionText"></p>
            <ol id="instructionList">
                <li>Copy this link.</li>
                <li>
                    <div class="copy-row">
                        <input type="text" value="192.168.4.1/menu" id="copyLink" readonly>
                        <button id="copyLinkButton" type="button" class="btn btn-success">Copy link</button>
                    </div>
                </li>
                <li class="step-mobile">Tap "Cancel" in the top-right corner.</li>
                <li class="step-mobile">Select "Use Without Internet".</li>
                <li class="step-mobile">Paste the link into your browser.</li>
                <li class="step-pc">Open the link in a new browser tab.</li>
            </ol>
        </div>

        <!-- shown on wide screens only -->
        <div class="buttons" id="goToMenuButton">
            <a class="btn btn-primary" href="/menu">Go to menu</a>
        </div>
    </div>

    <script>
    (function() {
        const copyLink = document.getElementById('copyLink');
        const copyLinkButton = document.getElementById('copyLinkButton');
        const instructionHeader = document.getElementById('instructionHeader');
        const instructionText = document.getElementById('instructionText');
        const goToMenuButton = document.getElementById('goToMenuButton');

        copyLinkButton.addEventListener('click', () => {
            copyLink.select();
            copyLink.setSelectionRange(0, 99999); // iOS Safari needs an explicit range to select
            try {
                // navigator.clipboard needs HTTPS and we're plain HTTP, so use execCommand
                // it returns false, without throwing, when the browser refused
                if (!document.execCommand('copy')) throw new Error('copy refused');
                alert('Link copied');
            } catch (e) {
                alert("Couldn't copy. The link is selected, copy it by hand.");
            }
        });

        // PCs get a "Go to menu" button + different steps, phones get the captive-portal steps.
        // just toggles pre-rendered steps, doesnt rebuild markup
        function adjustForDevice() {
            const isPC = window.innerWidth > 600;
            document.body.classList.toggle('is-pc', isPC);
            if (isPC) {
                instructionHeader.textContent = "You're on a PC!";
                instructionText.textContent = '';
            } else {
                instructionHeader.textContent = 'Connect to Nomad';
                instructionText.textContent = '';
            }
            goToMenuButton.style.display = isPC ? 'flex' : 'none';
        }

        adjustForDevice();
    })();
    </script>
</body>
</html>
