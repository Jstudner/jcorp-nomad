<!DOCTYPE html>
<!-- Version 7: first game on /assets/game-shell.js -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="nomad-modes" content="pass,room"/>
<title>Nomad • Tic-Tac-Toe</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/theme-manager.js?v=5"></script>
<script src="/assets/mp-client.js"></script>
<script src="/assets/game-shell.js"></script>
<style>
  /* The shell owns the lobby, the panel and their CSS. This is just the board. */
  main{max-width:520px;margin:0 auto;padding:14px}
  #board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
  #board button{aspect-ratio:1;font-size:3rem;font-weight:700;border-radius:12px;cursor:pointer;
    background:var(--bg);border:1px solid var(--line);color:var(--text)}
  #board button:disabled{cursor:default;opacity:.9}
  #board button.win{background:var(--primary);color:#fff}
</style>
</head>
<body>
  <header>
    <h1>Tic-Tac-Toe</h1>
    <a class="back-btn" href="/games">← Back to Games</a>
  </header>

  <main></main>

<script>
/* Tic-Tac-Toe. Two players, on one phone or two.

   Everything below is written for a room. For pass-and-play, game-shell.js
   swaps in a local MP whose seat follows the move count, so mySymbol() is
   whoever is holding the phone and MP.myTurn() is true for them.

   GameShell.init has to be the first statement, it injects the markup the
   getElementById calls below need. The callbacks passed to it are hoisted
   function declarations. Don't turn them into `const fn = () => ...`, init
   would hit them before they exist. */
GameShell.init({
  id: 'ttt',
  name: 'Tic-Tac-Toe',
  modes: ['pass', 'room'],
  seats_named: ['X', 'O'],
  onStart: render,
  onUpdate: onUpdate,
  onInfo: onInfo,
  onRematch: playAgain,
  isOver: isOver,
  pollInterval: 1000
});

const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board = '---------';
let over = false;
const mySymbol = () => MP.room.seat === 0 ? 'X' : 'O';

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function isOver(){
  return !!winnerLine() || !board.includes('-');
}

function render(){
  boardEl.innerHTML = '';
  const winLine = winnerLine();
  // set `over` before building the buttons, each one checks it, or the empty
  // squares stay clickable after a win
  over = isOver();
  for (let i = 0; i < 9; i++){
    const b = document.createElement('button');
    b.textContent = board[i] === '-' ? '' : board[i];
    if (winLine && winLine.includes(i)) b.classList.add('win');
    b.disabled = over || board[i] !== '-' || !MP.myTurn() || !MP.room.joined;
    b.onclick = () => play(i);
    boardEl.appendChild(b);
  }
  updateStatus();
}

function winnerLine(){
  for (const w of WINS){
    if (board[w[0]] !== '-' && board[w[0]] === board[w[1]] && board[w[1]] === board[w[2]]) return w;
  }
  return null;
}

function updateStatus(){
  const w = winnerLine();
  statusEl.classList.remove('hot');
  over = isOver();
  document.getElementById('againBtn').classList.toggle('hidden', !over || !MP.room.joined);
  if (w){
    const sym = board[w[0]];
    statusEl.textContent = sym === mySymbol() ? `You win! (${sym})` : `${sym} wins. Better luck next time`;
    statusEl.classList.add('hot');
  } else if (over){
    statusEl.textContent = "It's a draw!";
  } else if (!MP.room.joined){
    statusEl.textContent = `Waiting for a second player… (you are ${mySymbol()})`;
  } else if (MP.myTurn()){
    statusEl.textContent = `Your turn (${mySymbol()})`;
    statusEl.classList.add('hot');
  } else {
    statusEl.textContent = `Opponent's turn (${mySymbol() === 'X' ? 'O' : 'X'})`;
  }
}

async function play(i){
  if (over || board[i] !== '-' || !MP.myTurn()) return;
  const next = board.slice(0, i) + mySymbol() + board.slice(i + 1);
  try {
    await MP.move(JSON.stringify({ b: next }));
    board = next;
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}

function onUpdate(stateStr){
  try {
    const s = JSON.parse(stateStr);
    if (s && typeof s.b === 'string' && s.b.length === 9){ board = s.b; }
  } catch(e){}
  render();
}

/* Rematch in the same room with the same code. The firmware alternates who goes
   first and the other player gets the new board from the poll. The local driver
   alternates the same way. */
async function playAgain(){
  try {
    await MP.reset(JSON.stringify({ b: '---------' }));
    board = '---------';
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}

function onInfo(j){
  if (j.gone){ statusEl.textContent = 'Room expired.'; over = true; render(); MP.stop(); return; }
  render();
}
</script>
</body>
</html>
