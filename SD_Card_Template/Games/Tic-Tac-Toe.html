<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nomad • Tic-Tac-Toe</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js"></script>
<script src="/theme-manager.js"></script>
<script src="/assets/mp-client.js"></script>
<style>
  main{max-width:520px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:1.1rem;text-transform:uppercase;width:120px;text-align:center;letter-spacing:.2em}
  .btn{background:var(--primary);color:var(--color-white,#fff);border:none;border-radius:8px;
    padding:10px 18px;cursor:pointer;font-size:1rem}
  .btn.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  .code-big{font-size:2rem;letter-spacing:.35em;font-weight:700;color:var(--primary);text-align:center;margin:6px 0}
  .status{text-align:center;color:var(--muted);min-height:1.4em;margin:8px 0}
  .status.hot{color:var(--primary);font-weight:600}
  #board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
  #board button{aspect-ratio:1;font-size:3rem;font-weight:700;border-radius:12px;cursor:pointer;
    background:var(--bg);border:1px solid var(--line);color:var(--text)}
  #board button:disabled{cursor:default;opacity:.9}
  #board button.win{background:var(--primary);color:#fff}
  .hidden{display:none!important}
  .center{text-align:center}
</style>
</head>
<body>
  <header>
    <h1>Tic-Tac-Toe</h1>
    <a class="back-btn" href="/games.html">← Back to Games</a>
  </header>

  <main>
    <div class="card" id="lobby">
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="createRoom()">Create Room</button>
      </div>
      <p class="center" style="color:var(--muted)">or join a friend</p>
      <div class="row" style="justify-content:center">
        <input type="text" id="joinCode" maxlength="4" placeholder="CODE">
        <button class="btn secondary" onclick="joinRoom()">Join</button>
      </div>
      <div class="status" id="lobbyMsg"></div>
    </div>

    <div class="card hidden" id="game">
      <div class="code-big" id="roomCode"></div>
      <div class="status" id="status">Waiting…</div>
      <div id="board"></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn secondary" onclick="location.reload()">Leave / New Room</button>
      </div>
    </div>
  </main>

<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board = '---------';
let over = false;
const mySymbol = () => MP.room.seat === 0 ? 'X' : 'O';

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function render(){
  boardEl.innerHTML = '';
  const winLine = winnerLine();
  for (let i = 0; i < 9; i++){
    const b = document.createElement('button');
    b.textContent = board[i] === '-' ? '' : board[i];
    if (winLine && winLine.includes(i)) b.classList.add('win');
    b.disabled = over || board[i] !== '-' || !MP.myTurn() || !MP.room.joined;
    b.onclick = () => play(i);
    boardEl.appendChild(b);
  }
  updateStatus();
}

function winnerLine(){
  for (const w of WINS){
    if (board[w[0]] !== '-' && board[w[0]] === board[w[1]] && board[w[1]] === board[w[2]]) return w;
  }
  return null;
}

function updateStatus(){
  const w = winnerLine();
  statusEl.classList.remove('hot');
  if (w){
    over = true;
    const sym = board[w[0]];
    statusEl.textContent = sym === mySymbol() ? `You win! (${sym})` : `${sym} wins. Better luck next time`;
    statusEl.classList.add('hot');
  } else if (!board.includes('-')){
    over = true;
    statusEl.textContent = "It's a draw!";
  } else if (!MP.room.joined){
    statusEl.textContent = `Share the code and wait for a second player… (you are ${mySymbol()})`;
  } else if (MP.myTurn()){
    statusEl.textContent = `Your turn (${mySymbol()})`;
    statusEl.classList.add('hot');
  } else {
    statusEl.textContent = `Opponent's turn (${mySymbol() === 'X' ? 'O' : 'X'})`;
  }
}

async function play(i){
  if (over || board[i] !== '-' || !MP.myTurn()) return;
  const next = board.slice(0, i) + mySymbol() + board.slice(i + 1);
  try {
    await MP.move(JSON.stringify({ b: next }));
    board = next;
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}

function onUpdate(stateStr){
  try {
    const s = JSON.parse(stateStr);
    if (s && typeof s.b === 'string' && s.b.length === 9){ board = s.b; }
  } catch(e){}
  render();
}

function onInfo(j){
  if (j.gone){ statusEl.textContent = 'Room expired.'; over = true; render(); MP.stop(); return; }
  render();
}

function enterGame(){
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('roomCode').textContent = MP.room.code;
  render();
  MP.poll(onUpdate, onInfo, 1000);
}

async function createRoom(){
  try { await MP.create('ttt'); enterGame(); }
  catch(e){ document.getElementById('lobbyMsg').textContent = e.message; }
}

async function joinRoom(){
  const code = document.getElementById('joinCode').value;
  if (!code) return;
  try { await MP.join(code); enterGame(); }
  catch(e){ document.getElementById('lobbyMsg').textContent = e.message; }
}
document.getElementById('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
</script>
</body>
</html>
