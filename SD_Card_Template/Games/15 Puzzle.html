<!DOCTYPE html>
<!-- Version 1 -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="nomad-modes" content="solo"/>
<title>Nomad • 15 Puzzle</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js"></script>
<script src="/theme-manager.js"></script>
<style>
  main{max-width:480px;margin:0 auto;padding:14px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--text);border:none;padding:9px 14px;
    cursor:pointer;font-size:.95rem}
  .seg button[aria-pressed="true"]{background:var(--primary);color:var(--color-white,#fff)}
  .btn{background:var(--primary);color:var(--color-white,#fff);border:none;border-radius:8px;
    padding:10px 18px;cursor:pointer;font-size:1rem;min-height:44px}
  .btn.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  /* .hud and .sq because master.css already uses .meta and .tile */
  .hud{display:flex;justify-content:center;gap:18px;color:var(--muted);
    font-size:.92rem;margin-bottom:10px}
  .hud b{color:var(--text)}
  /* width:100% is needed. master.css makes <main> a column flex container, and
     `margin:0 auto` on a flex item stops it stretching, so the board shrinks to
     the width of its digits. Sudoku's board has the same fix. */
  #board{display:grid;gap:6px;width:100%;max-width:min(92vw,400px);margin:0 auto;
    background:var(--line);border-radius:12px;padding:6px;box-sizing:border-box;
    touch-action:manipulation;user-select:none}
  .sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border:none;border-radius:8px;background:var(--primary);color:var(--color-white,#fff);
    font-weight:700;cursor:pointer;padding:0;
    font-size:clamp(1rem,7vw,1.9rem);transition:transform .08s ease}
  .sq:active{transform:scale(.96)}
  .sq.blank{background:transparent;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
  .sq.home{background:var(--primary-dark,#0b5ed7)}
  .sq:disabled{cursor:default}
  .status{text-align:center;color:var(--muted);min-height:1.5em;margin:12px 0}
  .status.win{color:var(--primary);font-weight:700;font-size:1.1rem}
  .foot{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
</style>
</head>
<body>
  <header>
    <h1>15 Puzzle</h1>
    <a class="back-btn" href="/games">← Back to Games</a>
  </header>

  <main>
    <div class="bar">
      <div class="seg" id="sizeSeg" role="group" aria-label="Puzzle size">
        <button type="button" data-n="3" aria-pressed="false">3 × 3</button>
        <button type="button" data-n="4" aria-pressed="true">4 × 4</button>
        <button type="button" data-n="5" aria-pressed="false">5 × 5</button>
      </div>
      <button class="btn" id="newBtn" type="button">Shuffle</button>
    </div>

    <div class="hud">
      <span>Moves <b id="moves">0</b></span>
      <span>Time <b id="timer">0:00</b></span>
      <span id="bestWrap">Best <b id="best">—</b></span>
    </div>

    <div id="board" role="grid" aria-label="Sliding puzzle"></div>
    <div class="status" id="status"></div>

    <div class="foot">
      <button class="btn secondary" id="solveBtn" type="button">Reset to solved</button>
    </div>
  </main>

<script>
'use strict';
/* 15 Puzzle. Solo, so it never touches /api/mp/*.

   Tiles slide into the gap. Tapping any tile in the gap's row or column slides
   the whole run.

   SOLVABILITY. Half of all random arrangements can't be solved. The shuffle
   makes random legal slides from the solved board instead, so every shuffle can
   be undone. */

const boardEl  = document.getElementById('board');
const statusEl = document.getElementById('status');
const movesEl  = document.getElementById('moves');
const timerEl  = document.getElementById('timer');
const bestEl   = document.getElementById('best');

let n = 4;
let tiles = [];        // tiles[i] = the number at position i; 0 is the gap
let moves = 0;
let started = 0;       // ms of the first move, 0 while the board is untouched
let ticker = null;
let solved = true;

const bestKey = () => 'nomad_15_best_' + n;
const goal = () => Array.from({ length: n * n }, (_, i) => (i + 1) % (n * n));

function readBest(){
  try { return parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch(e){ return 0; }
}
function writeBest(v){
  try { localStorage.setItem(bestKey(), String(v)); } catch(e){}
}

function isSolved(){
  const g = goal();
  return tiles.every((v, i) => v === g[i]);
}

/* Positions that can slide into the gap: the gap's whole row and column.
   Returns null for a position that can't move. */
function runFor(pos){
  const gap = tiles.indexOf(0);
  const gr = Math.floor(gap / n), gc = gap % n;
  const r = Math.floor(pos / n), c = pos % n;
  if (r !== gr && c !== gc) return null;
  if (pos === gap) return null;
  const run = [];
  if (r === gr){
    const step = c < gc ? 1 : -1;
    for (let x = c; x !== gc; x += step) run.push(r * n + x);
  } else {
    const step = r < gr ? 1 : -1;
    for (let y = r; y !== gr; y += step) run.push(y * n + c);
  }
  return run;
}

/* Slide every tile in the run one place towards the gap. Counts as one move per
   tile moved, which is how these puzzles are scored. */
function slide(pos){
  const run = runFor(pos);
  if (!run || !run.length) return 0;
  let gap = tiles.indexOf(0);
  // walk from the tile nearest the gap outwards, so nothing is overwritten
  for (let k = run.length - 1; k >= 0; k--){
    tiles[gap] = tiles[run[k]];
    tiles[run[k]] = 0;
    gap = run[k];
  }
  return run.length;
}

function tap(pos){
  if (solved) return;
  const moved = slide(pos);
  if (!moved) return;
  moves += moved;
  if (!started){ started = Date.now(); ticker = setInterval(paintTime, 500); }
  render();
  if (isSolved()) finish();
}

function finish(){
  solved = true;
  clearInterval(ticker); ticker = null;
  const prev = readBest();
  const record = !prev || moves < prev;
  if (record) writeBest(moves);
  statusEl.className = 'status win';
  statusEl.textContent = record
    ? `Solved in ${moves} moves - a new best!`
    : `Solved in ${moves} moves.`;
  render();
}

function paintTime(){
  const s = started ? Math.floor((Date.now() - started) / 1000) : 0;
  timerEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function render(){
  boardEl.style.gridTemplateColumns = `repeat(${n},1fr)`;
  boardEl.innerHTML = '';
  const g = goal();
  for (let i = 0; i < n * n; i++){
    const v = tiles[i];
    const b = document.createElement('button');
    b.className = 'sq' + (v === 0 ? ' blank' : (v === g[i] ? ' home' : ''));
    b.textContent = v === 0 ? '' : v;
    b.disabled = solved || v === 0 || !runFor(i);
    if (v !== 0) b.setAttribute('aria-label', `Tile ${v}`);
    b.onclick = () => tap(i);
    boardEl.appendChild(b);
  }
  movesEl.textContent = moves;
  const best = readBest();
  bestEl.textContent = best ? best + ' moves' : '—';
  paintTime();
}

/* Walk backwards from solved. Never undo the slide just made, or it mostly
   shuffles the same two tiles back and forth. */
function shuffle(){
  tiles = goal();
  let lastGap = -1;
  const steps = n * n * 12;
  for (let k = 0; k < steps; k++){
    const gap = tiles.indexOf(0);
    const gr = Math.floor(gap / n), gc = gap % n;
    const options = [];
    if (gr > 0)     options.push(gap - n);
    if (gr < n - 1) options.push(gap + n);
    if (gc > 0)     options.push(gap - 1);
    if (gc < n - 1) options.push(gap + 1);
    const pick = options.filter(o => o !== lastGap);
    const from = (pick.length ? pick : options)[Math.floor(Math.random() * (pick.length ? pick.length : options.length))];
    lastGap = gap;
    tiles[gap] = tiles[from];
    tiles[from] = 0;
  }
  // a shuffle that lands back on solved is not a puzzle
  if (isSolved()) return shuffle();
  moves = 0; started = 0; solved = false;
  clearInterval(ticker); ticker = null;
  statusEl.className = 'status';
  statusEl.textContent = 'Slide the tiles back into order.';
  render();
}

function resetSolved(){
  tiles = goal();
  moves = 0; started = 0; solved = true;
  clearInterval(ticker); ticker = null;
  statusEl.className = 'status';
  statusEl.textContent = 'Shuffle to start.';
  render();
}

document.getElementById('newBtn').onclick = shuffle;
document.getElementById('solveBtn').onclick = resetSolved;
document.getElementById('sizeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  n = Number(b.dataset.n);
  [].forEach.call(e.currentTarget.children, el =>
    el.setAttribute('aria-pressed', String(el === b)));
  shuffle();
});

shuffle();
</script>
</body>
</html>
