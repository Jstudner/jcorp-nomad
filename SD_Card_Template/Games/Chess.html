<!DOCTYPE html>
<!-- Version 7 -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="nomad-modes" content="solo,pass,room"/>
<title>Nomad • Chess</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/theme-manager.js?v=5"></script>
<script src="/assets/chess.min.js"></script>
<script src="/assets/mp-client.js"></script>
<style>
  /* Fixed game palette, games don't follow the user's theme. The header and
     .back-btn still come from master.css. Board colours match the Chess cover art.
     Uses .panel because master.css already styles .card. */
  :root{
    --ch-light:#f0d9b5; --ch-dark:#b58863; --ch-edge:#6f4a2f;
    --ch-ink:#222831; --ch-dim:#6b7280; --ch-line:#dee2e6;
    --ch-surface:#ffffff; --ch-accent:#007bff; --ch-on:#ffffff; --ch-good:#28a745;
    --ch-mark:rgba(20,90,200,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  main{max-width:560px;margin:0 auto;padding:12px}

  .panel{background:var(--ch-surface);border:1px solid var(--ch-line);border-radius:10px;
    padding:16px;margin-bottom:14px}
  .prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;justify-content:center}
  input[type=text]{background:var(--ch-surface);color:var(--ch-ink);border:1px solid var(--ch-line);
    border-radius:8px;padding:10px 12px;font-size:1.1rem;text-transform:uppercase;width:120px;
    text-align:center;letter-spacing:.2em}
  .btn{background:var(--ch-accent);color:var(--ch-on);border:none;border-radius:8px;
    padding:10px 18px;cursor:pointer;font-size:1rem}
  .btn.secondary{background:transparent;color:var(--ch-accent);border:1px solid var(--ch-accent)}
  .seg{display:flex;border:1px solid var(--ch-line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--ch-surface);color:var(--ch-ink);border:none;padding:8px 14px;
    font-size:.92rem;cursor:pointer;border-right:1px solid var(--ch-line)}
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--ch-accent);color:var(--ch-on)}

  .code-big{font-size:2rem;letter-spacing:.35em;font-weight:700;color:var(--ch-accent);
    text-align:center;margin:6px 0}
  .status{text-align:center;color:var(--ch-dim);min-height:1.4em;margin:8px 0}
  .status.hot{color:var(--ch-accent);font-weight:600}
  .status.win{color:var(--ch-good);font-weight:700}

  .board-wrap{position:relative}
  #board{display:grid;grid-template-columns:repeat(8,1fr);max-width:480px;margin:0 auto;
    border:2px solid var(--ch-edge);border-radius:6px;overflow:hidden;user-select:none;
    touch-action:manipulation}
  .sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.6rem,6.5vw,2.6rem);cursor:pointer;position:relative;line-height:1}
  .sq.light{background:var(--ch-light)}
  .sq.dark{background:var(--ch-dark)}
  .sq.sel{outline:3px solid var(--ch-accent);outline-offset:-3px;z-index:1}
  .sq.tgt::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;
    background:var(--ch-mark)}
  .sq.cap::after{content:'';position:absolute;inset:6%;border-radius:50%;
    border:4px solid var(--ch-mark);background:transparent;width:auto;height:auto}
  .sq.last{box-shadow:inset 0 0 0 4px rgba(0,123,255,.35)}
  .sq .wp{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 2px rgba(0,0,0,.7)}
  .sq .bp{color:#111;text-shadow:0 0 2px rgba(255,255,255,.35)}

  /* Promotion picker, anchored to the board so on a phone it covers the board
     instead of floating somewhere in a scrolled page. */
  .promo{position:absolute;inset:0;z-index:5;display:flex;align-items:center;
    justify-content:center;background:rgba(0,0,0,.45);border-radius:6px}
  .promo-inner{background:var(--ch-surface);border:1px solid var(--ch-line);border-radius:12px;
    padding:14px 16px;max-width:92%}
  .promo-title{color:var(--ch-dim);font-size:.95rem;text-align:center;margin-bottom:10px}
  .promo-row{display:flex;gap:10px;justify-content:center}
  .promo-btn{width:64px;height:64px;padding:0;border-radius:10px;border:1px solid var(--ch-line);
    background:var(--ch-surface);color:var(--ch-ink);cursor:pointer;font-size:2.2rem;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .promo-btn:hover{border-color:var(--ch-accent)}
  .promo-btn:focus-visible{outline:2px solid var(--ch-accent);outline-offset:2px}

  /* Handoff screen for pass-and-play. The board flips between turns, so cover it
     while it does. Same idea as the privacy screen in Crazy Eights. */
  .handoff{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;background:var(--ch-surface);
    border-radius:6px;text-align:center;padding:20px}
  .handoff h2{margin:0;font-size:1.3rem;color:var(--ch-ink)}
  .handoff p{margin:0;color:var(--ch-dim);font-size:.95rem}

  .hidden{display:none!important}
  .center{text-align:center}
  :focus-visible{outline:2px solid var(--ch-accent);outline-offset:2px}
</style>
</head>
<body>
  <header>
    <h1>Chess</h1>
    <a class="back-btn" href="/games">← Back to Games</a>
  </header>

  <main>
    <div class="panel" id="lobby">
      <div class="prow">
        <button class="btn" id="soloBtn" type="button">Play solo</button>
        <button class="btn secondary" id="passBtn" type="button">Pass &amp; play</button>
      </div>
      <div class="prow">
        <div class="seg" id="level" role="group" aria-label="Bot strength">
          <button type="button" data-l="easy" aria-pressed="false">Easy</button>
          <button type="button" data-l="normal" aria-pressed="true">Normal</button>
          <button type="button" data-l="hard" aria-pressed="false">Hard</button>
        </div>
      </div>
      <p class="center" style="color:#6b7280;margin:14px 0 6px">or play someone on another phone</p>
      <div class="prow">
        <button class="btn secondary" id="createBtn" type="button">Create room</button>
        <input type="text" id="joinCode" maxlength="4" placeholder="CODE">
        <button class="btn secondary" id="joinBtn" type="button">Join</button>
      </div>
      <div class="status" id="lobbyMsg"></div>
    </div>

    <div class="panel hidden" id="game">
      <div class="code-big hidden" id="roomCode"></div>
      <div class="status" id="status">Waiting…</div>
      <div class="board-wrap"><div id="board"></div></div>
      <div class="prow" style="margin-top:14px">
        <button class="btn hidden" id="againBtn" type="button">Play again</button>
        <button class="btn secondary" id="leaveBtn" type="button">Leave</button>
      </div>
    </div>
  </main>

<script>
'use strict';
/* Chess: solo, pass-and-play and rooms on one rules engine.

   Drawing and tap handling only ask the driver two things: which side is at the
   bottom, and whether the local player can move right now. Modes only differ in
   those two answers and in who makes the next move.

   The solo opponent is Lozza (NNUE, UCI, in a Web Worker) at /assets/lozza.js. It's
   640 KB, so it only loads when someone picks Solo. */

if (typeof Chess === 'undefined') {
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('lobbyMsg').textContent =
      'Chess engine failed to load (/assets/chess.min.js). Re-copy the assets folder to the card.';
  });
  throw new Error('chess.min.js missing');
}

var game = new Chess();
var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
var boardEl = document.getElementById('board');
var statusEl = document.getElementById('status');
var wrapEl = document.querySelector('.board-wrap');

var mode = null;            // 'solo' | 'pass' | 'room'
var selected = null;
var targets = [];
var lastMove = null;
var humanColor = 'w';
var level = 'normal';
var thinking = false;
var awaitingHandoff = false;
/* Which side the board is drawn from in pass-and-play. Kept separate from
   game.turn() so the board doesn't flip until the handoff is dismissed. */
var viewSide = 'w';

/* Depth sets the strength, movetime is just a cap so a slow phone doesn't hang.
   With movetime alone, the same level plays much stronger on a fast phone than a
   slow one. When the cap hits, the engine plays the best move from the depth it
   reached. */
var TIERS = {
  easy:   'go depth 2 movetime 1000',
  normal: 'go depth 7 movetime 2000',
  hard:   'go depth 11 movetime 3500'
};

/* --- threefold repetition in a room --------------------------------------
   A room sends the position as a FEN, and game.load(fen) drops chess.js's move
   history, so in_threefold_repetition() never fires in a room. Each phone sees
   every position, so each keeps its own count instead. The key is the first four
   FEN fields (placement, side to move, castling, en passant), leaving out the
   move clocks.

   A phone that joins mid-game only counts from when it joined. */
var seenPositions = {};
var repeatedThrice = false;

function repKey(fen) { return String(fen).split(' ').slice(0, 4).join(' '); }

function notePosition() {
  var k = repKey(game.fen());
  seenPositions[k] = (seenPositions[k] || 0) + 1;
  if (seenPositions[k] >= 3) repeatedThrice = true;
}

function forgetPositions() { seenPositions = {}; repeatedThrice = false; }

// every way this game can end, in one place
function isOver() { return game.game_over() || repeatedThrice; }

/* --- the driver: the only place that knows about modes -------------------- */

function orientation() {
  if (mode === 'room') return (MP.room && MP.room.seat === 1) ? 'b' : 'w';
  if (mode === 'pass') return viewSide;         // flips on handoff, not on move
  return humanColor;
}

function localMayMove() {
  if (isOver() || thinking || awaitingHandoff) return false;
  if (mode === 'room') {
    return !!(MP.room && MP.room.joined && game.turn() === orientation() && MP.myTurn());
  }
  if (mode === 'pass') return true;             // whoever is holding the phone
  return game.turn() === humanColor;
}

function sideName(c) { return c === 'w' ? 'White' : 'Black'; }

/* --- board ---------------------------------------------------------------- */

function squares() {
  var files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  var ranks = [8, 7, 6, 5, 4, 3, 2, 1];
  var rows = [];
  for (var i = 0; i < ranks.length; i++) {
    for (var j = 0; j < files.length; j++) rows.push(files[j] + ranks[i]);
  }
  return orientation() === 'b' ? rows.reverse() : rows;
}

function render() {
  boardEl.innerHTML = '';
  var list = squares();
  for (var i = 0; i < list.length; i++) {
    (function (sq) {
      var d = document.createElement('div');
      var file = sq.charCodeAt(0) - 96, rank = Number(sq[1]);
      d.className = 'sq ' + ((file + rank) % 2 === 0 ? 'dark' : 'light');
      d.dataset.sq = sq;
      var piece = game.get(sq);
      if (piece) {
        var span = document.createElement('span');
        span.className = piece.color === 'w' ? 'wp' : 'bp';
        span.textContent = GLYPH[piece.type];
        d.appendChild(span);
      }
      if (selected === sq) d.classList.add('sel');
      if (lastMove && (lastMove.from === sq || lastMove.to === sq)) d.classList.add('last');
      for (var k = 0; k < targets.length; k++) {
        if (targets[k].to === sq) { d.classList.add(targets[k].captured ? 'cap' : 'tgt'); break; }
      }
      d.onclick = function () { tap(sq); };
      boardEl.appendChild(d);
    })(list[i]);
  }
  updateStatus();
}

function updateStatus() {
  statusEl.className = 'status';
  document.getElementById('againBtn').classList.toggle('hidden', !isOver());

  if (mode === 'room' && (!MP.room || !MP.room.joined)) {
    statusEl.textContent = 'Share the code and wait for Black to join… (you are ' +
      sideName(orientation()) + ')';
    return;
  }
  if (game.in_checkmate()) {
    var winner = game.turn() === 'w' ? 'b' : 'w';
    statusEl.className = 'status win';
    statusEl.textContent = (mode === 'solo')
      ? (winner === humanColor ? 'Checkmate. You win.' : 'Checkmate. The bot wins.')
      : 'Checkmate. ' + sideName(winner) + ' wins.';
    return;
  }
  if (game.in_draw() || repeatedThrice) {
    statusEl.className = 'status win';
    statusEl.textContent = game.in_stalemate() ? 'Stalemate. A draw.'
      : (repeatedThrice && !game.in_draw()) ? 'The same position three times. A draw.'
      : 'A draw.';
    return;
  }
  if (thinking) { statusEl.textContent = 'Thinking…'; return; }

  var check = game.in_check() ? ', check' : '';
  if (mode === 'solo') {
    if (game.turn() === humanColor) {
      statusEl.className = 'status hot';
      statusEl.textContent = 'Your move (' + sideName(humanColor) + ')' + check;
    } else {
      statusEl.textContent = 'Bot to move' + check;
    }
  } else if (mode === 'pass') {
    statusEl.className = 'status hot';
    statusEl.textContent = sideName(game.turn()) + ' to move' + check;
  } else {
    if (game.turn() === orientation()) {
      statusEl.className = 'status hot';
      statusEl.textContent = 'Your move (' + sideName(orientation()) + ')' + check;
    } else {
      statusEl.textContent = "Opponent's move" + check;
    }
  }
}

/* Resolves to 'q' | 'r' | 'b' | 'n'. chess.js lists one move per promotion piece,
   so several moves to the same square means it's a promotion. */
function askPromotion(color) {
  return new Promise(function (resolve) {
    var glyphs = color === 'w'
      ? { q: '♕', r: '♖', b: '♗', n: '♘' }
      : { q: '♛', r: '♜', b: '♝', n: '♞' };
    var names = { q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight' };
    var overlay = document.createElement('div');
    overlay.className = 'promo';
    var inner = document.createElement('div');
    inner.className = 'promo-inner';
    var title = document.createElement('div');
    title.className = 'promo-title';
    title.textContent = 'Promote to';
    var row = document.createElement('div');
    row.className = 'promo-row';
    ['q', 'r', 'b', 'n'].forEach(function (piece) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'promo-btn';
      btn.textContent = glyphs[piece];
      btn.setAttribute('aria-label', names[piece]);
      btn.onclick = function () { overlay.remove(); resolve(piece); };
      row.appendChild(btn);
    });
    inner.appendChild(title);
    inner.appendChild(row);
    overlay.appendChild(inner);
    wrapEl.appendChild(overlay);
    row.firstChild.focus();
  });
}

function showHandoff(next) {
  awaitingHandoff = true;
  render();
  var o = document.createElement('div');
  o.className = 'handoff';
  var h = document.createElement('h2');
  h.textContent = 'Pass to ' + sideName(next);
  var p = document.createElement('p');
  p.textContent = 'The board turns around so ' + sideName(next).toLowerCase() +
                  ' plays from their own side.';
  var b = document.createElement('button');
  b.className = 'btn';
  b.type = 'button';
  b.textContent = 'Ready';
  b.onclick = function () {
    o.remove();
    awaitingHandoff = false;
    viewSide = next;          // the turn round happens here, behind the screen
    render();
  };
  o.appendChild(h); o.appendChild(p); o.appendChild(b);
  wrapEl.appendChild(o);
  b.focus();
}

/* --- moving --------------------------------------------------------------- */

function tap(sq) {
  if (!localMayMove()) { selected = null; targets = []; render(); return; }
  var piece = game.get(sq);
  var movingSide = (mode === 'solo') ? humanColor : game.turn();

  if (selected && targets.some(function (m) { return m.to === sq; })) {
    commit(selected, sq);
    return;
  }
  if (piece && piece.color === movingSide) {
    selected = sq;
    targets = game.moves({ square: sq, verbose: true });
  } else {
    selected = null; targets = [];
  }
  render();
}

function commit(from, to) {
  var promoting = targets.some(function (m) {
    return m.to === to && m.flags.indexOf('p') !== -1;
  });
  var mover = game.turn();
  selected = null; targets = [];
  render();

  function apply(promotion) {
    var mv = game.move(promotion ? { from: from, to: to, promotion: promotion }
                                 : { from: from, to: to });
    if (!mv) { render(); return; }
    lastMove = { from: from, to: to };

    if (mode === 'room') {
      // our own move never comes back through onUpdate, so count it here
      notePosition();
      render();
      MP.move(JSON.stringify({ fen: game.fen(), san: mv.san }))['catch'](function (e) {
        game.undo();                    // server rejected (stale seq / race)
        lastMove = null;
        render();
        statusEl.textContent = e.message;
      });
      return;
    }
    if (mode === 'pass') {
      render();
      if (!isOver()) showHandoff(game.turn());
      return;
    }
    render();
    if (!isOver()) botMove();
  }

  if (promoting) askPromotion(mover).then(apply);
  else apply(null);
}

/* --- the bot -------------------------------------------------------------- */

var engine = null, engineReady = false, engineFailed = false;

function startEngine() {
  if (engine || engineFailed) return;
  try {
    engine = new Worker('/assets/lozza.js');
  } catch (e) {
    engineFailed = true;
    return;
  }
  engine.onerror = function () {
    engineFailed = true;
    thinking = false;
    statusEl.className = 'status';
    statusEl.textContent = 'The chess engine could not start. Pass & play and rooms still work.';
  };
  engine.onmessage = function (e) {
    var m = (typeof e.data === 'string') ? e.data : String(e.data);
    if (m.indexOf('uciok') === 0) {
      engineReady = true;
      // The hash table defaults to ~18 MB, Hash 8 brings it to ~9 MB for cheap phones.
      engine.postMessage('setoption name Hash value 8');
      engine.postMessage('ucinewgame');
      return;
    }
    if (m.indexOf('bestmove') === 0) {
      // Lozza sends `bestmove NULL ` when there's no move (other engines send
      // `(none)`), and every line has a trailing space.
      var uci = m.split(/\s+/)[1];
      thinking = false;
      if (!uci || uci === 'NULL' || uci === '(none)' || uci.length < 4) { render(); return; }
      var mv = game.move({
        from: uci.slice(0, 2),
        to: uci.slice(2, 4),
        promotion: uci.length > 4 ? uci.slice(4, 5) : undefined
      });
      if (mv) lastMove = { from: uci.slice(0, 2), to: uci.slice(2, 4) };
      render();
    }
  };
  engine.postMessage('uci');
}

function botMove() {
  if (engineFailed) {
    statusEl.className = 'status';
    statusEl.textContent = 'The chess engine is unavailable.';
    return;
  }
  thinking = true;
  render();
  function send() {
    engine.postMessage('position fen ' + game.fen());
    engine.postMessage(TIERS[level] || TIERS.normal);
  }
  if (engineReady) { send(); return; }
  var tries = 0;
  var wait = setInterval(function () {
    if (engineReady) { clearInterval(wait); send(); return; }
    if (engineFailed || ++tries > 150) {
      clearInterval(wait);
      thinking = false;
      statusEl.className = 'status';
      statusEl.textContent = 'The chess engine did not start in time.';
      render();
    }
  }, 100);
}

/* --- starting ------------------------------------------------------------- */

function enterGame(showCode) {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('roomCode').classList.toggle('hidden', !showCode);
  if (showCode) document.getElementById('roomCode').textContent = MP.room.code;
  render();
}

function startSolo() {
  mode = 'solo';
  game.reset();
  forgetPositions();
  selected = null; targets = []; lastMove = null; thinking = false;
  startEngine();
  enterGame(false);
  if (humanColor === 'b') botMove();
}

function startPass() {
  mode = 'pass';
  game.reset();
  forgetPositions();
  viewSide = 'w';
  selected = null; targets = []; lastMove = null;
  enterGame(false);
}

function playAgain() {
  if (mode === 'room') {
    var fresh = new Chess();
    MP.reset(JSON.stringify({ fen: fresh.fen(), san: '' }), 0).then(function () {
      game.reset(); forgetPositions(); notePosition();
      selected = null; targets = []; lastMove = null; render();
    })['catch'](function (e) { statusEl.textContent = e.message; });
    return;
  }
  game.reset();
  forgetPositions();
  viewSide = 'w';
  selected = null; targets = []; lastMove = null; thinking = false;
  if (mode === 'solo' && engine) engine.postMessage('ucinewgame');
  render();
  if (mode === 'solo' && humanColor === 'b') botMove();
}

/* --- room mode ------------------------------------------------------------ */

function onUpdate(stateStr) {
  try {
    var s = JSON.parse(stateStr);
    if (s && s.fen) { game.load(s.fen); notePosition(); }
  } catch (e) {}
  selected = null; targets = []; lastMove = null;
  render();
}
function onInfo(j) {
  if (j.gone) { statusEl.textContent = 'Room expired.'; MP.stop(); return; }
  updateStatus();
}

document.getElementById('soloBtn').onclick = startSolo;
document.getElementById('passBtn').onclick = startPass;
document.getElementById('createBtn').onclick = function () {
  MP.create('chess').then(function () {
    mode = 'room'; enterGame(true); MP.poll(onUpdate, onInfo, 1200);
  })['catch'](function (e) { document.getElementById('lobbyMsg').textContent = e.message; });
};
document.getElementById('joinBtn').onclick = function () {
  var code = document.getElementById('joinCode').value;
  if (!code) return;
  MP.join(code).then(function () {
    /* Refuse a code for a different game. The join has already taken that
       room's second seat, so this can't give it back, but at least it says
       what happened instead of desyncing. */
    if (MP.room.game && MP.room.game !== 'chess') {
      var other = MP.room.game;
      MP.room = null;
      document.getElementById('lobbyMsg').textContent =
        'That code is a ' + other + ' room, not a chess one.';
      return;
    }
    mode = 'room'; enterGame(true); MP.poll(onUpdate, onInfo, 1200);
  })['catch'](function (e) { document.getElementById('lobbyMsg').textContent = e.message; });
};
document.getElementById('joinCode').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('joinBtn').click();
});
document.getElementById('againBtn').onclick = playAgain;
document.getElementById('leaveBtn').onclick = function () { location.reload(); };
document.querySelectorAll('#level button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('#level button').forEach(function (o) {
      o.setAttribute('aria-pressed', String(o === b));
    });
    level = b.dataset.l;
  };
});
</script>
</body>
</html>
