<!DOCTYPE html>
<!-- Version 8: komi, and a dead-stone marking phase before the score -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="nomad-modes" content="pass,room"/>
<title>Nomad • Go</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/theme-manager.js?v=5"></script>
<script src="/assets/tenuki.min.js"></script>
<script src="/assets/mp-client.js"></script>
<script src="/assets/game-shell.js"></script>
<style>
  main{max-width:620px;margin:0 auto;padding:14px}
  select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  .caps{text-align:center;color:var(--muted);font-size:.85rem;margin:4px 0}
  #board{display:grid;margin:0 auto;background:#deb867;border-radius:8px;padding:8px;
    max-width:min(92vw,540px);touch-action:manipulation;user-select:none}
  .pt{position:relative;aspect-ratio:1;background:transparent;border:none;padding:0;cursor:pointer}
  /* board lines: centered 1.5px cross per intersection, clipped at edges */
  .pt::before,.pt::after{content:'';position:absolute;background:#4a3413;pointer-events:none}
  .pt::before{left:0;right:0;top:50%;height:1.5px;transform:translateY(-50%)}
  .pt::after{top:0;bottom:0;left:50%;width:1.5px;transform:translateX(-50%)}
  .pt.edge-l::before{left:50%}  .pt.edge-r::before{right:50%}
  .pt.edge-t::after{top:50%}    .pt.edge-b::after{bottom:50%}
  .stone{position:absolute;inset:8%;border-radius:50%;z-index:1;pointer-events:none}
  .stone.b{background:radial-gradient(circle at 35% 30%,#555,#000 70%)}
  .stone.w{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 75%);border:1px solid #999}
  .stone .last{position:absolute;inset:35%;border-radius:50%;border:2px solid var(--primary)}
  /* A stone marked dead stays on the board while players decide, so it's
     faded with a cross over it. */
  .stone.dead{opacity:.28}
  .pt.markable{cursor:pointer}
  .pt.markable .stone{cursor:pointer}
  .deadx{position:absolute;inset:0;pointer-events:none}
  .deadx::before,.deadx::after{content:'';position:absolute;left:50%;top:12%;bottom:12%;
    width:2px;background:var(--primary);border-radius:1px}
  .deadx::before{transform:translateX(-50%) rotate(45deg)}
  .deadx::after{transform:translateX(-50%) rotate(-45deg)}
</style>
</head>
<body>
  <header>
    <h1>Go</h1>
    <a class="back-btn" href="/games">← Back to Games</a>
  </header>

  <main></main>

<script>
/* Go, on tenuki. Two players, on one phone or two.

   Everything below is written for a room. For pass-and-play, game-shell.js
   swaps in a local MP whose seat follows the move count, so myColor() is
   whoever is holding the phone. That keeps tenuki's currentPlayer() and the
   seat in step as long as every move (passes too) goes through MP.move.

   GameShell.init has to be the first statement, it injects the markup the
   getElementById calls below need. */
GameShell.init({
  id: 'go',
  name: 'Go',
  modes: ['pass', 'room'],
  seats_named: ['Black', 'White'],
  preCreateHtml:
    '<select id="sizeSel" aria-label="Board size">' +
      '<option value="9">9 \u00d7 9 board</option>' +
      '<option value="13">13 \u00d7 13 board</option>' +
      '<option value="19">19 \u00d7 19 board</option>' +
    '</select>',
  hudHtml: '<div class="caps" id="caps"></div>',
  actionsHtml:
    '<button class="btn secondary" id="passBtn" onclick="doPass()">Pass</button>' +
    '<button class="btn hidden" id="doneBtn" onclick="acceptMarks()">Done</button>',
  onMode: onMode,
  onStart: onStart,
  onUpdate: onUpdate,
  onInfo: onInfo,
  onRematch: playAgain,
  // the shell stops handing the phone over once this is true, so both players
  // see the same board while marking
  isOver: function(){ return !!game && game.isOver(); },
  pollInterval: 1200
});

/* A 19x19 move list runs to about 720 characters, which doesn't fit the
   firmware's 512-byte state, so rooms only get 9 and 13. */
function onMode(mode){
  const sel = document.getElementById('sizeSel');
  const big = sel.querySelector('option[value="19"]');
  if (mode === 'room'){
    if (big) big.remove();
    if (sel.value === '19') sel.value = '9';
  } else if (!big){
    sel.insertAdjacentHTML('beforeend', '<option value="19">19 \u00d7 19 board</option>');
  }
}

function onStart(){
  size = Number(document.getElementById('sizeSel').value) || 9;
  moveStr = '';
  dead = '';
  accepted = 0;
  rebuild();
  render();
}

if (typeof tenuki === 'undefined') {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('lobbyMsg').textContent =
      'Go engine failed to load (/assets/tenuki.min.js). Re-copy the assets folder to the card.';
  });
  throw new Error('tenuki missing');
}

/* State travels as {"s":9,"m":"ddqf..pp","d":"","a":0}:

     s  board size
     m  move list, two chars per move, ".." = a pass
     d  which stones both players have agreed are dead, as a bitmap (below)
     a  which seats have accepted those marks, as a 2-bit mask

   The board is rebuilt by replaying m into a fresh tenuki game and then
   applying d.

   MOVE BUDGET. The firmware's state is 512 bytes and the worst case has to fit.
   A 13x13 board (the largest a room offers) needs 29 characters of dead-stone
   bitmap and the JSON around it is 28 more, so 440 characters of move list puts
   the worst case at 497. 440 is 220 moves, a 13x13 game doesn't get near it. */
const MAX_MOVES_CHARS = 440;

/* Komi: standard 6.5 for White moving second. The half point means no draws. */
const KOMI = 6.5;

/* The move cap is only for the 512-byte room state. Pass-and-play has no cap. */
function capReached(){
  return !GameShell.isLocal() && moveStr.length >= MAX_MOVES_CHARS;
}

/* Dead stones, as a bitmap over y*size+x, six bits per character. A bitmap
   keeps the worst case (a big dead group) small. Trailing empty chunks are
   dropped, so most games send a few characters or none. */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

function encodeDead(points, n){
  const bits = new Uint8Array(n * n);
  for (const p of points) bits[p.y * n + p.x] = 1;
  let out = '';
  for (let i = 0; i < n * n; i += 6){
    let v = 0;
    for (let b = 0; b < 6; b++) if (bits[i + b]) v |= (1 << b);
    out += B64[v];
  }
  return out.replace(/A+$/, '');
}

function decodeDead(str, n){
  const pts = [];
  for (let c = 0; c < (str || '').length; c++){
    const v = B64.indexOf(str[c]);
    if (v < 0) continue;
    for (let b = 0; b < 6; b++){
      if (v & (1 << b)){
        const i = c * 6 + b;
        if (i < n * n) pts.push({ y: Math.floor(i / n), x: i % n });
      }
    }
  }
  return pts;
}

let size = 9;
let moveStr = '';
let dead = '';       // encoded bitmap of stones agreed dead
let accepted = 0;    // bit 0 = seat 0 has accepted the marks, bit 1 = seat 1
let game = null;
let lastPt = null;   // [x,y] of last stone for the marker

/* Three phases, worked out from the state instead of stored with it.

     play  the game is running
     mark  both passed, the players are agreeing which stones are dead
     done  both have accepted, and the score on screen is the real one */
function phase(){
  if (!game || !game.isOver()) return 'play';
  return accepted === 3 ? 'done' : 'mark';
}

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const myColor = () => MP.room.seat === 0 ? 'black' : 'white';

function rebuild(){
  game = new tenuki.Game({ boardSize: size, scoring: 'territory', komi: KOMI });
  lastPt = null;
  for (let i = 0; i + 1 < moveStr.length; i += 2){
    const a = moveStr[i], b = moveStr[i+1];
    if (a === '.' && b === '.'){ game.pass(); lastPt = null; }
    else {
      const x = a.charCodeAt(0) - 97, y = b.charCodeAt(0) - 97;
      game.playAt(y, x);
      lastPt = [x, y];
    }
  }
  // marks go on after the replay, tenuki only takes them once the game is over
  if (dead && game.isOver()){
    for (const pt of decodeDead(dead, size)) game.markDeadAt(pt.y, pt.x);
  }
}

function render(){
  boardEl.style.gridTemplateColumns = `repeat(${size},1fr)`;
  boardEl.innerHTML = '';
  for (let y = 0; y < size; y++){
    for (let x = 0; x < size; x++){
      const b = document.createElement('button');
      b.className = 'pt' +
        (x === 0 ? ' edge-l' : '') + (x === size-1 ? ' edge-r' : '') +
        (y === 0 ? ' edge-t' : '') + (y === size-1 ? ' edge-b' : '');
      const it = game.intersectionAt(y, x);
      const marking = phase() === 'mark';
      if (!it.isEmpty()){
        const isDead = game._isDeadAt(y, x);
        const s = document.createElement('span');
        s.className = 'stone ' + (it.isBlack() ? 'b' : 'w') + (isDead ? ' dead' : '');
        if (lastPt && lastPt[0] === x && lastPt[1] === y && !marking){
          s.innerHTML = '<span class="last"></span>';
        }
        b.appendChild(s);
        if (isDead) b.insertAdjacentHTML('beforeend', '<span class="deadx"></span>');
        if (marking) b.classList.add('markable');
      }
      b.onclick = marking ? (() => toggleDead(x, y)) : (() => play(x, y));
      boardEl.appendChild(b);
    }
  }
  updateStatus();
}

function myTurn(){
  return MP.room.joined && !game.isOver() &&
         game.currentPlayer() === myColor() && MP.myTurn();
}

function scoreLine(){
  const sc = game.score();
  return `Black ${sc.black} : White ${sc.white} (komi ${KOMI})`;
}

function updateStatus(){
  const ph = phase();
  statusEl.classList.remove('hot');

  // Play again only once the marks are settled, so nobody restarts mid-count.
  // Pass and Done swap places with phase.
  document.getElementById('againBtn').classList.toggle('hidden',
    !(MP.room.joined && ph === 'done'));
  document.getElementById('passBtn').classList.toggle('hidden', ph !== 'play');
  document.getElementById('doneBtn').classList.toggle('hidden', ph !== 'mark');

  const st = game.currentState();
  // tenuki's <color>StonesCaptured counts stones of that color that were LOST,
  // so Black's capture count is whiteStonesCaptured. Once counting starts the
  // score goes here, keeping the status line short.
  document.getElementById('caps').textContent = (ph === 'play')
    ? `Captures  Black: ${st.whiteStonesCaptured || 0} · White: ${st.blackStonesCaptured || 0}`
    : scoreLine();
  const me = myColor() === 'black' ? 'Black' : 'White';

  if (!MP.room.joined){
    statusEl.textContent = `Share the code and wait for White to join… (you are ${me})`;
    return;
  }
  if (ph === 'mark'){
    // the score updates live as stones are marked
    const mine = 1 << MP.room.seat;
    // says "stones" because a mark can spread past a single group
    statusEl.textContent = (accepted & mine)
      ? 'Waiting for the other player to agree…'
      : 'Both passed. Tap any dead stones to remove them, then Done.';
    statusEl.classList.add('hot');
    return;
  }
  if (ph === 'done'){
    const sc = game.score();
    // komi is a half point, so the scores can't be equal
    const w = sc.black > sc.white ? 'Black' : 'White';
    statusEl.textContent = `Game over. ${w} wins` +
      ((!GameShell.isLocal() && w === me) ? ' (you!)' : '');
    statusEl.classList.add('hot');
    return;
  }
  if (capReached()){
    // hitting the cap ends the game like any other: pass twice and count
    statusEl.textContent =
      `This board is full to its ${MAX_MOVES_CHARS / 2}-move limit. Pass twice to count the game.`;
  } else if (myTurn()){
    statusEl.textContent = `Your move (${me})`;
    statusEl.classList.add('hot');
  } else {
    statusEl.textContent = `Opponent's move (you are ${me})`;
  }
}

async function sendState(){
  await MP.move(JSON.stringify({ s: size, m: moveStr, d: dead, a: accepted }));
}

/* Marks go through reset, not move. The move handler checks
   seat === seq % 2, so only one player could ever send them. Reset skips the
   turn and stale-seq checks. first is pinned to 0 (Black opens) so the seq
   parity doesn't drift however many marks get toggled. */
async function sendMarks(){
  await MP.reset(JSON.stringify({ s: size, m: moveStr, d: dead, a: accepted }), 0);
}

/* tenuki spreads a mark across every stone of that colour reachable through
   empty points, not just the tapped chain. That's right on a full end-game
   board but looks odd on a sparse one. It isn't a bug.

   Any change clears both acceptances. */
async function toggleDead(x, y){
  if (phase() !== 'mark') return;
  if (game.intersectionAt(y, x).isEmpty()) return;
  game.toggleDeadAt(y, x);
  dead = encodeDead(game.deadStones(), size);
  accepted = 0;
  render();
  try { await sendMarks(); }
  catch(e){ statusEl.textContent = e.message; }
}

async function acceptMarks(){
  if (phase() !== 'mark') return;
  // on one phone, one Done counts for both
  accepted = GameShell.isLocal() ? 3 : (accepted | (1 << MP.room.seat));
  render();
  try { await sendMarks(); }
  catch(e){ statusEl.textContent = e.message; }
}

async function play(x, y){
  if (phase() !== 'play' || !myTurn()) return;
  if (capReached()) return;                        // only pass fits now
  if (!game.playAt(y, x)) return;                  // illegal (occupied / ko / suicide)
  lastPt = [x, y];
  moveStr += String.fromCharCode(97 + x) + String.fromCharCode(97 + y);
  render();
  try { await sendState(); }
  catch(e){ game.undo(); moveStr = moveStr.slice(0, -2); statusEl.textContent = e.message; render(); }
}

async function doPass(){
  if (phase() !== 'play' || !myTurn()) return;
  game.pass();
  lastPt = null;
  moveStr += '..';
  render();
  try { await sendState(); }
  catch(e){ game.undo(); moveStr = moveStr.slice(0, -2); statusEl.textContent = e.message; render(); }
}

function onUpdate(stateStr){
  try {
    const s = JSON.parse(stateStr);
    if (s && typeof s.m === 'string'){
      if (s.s && s.s !== size) size = s.s;
      moveStr = s.m;
      // adopted BEFORE rebuild(), which applies the marks as its last step
      dead = typeof s.d === 'string' ? s.d : '';
      accepted = typeof s.a === 'number' ? s.a : 0;
      rebuild();
    }
  } catch(e){}
  render();
}

function onInfo(j){
  if (j.gone){ statusEl.textContent = 'Room expired.'; MP.stop(); return; }
  updateStatus();
}

/* Rematch in the same room and board size. Black is seat 0 and moves first,
   so the reset pins seat 0. */
async function playAgain(){
  try {
    await MP.reset(JSON.stringify({ s: size, m: '', d: '', a: 0 }), 0);
    moveStr = '';
    dead = '';
    accepted = 0;
    rebuild();
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}



</script>
</body>
</html>
