<!DOCTYPE html>
<!-- Version 7: on /assets/game-shell.js -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="nomad-modes" content="pass,room"/>
<title>Nomad • Connect Four</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js?v=5"></script>
<script src="/theme-manager.js?v=5"></script>
<script src="/assets/mp-client.js"></script>
<script src="/assets/game-shell.js"></script>
<style>
  main{max-width:560px;margin:0 auto;padding:14px}
  #board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:440px;margin:0 auto;
    background:#1d4ed8;border-radius:12px;padding:10px;touch-action:manipulation}
  .cell{aspect-ratio:1;border-radius:50%;background:var(--bg);cursor:pointer;border:none;padding:0}
  .cell.red{background:#dc2626}
  .cell.yellow{background:#eab308}
  .cell.win{box-shadow:0 0 0 3px #fff inset}
</style>
</head>
<body>
  <header>
    <h1>Connect Four</h1>
    <a class="back-btn" href="/games">← Back to Games</a>
  </header>

  <main></main>

<script>
/* Connect Four. Two players, on one phone or two.

   Everything below is written for a room. For pass-and-play, game-shell.js
   swaps in a local MP whose seat follows the move count, so myDisc() is whoever
   is holding the phone and MP.myTurn() is true for them.

   GameShell.init has to be the first statement, it injects the markup the
   getElementById calls below need. The callbacks passed to it are hoisted
   function declarations. Don't turn them into `const fn = () => ...`, init
   would hit them before they exist. */
GameShell.init({
  id: 'c4',
  name: 'Connect Four',
  modes: ['pass', 'room'],
  seats_named: ['Red', 'Yellow'],
  onStart: render,
  onUpdate: onUpdate,
  onInfo: onInfo,
  onRematch: playAgain,
  isOver: isOver,
  pollInterval: 1000
});

const COLS = 7, ROWS = 6;
let board = '-'.repeat(COLS * ROWS);  // row 0 = top; index = row*7+col
let over = false;
const myDisc = () => MP.room.seat === 0 ? 'R' : 'Y';

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function isOver(){
  return !!winnerCells() || !board.includes('-');
}

function winnerCells(){
  const at = (r,c) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? null : board[r*COLS+c];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const v = at(r,c);
      if (v === '-' || v === null) continue;
      for (const [dr,dc] of dirs){
        const run = [[r,c]];
        for (let k = 1; k < 4; k++){
          if (at(r+dr*k, c+dc*k) === v) run.push([r+dr*k, c+dc*k]); else break;
        }
        if (run.length === 4) return run;
      }
    }
  }
  return null;
}

function dropRow(col){
  for (let r = ROWS - 1; r >= 0; r--){
    if (board[r*COLS+col] === '-') return r;
  }
  return -1;
}

function render(){
  boardEl.innerHTML = '';
  const win = winnerCells();
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const b = document.createElement('button');
      const v = board[r*COLS+c];
      b.className = 'cell' + (v === 'R' ? ' red' : v === 'Y' ? ' yellow' : '');
      if (win && win.some(([wr,wc]) => wr === r && wc === c)) b.classList.add('win');
      b.onclick = () => play(c);
      boardEl.appendChild(b);
    }
  }
  updateStatus(win);
}

function updateStatus(win){
  statusEl.classList.remove('hot');
  const me = myDisc() === 'R' ? 'Red' : 'Yellow';
  // recompute from the board so a rematch reset clears a finished game
  over = !!win || !board.includes('-');
  document.getElementById('againBtn').classList.toggle('hidden', !over || !MP.room.joined);
  if (win){
    const w = board[win[0][0]*COLS+win[0][1]] === 'R' ? 'Red' : 'Yellow';
    statusEl.textContent = w === me ? `You win! (${w})` : `${w} wins. Better luck next time`;
    statusEl.classList.add('hot');
  } else if (over){
    statusEl.textContent = "It's a draw!";
  } else if (!MP.room.joined){
    statusEl.textContent = `Waiting for a second player… (you are ${me})`;
  } else if (MP.myTurn()){
    statusEl.textContent = `Your turn (${me})`;
    statusEl.classList.add('hot');
  } else {
    statusEl.textContent = `Opponent's turn (you are ${me})`;
  }
}

async function play(col){
  if (over || !MP.myTurn() || !MP.room.joined) return;
  const r = dropRow(col);
  if (r < 0) return;
  const i = r*COLS+col;
  const next = board.slice(0, i) + myDisc() + board.slice(i + 1);
  try {
    await MP.move(JSON.stringify({ b: next }));
    board = next;
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}

function onUpdate(stateStr){
  try {
    const s = JSON.parse(stateStr);
    if (s && typeof s.b === 'string' && s.b.length === COLS*ROWS){ board = s.b; }
  } catch(e){}
  render();
}

function onInfo(j){
  if (j.gone){ statusEl.textContent = 'Room expired.'; over = true; render(); MP.stop(); return; }
  render();
}

/* Rematch in the same room. The firmware alternates who drops first, and the
   other player gets the new board from the poll. */
async function playAgain(){
  try {
    await MP.reset(JSON.stringify({ b: '-'.repeat(COLS * ROWS) }));
    board = '-'.repeat(COLS * ROWS);
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}



</script>
</body>
</html>
