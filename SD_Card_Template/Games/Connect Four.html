<!DOCTYPE html>
<!-- Version 4 -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nomad • Connect Four</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/master.css">
<script src="/theme-boot.js"></script>
<script src="/theme-manager.js"></script>
<script src="/assets/mp-client.js"></script>
<style>
  main{max-width:560px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:1.1rem;text-transform:uppercase;width:120px;text-align:center;letter-spacing:.2em}
  .btn{background:var(--primary);color:var(--color-white,#fff);border:none;border-radius:8px;
    padding:10px 18px;cursor:pointer;font-size:1rem}
  .btn.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  .code-big{font-size:2rem;letter-spacing:.35em;font-weight:700;color:var(--primary);text-align:center;margin:6px 0}
  .status{text-align:center;color:var(--muted);min-height:1.4em;margin:8px 0}
  .status.hot{color:var(--primary);font-weight:600}
  #board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:440px;margin:0 auto;
    background:#1d4ed8;border-radius:12px;padding:10px;touch-action:manipulation}
  .cell{aspect-ratio:1;border-radius:50%;background:var(--bg);cursor:pointer;border:none;padding:0}
  .cell.red{background:#dc2626}
  .cell.yellow{background:#eab308}
  .cell.win{box-shadow:0 0 0 3px #fff inset}
  .hidden{display:none!important}
  .center{text-align:center}
</style>
</head>
<body>
  <header>
    <h1>Connect Four</h1>
    <a class="back-btn" href="/games.html">← Back to Games</a>
  </header>

  <main>
    <div class="card" id="lobby">
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="createRoom()">Create Room (play Red)</button>
      </div>
      <p class="center" style="color:var(--muted)">or join a friend as Yellow</p>
      <div class="row" style="justify-content:center">
        <input type="text" id="joinCode" maxlength="4" placeholder="CODE">
        <button class="btn secondary" onclick="joinRoom()">Join</button>
      </div>
      <div class="status" id="lobbyMsg"></div>
    </div>

    <div class="card hidden" id="game">
      <div class="code-big" id="roomCode"></div>
      <div class="status" id="status">Waiting…</div>
      <div id="board"></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn secondary" onclick="location.reload()">Leave / New Room</button>
      </div>
    </div>
  </main>

<script>
const COLS = 7, ROWS = 6;
let board = '-'.repeat(COLS * ROWS);  // row 0 = top; index = row*7+col
let over = false;
const myDisc = () => MP.room.seat === 0 ? 'R' : 'Y';

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function winnerCells(){
  const at = (r,c) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? null : board[r*COLS+c];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const v = at(r,c);
      if (v === '-' || v === null) continue;
      for (const [dr,dc] of dirs){
        const run = [[r,c]];
        for (let k = 1; k < 4; k++){
          if (at(r+dr*k, c+dc*k) === v) run.push([r+dr*k, c+dc*k]); else break;
        }
        if (run.length === 4) return run;
      }
    }
  }
  return null;
}

function dropRow(col){
  for (let r = ROWS - 1; r >= 0; r--){
    if (board[r*COLS+col] === '-') return r;
  }
  return -1;
}

function render(){
  boardEl.innerHTML = '';
  const win = winnerCells();
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const b = document.createElement('button');
      const v = board[r*COLS+c];
      b.className = 'cell' + (v === 'R' ? ' red' : v === 'Y' ? ' yellow' : '');
      if (win && win.some(([wr,wc]) => wr === r && wc === c)) b.classList.add('win');
      b.onclick = () => play(c);
      boardEl.appendChild(b);
    }
  }
  updateStatus(win);
}

function updateStatus(win){
  statusEl.classList.remove('hot');
  const me = myDisc() === 'R' ? 'Red' : 'Yellow';
  if (win){
    over = true;
    const w = board[win[0][0]*COLS+win[0][1]] === 'R' ? 'Red' : 'Yellow';
    statusEl.textContent = w === me ? `You win! (${w})` : `${w} wins. Better luck next time`;
    statusEl.classList.add('hot');
  } else if (!board.includes('-')){
    over = true;
    statusEl.textContent = "It's a draw!";
  } else if (!MP.room.joined){
    statusEl.textContent = `Share the code and wait for a second player… (you are ${me})`;
  } else if (MP.myTurn()){
    statusEl.textContent = `Your turn (${me})`;
    statusEl.classList.add('hot');
  } else {
    statusEl.textContent = `Opponent's turn (you are ${me})`;
  }
}

async function play(col){
  if (over || !MP.myTurn() || !MP.room.joined) return;
  const r = dropRow(col);
  if (r < 0) return;
  const i = r*COLS+col;
  const next = board.slice(0, i) + myDisc() + board.slice(i + 1);
  try {
    await MP.move(JSON.stringify({ b: next }));
    board = next;
    render();
  } catch(e){
    statusEl.textContent = e.message;
  }
}

function onUpdate(stateStr){
  try {
    const s = JSON.parse(stateStr);
    if (s && typeof s.b === 'string' && s.b.length === COLS*ROWS){ board = s.b; }
  } catch(e){}
  render();
}

function onInfo(j){
  if (j.gone){ statusEl.textContent = 'Room expired.'; over = true; render(); MP.stop(); return; }
  render();
}

function enterGame(){
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('roomCode').textContent = MP.room.code;
  render();
  MP.poll(onUpdate, onInfo, 1000);
}

async function createRoom(){
  try { await MP.create('c4'); enterGame(); }
  catch(e){ document.getElementById('lobbyMsg').textContent = e.message; }
}

async function joinRoom(){
  const code = document.getElementById('joinCode').value;
  if (!code) return;
  try { await MP.join(code); enterGame(); }
  catch(e){ document.getElementById('lobbyMsg').textContent = e.message; }
}
document.getElementById('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
</script>
</body>
</html>
