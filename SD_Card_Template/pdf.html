    <style>
        *, *::before, *::after {
            box-sizing: border-box;

        }

        html, body {
            height: 100%;
        }

        body {

            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;

        /* fits the visible screen: 100vh on a phone includes the strip behind the address
           bar and pushes the page buttons off the bottom */
        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        .reader-header {

            flex: 1;
            min-width: 0;
            font-size: 0.98rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
        }

        .reader-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            flex: 0 0 auto;
        }

        .reader-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            color: var(--header-text);
            min-width: 38px;
            height: 36px;
            padding: 0 10px;
            border-radius: var(--radius-medium);

            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .reader-btn:hover { background: rgba(255,255,255,0.3); }
        .reader-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .reader-main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
            overflow: auto;
        }

        #pdf-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            background: var(--bg);
            padding: 12px 0;
            gap: 10px;
        }

        .page-slot {
            flex: 0 0 auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin: 0 auto;
            max-width: none;
        }
        .page-slot canvas { display: block; width: 100%; height: 100%; }

        .loading-overlay {
            position: absolute;
            top:0;right:0;bottom:0;left:0;inset:0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: var(--bg);
            z-index: 50;
            padding: 20px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 123, 255, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;

        .loading-text {

            text-align: center;
            line-height: 1.45;

        .loading-bar {

            border-radius: 3px;
            background: var(--line);

        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* one row: back, where you are (tap to type a page), forward, clear of a phone's

        .reader-navigation {
            background: var(--card);
            border-top: 1px solid var(--card-border);
            padding: 8px 12px;

            justify-content: center;
            align-items: center;
            flex: 0 0 auto;

        .nav-btn {

            font-weight: 600;
            font-variant-numeric: tabular-nums;

        .page-info input {

        .error-message {
            padding: 20px;
            text-align: center;
            color: #d32f2f;
            font-size: 1rem;
        }

    <script>
        /* theme via shared ThemeManager instead of a local reimplementation */
        (function () { try { ThemeManager.applyDarkMode(ThemeManager.getDarkMode()); } catch (e) { } })();
        window.addEventListener('storage', (ev) => { if (ev.key === ThemeManager.STORAGE_KEY) ThemeManager.applyDarkMode(ev.newValue === 'true'); });

        function fileUrlDirect(path) { if (!path) return ''; return `/media?file=${encodeURIComponent(normalizePath(path))}`; }
        
        const urlParams = new URLSearchParams(window.location.search);
        const pdfPath = urlParams.get('path');
        
        if (!pdfPath) {
            // replaces the loading overlay too: it lives inside the container
            document.getElementById('pdf-container').innerHTML = '<p class="error-message">No PDF chosen. Go back and pick one.</p>';
        }

        const readerTitle = document.getElementById('readerTitle');
        const pdfContainer = document.getElementById('pdf-container');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const loadingBarFill = document.getElementById('loadingBarFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInput = document.getElementById('pageInput');
        const pageTotal = document.getElementById('pageTotal');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomResetBtn = document.getElementById('zoomReset');

        /* Every page gets a slot of its real size up front, so pages drawn or dropped above
           never move the one being read. Pages are drawn one at a time, nearest first.
           The file is read in ranges as PDF.js asks: Nomad's whole-file reply carries a
           duplicate "accept-ranges: none" that makes PDF.js download the whole book first. */
        let pdfDoc = null;
        let currentPage = 1;
        // bookmarks and notes by page, kept on this phone
        NomadMarks.attach(document.getElementById('marksBtn'), {
            key: () => pdfPath,
            title: () => document.getElementById('readerTitle').textContent,
            here: () => (currentPage ? { at: currentPage, order: currentPage, label: 'Page ' + currentPage } : null),
            go: (n) => goToPage(+n),
        });
        let totalPages = 0;
        let zoom = 1;                       // 1 = the page fills the reading width
        let scale = 1;                      // unused
        const UNLOAD_MARGIN = 6;            // canvases this far from the current page are freed
        const slots = [];                   // slots[n - 1] = the page's box
        let pageW = 612, pageH = 792;       // page 1 at scale 1, the shape slots start with

        // the page to come back to, plus the page count so progress works without opening the PDF
        const RESUME_KEY = 'nomad_pdf_progress';
        function getResumeKey(path) { return `${RESUME_KEY}_${encodeURIComponent(normalizePath(path))}`; }
        function saveProgress(path, page) {
            try { localStorage.setItem(getResumeKey(path), JSON.stringify({ page, pages: totalPages, time: Date.now() })); } catch (e) {}
            noteProgress(path, page);
        }
        // how far along, for the Books shelf and the menu's Continue (NomadProgress, nomad-utils.js).
        // A finished PDF opened again on its first page stays finished until you turn a page.
        function noteProgress(path, page) {
            if (!totalPages) return;
            const was = NomadProgress.get(path);
            if (page === 1 && was && was.done) return;
            const info = { k: 'pdf', t: readerTitle.textContent };
            if (page >= totalPages) NomadProgress.finish(path, info);
            else NomadProgress.note(path, Object.assign(info, { p: page / totalPages, l: `Page ${page} of ${totalPages}` }));
        }
        function loadProgress(path) {
            try { const d = localStorage.getItem(getResumeKey(path)); return d ? JSON.parse(d) : null; } catch (e) { return null; }
        }
        function updatePageInfo() {
            if (document.activeElement !== pageInput) pageInput.value = currentPage;
            pageTotal.textContent = `of ${totalPages}`;
            pageInput.max = totalPages;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }
        function updateZoomInfo() { zoomResetBtn.textContent = `${Math.round(zoom * 100)}%`; }
        function setLoadingProgress(pct, label) {
            if (loadingText) loadingText.textContent = label;
            if (loadingBarFill) loadingBarFill.style.width = (pct == null ? 0 : Math.max(0, Math.min(100, pct))) + '%';
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        async function rangeRead(url, spec) {
            for (let i = 0, wait = 400; ; i++) {
                const r = await fetch(url, { headers: { Range: spec } });
                if (r.status === 206) return { buf: await r.arrayBuffer(), range: r.headers.get('Content-Range') || '' };
                if (r.status === 200) {
                    const all = await r.arrayBuffer(), m = /bytes=(\d*)-(\d*)/.exec(spec);
                    const a = +m[1] || 0, b = m[2] === '' ? all.byteLength - 1 : +m[2];
                    return { buf: all.slice(a, b + 1), range: `bytes ${a}-${b}/${all.byteLength}` };
                }
                if (r.status !== 503 || i >= 6) throw new Error(r.status === 404 ? 'missing' : 'HTTP ' + r.status);
                const ra = parseFloat(r.headers.get('Retry-After'));
                await sleep(ra > 0 ? ra * 1000 : wait); wait = Math.min(wait * 1.8, 4000);
            }
        }
        // three reads at a time: past ~4 Nomad answers 503
        let reading = 0; const readQueue = [];
        function queuedRead(url, spec) {
            return new Promise((resolve, reject) => { readQueue.push({ url, spec, resolve, reject }); pumpReads(); });
        }
        function pumpReads() {
            while (reading < 3 && readQueue.length) {
                const job = readQueue.shift(); reading++;
                rangeRead(job.url, job.spec).then(job.resolve, job.reject).finally(() => { reading--; pumpReads(); });
            }
        }

        function slotWidth() {
            const avail = pdfContainer.clientWidth - 16;
            return Math.max(120, Math.round(Math.min(avail, 1100) * zoom));
        }
        function buildSlots() {
            pdfContainer.querySelectorAll('.page-slot').forEach((el) => el.remove());
            slots.length = 0;
            const w = slotWidth(), frag = document.createDocumentFragment();
            for (let n = 1; n <= totalPages; n++) {
                const el = document.createElement('div');
                el.className = 'page-slot';
                el.dataset.page = n;
                el.style.width = w + 'px';
                el.style.aspectRatio = `${pageW} / ${pageH}`;
                frag.appendChild(el); slots.push(el);
            }
            pdfContainer.appendChild(frag);
        }
        function resizeSlots() {
            const w = slotWidth() + 'px';
            for (const el of slots) el.style.width = w;
        }
        const drawn = new Map();            // page -> slot width it was drawn at
        let drawing = null;                 // { page, task }
        function wanted() {
            const out = [];
            for (let d = 0; d <= 3; d++) for (const n of d ? [currentPage + d, currentPage - d] : [currentPage]) {
                if (n >= 1 && n <= totalPages && drawn.get(n) !== slotWidth()) out.push(n);
            }
            return out;
        }
        async function drawNext() {
            if (drawing) {
                // already drawing something you've moved well away from: stop it
                if (Math.abs(drawing.page - currentPage) > 3 && drawing.task) drawing.task.cancel();
                return;
            }
            const n = wanted()[0];
            if (!n) return;
            const width = slotWidth();
            drawing = { page: n, task: null };
            try {
                const page = await pdfDoc.getPage(n);
                const v1 = page.getViewport({ scale: 1 });
                const slot = slots[n - 1];
                // a page of another shape: fix its slot, keeping your place if it is above you
                if (Math.abs(v1.width / v1.height - pageW / pageH) > 0.01 && slot.dataset.shaped !== '1') {
                    const before = slot.offsetHeight;
                    slot.style.aspectRatio = `${v1.width} / ${v1.height}`; slot.dataset.shaped = '1';
                    if (n < currentPage) pdfContainer.scrollTop += slot.offsetHeight - before;
                }
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const viewport = page.getViewport({ scale: (width * dpr) / v1.width });
                const canvas = document.createElement('canvas');
                canvas.width = Math.floor(viewport.width); canvas.height = Math.floor(viewport.height);
                drawing.task = page.render({ canvasContext: canvas.getContext('2d'), viewport });
                await drawing.task.promise;
                const old = slot.querySelector('canvas');
                if (old) { old.width = 0; old.height = 0; old.remove(); }
                slot.appendChild(canvas);
                drawn.set(n, width);
                if (n === currentPage) loadingOverlay.classList.add('hidden');
            } catch (err) {
                if (!err || err.name !== 'RenderingCancelledException') console.error(`Page ${n}:`, err);
            } finally {
                drawing = null;
                unloadFarPages();
                drawNext();
            }
        }
        // each page is a full-size canvas: free the ones far away (their slot keeps its size)
        function unloadFarPages() {
            for (const n of Array.from(drawn.keys())) {
                if (Math.abs(n - currentPage) <= UNLOAD_MARGIN) continue;
                const c = slots[n - 1] && slots[n - 1].querySelector('canvas');
                if (c) { c.width = 0; c.height = 0; c.remove(); }
                drawn.delete(n);
            }
        }

        function pageAtMiddle() {
            const box = pdfContainer.getBoundingClientRect();
            const el = document.elementFromPoint(box.left + box.width / 2, box.top + Math.min(box.height / 3, 200));
            const slot = el && el.closest && el.closest('.page-slot');
            return slot ? +slot.dataset.page : currentPage;
        }
        let scrollPending = false;
        pdfContainer.addEventListener('scroll', () => {
            if (scrollPending) return;
            scrollPending = true;
            requestAnimationFrame(() => {
                scrollPending = false;
                // at the very bottom you're on the last page, even when it is too short to reach the middle
                const atEnd = pdfContainer.scrollTop + pdfContainer.clientHeight >= pdfContainer.scrollHeight - 4;
                const n = atEnd && totalPages ? totalPages : pageAtMiddle();
                if (n !== currentPage) { currentPage = n; updatePageInfo(); saveProgress(pdfPath, currentPage); }
                drawNext();
            });
        }, { passive: true });
        // straight to the page: its slot is already where it will stay
        function goToPage(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > totalPages) return;
            currentPage = pageNum;
            updatePageInfo();
            saveProgress(pdfPath, currentPage);
            const slot = slots[pageNum - 1];
            pdfContainer.scrollTop += slot.getBoundingClientRect().top - pdfContainer.getBoundingClientRect().top - 10;
            drawNext();
        }
        function changeZoom(newZoom) {
            zoom = Math.max(0.5, Math.min(3, Math.round(newZoom * 100) / 100));
            updateZoomInfo();
            const keep = currentPage;
            resizeSlots();
            goToPage(keep);
        }
        let resizeT = null;
        window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => changeZoom(zoom), 200); });

        function failMessage(err) {
            const m = String((err && (err.message || err.name)) || err);
            if (err && err.name === 'PasswordException') return 'This PDF is password protected and can\'t be opened here.';
            if (err && (err.name === 'InvalidPDFException' || /Invalid PDF/i.test(m))) return 'This file isn\'t a readable PDF. It may be damaged: try copying it to the card again.';
            if (m === 'missing') return 'The file is missing from the card.';
            if (err instanceof TypeError || /fetch|network/i.test(m)) return 'Lost touch with Nomad. Check you\'re still on its WiFi, then reload.';
            return 'Couldn\'t open this PDF (' + m + ').';
        }

        async function loadPDF(path) {
            try {
                loadingOverlay.classList.remove('hidden');
                setLoadingProgress(5, 'Opening…');
                const fileName = path.split('/').pop();
                readerTitle.textContent = fileName.replace(/\.[^/.]+$/, '').replace(/[_\.]+/g, ' ').trim();
                if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js library not loaded');
                pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/pdf.worker.min.js';

                const url = fileUrlDirect(path);
                // the first piece also gives the size, PDF.js asks for the rest as needed.
                // Small pieces: Nomad reads are slow per KB, and most of what PDF.js asks for
                // while finding pages is a few hundred bytes. A page's image still comes in one
                // request, since PDF.js groups contiguous pieces.
                const CHUNK = 32768;
                const first = await rangeRead(url, 'bytes=0-131071');
                const total = parseInt((/\/(\d+)\s*$/.exec(first.range) || [])[1], 10) || first.buf.byteLength;
                const transport = new pdfjsLib.PDFDataRangeTransport(total, new Uint8Array(first.buf));
                let got = first.buf.byteLength, lastEnd = first.buf.byteLength, streak = 0;
                const t0 = Date.now(), mb = (n) => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
                transport.requestDataRange = (begin, end) => {
                    // reading straight through (PDF.js rescans a PDF whose index doesn't match
                    // its contents): take 256 KB at a time, far fewer requests
                    streak = begin === lastEnd ? streak + 1 : 0;
                    if (streak >= 3) end = Math.min(total, begin + CHUNK * 8);
                    lastEnd = end;
                    queuedRead(url, `bytes=${begin}-${end - 1}`).then((r) => {
                        got += r.buf.byteLength;
                        transport.onDataRange(begin, new Uint8Array(r.buf));
                        if (pdfDoc) return;
                        const pct = Math.min(90, 5 + (got / total) * 85), secs = (Date.now() - t0) / 1000;
                        if (secs > 20) setLoadingProgress(pct, `Still finding the pages… ${mb(got)} of ${mb(total)} MB read. ` +
                            'Re-save it on a computer (Save As or Print to PDF) to open faster.');
                        else if (secs > 8) setLoadingProgress(pct, `Finding the pages… ${mb(got)} MB read`);
                        else setLoadingProgress(pct, `Opening… ${mb(got)} MB read`);
                    }).catch((e) => console.error('PDF read', begin, e));
                };
                pdfDoc = await pdfjsLib.getDocument({ range: transport, length: total, rangeChunkSize: CHUNK,
                    disableAutoFetch: true, disableStream: true }).promise;
                totalPages = pdfDoc.numPages;
                const progress = loadProgress(path);
                // a PDF you finished starts again from the top
                const done = (NomadProgress.get(path) || {}).done;
                const startPage = (!done && progress && progress.page > 0 && progress.page <= totalPages) ? progress.page : 1;
                setLoadingProgress(95, 'Drawing the page…');
                const p1 = (await pdfDoc.getPage(startPage)).getViewport({ scale: 1 });
                pageW = p1.width; pageH = p1.height;
                buildSlots();
                updateZoomInfo();
                goToPage(startPage);
            } catch (err) {
                console.error('PDF load error', err);
                loadingOverlay.classList.add('hidden');
                pdfContainer.innerHTML = '<p class="error-message">' + failMessage(err) + '</p>';
            }
        }

        prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
        nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
        // the page number is the jump box: tap it, type, Enter (or tap away)
        const jumpTo = () => { const n = parseInt(pageInput.value); if (n) goToPage(Math.max(1, Math.min(totalPages, n))); else updatePageInfo(); };
        pageInput.addEventListener('focus', () => pageInput.select());
        pageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); pageInput.blur(); } });
        pageInput.addEventListener('change', jumpTo);
        pageInput.addEventListener('blur', () => setTimeout(updatePageInfo, 0));
        zoomInBtn.addEventListener('click', () => changeZoom(zoom + 0.25));
        zoomOutBtn.addEventListener('click', () => changeZoom(zoom - 0.25));
        zoomResetBtn.addEventListener('click', () => changeZoom(1));
        document.addEventListener('keydown', (e) => {
            if (e.target === pageInput) return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goToPage(currentPage + 1); }
            else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goToPage(currentPage - 1); }
            else if (e.key === '+' || e.key === '=') { e.preventDefault(); changeZoom(zoom + 0.25); }
            else if (e.key === '-' || e.key === '_') { e.preventDefault(); changeZoom(zoom - 0.25); }
        });

        if (pdfPath) {
            loadPDF(pdfPath);
        }
    </script>
</body>
</html>
